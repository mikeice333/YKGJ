<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>艺考工具 · 播音主持训练台</title>
<!-- 单文件整合版：朗诵稿件库 + 新闻联播快讯 + 即兴评述 + 试卷生成 -->
<style>
/* ===== 艺考工具 · 统一样式 ===== */
:root{
  --bg1:#0f1023;
  --bg2:#1b1e3d;
  --accent:#f5c542;
  --accent2:#7c5cff;
  --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.16);
  --txt:#f0f0f5;
  --dim:#9aa0c4;
  --dim2:#6b7199;
  --side-w:318px;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
  background:radial-gradient(1200px 800px at 15% 8%,#232753 0%,transparent 58%),
             radial-gradient(1000px 700px at 88% 92%,#31215e 0%,transparent 55%),
             linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--txt);
  overflow:hidden;
}
button{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(245,197,66,.28);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:rgba(245,197,66,.45);}

/* ===== 布局 ===== */
.app{display:flex;height:100vh;overflow:hidden;}
.sidebar{
  width:var(--side-w);flex:0 0 var(--side-w);
  display:flex;flex-direction:column;min-height:0;
  background:rgba(12,13,32,.55);
  border-right:1px solid var(--line);
  backdrop-filter:blur(10px);
  z-index:20;
}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;}

/* ===== 侧栏头部 ===== */
.brand{
  padding:14px 16px 10px;flex-shrink:0;
  border-bottom:1px solid var(--line);
}
.brand .logo-row{display:flex;align-items:center;gap:9px;}
.brand .logo{
  width:30px;height:30px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),#ff9d5c);
  color:#241a02;font-weight:800;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(245,197,66,.35);
}
.brand .name{
  font-size:17px;font-weight:800;letter-spacing:2px;
  background:linear-gradient(90deg,#ffd86b,#ff9d5c 55%,#c79bff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand .sub{font-size:10px;color:var(--dim2);letter-spacing:3px;margin-top:3px;}

/* 模块切换 */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px;flex-shrink:0;}
.mbtn{
  border:1px solid var(--line2);background:rgba(255,255,255,.05);
  color:#cfd3ec;font-size:12.5px;font-weight:600;letter-spacing:.5px;
  padding:9px 4px;border-radius:10px;cursor:pointer;transition:all .2s ease;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.mbtn .ico{font-size:15px;line-height:1;}
.mbtn:hover{background:rgba(255,255,255,.12);}
.mbtn.active{
  background:linear-gradient(135deg,var(--accent),#ffb347);
  color:#241a02;border-color:transparent;
  box-shadow:0 6px 18px rgba(245,197,66,.32);
}
.mbtn.active.purple{background:linear-gradient(135deg,var(--accent2),#9d7bff);color:#fff;box-shadow:0 6px 18px rgba(124,92,255,.38);}

/* 侧栏内容区 */
.side-body{flex:1;min-height:0;overflow-y:auto;padding:0 12px 16px;}
.side-search{
  position:relative;display:flex;align-items:center;margin-bottom:8px;
}
.side-search input{
  width:100%;border:1px solid var(--line2);background:rgba(0,0,0,.25);
  color:var(--txt);font-size:12.5px;font-family:inherit;
  padding:8px 26px 8px 10px;border-radius:9px;outline:none;transition:all .2s;
}
.side-search input:focus{border-color:rgba(245,197,66,.6);background:rgba(0,0,0,.38);}
.side-search input::placeholder{color:var(--dim2);}
.side-search .clr{
  position:absolute;right:6px;border:none;background:transparent;color:var(--dim2);
  cursor:pointer;font-size:15px;padding:2px 5px;line-height:1;
}
.side-search .clr:hover{color:var(--accent);}

.sec-title{
  font-size:10.5px;color:var(--dim2);letter-spacing:2px;
  margin:12px 2px 6px;display:flex;align-items:center;justify-content:space-between;
}
.sec-title .n{color:var(--accent);font-weight:700;letter-spacing:0;}

/* 分类按钮 */
.cats{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;}
.cbtn{
  border:1px solid var(--line);background:rgba(255,255,255,.045);color:#c3c8e6;
  font-size:11.5px;padding:5px 9px;border-radius:999px;cursor:pointer;
  transition:all .18s ease;white-space:nowrap;
}
.cbtn:hover{background:rgba(255,255,255,.12);}
.cbtn.on{background:linear-gradient(135deg,var(--accent),#ffb347);color:#241a02;border-color:transparent;font-weight:700;}
.cbtn b{font-weight:600;opacity:.7;font-size:10px;margin-left:3px;}

/* 列表 */
.list{display:flex;flex-direction:column;gap:4px;}
.item{
  padding:8px 10px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;background:rgba(255,255,255,.03);
  transition:all .16s ease;
}
.item:hover{background:rgba(255,255,255,.1);border-color:var(--line2);}
.item.cur{background:rgba(245,197,66,.14);border-color:rgba(245,197,66,.45);}
.item .t{font-size:13px;font-weight:600;color:#e8ebff;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.item .s{font-size:10.5px;color:var(--dim2);margin-top:2px;display:flex;gap:7px;align-items:center;}
.item .s .tag{color:#c9b4ff;}
.item .snip{font-size:10.5px;color:#8b91b8;margin-top:3px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.item mark{background:rgba(245,197,66,.28);color:#ffd86b;border-radius:2px;padding:0 1px;}
.empty{color:var(--dim2);font-size:12px;text-align:center;padding:26px 8px;line-height:1.8;}

/* 分组标题（新闻） */
.grp{font-size:10.5px;color:var(--dim2);letter-spacing:1px;margin:11px 2px 5px;
  padding-bottom:4px;border-bottom:1px dashed rgba(255,255,255,.1);display:flex;justify-content:space-between;}
.grp:first-child{margin-top:2px;}

/* ===== 顶部工具条 ===== */
.topbar{
  flex-shrink:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 16px;border-bottom:1px solid var(--line);
  background:rgba(0,0,0,.2);min-height:54px;
}
.topbar .tb-title{
  font-size:15px;font-weight:800;color:#ffd86b;letter-spacing:1px;
  flex:1;min-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.topbar .tb-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.tb{
  cursor:pointer;font-size:12.5px;font-weight:600;letter-spacing:.5px;
  padding:7px 12px;border-radius:9px;transition:all .18s ease;white-space:nowrap;
  background:rgba(255,255,255,.07);color:#cfd3ec;border:1px solid var(--line2);
}
.tb:hover{background:rgba(255,255,255,.16);transform:translateY(-1px);}
.tb:active{transform:translateY(0);}
.tb.gold{background:rgba(245,197,66,.16);color:#ffd86b;border-color:rgba(245,197,66,.42);}
.tb.gold:hover{background:rgba(245,197,66,.34);}
.tb.exit{background:rgba(255,130,80,.16);color:#ffb896;border-color:rgba(255,150,100,.5);}
.tb.exit:hover{background:rgba(255,130,80,.34);}
.tb.purple{background:rgba(124,92,255,.2);color:#c9b4ff;border-color:rgba(124,92,255,.5);}
.tb.purple:hover{background:rgba(124,92,255,.4);}
.tb.on{background:rgba(138,216,255,.2);color:#8ad8ff;border-color:rgba(138,216,255,.55);}
.tb.on:hover{background:rgba(138,216,255,.34);}
.tb:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.fs-label{font-size:11.5px;color:#c8a24e;min-width:42px;text-align:center;letter-spacing:1px;}
.tb-sep{width:1px;height:20px;background:var(--line2);margin:0 2px;}

/* ===== 内容视图 ===== */
.view{flex:1;min-height:0;overflow-y:auto;position:relative;}
.pad{padding:26px clamp(18px,4vw,58px) 90px;}

/* 阅读器 */
.reader{max-width:940px;margin:0 auto;}
.reader .r-head{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:20px;}
.reader .r-title{font-size:clamp(21px,2.6vw,30px);font-weight:800;color:#ffd86b;letter-spacing:2px;line-height:1.4;}
.reader .r-meta{font-size:12.5px;color:var(--dim);margin-top:8px;letter-spacing:1px;display:flex;gap:12px;flex-wrap:wrap;}
.reader .r-meta .tag{color:#c9b4ff;}
.mark-body{font-size:20px;line-height:2.25;color:#f7ecd0;word-break:break-word;}
.mark-body p{margin-bottom:.85em;}
.mark-body p.sub{
  font-weight:700;color:#ffd86b;margin-top:1.1em;margin-bottom:.4em;font-size:1.02em;
}
.mark-body.align-center,.mark-body.center{text-align:center;}
.mark-body.align-right{text-align:right;}
/* 首行缩进两个字符（小标题不缩进）。
   不用 text-indent：它会让字和字上方拼音的定位基点错开（实测拼音会左右偏近 20px）。
   改成在段首放一个 2em 宽的行内占位块，字的实际位置与定位基点始终一致。
   只在左对齐下生效：居中和右对齐时缩进会把整段推偏。 */
.mark-body.indent:not(.align-center):not(.align-right) p:not(.sub)::before{
  content:'';display:inline-block;width:2em;
}
.mark-body.serif{font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC","SimSun",serif;}
.r-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;min-height:340px;color:var(--dim2);gap:14px;text-align:center;padding:30px;}
.r-empty .big{font-size:52px;opacity:.55;}
.r-empty .t1{font-size:16px;letter-spacing:2px;color:var(--dim);}
.r-empty .t2{font-size:12px;line-height:1.9;max-width:420px;}

/* 标注样式 */
.m-p::after{content:"/";color:#ff9d5c;font-weight:700;margin:0 .08em;font-family:Georgia,serif;white-space:nowrap;}
.m-c{border-bottom:2px solid #4fd1c5;padding-bottom:1px;}
.m-s{
  -webkit-text-emphasis:dot #ffd86b;
  -webkit-text-emphasis-position:under;
  text-emphasis:dot #ffd86b;
  text-emphasis-position:under;
}

/* ===== 注音（拼音）=====
   拼音用伪元素 + data-py 呈现，不产生文本节点，
   因此不会干扰标注引擎对选区字符索引的计算。
   字号用 em，自动随全局字号缩放。 */
.mark-body.note,.focus-text.note{padding-top:.6em;}
.mark-body p.py,.focus-text p.py{line-height:2.45;}
/* 聚焦层（.focus-text）与正文区共用同一套注音样式 */
.mark-body .zh,.focus-text .zh{position:relative;}
.mark-body .zh::before,.focus-text .zh::before{
  content:attr(data-py);
  position:absolute;left:50%;bottom:100%;
  /* 偏长的拼音由脚本算出压缩比 --pyk，横向压进本字宽度内，避免和邻字叠在一起 */
  transform:translateX(-50%) scaleX(var(--pyk,1));
  transform-origin:50% 100%;
  font-size:.5em;line-height:1.1;font-weight:600;
  color:#8ad8ff;letter-spacing:0;white-space:nowrap;
  font-family:"Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
  pointer-events:none;
}
.mark-body .zh.pyed::before,.focus-text .zh.pyed::before{color:#ffd86b;}
/* 拼音编辑框：浮在字上方，不进正文文本流 */
.py-input{
  position:fixed;z-index:260;
  padding:3px 7px;text-align:center;
  background:#0d1830;color:#8ad8ff;
  border:1px solid #8ad8ff;border-radius:7px;outline:none;
  font-family:"Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
  box-shadow:0 8px 24px rgba(0,0,0,.65);
}
/* 聚焦显示：选中文字单独全屏 */
.focus-text{color:#f7ecd0;line-height:2.1;word-break:break-word;}
.focus-text p{margin-bottom:.7em;}
.focus-text.align-center,.focus-text.center{text-align:center;}
.focus-text.align-right{text-align:right;}
.focus-text.indent:not(.align-center):not(.align-right) p::before{
  content:'';display:inline-block;width:2em;
}
.focus-text.serif{font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC","SimSun",serif;}

/* 选区提示 */
.selbar{
  position:fixed;z-index:60;display:none;gap:6px;padding:7px 8px;
  background:rgba(20,22,48,.97);border:1px solid rgba(245,197,66,.4);
  border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.6);backdrop-filter:blur(8px);
}
.selbar.show{display:flex;}

/* ===== 即兴评述（迁移） ===== */
.jx-wrap{display:flex;flex-direction:column;height:100%;min-height:0;padding:14px 18px 10px;}
.jx-head{text-align:center;margin-bottom:8px;flex-shrink:0;}
.jx-head .t{
  font-size:clamp(19px,2.5vw,27px);font-weight:800;letter-spacing:2px;
  background:linear-gradient(90deg,#ffd86b,#ff9d5c 45%,#c79bff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.jx-head .s{margin-top:2px;font-size:11px;color:var(--dim);letter-spacing:4px;}
.filters{
  display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap;
  background:rgba(255,255,255,.055);border:1px solid var(--line2);
  border-radius:12px;padding:6px 12px;margin-bottom:10px;flex-shrink:0;
}
.fbtn{
  border:none;cursor:pointer;font-size:12.5px;font-weight:600;letter-spacing:1px;
  padding:6px 17px;border-radius:999px;color:#cfd3ec;background:rgba(255,255,255,.08);
  transition:all .2s ease;
}
.fbtn:hover{background:rgba(255,255,255,.16);}
.fbtn.active{background:linear-gradient(135deg,var(--accent),#ffb347);color:#241a02;box-shadow:0 6px 18px rgba(245,197,66,.36);}
.fbtn.active.blue{background:linear-gradient(135deg,var(--accent2),#9d7bff);color:#fff;box-shadow:0 6px 18px rgba(124,92,255,.4);}
.filters .count{font-size:11.5px;color:var(--dim);}
.filters .count b{color:var(--accent);font-size:13px;}
.cards{display:flex;gap:16px;width:100%;flex:1;min-height:0;justify-content:center;perspective:2000px;margin-bottom:12px;}
.card{
  flex:1 1 0;min-width:0;max-width:390px;position:relative;cursor:pointer;
  transform-style:preserve-3d;transition:transform .7s cubic-bezier(.23,1,.32,1);
}
.card.flipped{transform:rotateY(180deg);cursor:default;}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:16px;display:flex;flex-direction:column;overflow:hidden;}
.card .front{
  background:linear-gradient(160deg,#2a2e5c,#1c1f42);
  border:1px solid var(--line2);
  box-shadow:0 18px 44px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);
  align-items:center;justify-content:center;
}
.front .num{position:absolute;top:11px;left:14px;font-size:12px;color:#7b82ab;font-weight:600;}
.front .cat{position:absolute;top:11px;right:14px;font-size:10.5px;padding:3px 10px;border-radius:999px;
  background:rgba(245,197,66,.16);color:#ffd86b;letter-spacing:1px;}
.front .cat.news{background:rgba(124,92,255,.22);color:#c9b4ff;}
.front .big{font-size:clamp(40px,4.6vw,58px);font-weight:800;color:#f5c542;
  text-shadow:0 0 26px rgba(245,197,66,.5);margin-bottom:6px;}
.front .hint{font-size:12.5px;color:var(--dim);letter-spacing:6px;}
.front .tap{position:absolute;bottom:13px;font-size:10.5px;color:var(--dim2);letter-spacing:2px;}
.card .back{
  transform:rotateY(180deg);
  background:linear-gradient(165deg,#2c2410,#3d3218);
  border:1px solid rgba(245,197,66,.42);
  box-shadow:0 18px 44px rgba(0,0,0,.55), inset 0 0 50px rgba(245,197,66,.08);
  padding:15px 6px 11px 15px;
}
.qhead{display:flex;align-items:center;gap:8px;padding-right:10px;margin-bottom:7px;flex-shrink:0;}
.qhead .tag{font-size:10px;padding:2px 9px;border-radius:999px;letter-spacing:1px;flex-shrink:0;
  background:rgba(124,92,255,.25);color:#c9b4ff;}
.qhead .tag.other{background:rgba(245,197,66,.2);color:#ffd86b;}
.qhead .qtitle{font-size:13.5px;font-weight:700;color:#ffd86b;letter-spacing:.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qscroll{flex:1;min-height:0;overflow-y:auto;padding-right:10px;padding-bottom:34px;text-align:left;}
.qscroll p{color:#ffeec4;line-height:1.75;margin-bottom:.55em;word-break:break-word;}
.tips{margin-top:10px;border-top:1px dashed rgba(245,197,66,.3);padding-top:8px;}
.tips-toggle{font-size:11px;color:#c8a24e;letter-spacing:1px;cursor:pointer;}
.tips-toggle:hover{color:#ffd86b;}
.tips-body{display:none;margin-top:6px;}
.tips-body.open{display:block;}
.tips-body p{font-size:12px!important;color:#d8bd7d;line-height:1.7;}
.zoombtn{
  position:absolute;bottom:9px;right:11px;z-index:6;
  font-size:11px;font-weight:600;padding:5px 12px;border-radius:9px;cursor:pointer;
  background:rgba(245,197,66,.22);color:#ffd86b;border:1px solid rgba(245,197,66,.5);
  transition:all .2s ease;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.35);
}
.zoombtn:hover{background:rgba(245,197,66,.42);transform:translateY(-1px);}
.jx-controls{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;flex-shrink:0;}
.btn{border:none;cursor:pointer;font-size:13.5px;font-weight:700;letter-spacing:2px;
  padding:10px 26px;border-radius:999px;transition:all .22s ease;}
.btn-main{background:linear-gradient(135deg,var(--accent),#ffb347);color:#241a02;box-shadow:0 10px 26px rgba(245,197,66,.4);}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(245,197,66,.55);}
.btn-ghost{background:rgba(255,255,255,.07);color:#cfd3ec;border:1px solid var(--line2);}
.btn-ghost:hover{background:rgba(255,255,255,.14);}
.jx-info{font-size:11.5px;color:var(--dim);text-align:center;margin-top:6px;flex-shrink:0;}
.jx-info b{color:#ffd86b;}
.card.anim{animation:deal .6s cubic-bezier(.34,1.56,.64,1) backwards;}
.card.anim:nth-child(1){animation-delay:0s;}
.card.anim:nth-child(2){animation-delay:.1s;}
.card.anim:nth-child(3){animation-delay:.2s;}
@keyframes deal{0%{transform:translateY(70px) scale(.85);opacity:0;}100%{transform:translateY(0) scale(1);opacity:1;}}

/* ===== 试卷 ===== */
.paper-wrap{max-width:900px;margin:0 auto;}
/* 卷面上方的编辑提示条（不打印） */
.paper-hint{
  font-size:12px;line-height:1.85;color:#9aa0c4;
  background:rgba(138,216,255,.08);border:1px solid rgba(138,216,255,.25);
  border-radius:10px;padding:10px 13px;margin-bottom:12px;
}
.paper{
  background:#fdfcf8;color:#1c1c22;border-radius:8px;
  padding:clamp(22px,4vw,52px);box-shadow:0 20px 60px rgba(0,0,0,.5);
  outline:none;
}
.paper .p-title{text-align:center;font-size:23px;font-weight:800;letter-spacing:5px;
  padding-bottom:14px;border-bottom:2.5px solid #1c1c22;margin-bottom:28px;}
.paper h3{
  font-size:16.5px;font-weight:800;letter-spacing:1.5px;margin:26px 0 12px;
  padding-left:2px;color:#111;
}
.paper h3:first-of-type{margin-top:8px;}
.paper .q{margin-bottom:22px;position:relative;padding-right:34px;}
.paper .q .qh{font-size:14.5px;font-weight:700;margin-bottom:7px;letter-spacing:.5px;}
.paper .q .qt{font-size:14px;line-height:1.95;text-align:justify;white-space:pre-wrap;}
.paper .q .qt p{margin-bottom:.5em;}
.paper .q .del{
  position:absolute;top:0;right:0;border:1px solid #d9d5cc;background:#fff;color:#a33;
  font-size:11px;padding:3px 9px;border-radius:7px;cursor:pointer;
}
.paper .q .del:hover{background:#a33;color:#fff;border-color:#a33;}
.paper .q .lines{margin-top:10px;}
.paper .q .lines i{display:block;border-bottom:1px solid #cfcbc2;height:30px;}
.paper [contenteditable]:focus{outline:2px dashed #b9a86a;outline-offset:3px;border-radius:4px;}
.paper-meta{display:flex;gap:16px;font-size:12px;color:#666;justify-content:center;margin-bottom:18px;letter-spacing:1px;}

/* ===== 全屏阅读层 ===== */
.overlay{
  position:fixed;inset:0;z-index:100;display:none;
  background:radial-gradient(900px 620px at 50% 0%,#2b2412 0%,transparent 62%),
             linear-gradient(165deg,#16130c,#221c0e);
}
.overlay.show{display:flex;flex-direction:column;animation:fadein .22s ease;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.overlay-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:12px 3vw;border-bottom:1px solid rgba(245,197,66,.22);
  flex-shrink:0;background:rgba(0,0,0,.18);
}
.overlay-title{font-size:clamp(14px,1.8vw,20px);font-weight:800;color:#ffd86b;letter-spacing:1px;
  flex:1;min-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.overlay-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex-shrink:0;}
.overlay-body{flex:1;min-height:0;overflow-y:auto;width:100%;max-width:1080px;margin:0 auto;padding:26px 4vw 80px;}

/* ===== 课堂分享 ===== */
.follow-tag{
  font-size:11px;padding:3px 9px;border-radius:20px;flex:0 0 auto;letter-spacing:1px;
  background:rgba(138,216,255,.16);color:#8ad8ff;border:1px solid rgba(138,216,255,.42);
}
.share-code-label{text-align:center;font-size:12px;color:#9aa0c4;letter-spacing:1px;margin-bottom:8px;}
.share-code{
  text-align:center;font-family:Consolas,Monaco,monospace;
  font-size:34px;font-weight:800;letter-spacing:9px;color:#ffd86b;
  background:rgba(0,0,0,.35);border:1px dashed rgba(245,197,66,.5);
  border-radius:12px;padding:14px 10px 14px 19px;margin-bottom:16px;
}
.share-note{
  font-size:12.5px;line-height:1.9;color:#ffd8a8;
  background:rgba(255,180,90,.1);border:1px solid rgba(255,180,90,.3);
  border-radius:10px;padding:10px 12px;margin-bottom:16px;
}
.share-qr{display:flex;justify-content:center;margin-bottom:16px;}
.share-qr svg{width:212px;height:212px;background:#fff;padding:9px;border-radius:10px;}
.share-warn{
  font-size:12px;line-height:1.9;color:#ffb896;text-align:center;padding:16px;
  border:1px dashed rgba(255,150,100,.4);border-radius:10px;
}
.share-url-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.share-url-row input{
  flex:1;min-width:0;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:9px;
  color:#c3c8e6;padding:9px 11px;font-size:11.5px;font-family:Consolas,Monaco,monospace;
}
/* 身份选择 */
.role-pick{display:flex;flex-direction:column;gap:11px;}
.role-pick .rp-lead{font-size:12.5px;color:#c3c8e6;line-height:1.9;margin:0 0 3px;}
.role-btn{
  display:flex;flex-direction:column;gap:5px;align-items:flex-start;text-align:left;
  padding:14px 16px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:700;
  background:rgba(255,255,255,.06);border:1px solid var(--line);color:#f0e6cf;
}
.role-btn:hover{background:rgba(245,197,66,.14);border-color:rgba(245,197,66,.5);}
.role-btn span{font-size:11.5px;font-weight:400;color:#8b91b8;line-height:1.7;}

/* ===== 弹层/提示 ===== */
.mask{
  position:fixed;inset:0;z-index:200;background:rgba(5,6,18,.72);
  display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);
}
.mask.show{display:flex;}
.dlg{
  background:linear-gradient(160deg,#242850,#1a1d3c);
  border:1px solid var(--line2);border-radius:16px;
  width:100%;max-width:640px;max-height:86vh;display:flex;flex-direction:column;
  box-shadow:0 26px 70px rgba(0,0,0,.65);
}
.dlg-h{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.dlg-h .t{font-size:15px;font-weight:800;color:#ffd86b;letter-spacing:1px;}
.dlg-h .x{border:none;background:transparent;color:var(--dim);font-size:20px;cursor:pointer;line-height:1;padding:0 4px;}
.dlg-h .x:hover{color:#ff9d5c;}
.dlg-b{padding:18px 20px;overflow-y:auto;flex:1;min-height:0;}
.dlg-f{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--dim);letter-spacing:1px;margin-bottom:6px;}
.field input[type=text],.field input[type=number],.field select,.field textarea{
  width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:9px;
  color:var(--txt);font-family:inherit;font-size:13px;padding:9px 11px;outline:none;
}
.field textarea{min-height:190px;line-height:1.75;resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(245,197,66,.6);}
.field .hint{font-size:11px;color:var(--dim2);margin-top:5px;line-height:1.7;}
.frow{display:flex;gap:10px;}
.frow>*{flex:1;min-width:0;}

/* 抓取日志 */
.logs{
  background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;font-size:11px;line-height:1.85;color:#9aa0c4;
  max-height:190px;overflow-y:auto;font-family:Consolas,Monaco,monospace;
}
.logs .ok{color:#5fd39a;}
.logs .bad{color:#ff8f6b;}
.logs .warn{color:#ffd86b;}
.logs .mut{color:#5d6389;}

/* 危险操作按钮（停止同步） */
.tb.danger{background:rgba(255,118,88,.16);color:#ffb3a0;border-color:rgba(255,140,110,.5);}
.tb.danger:hover{background:rgba(255,140,110,.34);}

/* 同步进度提示 */
.sync-bar{
  background:rgba(245,197,66,.10);border:1px solid rgba(245,197,66,.3);border-radius:9px;
  padding:7px 10px;font-size:11.5px;color:#d8bd7d;line-height:1.6;margin-bottom:9px;
}
.sync-bar b{color:#ffd86b;}

.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(14px);
  background:rgba(24,26,54,.97);border:1px solid rgba(245,197,66,.45);color:#ffe9b0;
  padding:10px 22px;border-radius:11px;font-size:12.5px;letter-spacing:.5px;
  opacity:0;pointer-events:none;transition:all .26s ease;z-index:300;
  box-shadow:0 12px 34px rgba(0,0,0,.55);max-width:80vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 侧栏抽屉（移动端） */
.drawer-btn{display:none;}

/* ===== 响应式 ===== */
@media (max-width:1000px){
  :root{--side-w:272px;}
  .card .front .big{font-size:34px;}
}
@media (max-width:820px){
  .app{flex-direction:column;}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:290px;flex:none;
    transform:translateX(-100%);transition:transform .26s ease;
    box-shadow:14px 0 44px rgba(0,0,0,.5);
  }
  .sidebar.open{transform:translateX(0);}
  .drawer-btn{display:inline-flex;align-items:center;gap:5px;}
  .side-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:19;display:none;}
  .side-mask.show{display:block;}
  /* 窄屏：工具条单行横向滚动，保证所有按钮都够得着 */
  .topbar{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:8px 10px;scrollbar-width:none;}
  .topbar::-webkit-scrollbar{display:none;}
  .topbar .tb-title{flex:0 0 auto;max-width:30vw;font-size:13px;}
  .topbar .tb-tools{flex-wrap:nowrap;}
  .tb{flex:0 0 auto;}
  .cards{flex-direction:column;overflow-y:auto;perspective:none;}
  .card{max-width:none;min-height:200px;flex:0 0 auto;}
  .card .front{position:relative;}
  .card.flipped{transform:none;}
  .card .back{transform:none;position:relative;display:none;}
  .card.flipped .front{display:none;}
  .card.flipped .back{display:flex;}
  .pad{padding:16px 14px 80px;}
  .mark-body{font-size:18px;}
  .overlay-head{padding:9px 10px;gap:8px;flex-wrap:nowrap;overflow-x:auto;}
  .overlay-tools{flex-wrap:nowrap;}
}
@media (max-width:520px){
  .modes{grid-template-columns:1fr 1fr;}
  .paper{padding:18px 14px;}
  .topbar{padding:8px 10px;gap:6px;}
  .tb{padding:6px 9px;font-size:11.5px;}
}

/* ===== 打印（试卷 / 导出 PDF） ===== */
@page{margin:14mm 12mm;}
@media print{
  html,body{background:#fff!important;overflow:visible!important;height:auto!important;}
  .sidebar,.side-mask,.topbar,.no-print,.selbar,.toast,.overlay,.mask,.py-input{display:none!important;}
  .app{display:block!important;height:auto!important;overflow:visible!important;}
  .main{display:block!important;height:auto!important;}
  .view{overflow:visible!important;height:auto!important;flex:none!important;}
  .pad{padding:0!important;}
  .paper{
    box-shadow:none!important;border-radius:0!important;padding:0!important;
    background:#fff!important;color:#000!important;max-width:none!important;
  }
  .paper-wrap{max-width:none!important;}
  .paper .q{padding-right:0!important;}
  /* 打印时隐藏全部标注符号 */
  .m-p::after{content:""!important;}
  .m-c{border-bottom:none!important;}
  .m-s{-webkit-text-emphasis:none!important;text-emphasis:none!important;}
  .paper [contenteditable]:focus{outline:none!important;}
}

</style>
</head>
<body>
<div class="app">

  <!-- ===== 左侧栏 ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo-row">
        <span class="logo">艺</span>
        <span class="name">艺考工具</span>
      </div>
      <div class="sub">播 音 主 持 · 训 练 台</div>
    </div>

    <div class="modes" id="modes">
      <button class="mbtn active" data-mod="lang"><span class="ico">📖</span>朗诵稿件</button>
      <button class="mbtn" data-mod="news"><span class="ico">📰</span>新闻联播</button>
      <button class="mbtn" data-mod="jx"><span class="ico">🎲</span>即兴评述</button>
      <button class="mbtn" data-mod="paper"><span class="ico">📝</span>试卷生成</button>
    </div>

    <div class="side-body" id="sideBody"></div>
  </aside>
  <div class="side-mask" id="sideMask"></div>

  <!-- ===== 右侧主区 ===== -->
  <main class="main">
    <header class="topbar" id="topbar"></header>
    <div class="view" id="view"></div>
  </main>
</div>

<!-- 划词操作条 -->
<div class="selbar" id="selbar"></div>

<!-- 全屏阅读层 -->
<div class="overlay" id="overlay">
  <div class="overlay-head">
    <div class="overlay-title" id="ovTitle">文稿</div>
    <div class="overlay-tools" id="ovTools"></div>
  </div>
  <div class="overlay-body" id="ovBody"></div>
</div>

<!-- 通用弹层 -->
<div class="mask" id="mask">
  <div class="dlg">
    <div class="dlg-h"><span class="t" id="dlgTitle">标题</span><button class="x" id="dlgX">&times;</button></div>
    <div class="dlg-b" id="dlgBody"></div>
    <div class="dlg-f" id="dlgFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script id="d-lang" type="application/json">[{"title": "咏鹅", "author": "唐·骆宾王", "tag": "一年级上册", "cat": "小学必背", "lines": ["鹅，鹅，鹅，曲项向天歌。", "白毛浮绿水，红掌拨清波。"], "id": 0}, {"title": "江南", "author": "汉乐府", "tag": "一年级上册", "cat": "小学必背", "lines": ["江南可采莲，莲叶何田田。", "鱼戏莲叶间。", "鱼戏莲叶东，鱼戏莲叶西，", "鱼戏莲叶南，鱼戏莲叶北。"], "id": 1}, {"title": "画", "author": "", "tag": "一年级上册", "cat": "小学必背", "lines": ["远看山有色，近听水无声。", "春去花还在，人来鸟不惊。"], "id": 2}, {"title": "悯农（其二）", "author": "唐·李绅", "tag": "一年级上册", "cat": "小学必背", "lines": ["锄禾日当午，汗滴禾下土。", "谁知盘中餐，粒粒皆辛苦。"], "id": 3}, {"title": "古朗月行（节选）", "author": "唐·李白", "tag": "一年级上册", "cat": "小学必背", "lines": ["小时不识月，呼作白玉盘。", "又疑瑶台镜，飞在青云端。"], "id": 4}, {"title": "风", "author": "唐·李峤", "tag": "一年级上册", "cat": "小学必背", "lines": ["解落三秋叶，能开二月花。", "过江千尺浪，入竹万竿斜。"], "id": 5}, {"title": "春晓", "author": "唐·孟浩然", "tag": "一年级下册", "cat": "小学必背", "lines": ["春眠不觉晓，处处闻啼鸟。", "夜来风雨声，花落知多少。"], "id": 6}, {"title": "赠汪伦", "author": "唐·李白", "tag": "一年级下册", "cat": "小学必背", "lines": ["李白乘舟将欲行，忽闻岸上踏歌声。", "桃花潭水深千尺，不及汪伦送我情。"], "id": 7}, {"title": "静夜思", "author": "唐·李白", "tag": "一年级下册", "cat": "小学必背", "lines": ["床前明月光，疑是地上霜。", "举头望明月，低头思故乡。"], "id": 8}, {"title": "寻隐者不遇", "author": "唐·贾岛", "tag": "一年级下册", "cat": "小学必背", "lines": ["松下问童子，言师采药去。", "只在此山中，云深不知处。"], "id": 9}, {"title": "池上", "author": "唐·白居易", "tag": "一年级下册", "cat": "小学必背", "lines": ["小娃撑小艇，偷采白莲回。", "不解藏踪迹，浮萍一道开。"], "id": 10}, {"title": "小池", "author": "宋·杨万里", "tag": "一年级下册", "cat": "小学必背", "lines": ["泉眼无声惜细流，树阴照水爱晴柔。", "小荷才露尖尖角，早有蜻蜓立上头。"], "id": 11}, {"title": "画鸡", "author": "明·唐寅", "tag": "一年级下册", "cat": "小学必背", "lines": ["头上红冠不用裁，满身雪白走将来。", "平生不敢轻言语，一叫千门万户开。"], "id": 12}, {"title": "梅花", "author": "宋·王安石", "tag": "二年级上册", "cat": "小学必背", "lines": ["墙角数枝梅，凌寒独自开。", "遥知不是雪，为有暗香来。"], "id": 13}, {"title": "小儿垂钓", "author": "唐·胡令能", "tag": "二年级上册", "cat": "小学必背", "lines": ["蓬头稚子学垂纶，侧坐莓苔草映身。", "路人借问遥招手，怕得鱼惊不应人。"], "id": 14}, {"title": "登鹳雀楼", "author": "唐·王之涣", "tag": "二年级上册", "cat": "小学必背", "lines": ["白日依山尽，黄河入海流。", "欲穷千里目，更上一层楼。"], "id": 15}, {"title": "望庐山瀑布", "author": "唐·李白", "tag": "二年级上册", "cat": "小学必背", "lines": ["日照香炉生紫烟，遥看瀑布挂前川。", "飞流直下三千尺，疑是银河落九天。"], "id": 16}, {"title": "江雪", "author": "唐·柳宗元", "tag": "二年级上册", "cat": "小学必背", "lines": ["千山鸟飞绝，万径人踪灭。", "孤舟蓑笠翁，独钓寒江雪。"], "id": 17}, {"title": "夜宿山寺", "author": "唐·李白", "tag": "二年级上册", "cat": "小学必背", "lines": ["危楼高百尺，手可摘星辰。", "不敢高声语，恐惊天上人。"], "id": 18}, {"title": "敕勒歌", "author": "北朝民歌", "tag": "二年级上册", "cat": "小学必背", "lines": ["敕勒川，阴山下，", "天似穹庐，笼盖四野。", "天苍苍，野茫茫，", "风吹草低见牛羊。"], "id": 19}, {"title": "村居", "author": "清·高鼎", "tag": "二年级下册", "cat": "小学必背", "lines": ["草长莺飞二月天，拂堤杨柳醉春烟。", "儿童散学归来早，忙趁东风放纸鸢。"], "id": 20}, {"title": "咏柳", "author": "唐·贺知章", "tag": "二年级下册", "cat": "小学必背", "lines": ["碧玉妆成一树高，万条垂下绿丝绦。", "不知细叶谁裁出，二月春风似剪刀。"], "id": 21}, {"title": "赋得古原草送别（节选）", "author": "唐·白居易", "tag": "二年级下册", "cat": "小学必背", "lines": ["离离原上草，一岁一枯荣。", "野火烧不尽，春风吹又生。"], "id": 22}, {"title": "晓出净慈寺送林子方", "author": "宋·杨万里", "tag": "二年级下册", "cat": "小学必背", "lines": ["毕竟西湖六月中，风光不与四时同。", "接天莲叶无穷碧，映日荷花别样红。"], "id": 23}, {"title": "绝句（两个黄鹂鸣翠柳）", "author": "唐·杜甫", "tag": "二年级下册", "cat": "小学必背", "lines": ["两个黄鹂鸣翠柳，一行白鹭上青天。", "窗含西岭千秋雪，门泊东吴万里船。"], "id": 24}, {"title": "悯农（其一）", "author": "唐·李绅", "tag": "二年级下册", "cat": "小学必背", "lines": ["春种一粒粟，秋收万颗子。", "四海无闲田，农夫犹饿死。"], "id": 25}, {"title": "舟夜书所见", "author": "清·查慎行", "tag": "二年级下册", "cat": "小学必背", "lines": ["月黑见渔灯，孤光一点萤。", "微微风簇浪，散作满河星。"], "id": 26}, {"title": "所见", "author": "清·袁枚", "tag": "三年级上册", "cat": "小学必背", "lines": ["牧童骑黄牛，歌声振林樾。", "意欲捕鸣蝉，忽然闭口立。"], "id": 27}, {"title": "山行", "author": "唐·杜牧", "tag": "三年级上册", "cat": "小学必背", "lines": ["远上寒山石径斜，白云生处有人家。", "停车坐爱枫林晚，霜叶红于二月花。"], "id": 28}, {"title": "赠刘景文", "author": "宋·苏轼", "tag": "三年级上册", "cat": "小学必背", "lines": ["荷尽已无擎雨盖，菊残犹有傲霜枝。", "一年好景君须记，最是橙黄橘绿时。"], "id": 29}, {"title": "夜书所见", "author": "宋·叶绍翁", "tag": "三年级上册", "cat": "小学必背", "lines": ["萧萧梧叶送寒声，江上秋风动客情。", "知有儿童挑促织，夜深篱落一灯明。"], "id": 30}, {"title": "望天门山", "author": "唐·李白", "tag": "三年级上册", "cat": "小学必背", "lines": ["天门中断楚江开，碧水东流至此回。", "两岸青山相对出，孤帆一片日边来。"], "id": 31}, {"title": "饮湖上初晴后雨", "author": "宋·苏轼", "tag": "三年级上册", "cat": "小学必背", "lines": ["水光潋滟晴方好，山色空蒙雨亦奇。", "欲把西湖比西子，淡妆浓抹总相宜。"], "id": 32}, {"title": "望洞庭", "author": "唐·刘禹锡", "tag": "三年级上册", "cat": "小学必背", "lines": ["湖光秋月两相和，潭面无风镜未磨。", "遥望洞庭山水翠，白银盘里一青螺。"], "id": 33}, {"title": "早发白帝城", "author": "唐·李白", "tag": "三年级上册", "cat": "小学必背", "lines": ["朝辞白帝彩云间，千里江陵一日还。", "两岸猿声啼不住，轻舟已过万重山。"], "id": 34}, {"title": "采莲曲", "author": "唐·王昌龄", "tag": "三年级上册", "cat": "小学必背", "lines": ["荷叶罗裙一色裁，芙蓉向脸两边开。", "乱入池中看不见，闻歌始觉有人来。"], "id": 35}, {"title": "绝句（迟日江山丽）", "author": "唐·杜甫", "tag": "三年级下册", "cat": "小学必背", "lines": ["迟日江山丽，春风花草香。", "泥融飞燕子，沙暖睡鸳鸯。"], "id": 36}, {"title": "惠崇春江晚景", "author": "宋·苏轼", "tag": "三年级下册", "cat": "小学必背", "lines": ["竹外桃花三两枝，春江水暖鸭先知。", "蒌蒿满地芦芽短，正是河豚欲上时。"], "id": 37}, {"title": "三衢道中", "author": "宋·曾几", "tag": "三年级下册", "cat": "小学必背", "lines": ["梅子黄时日日晴，小溪泛尽却山行。", "绿阴不减来时路，添得黄鹂四五声。"], "id": 38}, {"title": "忆江南", "author": "唐·白居易", "tag": "三年级下册", "cat": "小学必背", "lines": ["江南好，风景旧曾谙。", "日出江花红胜火，春来江水绿如蓝。", "能不忆江南？"], "id": 39}, {"title": "元日", "author": "宋·王安石", "tag": "三年级下册", "cat": "小学必背", "lines": ["爆竹声中一岁除，春风送暖入屠苏。", "千门万户曈曈日，总把新桃换旧符。"], "id": 40}, {"title": "清明", "author": "唐·杜牧", "tag": "三年级下册", "cat": "小学必背", "lines": ["清明时节雨纷纷，路上行人欲断魂。", "借问酒家何处有？牧童遥指杏花村。"], "id": 41}, {"title": "九月九日忆山东兄弟", "author": "唐·王维", "tag": "三年级下册", "cat": "小学必背", "lines": ["独在异乡为异客，每逢佳节倍思亲。", "遥知兄弟登高处，遍插茱萸少一人。"], "id": 42}, {"title": "滁州西涧", "author": "唐·韦应物", "tag": "三年级下册", "cat": "小学必背", "lines": ["独怜幽草涧边生，上有黄鹂深树鸣。", "春潮带雨晚来急，野渡无人舟自横。"], "id": 43}, {"title": "大林寺桃花", "author": "唐·白居易", "tag": "三年级下册", "cat": "小学必背", "lines": ["人间四月芳菲尽，山寺桃花始盛开。", "长恨春归无觅处，不知转入此中来。"], "id": 44}, {"title": "鹿柴", "author": "唐·王维", "tag": "四年级上册", "cat": "小学必背", "lines": ["空山不见人，但闻人语响。", "返景入深林，复照青苔上。"], "id": 45}, {"title": "暮江吟", "author": "唐·白居易", "tag": "四年级上册", "cat": "小学必背", "lines": ["一道残阳铺水中，半江瑟瑟半江红。", "可怜九月初三夜，露似真珠月似弓。"], "id": 46}, {"title": "题西林壁", "author": "宋·苏轼", "tag": "四年级上册", "cat": "小学必背", "lines": ["横看成岭侧成峰，远近高低各不同。", "不识庐山真面目，只缘身在此山中。"], "id": 47}, {"title": "雪梅", "author": "宋·卢钺", "tag": "四年级上册", "cat": "小学必背", "lines": ["梅雪争春未肯降，骚人搁笔费评章。", "梅须逊雪三分白，雪却输梅一段香。"], "id": 48}, {"title": "嫦娥", "author": "唐·李商隐", "tag": "四年级上册", "cat": "小学必背", "lines": ["云母屏风烛影深，长河渐落晓星沉。", "嫦娥应悔偷灵药，碧海青天夜夜心。"], "id": 49}, {"title": "出塞", "author": "唐·王昌龄", "tag": "四年级上册", "cat": "小学必背", "lines": ["秦时明月汉时关，万里长征人未还。", "但使龙城飞将在，不教胡马度阴山。"], "id": 50}, {"title": "凉州词（葡萄美酒夜光杯）", "author": "唐·王翰", "tag": "四年级上册", "cat": "小学必背", "lines": ["葡萄美酒夜光杯，欲饮琵琶马上催。", "醉卧沙场君莫笑，古来征战几人回？"], "id": 51}, {"title": "夏日绝句", "author": "宋·李清照", "tag": "四年级上册", "cat": "小学必背", "lines": ["生当作人杰，死亦为鬼雄。", "至今思项羽，不肯过江东。"], "id": 52}, {"title": "别董大", "author": "唐·高适", "tag": "四年级上册", "cat": "小学必背", "lines": ["千里黄云白日曛，北风吹雁雪纷纷。", "莫愁前路无知己，天下谁人不识君？"], "id": 53}, {"title": "浪淘沙（其七）", "author": "唐·刘禹锡", "tag": "四年级上册", "cat": "小学必背", "lines": ["八月涛声吼地来，头高数丈触山回。", "须臾却入海门去，卷起沙堆似雪堆。"], "id": 54}, {"title": "宿新市徐公店", "author": "宋·杨万里", "tag": "四年级下册", "cat": "小学必背", "lines": ["篱落疏疏一径深，树头新绿未成阴。", "儿童急走追黄蝶，飞入菜花无处寻。"], "id": 55}, {"title": "四时田园杂兴（其二十五）", "author": "宋·范成大", "tag": "四年级下册", "cat": "小学必背", "lines": ["梅子金黄杏子肥，麦花雪白菜花稀。", "日长篱落无人过，惟有蜻蜓蛱蝶飞。"], "id": 56}, {"title": "清平乐·村居", "author": "宋·辛弃疾", "tag": "四年级下册", "cat": "小学必背", "lines": ["茅檐低小， 溪上青青草。", "醉里吴音相媚好，白发谁家翁媪？", "大儿锄豆溪东， 中儿正织鸡笼。", "最喜小儿亡赖， 溪头卧剥莲蓬。"], "id": 57}, {"title": "卜算子·咏梅", "author": "毛泽东", "tag": "四年级下册", "cat": "小学必背", "lines": ["风雨送春归，飞雪迎春到。", "已是悬崖百丈冰，犹有花枝俏。", "俏也不争春，只把春来报。", "待到山花烂漫时，她在丛中笑。"], "id": 58}, {"title": "蜂", "author": "唐·罗隐", "tag": "四年级下册", "cat": "小学必背", "lines": ["不论平地与山尖，无限风光尽被占。", "采得百花成蜜后，为谁辛苦为谁甜？"], "id": 59}, {"title": "独坐敬亭山", "author": "唐·李白", "tag": "四年级下册", "cat": "小学必背", "lines": ["众鸟高飞尽，孤云独去闲。", "相看两不厌，只有敬亭山。"], "id": 60}, {"title": "芙蓉楼送辛渐", "author": "唐·王昌龄", "tag": "四年级下册", "cat": "小学必背", "lines": ["寒雨连江夜入吴，平明送客楚山孤。", "洛阳亲友如相问，一片冰心在玉壶。"], "id": 61}, {"title": "塞下曲", "author": "唐·卢纶", "tag": "四年级下册", "cat": "小学必背", "lines": ["月黑雁飞高，单于夜遁逃。", "欲将轻骑逐，大雪满弓刀。"], "id": 62}, {"title": "墨梅", "author": "元·王冕", "tag": "四年级下册", "cat": "小学必背", "lines": ["我家洗砚池头树，朵朵花开淡墨痕。", "不要人夸好颜色，只留清气满乾坤。"], "id": 63}, {"title": "江畔独步寻花", "author": "唐·杜甫", "tag": "四年级下册", "cat": "小学必背", "lines": ["黄师塔前江水东，春光懒困倚微风。", "桃花一簇开无主，可爱深红爱浅红？"], "id": 64}, {"title": "蝉", "author": "唐·虞世南", "tag": "五年级上册·五年级下册", "cat": "小学必背", "lines": ["垂緌饮清露，流响出疏桐。", "居高声自远，非是藉秋风。"], "id": 65}, {"title": "乞巧", "author": "唐·林杰", "tag": "五年级上册", "cat": "小学必背", "lines": ["七夕今宵看碧霄，牵牛织女渡河桥。", "家家乞巧望秋月，穿尽红丝几万条。"], "id": 66}, {"title": "示儿", "author": "宋·陆游", "tag": "五年级上册", "cat": "小学必背", "lines": ["死去元知万事空，但悲不见九州同。", "王师北定中原日，家祭无忘告乃翁。"], "id": 67}, {"title": "题临安邸", "author": "宋·林升", "tag": "五年级上册", "cat": "小学必背", "lines": ["山外青山楼外楼，西湖歌舞几时休？", "暖风熏得游人醉，直把杭州作汴州。"], "id": 68}, {"title": "己亥杂诗", "author": "清·龚自珍", "tag": "五年级上册", "cat": "小学必背", "lines": ["九州生气恃风雷，万马齐喑究可哀。", "我劝天公重抖擞，不拘一格降人才。"], "id": 69}, {"title": "山居秋暝", "author": "唐·王维", "tag": "五年级上册", "cat": "小学必背", "lines": ["空山新雨后，天气晚来秋。", "明月松间照，清泉石上流。", "竹喧归浣女，莲动下渔舟。", "随意春芳歇，王孙自可留。"], "id": 70}, {"title": "枫桥夜泊", "author": "唐·张继", "tag": "五年级上册", "cat": "小学必背", "lines": ["月落乌啼霜满天，江枫渔火对愁眠。", "姑苏城外寒山寺，夜半钟声到客船。"], "id": 71}, {"title": "长相思", "author": "清·纳兰性德", "tag": "五年级上册", "cat": "小学必背", "lines": ["山一程，水一程，", "身向榆关那畔行，夜深千帐灯。", "风一更，雪一更，", "聒碎乡心梦不成，故园无此声。"], "id": 72}, {"title": "渔歌子", "author": "唐·张志和", "tag": "五年级上册", "cat": "小学必背", "lines": ["西塞山前白鹭飞，桃花流水鳜鱼肥。", "青箬笠，绿蓑衣，斜风细雨不须归。"], "id": 73}, {"title": "观书有感（其一）", "author": "宋·朱熹", "tag": "五年级上册", "cat": "小学必背", "lines": ["半亩方塘一鉴开，天光云影共徘徊。", "问渠那得清如许？为有源头活水来。"], "id": 74}, {"title": "观书有感（其二）", "author": "宋·朱熹", "tag": "五年级上册", "cat": "小学必背", "lines": ["昨夜江边春水生，蒙冲巨舰一毛轻。", "向来枉费推移力，此日中流自在行。"], "id": 75}, {"title": "四时田园杂兴（其三十一）", "author": "宋·范成大", "tag": "五年级下册", "cat": "小学必背", "lines": ["昼出耘田夜绩麻，村庄儿女各当家。", "童孙未解供耕织，也傍桑阴学种瓜。"], "id": 76}, {"title": "稚子弄冰", "author": "宋·杨万里", "tag": "五年级下册", "cat": "小学必背", "lines": ["稚子金盆脱晓冰，彩丝穿取当银铮。", "敲成玉磬穿林响，忽作玻璃碎地声。"], "id": 77}, {"title": "村晚", "author": "宋·雷震", "tag": "五年级下册", "cat": "小学必背", "lines": ["草满池塘水满陂，山衔落日浸寒漪。", "牧童归去横牛背，短笛无腔信口吹。"], "id": 78}, {"title": "鸟鸣涧", "author": "唐·王维", "tag": "五年级下册", "cat": "小学必背", "lines": ["人闲桂花落，夜静春山空。", "月出惊山鸟，时鸣春涧中。"], "id": 79}, {"title": "凉州词（黄河远上白云间）", "author": "唐·王之涣", "tag": "五年级下册", "cat": "小学必背", "lines": ["黄河远上白云间，一片孤城万仞山。", "羌笛何须怨杨柳，春风不度玉门关。"], "id": 80}, {"title": "送元二使安西", "author": "唐·王维", "tag": "五年级下册", "cat": "小学必背", "lines": ["渭城朝雨浥轻尘，客舍青青柳色新。", "劝君更尽一杯酒，西出阳关无故人。"], "id": 81}, {"title": "秋夜将晓出篱门迎凉有感", "author": "宋·陆游", "tag": "五年级下册", "cat": "小学必背", "lines": ["三万里河东入海，五千仞岳上摩天。", "遗民泪尽胡尘里，南望王师又一年。"], "id": 82}, {"title": "寒菊", "author": "宋·郑思肖", "tag": "五年级下册", "cat": "小学必背", "lines": ["花开不并百花丛，独立疏篱趣未穷。", "宁可枝头抱香死，何曾吹落北风中。"], "id": 83}, {"title": "乡村四月", "author": "宋·翁卷", "tag": "五年级下册", "cat": "小学必背", "lines": ["绿遍山原白满川，子规声里雨如烟。", "乡村四月闲人少，才了蚕桑又插田。"], "id": 84}, {"title": "游子吟", "author": "唐·孟郊", "tag": "五年级下册", "cat": "小学必背", "lines": ["慈母手中线，游子身上衣。", "临行密密缝，意恐迟迟归。", "谁言寸草心，报得三春晖。"], "id": 85}, {"title": "从军行", "author": "唐·王昌龄", "tag": "五年级下册", "cat": "小学必背", "lines": ["青海长云暗雪山，孤城遥望玉门关。", "黄沙百战穿金甲，不破楼兰终不还。"], "id": 86}, {"title": "黄鹤楼送孟浩然之广陵", "author": "唐·李白", "tag": "五年级下册", "cat": "小学必背", "lines": ["故人西辞黄鹤楼，烟花三月下扬州。", "孤帆远影碧空尽，唯见长江天际流。"], "id": 87}, {"title": "宿建德江", "author": "唐·孟浩然", "tag": "六年级上册", "cat": "小学必背", "lines": ["移舟泊烟渚，日暮客愁新。", "野旷天低树，江清月近人。"], "id": 88}, {"title": "六月二十七日望湖楼醉书", "author": "宋·苏轼", "tag": "六年级上册", "cat": "小学必背", "lines": ["黑云翻墨未遮山，白雨跳珠乱入船。", "卷地风来忽吹散，望湖楼下水如天。"], "id": 89}, {"title": "西江月·夜行黄沙道中", "author": "宋·辛弃疾", "tag": "六年级上册", "cat": "小学必背", "lines": ["明月别枝惊鹊， 清风半夜鸣蝉。", "稻花香里说丰年，听取蛙声一片。", "七八个星天外， 两三点雨山前。", "旧时茅店社林边，路转溪桥忽见。"], "id": 90}, {"title": "过故人庄", "author": "唐·孟浩然", "tag": "六年级上册", "cat": "小学必背", "lines": ["故人具鸡黍，邀我至田家。", "绿树村边合，青山郭外斜。", "开轩面场圃，把酒话桑麻。", "待到重阳日，还来就菊花。"], "id": 91}, {"title": "七律·长征", "author": "毛泽东", "tag": "六年级上册", "cat": "小学必背", "lines": ["红军不怕远征难，万水千山只等闲。", "五岭逶迤腾细浪，乌蒙磅礴走泥丸。", "金沙水拍云崖暖，大渡桥横铁索寒。", "更喜岷山千里雪，三军过后尽开颜。"], "id": 92}, {"title": "菩萨蛮·大柏地", "author": "毛泽东", "tag": "六年级上册", "cat": "小学必背", "lines": ["赤橙黄绿青蓝紫，谁持彩练当空舞？", "雨后复斜阳，关山阵阵苍。", "当年鏖战急，弹洞前村壁。", "装点此关山，今朝更好看。"], "id": 93}, {"title": "春日", "author": "宋·朱熹", "tag": "六年级上册", "cat": "小学必背", "lines": ["胜日寻芳泗水滨，无边光景一时新。", "等闲识得东风面，万紫千红总是春。"], "id": 94}, {"title": "回乡偶书", "author": "唐·贺知章", "tag": "六年级上册", "cat": "小学必背", "lines": ["少小离家老大回，乡音无改鬓毛衰。", "儿童相见不相识，笑问客从何处来。"], "id": 95}, {"title": "浪淘沙（其一）", "author": "唐·刘禹锡", "tag": "六年级上册", "cat": "小学必背", "lines": ["九曲黄河万里沙，浪淘风簸自天涯。", "如今直上银河去，同到牵牛织女家。"], "id": 96}, {"title": "江南春", "author": "唐·杜牧", "tag": "六年级上册", "cat": "小学必背", "lines": ["千里莺啼绿映红，水村山郭酒旗风。", "南朝四百八十寺，多少楼台烟雨中。"], "id": 97}, {"title": "书湖阴先生壁", "author": "宋·王安石", "tag": "六年级上册", "cat": "小学必背", "lines": ["茅檐长扫净无苔，花木成畦手自栽。", "一水护田将绿绕，两山排闼送青来。"], "id": 98}, {"title": "寒食", "author": "唐·韩翃", "tag": "六年级下册", "cat": "小学必背", "lines": ["春城无处不飞花，寒食东风御柳斜。", "日暮汉宫传蜡烛，轻烟散入五侯家。"], "id": 99}, {"title": "迢迢牵牛星", "author": "", "tag": "六年级下册", "cat": "小学必背", "lines": ["迢迢牵牛星，皎皎河汉女。", "纤纤擢素手，札札弄机杼。", "终日不成章，泣涕零如雨。", "河汉清且浅，相去复几许。", "盈盈一水间，脉脉不得语。"], "id": 100}, {"title": "十五夜望月", "author": "唐·王建", "tag": "六年级下册", "cat": "小学必背", "lines": ["中庭地白树栖鸦，冷露无声湿桂花。", "今夜月明人尽望，不知秋思落谁家？"], "id": 101}, {"title": "长歌行", "author": "汉乐府", "tag": "六年级下册", "cat": "小学必背", "lines": ["青青园中葵，朝露待日晞。", "阳春布德泽，万物生光辉。", "常恐秋节至，焜黄华叶衰。", "百川东到海，何时复西归？", "少壮不努力，老大徒伤悲！"], "id": 102}, {"title": "马诗", "author": "唐·李贺", "tag": "六年级下册", "cat": "小学必背", "lines": ["大漠沙如雪，燕山月似钩。", "何当金络脑，快走踏清秋。"], "id": 103}, {"title": "石灰吟", "author": "明·于谦", "tag": "六年级下册", "cat": "小学必背", "lines": ["千锤万凿出深山，烈火焚烧若等闲。", "粉身碎骨浑不怕，要留清白在人间。"], "id": 104}, {"title": "竹石", "author": "清·郑燮", "tag": "六年级下册", "cat": "小学必背", "lines": ["咬定青山不放松，立根原在破岩中。", "千磨万击还坚劲，任尔东西南北风。"], "id": 105}, {"title": "采薇（节选）", "author": "《诗经·小雅》", "tag": "六年级下册", "cat": "小学必背", "lines": ["昔我往矣，杨柳依依。", "今我来思，雨雪霏霏。", "行道迟迟，载渴载饥。", "我心伤悲，莫知我哀！"], "id": 106}, {"title": "春夜喜雨", "author": "唐·杜甫", "tag": "六年级下册", "cat": "小学必背", "lines": ["好雨知时节，当春乃发生。", "随风潜入夜，润物细无声。", "野径云俱黑，江船火独明。", "晓看红湿处，花重锦官城。"], "id": 107}, {"title": "闻官军收河南河北", "author": "唐·杜甫", "tag": "六年级下册", "cat": "小学必背", "lines": ["剑外忽传收蓟北，初闻涕泪满衣裳。", "却看妻子愁何在，漫卷诗书喜欲狂。", "白日放歌须纵酒，青春作伴好还乡。", "即从巴峡穿巫峡，便下襄阳向洛阳。"], "id": 108}, {"title": "早春呈水部张十八员外", "author": "唐·韩愈", "tag": "六年级下册", "cat": "小学必背", "lines": ["天街小雨润如酥，草色遥看近却无。", "最是一年春好处，绝胜烟柳满皇都。"], "id": 109}, {"title": "江上渔者", "author": "宋·范仲淹", "tag": "六年级下册", "cat": "小学必背", "lines": ["江上往来人，但爱鲈鱼美。", "君看一叶舟，出没风波里。"], "id": 110}, {"title": "泊船瓜洲", "author": "宋·王安石", "tag": "六年级下册", "cat": "小学必背", "lines": ["京口瓜洲一水间，钟山只隔数重山。", "春风又绿江南岸，明月何时照我还。"], "id": 111}, {"title": "游园不值", "author": "宋·叶绍翁", "tag": "六年级下册", "cat": "小学必背", "lines": ["应怜屐齿印苍苔，小扣柴扉久不开。", "春色满园关不住，一枝红杏出墙来。"], "id": 112}, {"title": "卜算子·送鲍浩然之浙东", "author": "宋·王观", "tag": "六年级下册", "cat": "小学必背", "lines": ["水是眼波横，山是眉峰聚。欲问行人去那边？眉眼盈盈处。", "才始送春归，又送君归去。若到江南赶上春，千万和春住。"], "id": 113}, {"title": "浣溪沙", "author": "宋·苏轼", "tag": "六年级下册", "cat": "小学必背", "lines": ["游蕲水清泉寺，寺临兰溪，溪水西流。", "山下兰芽短浸溪，松间沙路净无泥，潇潇暮雨子规啼。", "谁道人生无再少？门前流水尚能西！ 休将白发唱黄鸡。"], "id": 114}, {"title": "清平乐", "author": "宋·黄庭坚", "tag": "六年级下册", "cat": "小学必背", "lines": ["春归何处？寂寞无行路。若有人知春去处，唤取归来同住。", "春无踪迹谁知？除非问取黄鹂。百啭无人能解，因风飞过蔷薇。"], "id": 115}, {"title": "人之初", "author": "《三字经》", "tag": "一年级下册", "cat": "小学必背", "lines": ["人之初，性本善，性相近，习相远。苟不教，性乃迁，教之道，贵以专。", "子不学，非所宜，幼不学，老何为？玉不琢，不成器，人不学，不知义。"], "id": 116}, {"title": "弟子规（节选）", "author": "李毓秀", "tag": "二年级下册", "cat": "小学必背", "lines": ["弟子规，圣人训。首孝悌，次谨信。泛爱众，而亲仁。有余力，则学文。"], "id": 117}, {"title": "司马光", "author": "《宋史·司马光传》", "tag": "三年级上册", "cat": "小学必背", "lines": ["群儿戏于庭，一儿登瓮，足跌没水中。众皆弃去，光持石击瓮破之，水迸，儿得活。"], "id": 118}, {"title": "守株待兔", "author": "《韩非子·五蠹》", "tag": "三年级下册", "cat": "小学必背", "lines": ["宋人有耕者。田中有株。兔走触株，折颈而死。因释其耒而守株，冀复得兔。兔不可复得，而身为宋国笑。"], "id": 119}, {"title": "精卫填海", "author": "《山海经·北山经》", "tag": "四年级上册", "cat": "小学必背", "lines": ["炎帝之少女，名曰女娃。女娃游于东海，溺而不返，故为精卫，常衔西山之木石，以堙于东海。"], "id": 120}, {"title": "王戎不取道旁李", "author": "《世说新语·雅量》", "tag": "四年级上册", "cat": "小学必背", "lines": ["王戎七岁，尝与诸小儿游。看道边李树多子折枝，诸儿竞走取之，唯戎不动。人问之，答曰：“树在道边而多子，此必苦李。”取之，信然。"], "id": 121}, {"title": "囊萤夜读", "author": "《晋书·车胤传》", "tag": "四年级下册", "cat": "小学必背", "lines": ["胤恭勤不倦，博学多通。家贫不常得油，夏月则练囊盛数十萤火以照书，以夜继日焉。"], "id": 122}, {"title": "铁杵成针", "author": "《方舆胜览·眉州》", "tag": "四年级下册", "cat": "小学必背", "lines": ["磨针溪，在象耳山下。世传李太白读书山中，未成，弃去。过是溪，逢老媪方磨铁杵。问之，曰：“欲作针。”太白感其意，还卒业。"], "id": 123}, {"title": "古人谈读书（其一）", "author": "《论语》", "tag": "五年级上册", "cat": "小学必背", "lines": ["敏而好学，不耻下问。", "知之为知之，不知为不知，是知也。", "默而识之，学而不厌，诲人不倦。"], "id": 124}, {"title": "古人谈读书（其二）", "author": "朱熹", "tag": "五年级上册", "cat": "小学必背", "lines": ["余尝谓读书有三到，谓心到、眼到、口到。心不在此，则眼不看仔细，心眼既不专一，却只漫浪诵读，决不能记，记亦不能久也。三到之中，心到最急。心既到矣，眼口岂不到乎？"], "id": 125}, {"title": "古人谈读书（其三）", "author": "曾国藩", "tag": "五年级上册", "cat": "小学必背", "lines": ["盖士人读书，第一要有志，第二要有识，第三要有恒。有志则断不甘为下流；有识则知学问无尽，不敢以一得自足，如河伯之观海，如井蛙之窥天，皆无识者也；有恒者则断无不成之事。此三者缺一不可。"], "id": 126}, {"title": "少年中国说（节选）", "author": "梁启超", "tag": "五年级上册", "cat": "小学必背", "lines": ["故今日之责任，不在他人，而全在我少年。少年智则国智，少年富则国富，少年强则国强，少年独立则国独立，少年自由则国自由，少年进步则国进步，少年胜于欧洲则国胜于欧洲，少年雄于地球则国雄于地球。"], "id": 127}, {"title": "自相矛盾", "author": "《韩非子·难一》", "tag": "五年级下册", "cat": "小学必背", "lines": ["楚人有鬻盾与矛者，誉之曰：“吾盾之坚，物莫能陷也。”又誉其矛曰：“吾矛之利，于物无不陷也。”或曰：“以子之矛，陷子之盾，何如？”其人弗能应也。夫不可陷之盾与无不陷之矛，不可同世而立。"], "id": 128}, {"title": "杨氏之子", "author": "《世说新语·言语》", "tag": "五年级下册", "cat": "小学必背", "lines": ["梁国杨氏子九岁，甚聪惠。孔君平诣其父，父不在，乃呼儿出。为设果，果有杨梅。孔指以示儿曰：“此是君家果。”儿应声答曰：“未闻孔雀是夫子家禽。”"], "id": 129}, {"title": "伯牙鼓琴", "author": "《吕氏春秋·本味》", "tag": "六年级上册", "cat": "小学必背", "lines": ["伯牙鼓琴，锺子期听之。方鼓琴而志在太山，锺子期曰：“善哉乎鼓琴，巍巍乎若太山。”少选之间而志在流水，锺子期又曰：“善哉乎鼓琴，汤汤乎若流水。”锺子期死，伯牙破琴绝弦，终身不复鼓琴，以为世无足复为鼓琴者。"], "id": 130}, {"title": "书戴嵩画牛", "author": "苏轼", "tag": "六年级上册", "cat": "小学必背", "lines": ["蜀中有杜处士，好书画，所宝以百数。有戴嵩《牛》一轴，尤所爱，锦囊玉轴，常以自随。", "一日曝书画，有一牧童见之，拊掌大笑，曰：“此画斗牛也。牛斗，力在角，尾搐入两股间，今乃掉尾而斗，谬矣。”处士笑而然之。古语有云：“耕当问奴，织当问婢。”不可改也。"], "id": 131}, {"title": "学弈", "author": "《孟子·告子上》", "tag": "六年级下册", "cat": "小学必背", "lines": ["弈秋，通国之善弈者也。使弈秋诲二人弈，其一人专心致志，惟弈秋之为听；一人虽听之，一心以为有鸿鹄将至，思援弓缴而射之，虽与之俱学，弗若之矣。为是其智弗若与？曰：非然也。"], "id": 132}, {"title": "两小儿辩日", "author": "《列子·汤问》", "tag": "六年级下册", "cat": "小学必背", "lines": ["孔子东游，见两小儿辩斗，问其故。", "一儿曰：“我以日始出时去人近，而日中时远也。”一儿曰：“我以日初出远，而日中时近也。”", "一儿曰：“日初出大如车盖，及日中则如盘盂，此不为远者小而近者大乎？”一儿曰：“日初出沧沧凉凉，及其日中如探汤，此不为近者热而远者凉乎？”", "孔子不能决也。两小儿笑曰：“孰为汝多知乎？”"], "id": 133}, {"title": "关雎", "author": "《诗经·周南》", "tag": "八年级下册", "cat": "初中必背", "lines": ["关关雎鸠，在河之洲。窈窕淑女，君子好逑。", "参差荇菜，左右流之。窈窕淑女，寤寐求之。", "求之不得，寤寐思服。悠哉悠哉，辗转反侧。", "参差荇菜，左右采之。窈窕淑女，琴瑟友之。", "参差荇菜，左右芼之。窈窕淑女，钟鼓乐之。"], "id": 134}, {"title": "蒹葭", "author": "《诗经·秦风》", "tag": "八年级下册", "cat": "初中必背", "lines": ["蒹葭苍苍，白露为霜。所谓伊人，在水一方。", "溯洄从之，道阻且长。溯游从之，宛在水中央。", "蒹葭萋萋，白露未晞。所谓伊人，在水之湄。", "溯洄从之，道阻且跻。溯游从之，宛在水中坻。", "蒹葭采采，白露未已。所谓伊人，在水之涘。", "溯洄从之，道阻且右。溯游从之，宛在水中沚。"], "id": 135}, {"title": "十五从军征", "author": "汉乐府", "tag": "九年级下册", "cat": "初中必背", "lines": ["十五从军征，八十始得归。", "道逢乡里人：“家中有阿谁？”", "“遥看是君家，松柏冢累累。”", "兔从狗窦入，雉从梁上飞。", "中庭生旅谷，井上生旅葵。", "舂谷持作饭，采葵持作羹。", "羹饭一时熟，不知贻阿谁。", "出门东向看，泪落沾我衣。"], "id": 136}, {"title": "观沧海", "author": "曹操", "tag": "七年级上册", "cat": "初中必背", "lines": ["东临碣石，以观沧海。", "水何澹澹，山岛竦峙。", "树木丛生，百草丰茂。", "秋风萧瑟，洪波涌起。", "日月之行，若出其中。", "星汉灿烂，若出其里。", "幸甚至哉，歌以咏志。"], "id": 137}, {"title": "饮酒（其五）", "author": "陶渊明", "tag": "八年级上册", "cat": "初中必背", "lines": ["结庐在人境，而无车马喧。", "问君何能尔？心远地自偏。", "采菊东篱下，悠然见南山。", "山气日夕佳，飞鸟相与还。", "此中有真意，欲辨已忘言。"], "id": 138}, {"title": "木兰诗", "author": "北朝民歌", "tag": "七年级下册", "cat": "初中必背", "lines": ["唧唧复唧唧，木兰当户织。不闻机杼声，唯闻女叹息。", "问女何所思，问女何所忆。女亦无所思，女亦无所忆。昨夜见军帖，可汗大点兵。军书十二卷，卷卷有爷名。阿爷无大儿，木兰无长兄。愿为市鞍马，从此替爷征。", "东市买骏马，西市买鞍鞯，南市买辔头，北市买长鞭。旦辞爷娘去，暮宿黄河边。不闻爷娘唤女声，但闻黄河流水鸣溅溅。旦辞黄河去，暮至黑山头。不闻爷娘唤女声，但闻燕山胡骑鸣啾啾。", "万里赴戎机，关山度若飞。朔气传金柝，寒光照铁衣。将军百战死，壮士十年归。", "归来见天子，天子坐明堂。策勋十二转，赏赐百千强。可汗问所欲，木兰不用尚书郎。愿驰千里足，送儿还故乡。", "爷娘闻女来，出郭相扶将；阿姊闻妹来，当户理红妆；小弟闻姊来，磨刀霍霍向猪羊。开我东阁门，坐我西阁床。脱我战时袍，著我旧时裳。当窗理云鬓，对镜帖花黄。出门看火伴，火伴皆惊忙。同行十二年，不知木兰是女郎。", "雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？"], "id": 139}, {"title": "送杜少府之任蜀州", "author": "王勃", "tag": "八年级下册", "cat": "初中必背", "lines": ["城阙辅三秦，风烟望五津。", "与君离别意，同是宦游人。", "海内存知己，天涯若比邻。", "无为在歧路，儿女共沾巾。"], "id": 140}, {"title": "登幽州台歌", "author": "陈子昂", "tag": "七年级下册", "cat": "初中必背", "lines": ["前不见古人，后不见来者。", "念天地之悠悠，独怆然而涕下。"], "id": 141}, {"title": "次北固山下", "author": "王湾", "tag": "七年级上册", "cat": "初中必背", "lines": ["客路青山外，行舟绿水前。", "潮平两岸阔，风正一帆悬。", "海日生残夜，江春入旧年。", "乡书何处达？归雁洛阳边。"], "id": 142}, {"title": "使至塞上", "author": "王维", "tag": "八年级上册", "cat": "初中必背", "lines": ["单车欲问边，属国过居延。", "征蓬出汉塞，归雁入胡天。", "大漠孤烟直，长河落日圆。", "萧关逢候骑，都护在燕然。"], "id": 143}, {"title": "闻王昌龄左迁龙标遥有此寄", "author": "李白", "tag": "七年级上册", "cat": "初中必背", "lines": ["杨花落尽子规啼，闻道龙标过五溪。", "我寄愁心与明月，随君直到夜郎西。"], "id": 144}, {"title": "行路难（其一）", "author": "李白", "tag": "九年级上册", "cat": "初中必背", "lines": ["金樽清酒斗十千，玉盘珍羞直万钱。", "停杯投箸不能食，拔剑四顾心茫然。", "欲渡黄河冰塞川，将登太行雪满山。", "闲来垂钓碧溪上，忽复乘舟梦日边。", "行路难，行路难，多歧路，今安在？", "长风破浪会有时，直挂云帆济沧海。"], "id": 145}, {"title": "黄鹤楼", "author": "崔颢", "tag": "八年级上册", "cat": "初中必背", "lines": ["昔人已乘黄鹤去，此地空余黄鹤楼。", "黄鹤一去不复返，白云千载空悠悠。", "晴川历历汉阳树，芳草萋萋鹦鹉洲。", "日暮乡关何处是？烟波江上使人愁。"], "id": 146}, {"title": "望岳", "author": "杜甫", "tag": "七年级下册", "cat": "初中必背", "lines": ["岱宗夫如何？齐鲁青未了。", "造化钟神秀，阴阳割昏晓。", "荡胸生曾云，决眦入归鸟。", "会当凌绝顶，一览众山小。"], "id": 147}, {"title": "春望", "author": "杜甫", "tag": "八年级上册", "cat": "初中必背", "lines": ["国破山河在，城春草木深。", "感时花溅泪，恨别鸟惊心。", "烽火连三月，家书抵万金。", "白头搔更短，浑欲不胜簪。"], "id": 148}, {"title": "茅屋为秋风所破歌", "author": "杜甫", "tag": "八年级下册", "cat": "初中必背", "lines": ["八月秋高风怒号，卷我屋上三重茅。茅飞渡江洒江郊，高者挂罥长林梢，下者飘转沉塘坳。", "南村群童欺我老无力，忍能对面为盗贼。公然抱茅入竹去，唇焦口燥呼不得，归来倚杖自叹息。", "俄顷风定云墨色，秋天漠漠向昏黑。布衾多年冷似铁，娇儿恶卧踏里裂。床头屋漏无干处，雨脚如麻未断绝。自经丧乱少睡眠，长夜沾湿何由彻！", "安得广厦千万间，大庇天下寒士俱欢颜！风雨不动安如山。呜呼！何时眼前突兀见此屋，吾庐独破受冻死亦足！"], "id": 149}, {"title": "白雪歌送武判官归京", "author": "岑参", "tag": "九年级下册", "cat": "初中必背", "lines": ["北风卷地白草折，胡天八月即飞雪。", "忽如一夜春风来，千树万树梨花开。", "散入珠帘湿罗幕，狐裘不暖锦衾薄。", "将军角弓不得控，都护铁衣冷难着。", "瀚海阑干百丈冰，愁云惨淡万里凝。", "中军置酒饮归客，胡琴琵琶与羌笛。", "纷纷暮雪下辕门，风掣红旗冻不翻。", "轮台东门送君去，去时雪满天山路。", "山回路转不见君，雪上空留马行处。"], "id": 150}, {"title": "酬乐天扬州初逢席上见赠", "author": "刘禹锡", "tag": "九年级上册", "cat": "初中必背", "lines": ["巴山楚水凄凉地，二十三年弃置身。", "怀旧空吟闻笛赋，到乡翻似烂柯人。", "沉舟侧畔千帆过，病树前头万木春。", "今日听君歌一曲，暂凭杯酒长精神。"], "id": 151}, {"title": "卖炭翁", "author": "白居易", "tag": "八年级下册", "cat": "初中必背", "lines": ["卖炭翁，伐薪烧炭南山中。", "满面尘灰烟火色，两鬓苍苍十指黑。", "卖炭得钱何所营？身上衣裳口中食。", "可怜身上衣正单，心忧炭贱愿天寒。", "夜来城外一尺雪，晓驾炭车辗冰辙。", "牛困人饥日已高，市南门外泥中歇。", "翩翩两骑来是谁？黄衣使者白衫儿。", "手把文书口称敕，回车叱牛牵向北。", "一车炭，千余斤，宫使驱将惜不得。", "半匹红纱一丈绫，系向牛头充炭直。"], "id": 152}, {"title": "钱塘湖春行", "author": "白居易", "tag": "八年级上册", "cat": "初中必背", "lines": ["孤山寺北贾亭西，水面初平云脚低。", "几处早莺争暖树，谁家新燕啄春泥。", "乱花渐欲迷人眼，浅草才能没马蹄。", "最爱湖东行不足，绿杨阴里白沙堤。"], "id": 153}, {"title": "雁门太守行", "author": "李贺", "tag": "八年级上册", "cat": "初中必背", "lines": ["黑云压城城欲摧，甲光向日金鳞开。", "角声满天秋色里，塞上燕脂凝夜紫。", "半卷红旗临易水，霜重鼓寒声不起。", "报君黄金台上意，提携玉龙为君死。"], "id": 154}, {"title": "赤壁", "author": "杜牧", "tag": "八年级上册", "cat": "初中必背", "lines": ["折戟沉沙铁未销，自将磨洗认前朝。", "东风不与周郎便，铜雀春深锁二乔。"], "id": 155}, {"title": "泊秦淮", "author": "杜牧", "tag": "七年级下册", "cat": "初中必背", "lines": ["烟笼寒水月笼沙，夜泊秦淮近酒家。", "商女不知亡国恨，隔江犹唱后庭花。"], "id": 156}, {"title": "夜雨寄北", "author": "李商隐", "tag": "七年级上册", "cat": "初中必背", "lines": ["君问归期未有期，巴山夜雨涨秋池。", "何当共剪西窗烛，却话巴山夜雨时。"], "id": 157}, {"title": "无题（相见时难别亦难）", "author": "李商隐", "tag": "九年级上册", "cat": "初中必背", "lines": ["相见时难别亦难，东风无力百花残。", "春蚕到死丝方尽，蜡炬成灰泪始干。", "晓镜但愁云鬓改，夜吟应觉月光寒。", "蓬山此去无多路，青鸟殷勤为探看。"], "id": 158}, {"title": "相见欢（无言独上西楼）", "author": "李煜", "tag": "七年级上册", "cat": "初中必背", "lines": ["无言独上西楼，月如钩。寂寞梧桐深院锁清秋。", "剪不断，理还乱，是离愁。别是一般滋味在心头。"], "id": 159}, {"title": "渔家傲·秋思", "author": "范仲淹", "tag": "九年级下册", "cat": "初中必背", "lines": ["塞下秋来风景异，衡阳雁去无留意。四面边声连角起，千嶂里，长烟落日孤城闭。", "浊酒一杯家万里，燕然未勒归无计。羌管悠悠霜满地，人不寐，将军白发征夫泪。"], "id": 160}, {"title": "浣溪沙（一曲新词酒一杯）", "author": "晏殊", "tag": "八年级上册", "cat": "初中必背", "lines": ["一曲新词酒一杯，去年天气旧亭台。夕阳西下几时回？", "无可奈何花落去，似曾相识燕归来。小园香径独徘徊。"], "id": 161}, {"title": "登飞来峰", "author": "王安石", "tag": "七年级下册", "cat": "初中必背", "lines": ["飞来山上千寻塔，闻说鸡鸣见日升。", "不畏浮云遮望眼，自缘身在最高层。"], "id": 162}, {"title": "江城子·密州出猎", "author": "苏轼", "tag": "九年级下册", "cat": "初中必背", "lines": ["老夫聊发少年狂，左牵黄，右擎苍，锦帽貂裘，千骑卷平冈。为报倾城随太守，亲射虎，看孙郎。", "酒酣胸胆尚开张。鬓微霜，又何妨！持节云中，何日遣冯唐？会挽雕弓如满月，西北望，射天狼。"], "id": 163}, {"title": "水调歌头（明月几时有）", "author": "苏轼", "tag": "九年级上册", "cat": "初中必背", "lines": ["明月几时有？把酒问青天。不知天上宫阙，今夕是何年。我欲乘风归去，又恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间。", "转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆？人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。"], "id": 164}, {"title": "渔家傲（天接云涛连晓雾）", "author": "李清照", "tag": "八年级上册", "cat": "初中必背", "lines": ["天接云涛连晓雾，星河欲转千帆舞。仿佛梦魂归帝所。闻天语，殷勤问我归何处。", "我报路长嗟日暮，学诗谩有惊人句。九万里风鹏正举。风休住，蓬舟吹取三山去！"], "id": 165}, {"title": "游山西村", "author": "陆游", "tag": "七年级下册", "cat": "初中必背", "lines": ["莫笑农家腊酒浑，丰年留客足鸡豚。", "山重水复疑无路，柳暗花明又一村。", "箫鼓追随春社近，衣冠简朴古风存。", "从今若许闲乘月，拄杖无时夜叩门。"], "id": 166}, {"title": "南乡子·登京口北固亭有怀", "author": "辛弃疾", "tag": "九年级下册", "cat": "初中必背", "lines": ["何处望神州？满眼风光北固楼。千古兴亡多少事？悠悠。不尽长江滚滚流。", "年少万兜鍪，坐断东南战未休。天下英雄谁敌手？曹刘。生子当如孙仲谋。"], "id": 167}, {"title": "破阵子·为陈同甫赋壮词以寄之", "author": "辛弃疾", "tag": "九年级下册", "cat": "初中必背", "lines": ["醉里挑灯看剑，梦回吹角连营。八百里分麾下炙，五十弦翻塞外声。沙场秋点兵。", "马作的卢飞快，弓如霹雳弦惊。了却君王天下事，赢得生前身后名。可怜白发生！"], "id": 168}, {"title": "过零丁洋", "author": "文天祥", "tag": "九年级下册", "cat": "初中必背", "lines": ["辛苦遭逢起一经，干戈寥落四周星。", "山河破碎风飘絮，身世浮沉雨打萍。", "惶恐滩头说惶恐，零丁洋里叹零丁。", "人生自古谁无死？留取丹心照汗青。"], "id": 169}, {"title": "天净沙·秋思", "author": "马致远", "tag": "七年级上册", "cat": "初中必背", "lines": ["枯藤老树昏鸦，小桥流水人家，古道西风瘦马。", "夕阳西下，断肠人在天涯。"], "id": 170}, {"title": "山坡羊·潼关怀古", "author": "张养浩", "tag": "九年级下册", "cat": "初中必背", "lines": ["峰峦如聚，波涛如怒，山河表里潼关路。望西都，意踌躇。", "伤心秦汉经行处，宫阙万间都做了土。兴，百姓苦；亡，百姓苦。"], "id": 171}, {"title": "己亥杂诗（浩荡离愁白日斜）", "author": "龚自珍", "tag": "七年级下册", "cat": "初中必背", "lines": ["浩荡离愁白日斜，吟鞭东指即天涯。", "落红不是无情物，化作春泥更护花。"], "id": 172}, {"title": "满江红（小住京华）", "author": "秋瑾", "tag": "九年级下册", "cat": "初中必背", "lines": ["小住京华，早又是中秋佳节。为篱下黄花开遍，秋容如拭。四面歌残终破楚，八年风味徒思浙。苦将侬强派作蛾眉，殊未屑！", "身不得，男儿列，心却比，男儿烈。算平生肝胆，因人常热。俗子胸襟谁识我？英雄末路当磨折。莽红尘何处觅知音？青衫湿！"], "id": 173}, {"title": "论语十二章", "author": "孔子及其弟子", "tag": "七年级上册", "cat": "初中必背", "lines": ["子曰：“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？”", "曾子曰：“吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？”", "子曰：“吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。”", "子曰：“温故而知新，可以为师矣。”", "子曰：“学而不思则罔，思而不学则殆。”", "子曰：“贤哉，回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。贤哉，回也！”", "子曰：“知之者不如好之者，好之者不如乐之者。”", "子曰：“饭疏食，饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云。”", "子曰：“三人行，必有我师焉。择其善者而从之，其不善者而改之。”", "子在川上曰：“逝者如斯夫，不舍昼夜。”", "子曰：“三军可夺帅也，匹夫不可夺志也。”", "子夏曰：“博学而笃志，切问而近思，仁在其中矣。”"], "id": 174}, {"title": "曹刿论战", "author": "《左传》", "tag": "九年级下册", "cat": "初中必背", "lines": ["十年春，齐师伐我。公将战，曹刿请见。其乡人曰：“肉食者谋之，又何间焉？”刿曰：“肉食者鄙，未能远谋。”乃入见。问：“何以战？”公曰：“衣食所安，弗敢专也，必以分人。”对曰：“小惠未遍，民弗从也。”公曰：“牺牲玉帛，弗敢加也，必以信。”对曰：“小信未孚，神弗福也。”公曰：“小大之狱，虽不能察，必以情。”对曰：“忠之属也。可以一战。战则请从。”", "公与之乘，战于长勺。公将鼓之。刿曰：“未可。”齐人三鼓。刿曰：“可矣。”齐师败绩。公将驰之。刿曰：“未可。”下视其辙，登轼而望之，曰：“可矣。”遂逐齐师。", "既克，公问其故。对曰：“夫战，勇气也。一鼓作气，再而衰，三而竭。彼竭我盈，故克之。夫大国，难测也，惧有伏焉。吾视其辙乱，望其旗靡，故逐之。”"], "id": 175}, {"title": "鱼我所欲也", "author": "孟子", "tag": "九年级下册", "cat": "初中必背", "lines": ["鱼，我所欲也；熊掌，亦我所欲也。二者不可得兼，舍鱼而取熊掌者也。生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。生亦我所欲，所欲有甚于生者，故不为苟得也；死亦我所恶，所恶有甚于死者，故患有所不辟也。如使人之所欲莫甚于生，则凡可以得生者何不用也？使人之所恶莫甚于死者，则凡可以辟患者何不为也？由是则生而有不用也，由是则可以辟患而有不为也。是故所欲有甚于生者，所恶有甚于死者。非独贤者有是心也，人皆有之，贤者能勿丧耳。", "一箪食，一豆羹，得之则生，弗得则死。呼尔而与之，行道之人弗受；蹴尔而与之，乞人不屑也。万钟则不辩礼义而受之，万钟于我何加焉！为宫室之美，妻妾之奉，所识穷乏者得我与？乡为身死而不受，今为宫室之美为之；乡为身死而不受，今为妻妾之奉为之；乡为身死而不受，今为所识穷乏者得我而为之：是亦不可以已乎？此之谓失其本心。"], "id": 176}, {"title": "得道多助，失道寡助", "author": "孟子", "tag": "八年级上册", "cat": "初中必背", "lines": ["天时不如地利，地利不如人和。三里之城，七里之郭，环而攻之而不胜。夫环而攻之，必有得天时者矣，然而不胜者，是天时不如地利也。城非不高也，池非不深也，兵革非不坚利也，米粟非不多也，委而去之，是地利不如人和也。故曰：域民不以封疆之界，固国不以山溪之险，威天下不以兵革之利。得道者多助，失道者寡助。寡助之至，亲戚畔之；多助之至，天下顺之。以天下之所顺，攻亲戚之所畔，故君子有不战，战必胜矣。"], "id": 177}, {"title": "生于忧患，死于安乐", "author": "孟子", "tag": "八年级上册", "cat": "初中必背", "lines": ["舜发于畎亩之中，傅说举于版筑之间，胶鬲举于鱼盐之中，管夷吾举于士，孙叔敖举于海，百里奚举于市。故天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。", "人恒过，然后能改；困于心，衡于虑，而后作；征于色，发于声，而后喻。入则无法家拂士，出则无敌国外患者，国恒亡。然后知生于忧患而死于安乐也。"], "id": 178}, {"title": "北冥有鱼", "author": "《庄子》", "tag": "八年级下册", "cat": "初中必背", "lines": ["北冥有鱼，其名为鲲。鲲之大，不知其几千里也；化而为鸟，其名为鹏。鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。是鸟也，海运则将徙于南冥。南冥者，天池也。《齐谐》者，志怪者也。《谐》之言曰：“鹏之徙于南冥也，水击三千里，抟扶摇而上者九万里，去以六月息者也。”野马也，尘埃也，生物之以息相吹也。天之苍苍，其正色邪？其远而无所至极邪？其视下也，亦若是则已矣。"], "id": 179}, {"title": "虽有嘉肴", "author": "《礼记》", "tag": "八年级下册", "cat": "初中必背", "lines": ["虽有嘉肴，弗食，不知其旨也；虽有至道，弗学，不知其善也。是故学然后知不足，教然后知困。知不足，然后能自反也；知困，然后能自强也。故曰：教学相长也。《兑命》曰“学学半”，其此之谓乎！"], "id": 180}, {"title": "伯牙鼓琴", "author": "《吕氏春秋》", "tag": "初中", "cat": "初中必背", "lines": ["伯牙鼓琴，锺子期听之。方鼓琴而志在太山，锺子期曰：“善哉乎鼓琴，巍巍乎若太山。”少选之间而志在流水，锺子期又曰：“善哉乎鼓琴，汤汤乎若流水。”锺子期死，伯牙破琴绝弦，终身不复鼓琴，以为世无足复为鼓琴者。"], "id": 181}, {"title": "邹忌讽齐王纳谏", "author": "《战国策》", "tag": "九年级下册", "cat": "初中必背", "lines": ["邹忌修八尺有余，而形貌昳丽。朝服衣冠，窥镜，谓其妻曰：“我孰与城北徐公美？”其妻曰：“君美甚，徐公何能及君也？”城北徐公，齐国之美丽者也。忌不自信，而复问其妾曰：“吾孰与徐公美？”妾曰：“徐公何能及君也？”旦日，客从外来，与坐谈，问之客曰：“吾与徐公孰美？”客曰：“徐公不若君之美也。”明日徐公来，孰视之，自以为不如；窥镜而自视，又弗如远甚。暮寝而思之，曰：“吾妻之美我者，私我也；妾之美我者，畏我也；客之美我者，欲有求于我也。”", "于是入朝见威王，曰：“臣诚知不如徐公美。臣之妻私臣，臣之妾畏臣，臣之客欲有求于臣，皆以美于徐公。今齐地方千里，百二十城，宫妇左右莫不私王，朝廷之臣莫不畏王，四境之内莫不有求于王：由此观之，王之蔽甚矣。”", "王曰：“善。”乃下令：“群臣吏民能面刺寡人之过者，受上赏；上书谏寡人者，受中赏；能谤讥于市朝，闻寡人之耳者，受下赏。”令初下，群臣进谏，门庭若市；数月之后，时时而间进；期年之后，虽欲言，无可进者。燕、赵、韩、魏闻之，皆朝于齐。此所谓战胜于朝廷。"], "id": 182}, {"title": "出师表", "author": "诸葛亮", "tag": "九年级下册", "cat": "初中必背", "lines": ["先帝创业未半，而中道崩殂；今天下三分，益州疲弊，此诚危急存亡之秋也。然侍卫之臣不懈于内，忠志之士忘身于外者，盖追先帝之殊遇，欲报之于陛下也。诚宜开张圣听，以光先帝遗德，恢弘志士之气；不宜妄自菲薄，引喻失义，以塞忠谏之路也。", "宫中府中，俱为一体，陟罚臧否，不宜异同。若有作奸犯科及为忠善者，宜付有司论其刑赏，以昭陛下平明之理；不宜偏私，使内外异法也。", "侍中、侍郎郭攸之、费祎、董允等，此皆良实，志虑忠纯，是以先帝简拔以遗陛下。愚以为宫中之事，事无大小，悉以咨之，然后施行，必能裨补阙漏，有所广益。", "将军向宠，性行淑均，晓畅军事，试用于昔日，先帝称之曰能，是以众议举宠为督。愚以为营中之事，悉以咨之，必能使行阵和睦，优劣得所。", "亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也。先帝在时，每与臣论此事，未尝不叹息痛恨于桓、灵也。侍中、尚书、长史、参军，此悉贞良死节之臣，愿陛下亲之信之，则汉室之隆，可计日而待也。", "臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中，咨臣以当世之事，由是感激，遂许先帝以驱驰。后值倾覆，受任于败军之际，奉命于危难之间，尔来二十有一年矣。", "愿陛下托臣以讨贼兴复之效；不效，则治臣之罪，以告先帝之灵。若无兴德之言，则责攸之、祎、允等之慢，以彰其咎。陛下亦宜自谋，以咨诹善道，察纳雅言，深追先帝遗诏。臣不胜受恩感激。今当远离，临表涕零，不知所言。"], "id": 183}, {"title": "桃花源记", "author": "陶渊明", "tag": "八年级下册", "cat": "初中必背", "lines": ["晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。", "林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田、美池、桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。", "见渔人，乃大惊，问所从来。具答之。便要还家，设酒杀鸡作食。村中闻有此人，咸来问讯。自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。问今是何世，乃不知有汉，无论魏晋。此人一一为具言所闻，皆叹惋。余人各复延至其家，皆出酒食。停数日，辞去。此中人语云：“不足为外人道也。”", "既出，得其船，便扶向路，处处志之。及郡下，诣太守，说如此。太守即遣人随其往，寻向所志，遂迷，不复得路。", "南阳刘子骥，高尚士也，闻之，欣然规往。未果，寻病终。后遂无问津者。"], "id": 184}, {"title": "答谢中书书", "author": "陶弘景", "tag": "八年级上册", "cat": "初中必背", "lines": ["山川之美，古来共谈。高峰入云，清流见底。两岸石壁，五色交辉。青林翠竹，四时俱备。晓雾将歇，猿鸟乱鸣；夕日欲颓，沉鳞竞跃。实是欲界之仙都。自康乐以来，未复有能与其奇者。"], "id": 185}, {"title": "三峡", "author": "郦道元", "tag": "八年级上册", "cat": "初中必背", "lines": ["自三峡七百里中，两岸连山，略无阙处。重岩叠嶂，隐天蔽日。自非亭午夜分，不见曦月。", "至于夏水襄陵，沿溯阻绝。或王命急宣，有时朝发白帝，暮到江陵，其间千二百里，虽乘奔御风，不以疾也。", "春冬之时，则素湍绿潭，回清倒影。绝𪩘多生怪柏，悬泉瀑布，飞漱其间，清荣峻茂，良多趣味。", "每至晴初霜旦，林寒涧肃，常有高猿长啸，属引凄异，空谷传响，哀转久绝。故渔者歌曰：“巴东三峡巫峡长，猿鸣三声泪沾裳。”"], "id": 186}, {"title": "马说", "author": "韩愈", "tag": "八年级下册", "cat": "初中必背", "lines": ["世有伯乐，然后有千里马。千里马常有，而伯乐不常有。故虽有名马，祇辱于奴隶人之手，骈死于槽枥之间，不以千里称也。", "马之千里者，一食或尽粟一石。食马者不知其能千里而食也。是马也，虽有千里之能，食不饱，力不足，才美不外见，且欲与常马等不可得，安求其能千里也？", "策之不以其道，食之不能尽其材，鸣之而不能通其意，执策而临之，曰：“天下无马！”呜呼！其真无马邪？其真不知马也！"], "id": 187}, {"title": "陋室铭", "author": "刘禹锡", "tag": "七年级下册", "cat": "初中必背", "lines": ["山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？"], "id": 188}, {"title": "小石潭记", "author": "柳宗元", "tag": "八年级下册", "cat": "初中必背", "lines": ["从小丘西行百二十步，隔篁竹，闻水声，如鸣珮环，心乐之。伐竹取道，下见小潭，水尤清冽。全石以为底，近岸，卷石底以出，为坻，为屿，为嵁，为岩。青树翠蔓，蒙络摇缀，参差披拂。", "潭中鱼可百许头，皆若空游无所依，日光下澈，影布石上。佁然不动，俶尔远逝，往来翕忽，似与游者相乐。", "潭西南而望，斗折蛇行，明灭可见。其岸势犬牙差互，不可知其源。", "坐潭上，四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃。以其境过清，不可久居，乃记之而去。", "同游者：吴武陵，龚古，余弟宗玄。隶而从者，崔氏二小生，曰恕己，曰奉壹。"], "id": 189}, {"title": "岳阳楼记", "author": "范仲淹", "tag": "九年级上册", "cat": "初中必背", "lines": ["庆历四年春，滕子京谪守巴陵郡。越明年，政通人和，百废具兴，乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上，属予作文以记之。", "予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯，朝晖夕阴，气象万千，此则岳阳楼之大观也，前人之述备矣。然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？", "若夫淫雨霏霏，连月不开，阴风怒号，浊浪排空，日星隐曜，山岳潜形，商旅不行，樯倾楫摧，薄暮冥冥，虎啸猿啼。登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。", "至若春和景明，波澜不惊，上下天光，一碧万顷，沙鸥翔集，锦鳞游泳，岸芷汀兰，郁郁青青。而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。", "嗟夫！予尝求古仁人之心，或异二者之为，何哉？不以物喜，不以己悲，居庙堂之高则忧其民，处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰“先天下之忧而忧，后天下之乐而乐”乎！噫！微斯人，吾谁与归？"], "id": 190}, {"title": "醉翁亭记", "author": "欧阳修", "tag": "九年级上册", "cat": "初中必背", "lines": ["环滁皆山也。其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。山行六七里，渐闻水声潺潺，而泻出于两峰之间者，酿泉也。峰回路转，有亭翼然临于泉上者，醉翁亭也。作亭者谁？山之僧智仙也。名之者谁？太守自谓也。太守与客来饮于此，饮少辄醉，而年又最高，故自号曰醉翁也。醉翁之意不在酒，在乎山水之间也。山水之乐，得之心而寓之酒也。", "若夫日出而林霏开，云归而岩穴暝，晦明变化者，山间之朝暮也。野芳发而幽香，佳木秀而繁阴，风霜高洁，水落而石出者，山间之四时也。朝而往，暮而归，四时之景不同，而乐亦无穷也。", "至于负者歌于途，行者休于树，前者呼，后者应，伛偻提携，往来而不绝者，滁人游也。临溪而渔，溪深而鱼肥，酿泉为酒，泉香而酒洌，山肴野蔌，杂然而前陈者，太守宴也。宴酣之乐，非丝非竹，射者中，弈者胜，觥筹交错，起坐而喧哗者，众宾欢也。苍颜白发，颓然乎其间者，太守醉也。", "已而夕阳在山，人影散乱，太守归而宾客从也。树林阴翳，鸣声上下，游人去而禽鸟乐也。然而禽鸟知山林之乐，而不知人之乐；人知从太守游而乐，而不知太守之乐其乐也。醉能同其乐，醒能述以文者，太守也。太守谓谁？庐陵欧阳修也。"], "id": 191}, {"title": "爱莲说", "author": "周敦颐", "tag": "七年级下册", "cat": "初中必背", "lines": ["水陆草木之花，可爱者甚蕃。晋陶渊明独爱菊。自李唐来，世人甚爱牡丹。予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。", "予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。噫！菊之爱，陶后鲜有闻。莲之爱，同予者何人？牡丹之爱，宜乎众矣！"], "id": 192}, {"title": "记承天寺夜游", "author": "苏轼", "tag": "八年级上册", "cat": "初中必背", "lines": ["元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭。庭下如积水空明，水中藻、荇交横，盖竹柏影也。何夜无月？何处无竹柏？但少闲人如吾两人者耳。"], "id": 193}, {"title": "送东阳马生序", "author": "宋濂", "tag": "九年级下册", "cat": "初中必背", "lines": ["余幼时即嗜学。家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还。天大寒，砚冰坚，手指不可屈伸，弗之怠。录毕，走送之，不敢稍逾约。以是人多以书假余，余因得遍观群书。既加冠，益慕圣贤之道。又患无硕师名人与游，尝趋百里外，从乡之先达执经叩问。先达德隆望尊，门人弟子填其室，未尝稍降辞色。余立侍左右，援疑质理，俯身倾耳以请；或遇其叱咄，色愈恭，礼愈至，不敢出一言以复；俟其欣悦，则又请焉。故余虽愚，卒获有所闻。", "当余之从师也，负箧曳屣行深山巨谷中。穷冬烈风，大雪深数尺，足肤皲裂而不知。至舍，四支僵劲不能动，媵人持汤沃灌，以衾拥覆，久而乃和。寓逆旅，主人日再食，无鲜肥滋味之享。同舍生皆被绮绣，戴朱缨宝饰之帽，腰白玉之环，左佩刀，右备容臭，烨然若神人；余则缊袍敝衣处其间，略无慕艳意，以中有足乐者，不知口体之奉不若人也。盖余之勤且艰若此。"], "id": 194}, {"title": "湖心亭看雪", "author": "张岱", "tag": "九年级上册", "cat": "初中必背", "lines": ["崇祯五年十二月，余住西湖。大雪三日，湖中人鸟声俱绝。是日更定矣，余拏一小舟，拥毳衣炉火，独往湖心亭看雪。雾凇沆砀，天与云与山与水，上下一白。湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。", "到亭上，有两人铺毡对坐，一童子烧酒炉正沸。见余大喜曰：“湖中焉得更有此人！”拉余同饮。余强饮三大白而别。问其姓氏，是金陵人，客此。及下船，舟子喃喃曰：“莫说相公痴，更有痴似相公者！”"], "id": 195}, {"title": "论语十二章", "author": "《论语》", "tag": "选择性必修上册", "cat": "高中必背", "lines": ["子曰：“君子食无求饱，居无求安，敏于事而慎于言，就有道而正焉，可谓好学也已。”", "子曰：“人而不仁，如礼何？人而不仁，如乐何？”", "子曰：“朝闻道，夕死可矣。”", "子曰：“君子喻于义，小人喻于利。”", "子曰：“见贤思齐焉，见不贤而内自省也。”", "子曰：“质胜文则野，文胜质则史。文质彬彬，然后君子。”", "曾子曰：“士不可以不弘毅，任重而道远。仁以为己任，不亦重乎？死而后已，不亦远乎？”", "子曰：“譬如为山，未成一篑，止，吾止也。譬如平地，虽覆一篑，进，吾往也。”", "子曰：“知者不惑，仁者不忧，勇者不惧。”", "颜渊问仁。子曰：“克己复礼为仁。一日克己复礼，天下归仁焉。为仁由己，而由人乎哉？”颜渊曰：“请问其目。”子曰：“非礼勿视，非礼勿听，非礼勿言，非礼勿动。”颜渊曰：“回虽不敏，请事斯语矣。”", "子贡问曰：“有一言而可以终身行之者乎？”子曰：“其恕乎！己所不欲，勿施于人。”", "子曰：“小子何莫学夫《诗》？《诗》可以兴，可以观，可以群，可以怨。迩之事父，远之事君。多识于鸟兽草木之名。”"], "id": 196}, {"title": "劝学", "author": "荀子", "tag": "必修上册", "cat": "高中必背", "lines": ["君子曰：学不可以已。", "青，取之于蓝，而青于蓝；冰，水为之，而寒于水。木直中绳，輮以为轮，其曲中规。虽有槁暴，不复挺者，輮使之然也。故木受绳则直，金就砺则利，君子博学而日参省乎己，则知明而行无过矣。", "吾尝终日而思矣，不如须臾之所学也；吾尝跂而望矣，不如登高之博见也。登高而招，臂非加长也，而见者远；顺风而呼，声非加疾也，而闻者彰。假舆马者，非利足也，而致千里；假舟楫者，非能水也，而绝江河。君子生非异也，善假于物也。", "积土成山，风雨兴焉；积水成渊，蛟龙生焉；积善成德，而神明自得，圣心备焉。故不积跬步，无以至千里；不积小流，无以成江海。骐骥一跃，不能十步；驽马十驾，功在不舍。锲而舍之，朽木不折；锲而不舍，金石可镂。蚓无爪牙之利，筋骨之强，上食埃土，下饮黄泉，用心一也。蟹六跪而二螯，非蛇鳝之穴无可寄托者，用心躁也。"], "id": 197}, {"title": "屈原列传（节选）", "author": "司马迁", "tag": "选择性必修中册", "cat": "高中必背", "lines": ["屈平疾王听之不聪也，谗谄之蔽明也，邪曲之害公也，方正之不容也，故忧愁幽思而作《离骚》。“离骚”者，犹离忧也。夫天者，人之始也；父母者，人之本也。人穷则反本，故劳苦倦极，未尝不呼天也；疾痛惨怛，未尝不呼父母也。屈平正道直行，竭忠尽智以事其君，谗人间之，可谓穷矣。信而见疑，忠而被谤，能无怨乎？屈平之作《离骚》，盖自怨生也。", "《国风》好色而不淫，《小雅》怨诽而不乱。若《离骚》者，可谓兼之矣。上称帝喾，下道齐桓，中述汤、武，以刺世事。明道德之广崇，治乱之条贯，靡不毕见。其文约，其辞微，其志洁，其行廉。其称文小而其指极大，举类迩而见义远。其志洁，故其称物芳；其行廉，故死而不容。自疏濯淖污泥之中，蝉蜕于浊秽，以浮游尘埃之外，不获世之滋垢，皭然泥而不滓者也。推此志也，虽与日月争光可也。"], "id": 198}, {"title": "谏太宗十思疏", "author": "魏征", "tag": "必修下册", "cat": "高中必背", "lines": ["臣闻求木之长者，必固其根本；欲流之远者，必浚其泉源；思国之安者，必积其德义。源不深而望流之远，根不固而求木之长，德不厚而思国之理，臣虽下愚，知其不可，而况于明哲乎？人君当神器之重，居域中之大，将崇极天之峻，永保无疆之休。不念居安思危，戒奢以俭，德不处其厚，情不胜其欲，斯亦伐根以求木茂，塞源而欲流长者也。", "凡百元首，承天景命，莫不殷忧而道著，功成而德衰。有善始者实繁，能克终者盖寡。岂取之易而守之难乎？昔取之而有余，今守之而不足，何也？夫在殷忧，必竭诚以待下；既得志，则纵情以傲物。竭诚则胡越为一体，傲物则骨肉为行路。虽董之以严刑，振之以威怒，终苟免而不怀仁，貌恭而不心服。怨不在大，可畏惟人；载舟覆舟，所宜深慎；奔车朽索，其可忽乎！", "君人者，诚能见可欲则思知足以自戒，将有作则思知止以安人，念高危则思谦冲而自牧，惧满溢则思江海下百川，乐盘游则思三驱以为度，忧懈怠则思慎始而敬终，虑壅蔽则思虚心以纳下，想谗邪则思正身以黜恶，恩所加则思无因喜以谬赏，罚所及则思无因怒而滥刑。总此十思，弘兹九德，简能而任之，择善而从之，则智者尽其谋，勇者竭其力，仁者播其惠，信者效其忠。文武争驰，在君无事，可以尽豫游之乐，可以养松、乔之寿，鸣琴垂拱，不言而化。何必劳神苦思，代下司职，役聪明之耳目，亏无为之大道哉？"], "id": 199}, {"title": "师说", "author": "韩愈", "tag": "必修上册", "cat": "高中必背", "lines": ["古之学者必有师。师者，所以传道受业解惑也。人非生而知之者，孰能无惑？惑而不从师，其为惑也，终不解矣。生乎吾前，其闻道也固先乎吾，吾从而师之；生乎吾后，其闻道也亦先乎吾，吾从而师之。吾师道也，夫庸知其年之先后生于吾乎？是故无贵无贱，无长无少，道之所存，师之所存也。", "嗟乎！师道之不传也久矣！欲人之无惑也难矣！古之圣人，其出人也远矣，犹且从师而问焉；今之众人，其下圣人也亦远矣，而耻学于师。是故圣益圣，愚益愚。圣人之所以为圣，愚人之所以为愚，其皆出于此乎？", "爱其子，择师而教之；于其身也，则耻师焉，惑矣。彼童子之师，授之书而习其句读者，非吾所谓传其道解其惑者也。句读之不知，惑之不解，或师焉，或不焉，小学而大遗，吾未见其明也。", "巫医乐师百工之人，不耻相师。士大夫之族，曰师曰弟子云者，则群聚而笑之。问之，则曰：“彼与彼年相若也，道相似也。位卑则足羞，官盛则近谀。”呜呼！师道之不复可知矣。巫医乐师百工之人，君子不齿，今其智乃反不能及，其可怪也欤！", "圣人无常师。孔子师郯子、苌弘、师襄、老聃。郯子之徒，其贤不及孔子。孔子曰：三人行，则必有我师。是故弟子不必不如师，师不必贤于弟子，闻道有先后，术业有专攻，如是而已。", "李氏子蟠，年十七，好古文，六艺经传皆通习之，不拘于时，学于余。余嘉其能行古道，作《师说》以贻之。"], "id": 200}, {"title": "阿房宫赋", "author": "杜牧", "tag": "必修下册", "cat": "高中必背", "lines": ["六王毕，四海一，蜀山兀，阿房出。覆压三百余里，隔离天日。骊山北构而西折，直走咸阳。二川溶溶，流入宫墙。五步一楼，十步一阁；廊腰缦回，檐牙高啄；各抱地势，钩心斗角。盘盘焉，囷囷焉，蜂房水涡，矗不知其几千万落。长桥卧波，未云何龙？复道行空，不霁何虹？高低冥迷，不知西东。歌台暖响，春光融融；舞殿冷袖，风雨凄凄。一日之内，一宫之间，而气候不齐。", "妃嫔媵嫱，王子皇孙，辞楼下殿，辇来于秦。朝歌夜弦，为秦宫人。明星荧荧，开妆镜也；绿云扰扰，梳晓鬟也；渭流涨腻，弃脂水也；烟斜雾横，焚椒兰也。雷霆乍惊，宫车过也；辘辘远听，杳不知其所之也。一肌一容，尽态极妍，缦立远视，而望幸焉。有不见者，三十六年。", "燕赵之收藏，韩魏之经营，齐楚之精英，几世几年，剽掠其人，倚叠如山。一旦不能有，输来其间。鼎铛玉石，金块珠砾，弃掷逦迤，秦人视之，亦不甚惜。", "嗟乎！一人之心，千万人之心也。秦爱纷奢，人亦念其家。奈何取之尽锱铢，用之如泥沙？使负栋之柱，多于南亩之农夫；架梁之椽，多于机上之工女；钉头磷磷，多于在庾之粟粒；瓦缝参差，多于周身之帛缕；直栏横槛，多于九土之城郭；管弦呕哑，多于市人之言语。使天下之人，不敢言而敢怒。独夫之心，日益骄固。戍卒叫，函谷举，楚人一炬，可怜焦土！", "呜呼！灭六国者六国也，非秦也；族秦者秦也，非天下也。嗟夫！使六国各爱其人，则足以拒秦；使秦复爱六国之人，则递三世可至万世而为君，谁得而族灭也？秦人不暇自哀，而后人哀之；后人哀之而不鉴之，亦使后人而复哀后人也。"], "id": 201}, {"title": "六国论", "author": "苏洵", "tag": "必修下册", "cat": "高中必背", "lines": ["六国破灭，非兵不利，战不善，弊在赂秦。赂秦而力亏，破灭之道也。或曰：六国互丧，率赂秦耶？曰：不赂者以赂者丧。盖失强援，不能独完。故曰弊在赂秦也。", "秦以攻取之外，小则获邑，大则得城。较秦之所得，与战胜而得者，其实百倍；诸侯之所亡，与战败而亡者，其实亦百倍。则秦之所大欲，诸侯之所大患，固不在战矣。思厥先祖父，暴霜露，斩荆棘，以有尺寸之地。子孙视之不甚惜，举以予人，如弃草芥。今日割五城，明日割十城，然后得一夕安寝。起视四境，而秦兵又至矣。然则诸侯之地有限，暴秦之欲无厌，奉之弥繁，侵之愈急。故不战而强弱胜负已判矣。至于颠覆，理固宜然。古人云：“以地事秦，犹抱薪救火，薪不尽，火不灭。”此言得之。", "齐人未尝赂秦，终继五国迁灭，何哉？与嬴而不助五国也。五国既丧，齐亦不免矣。燕、赵之君，始有远略，能守其土，义不赂秦。是故燕虽小国而后亡，斯用兵之效也。至丹以荆卿为计，始速祸焉。赵尝五战于秦，二败而三胜。后秦击赵者再，李牧连却之。洎牧以谗诛，邯郸为郡，惜其用武而不终也。且燕、赵处秦革灭殆尽之际，可谓智力孤危，战败而亡，诚不得已。向使三国各爱其地，齐人勿附于秦，刺客不行，良将犹在，则胜负之数，存亡之理，当与秦相较，或未易量。", "呜呼！以赂秦之地，封天下之谋臣，以事秦之心，礼天下之奇才，并力西向，则吾恐秦人食之不得下咽也。悲夫！有如此之势，而为秦人积威之所劫，日削月割，以趋于亡。为国者无使为积威之所劫哉！", "夫六国与秦皆诸侯，其势弱于秦，而犹有可以不赂而胜之之势。苟以天下之大，下而从六国破亡之故事，是又在六国下矣。"], "id": 202}, {"title": "答司马谏议书", "author": "王安石", "tag": "必修下册", "cat": "高中必背", "lines": ["某启：昨日蒙教，窃以为与君实游处相好之日久，而议事每不合，所操之术多异故也。虽欲强聒，终必不蒙见察，故略上报，不复一一自辨。重念蒙君实视遇厚，于反覆不宜卤莽，故今具道所以，冀君实或见恕也。", "盖儒者所争，尤在于名实，名实已明，而天下之理得矣。今君实所以见教者，以为侵官、生事、征利、拒谏，以致天下怨谤也。某则以谓受命于人主，议法度而修之于朝廷，以授之于有司，不为侵官；举先王之政，以兴利除弊，不为生事；为天下理财，不为征利；辟邪说，难壬人，不为拒谏。至于怨诽之多，则固前知其如此也。", "人习于苟且非一日，士大夫多以不恤国事、同俗自媚于众为善，上乃欲变此，而某不量敌之众寡，欲出力助上以抗之，则众何为而不汹汹然？盘庚之迁，胥怨者民也，非特朝廷士大夫而已；盘庚不为怨者故改其度，度义而后动，是而不见可悔故也。如君实责我以在位久，未能助上大有为，以膏泽斯民，则某知罪矣；如曰今日当一切不事事，守前所为而已，则非某之所敢知。", "无由会晤，不任区区向往之至！"], "id": 203}, {"title": "赤壁赋", "author": "苏轼", "tag": "必修上册", "cat": "高中必背", "lines": ["壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。清风徐来，水波不兴。举酒属客，诵明月之诗，歌窈窕之章。少焉，月出于东山之上，徘徊于斗牛之间。白露横江，水光接天。纵一苇之所如，凌万顷之茫然。浩浩乎如冯虚御风，而不知其所止；飘飘乎如遗世独立，羽化而登仙。", "于是饮酒乐甚，扣舷而歌之。歌曰：“桂棹兮兰桨，击空明兮溯流光。渺渺兮予怀，望美人兮天一方。”客有吹洞箫者，倚歌而和之。其声呜呜然，如怨如慕，如泣如诉，余音袅袅，不绝如缕。舞幽壑之潜蛟，泣孤舟之嫠妇。", "苏子愀然，正襟危坐而问客曰：“何为其然也？”客曰：“‘月明星稀，乌鹊南飞’，此非曹孟德之诗乎？西望夏口，东望武昌，山川相缪，郁乎苍苍，此非孟德之困于周郎者乎？方其破荆州，下江陵，顺流而东也，舳舻千里，旌旗蔽空，酾酒临江，横槊赋诗，固一世之雄也，而今安在哉？况吾与子渔樵于江渚之上，侣鱼虾而友麋鹿，驾一叶之扁舟，举匏樽以相属。寄蜉蝣于天地，渺沧海之一粟。哀吾生之须臾，羡长江之无穷。挟飞仙以遨游，抱明月而长终。知不可乎骤得，托遗响于悲风。”", "苏子曰：“客亦知夫水与月乎？逝者如斯，而未尝往也；盈虚者如彼，而卒莫消长也。盖将自其变者而观之，则天地曾不能以一瞬；自其不变者而观之，则物与我皆无尽也，而又何羡乎！且夫天地之间，物各有主，苟非吾之所有，虽一毫而莫取。惟江上之清风，与山间之明月，耳得之而为声，目遇之而成色，取之无禁，用之不竭。是造物者之无尽藏也，而吾与子之所共适。”", "客喜而笑，洗盏更酌。肴核既尽，杯盘狼籍。相与枕藉乎舟中，不知东方之既白。"], "id": 204}, {"title": "项脊轩志", "author": "归有光", "tag": "选择性必修下册", "cat": "高中必背", "lines": ["项脊轩，旧南阁子也。室仅方丈，可容一人居。百年老屋，尘泥渗漉，雨泽下注；每移案，顾视无可置者。又北向，不能得日，日过午已昏。余稍为修葺，使不上漏。前辟四窗，垣墙周庭，以当南日，日影反照，室始洞然。又杂植兰桂竹木于庭，旧时栏楯，亦遂增胜。借书满架，偃仰啸歌，冥然兀坐，万籁有声；而庭阶寂寂，小鸟时来啄食，人至不去。三五之夜，明月半墙，桂影斑驳，风移影动，珊珊可爱。", "然余居于此，多可喜，亦多可悲。先是庭中通南北为一。迨诸父异爨，内外多置小门墙，往往而是。东犬西吠，客逾庖而宴，鸡栖于厅。庭中始为篱，已为墙，凡再变矣。家有老妪，尝居于此。妪，先大母婢也，乳二世，先妣抚之甚厚。室西连于中闺，先妣尝一至。妪每谓余曰：“某所，而母立于兹。”妪又曰：“汝姊在吾怀，呱呱而泣；娘以指叩门扉曰：‘儿寒乎？欲食乎？’吾从板外相为应答。”语未毕，余泣，妪亦泣。余自束发读书轩中，一日，大母过余曰：“吾儿，久不见若影，何竟日默默在此，大类女郎也？”比去，以手阖门，自语曰：“吾家读书久不效，儿之成，则可待乎！”顷之，持一象笏至，曰：“此吾祖太常公宣德间执此以朝，他日汝当用之！”瞻顾遗迹，如在昨日，令人长号不自禁。", "轩东故尝为厨，人往，从轩前过。余扃牖而居，久之，能以足音辨人。轩凡四遭火，得不焚，殆有神护者。", "余既为此志，后五年，吾妻来归，时至轩中，从余问古事，或凭几学书。吾妻归宁，述诸小妹语曰：“闻姊家有阁子，且何谓阁子也？”其后六年，吾妻死，室坏不修。其后二年，余久卧病无聊，乃使人复葺南阁子，其制稍异于前。然自后余多在外，不常居。", "庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣。"], "id": 205}, {"title": "子路曾皙冉有公西华侍坐", "author": "《论语》", "tag": "必修下册", "cat": "高中必背", "lines": ["子路、曾皙、冉有、公西华侍坐。子曰：“以吾一日长乎尔，毋吾以也。居则曰：‘不吾知也。’如或知尔，则何以哉？”", "子路率尔而对曰：“千乘之国，摄乎大国之间，加之以师旅，因之以饥馑；由也为之，比及三年，可使有勇，且知方也。”夫子哂之。", "“求！尔何如？”对曰：“方六七十，如五六十，求也为之，比及三年，可使足民。如其礼乐，以俟君子。”", "“赤！尔何如？”对曰：“非曰能之，愿学焉。宗庙之事，如会同，端章甫，愿为小相焉。”", "“点！尔何如？”鼓瑟希，铿尔，舍瑟而作，对曰：“异乎三子者之撰。”子曰：“何伤乎？亦各言其志也。”曰：“莫春者，春服既成，冠者五六人，童子六七人，浴乎沂，风乎舞雩，咏而归。”夫子喟然叹曰：“吾与点也！”", "三子者出，曾皙后。曾皙曰：“夫三子者之言何如？”子曰：“亦各言其志也已矣。”曰：“夫子何哂由也？”曰：“为国以礼，其言不让，是故哂之。”“唯求则非邦也与？”“安见方六七十如五六十而非邦也者？”“唯赤则非邦也与？”“宗庙会同，非诸侯而何？赤也为之小，孰能为之大？”"], "id": 206}, {"title": "报任安书（节选）", "author": "司马迁", "tag": "高中", "cat": "高中必背", "lines": ["古者富贵而名摩灭，不可胜记，唯倜傥非常之人称焉。盖文王拘而演《周易》；仲尼厄而作《春秋》；屈原放逐，乃赋《离骚》；左丘失明，厥有《国语》；孙子膑脚，《兵法》修列；不韦迁蜀，世传《吕览》；韩非囚秦，《说难》《孤愤》；《诗》三百篇，大底圣贤发愤之所为作也。此人皆意有所郁结，不得通其道，故述往事、思来者。乃如左丘无目，孙子断足，终不可用，退而论书策，以舒其愤，思垂空文以自见。", "仆窃不逊，近自托于无能之辞，网罗天下放失旧闻，略考其行事，综其终始，稽其成败兴坏之纪，上计轩辕，下至于兹，为十表，本纪十二，书八章，世家三十，列传七十，凡百三十篇。亦欲以究天人之际，通古今之变，成一家之言。草创未就，会遭此祸，惜其不成，是以就极刑而无愠色。仆诚以著此书，藏之名山，传之其人，通邑大都，则仆偿前辱之责，虽万被戮，岂有悔哉！然此可为智者道，难为俗人言也！"], "id": 207}, {"title": "过秦论（上）", "author": "贾谊", "tag": "选择性必修中册", "cat": "高中必背", "lines": ["秦孝公据崤函之固，拥雍州之地，君臣固守以窥周室，有席卷天下，包举宇内，囊括四海之意，并吞八荒之心。当是时也，商君佐之，内立法度，务耕织，修守战之具，外连衡而斗诸侯。于是秦人拱手而取西河之外。", "孝公既没，惠文、武、昭襄蒙故业，因遗策，南取汉中，西举巴、蜀，东割膏腴之地，北收要害之郡。诸侯恐惧，会盟而谋弱秦，不爱珍器重宝肥饶之地，以致天下之士，合从缔交，相与为一。当此之时，齐有孟尝，赵有平原，楚有春申，魏有信陵。此四君者，皆明智而忠信，宽厚而爱人，尊贤而重士，约从离衡，兼韩、魏、燕、楚、齐、赵、宋、卫、中山之众。于是六国之士，有甯越、徐尚、苏秦、杜赫之属为之谋，齐明、周最、陈轸、召滑、楼缓、翟景、苏厉、乐毅之徒通其意，吴起、孙膑、带佗、倪良、王廖、田忌、廉颇、赵奢之伦制其兵。尝以十倍之地，百万之众，叩关而攻秦。秦人开关延敌，九国之师，逡巡而不敢进。秦无亡矢遗镞之费，而天下诸侯已困矣。于是从散约败，争割地而赂秦。秦有余力而制其弊，追亡逐北，伏尸百万，流血漂橹；因利乘便，宰割天下，分裂山河。强国请服，弱国入朝。延及孝文王、庄襄王，享国之日浅，国家无事。", "及至始皇，奋六世之余烈，振长策而御宇内，吞二周而亡诸侯，履至尊而制六合，执敲扑而鞭笞天下，威振四海。南取百越之地，以为桂林、象郡；百越之君，俯首系颈，委命下吏。乃使蒙恬北筑长城而守藩篱，却匈奴七百余里；胡人不敢南下而牧马，士不敢弯弓而报怨。于是废先王之道，焚百家之言，以愚黔首；隳名城，杀豪杰；收天下之兵，聚之咸阳，销锋镝，铸以为金人十二，以弱天下之民。然后践华为城，因河为池，据亿丈之城，临不测之渊，以为固。良将劲弩守要害之处，信臣精卒陈利兵而谁何。天下已定，始皇之心，自以为关中之固，金城千里，子孙帝王万世之业也。", "始皇既没，余威震于殊俗。然陈涉瓮牖绳枢之子，氓隶之人，而迁徙之徒也；才能不及中人，非有仲尼、墨翟之贤，陶朱、猗顿之富；蹑足行伍之间，而倔起阡陌之中，率疲弊之卒，将数百之众，转而攻秦；斩木为兵，揭竿为旗，天下云集响应，赢粮而景从。山东豪俊遂并起而亡秦族矣。", "且夫天下非小弱也，雍州之地，崤函之固，自若也。陈涉之位，非尊于齐、楚、燕、赵、韩、魏、宋、卫、中山之君也；锄櫌棘矜，非铦于钩戟长铩也；谪戍之众，非抗于九国之师也；深谋远虑，行军用兵之道，非及向时之士也。然而成败异变，功业相反，何也？试使山东之国与陈涉度长絜大，比权量力，则不可同年而语矣。然秦以区区之地，致万乘之势，序八州而朝同列，百有余年矣；然后以六合为家，崤函为宫；一夫作难而七庙隳，身死人手，为天下笑者，何也？仁义不施而攻守之势异也。"], "id": 208}, {"title": "礼运（节选）", "author": "《礼记》", "tag": "高中", "cat": "高中必背", "lines": ["大道之行也，天下为公。选贤与能，讲信修睦。故人不独亲其亲，不独子其子，使老有所终，壮有所用，幼有所长，矜、寡、孤、独、废疾者皆有所养，男有分，女有归。货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己。是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭。是谓大同。"], "id": 209}, {"title": "陈情表", "author": "李密", "tag": "选择性必修下册", "cat": "高中必背", "lines": ["臣密言：臣以险衅，夙遭闵凶。生孩六月，慈父见背；行年四岁，舅夺母志。祖母刘悯臣孤弱，躬亲抚养。臣少多疾病，九岁不行，零丁孤苦，至于成立。既无伯叔，终鲜兄弟，门衰祚薄，晚有儿息。外无期功强近之亲，内无应门五尺之僮，茕茕孑立，形影相吊。而刘夙婴疾病，常在床蓐，臣侍汤药，未曾废离。", "逮奉圣朝，沐浴清化。前太守臣逵察臣孝廉，后刺史臣荣举臣秀才。臣以供养无主，辞不赴命。诏书特下，拜臣郎中，寻蒙国恩，除臣洗马。猥以微贱，当侍东宫，非臣陨首所能上报。臣具以表闻，辞不就职。诏书切峻，责臣逋慢。郡县逼迫，催臣上道；州司临门，急于星火。臣欲奉诏奔驰，则刘病日笃；欲苟顺私情，则告诉不许。臣之进退，实为狼狈。", "伏惟圣朝以孝治天下，凡在故老，犹蒙矜育，况臣孤苦，特为尤甚。且臣少仕伪朝，历职郎署，本图宦达，不矜名节。今臣亡国贱俘，至微至陋，过蒙拔擢，宠命优渥，岂敢盘桓，有所希冀。但以刘日薄西山，气息奄奄，人命危浅，朝不虑夕。臣无祖母，无以至今日；祖母无臣，无以终余年。母、孙二人，更相为命，是以区区不能废远。", "臣密今年四十有四，祖母今年九十有六，是臣尽节于陛下之日长，报养刘之日短也。乌鸟私情，愿乞终养。臣之辛苦，非独蜀之人士及二州牧伯所见明知，皇天后土实所共鉴。愿陛下矜悯愚诚，听臣微志，庶刘侥幸，保卒余年。臣生当陨首，死当结草。臣不胜犬马怖惧之情，谨拜表以闻。"], "id": 210}, {"title": "归去来兮辞（并序）", "author": "陶渊明", "tag": "选择性必修下册", "cat": "高中必背", "lines": ["余家贫，耕植不足以自给。幼稚盈室，瓶无储粟，生生所资，未见其术。亲故多劝余为长吏，脱然有怀，求之靡途。会有四方之事，诸侯以惠爱为德，家叔以余贫苦，遂见用于小邑。于时风波未静，心惮远役，彭泽去家百里，公田之利，足以为酒。故便求之。及少日，眷然有归欤之情。何则？质性自然，非矫厉所得。饥冻虽切，违己交病。尝从人事，皆口腹自役。于是怅然慷慨，深愧平生之志。犹望一稔，当敛裳宵逝。寻程氏妹丧于武昌，情在骏奔，自免去职。仲秋至冬，在官八十余日。因事顺心，命篇曰《归去来兮》。乙巳岁十一月也。", "归去来兮，田园将芜胡不归？既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。实迷途其未远，觉今是而昨非。舟遥遥以轻飏，风飘飘而吹衣。问征夫以前路，恨晨光之熹微。", "乃瞻衡宇，载欣载奔。僮仆欢迎，稚子候门。三径就荒，松菊犹存。携幼入室，有酒盈樽。引壶觞以自酌，眄庭柯以怡颜。倚南窗以寄傲，审容膝之易安。园日涉以成趣，门虽设而常关。策扶老以流憩，时矫首而遐观。云无心以出岫，鸟倦飞而知还。景翳翳以将入，抚孤松而盘桓。", "归去来兮，请息交以绝游。世与我而相违，复驾言兮焉求？悦亲戚之情话，乐琴书以消忧。农人告余以春及，将有事于西畴。或命巾车，或棹孤舟。既窈窕以寻壑，亦崎岖而经丘。木欣欣以向荣，泉涓涓而始流。善万物之得时，感吾生之行休。", "已矣乎！寓形宇内复几时？曷不委心任去留？胡为乎遑遑欲何之？富贵非吾愿，帝乡不可期。怀良辰以孤往，或植杖而耘耔。登东皋以舒啸，临清流而赋诗。聊乘化以归尽，乐夫天命复奚疑！"], "id": 211}, {"title": "种树郭橐驼传", "author": "柳宗元", "tag": "选择性必修下册", "cat": "高中必背", "lines": ["郭橐驼，不知始何名。病偻，隆然伏行，有类橐驼者，故乡人号之“驼”。驼闻之曰：“甚善。名我固当。”因舍其名，亦自谓“橐驼”云。其乡曰丰乐乡，在长安西。驼业种树，凡长安豪富人为观游及卖果者，皆争迎取养。视驼所种树，或移徙，无不活；且硕茂，早实以蕃。他植者虽窥伺效慕，莫能如也。", "有问之，对曰：“橐驼非能使木寿且孳也，能顺木之天，以致其性焉尔。凡植木之性，其本欲舒，其培欲平，其土欲故，其筑欲密。既然已，勿动勿虑，去不复顾。其莳也若子，其置也若弃，则其天者全而其性得矣。故吾不害其长而已，非有能硕茂之也；不抑耗其实而已，非有能早而蕃之也。他植者则不然。根拳而土易，其培之也，若不过焉则不及。苟有能反是者，则又爱之太恩，忧之太勤。旦视而暮抚，已去而复顾。甚者，爪其肤以验其生枯，摇其本以观其疏密，而木之性日以离矣。虽曰爱之，其实害之；虽曰忧之，其实仇之；故不我若也。吾又何能为哉！”", "问者曰：“以子之道，移之官理，可乎？”驼曰：“我知种树而已，理，非吾业也。然吾居乡，见长人者好烦其令，若甚怜焉，而卒以祸。旦暮吏来而呼曰：‘官命促尔耕，勖尔植，督尔获，早缫而绪，早织而缕，字而幼孩，遂而鸡豚。’鸣鼓而聚之，击木而召之。吾小人辍飧饔以劳吏者，且不得暇，又何以蕃吾生而安吾性耶？故病且怠。若是，则与吾业者其亦有类乎？”", "问者曰：“嘻，不亦善夫！吾问养树，得养人术。”传其事以为官戒也。"], "id": 212}, {"title": "五代史伶官传序", "author": "欧阳修", "tag": "选择性必修中册", "cat": "高中必背", "lines": ["呜呼！盛衰之理，虽曰天命，岂非人事哉！原庄宗之所以得天下，与其所以失之者，可以知之矣。", "世言晋王之将终也，以三矢赐庄宗而告之曰：“梁，吾仇也；燕王，吾所立，契丹与吾约为兄弟，而皆背晋以归梁。此三者，吾遗恨也。与尔三矢，尔其无忘乃父之志！”庄宗受而藏之于庙。其后用兵，则遣从事以一少牢告庙，请其矢，盛以锦囊，负而前驱，及凯旋而纳之。", "方其系燕父子以组，函梁君臣之首，入于太庙，还矢先王，而告以成功，其意气之盛，可谓壮哉！及仇雠已灭，天下已定，一夫夜呼，乱者四应，仓皇东出，未及见贼而士卒离散，君臣相顾，不知所归，至于誓天断发，泣下沾襟，何其衰也！岂独伶人也哉？《书》曰：“满招损，谦得益。”忧劳可以兴国，逸豫可以亡身，自然之理也。", "故方其盛也，举天下之豪杰，莫能与之争；及其衰也，数十伶人困之，而身死国灭，为天下笑。夫祸患常积于忽微，而智勇多困于所溺，岂独伶人也哉？作《伶官传》。"], "id": 213}, {"title": "石钟山记", "author": "苏轼", "tag": "选择性必修下册", "cat": "高中必背", "lines": ["《水经》云：“彭蠡之口有石钟山焉。”郦元以为下临深潭，微风鼓浪，水石相搏，声如洪钟。是说也，人常疑之。今以钟磬置水中，虽大风浪不能鸣也，而况石乎！至唐李渤始访其遗踪，得双石于潭上，扣而聆之，南声函胡，北音清越，桴止响腾，余韵徐歇。自以为得之矣。然是说也，余尤疑之。石之铿然有声者，所在皆是也，而此独以钟名，何哉？", "元丰七年六月丁丑，余自齐安舟行适临汝，而长子迈将赴饶之德兴尉，送之至湖口，因得观所谓石钟者。寺僧使小童持斧，于乱石间择其一二扣之，硿硿焉。余固笑而不信也。至莫夜月明，独与迈乘小舟，至绝壁下。大石侧立千尺，如猛兽奇鬼，森然欲搏人；而山上栖鹘，闻人声亦惊起，磔磔云霄间；又有若老人咳且笑于山谷中者，或曰此鹳鹤也。余方心动欲还，而大声发于水上，噌吰如钟鼓不绝。舟人大恐。徐而察之，则山下皆石穴罅，不知其浅深，微波入焉，涵淡澎湃而为此也。舟回至两山间，将入港口，有大石当中流，可坐百人，空中而多窍，与风水相吞吐，有窾坎镗鞳之声，与向之噌吰者相应，如乐作焉。因笑谓迈曰：“汝识之乎？噌吰者，周景王之无射也；窾坎镗鞳者，魏庄子之歌钟也。古之人不余欺也！”", "事不目见耳闻，而臆断其有无，可乎？郦元之所见闻，殆与余同，而言之不详；士大夫终不肯以小舟夜泊绝壁之下，故莫能知；而渔工水师虽知而不能言。此世所以不传也。而陋者乃以斧斤考击而求之，自以为得其实。余是以记之，盖叹郦元之简，而笑李渤之陋也。"], "id": 214}, {"title": "登泰山记", "author": "姚鼐", "tag": "必修上册", "cat": "高中必背", "lines": ["泰山之阳，汶水西流；其阴，济水东流。阳谷皆入汶，阴谷皆入济。当其南北分者，古长城也。最高日观峰，在长城南十五里。", "余以乾隆三十九年十二月，自京师乘风雪，历齐河、长清，穿泰山西北谷，越长城之限，至于泰安。是月丁未，与知府朱孝纯子颍由南麓登。四十五里，道皆砌石为磴，其级七千有余。泰山正南面有三谷。中谷绕泰安城下，郦道元所谓环水也。余始循以入，道少半，越中岭，复循西谷，遂至其巅。古时登山，循东谷入，道有天门。东谷者，古谓之天门溪水，余所不至也。今所经中岭及山巅，崖限当道者，世皆谓之天门云。道中迷雾冰滑，磴几不可登。及既上，苍山负雪，明烛天南。望晚日照城郭，汶水、徂徕如画，而半山居雾若带然。", "戊申晦，五鼓，与子颍坐日观亭，待日出。大风扬积雪击面。亭东自足下皆云漫。稍见云中白若樗蒱数十立者，山也。极天云一线异色，须臾成五采。日上，正赤如丹，下有红光动摇承之，或曰，此东海也。回视日观以西峰，或得日或否，绛皓驳色，而皆若偻。", "亭西有岱祠，又有碧霞元君祠。皇帝行宫在碧霞元君祠东。是日观道中石刻，自唐显庆以来，其远古刻尽漫失。僻不当道者，皆不及往。", "山多石，少土。石苍黑色，多平方，少圜。少杂树，多松，生石罅，皆平顶。冰雪，无瀑水，无鸟兽音迹。至日观数里内无树，而雪与人膝齐。", "桐城姚鼐记。"], "id": 215}, {"title": "老子（八章）", "author": "老子", "tag": "高中", "cat": "高中必背", "lines": ["上善若水。水善利万物而不争，处众人之所恶，故几于道。居善地，心善渊，与善仁，言善信，政善治，事善能，动善时。夫唯不争，故无尤。", "五色令人目盲，五音令人耳聋，五味令人口爽，驰骋畋猎令人心发狂，难得之货令人行妨。是以圣人为腹不为目，故去彼取此。", "古之善为士者，微妙玄通，深不可识。夫唯不可识，故强为之容：豫兮若冬涉川，犹兮若畏四邻，俨兮其若客，涣兮若冰之将释，敦兮其若朴，旷兮其若谷，混兮其若浊。孰能浊以静之徐清？孰能安以动之徐生？保此道者，不欲盈。夫唯不盈，故能蔽不新成。", "曲则全，枉则直，洼则盈，敝则新，少则得，多则惑。是以圣人抱一为天下式。不自见，故明；不自是，故彰；不自伐，故有功；不自矜，故长。夫唯不争，故天下莫能与之争。古之所谓曲则全者，岂虚言哉！诚全而归之。", "企者不立，跨者不行，自见者不明，自是者不彰，自伐者无功，自矜者不长。其在道也，曰余食赘行。物或恶之，故有道者不处。", "善行无辙迹，善言无瑕谪，善数不用筹策，善闭无关楗而不可开，善结无绳约而不可解。是以圣人常善救人，故无弃人；常善救物，故无弃物。是谓袭明。故善人者，不善人之师；不善人者，善人之资。不贵其师，不爱其资，虽智大迷，是谓要妙。", "知人者智，自知者明。胜人者有力，自胜者强。知足者富，强行者有志。不失其所者久，死而不亡者寿。", "信言不美，美言不信。善者不辩，辩者不善。知者不博，博者不知。圣人不积，既以为人己愈有，既以与人己愈多。天之道，利而不害；圣人之道，为而不争。"], "id": 216}, {"title": "季氏将伐颛臾", "author": "《论语》", "tag": "选修", "cat": "高中必背", "lines": ["季氏将伐颛臾。冉有、季路见于孔子曰：“季氏将有事于颛臾。”孔子曰：“求！无乃尔是过与？夫颛臾，昔者先王以为东蒙主，且在邦域之中矣，是社稷之臣也。何以伐为？”", "冉有曰：“夫子欲之，吾二臣者皆不欲也。”孔子曰：“求！周任有言曰：‘陈力就列，不能者止。’危而不持，颠而不扶，则将焉用彼相矣？且尔言过矣。虎兕出于柙，龟玉毁于椟中，是谁之过与？”", "冉有曰：“今夫颛臾，固而近于费。今不取，后世必为子孙忧。”孔子曰：“求！君子疾夫舍曰欲之而必为之辞。丘也闻有国有家者，不患寡而患不均，不患贫而患不安。盖均无贫，和无寡，安无倾。夫如是，故远人不服，则修文德以来之。既来之，则安之。今由与求也，相夫子，远人不服而不能来也，邦分崩离析而不能守也，而谋动干戈于邦内。吾恐季孙之忧，不在颛臾，而在萧墙之内也。”"], "id": 217}, {"title": "大学（节选）", "author": "《礼记》", "tag": "选修", "cat": "高中必背", "lines": ["古之欲明明德于天下者，先治其国；欲治其国者，先齐其家；欲齐其家者，先修其身；欲修其身者，先正其心；欲正其心者，先诚其意；欲诚其意者，先致其知；致知在格物。物格而后知至，知至而后意诚，意诚而后心正，心正而后身修，身修而后家齐，家齐而后国治，国治而后天下平。自天子以至于庶人，壹是皆以修身为本。"], "id": 218}, {"title": "中庸（节选）", "author": "《礼记》", "tag": "选修", "cat": "高中必背", "lines": ["喜怒哀乐之未发，谓之中；发而皆中节，谓之和。中也者，天下之大本也；和也者，天下之达道也。致中和，天地位焉，万物育焉。", "博学之，审问之，慎思之，明辨之，笃行之。有弗学，学之弗能，弗措也；有弗问，问之弗知，弗措也；有弗思，思之弗得，弗措也；有弗辨，辨之弗明，弗措也；有弗行，行之弗笃，弗措也。人一能之，己百之；人十能之，己千之。果能此道矣，虽愚必明，虽柔必强。"], "id": 219}, {"title": "孟子一则", "author": "《孟子》", "tag": "选修", "cat": "高中必背", "lines": ["“敢问夫子恶乎长？”曰：“我知言，我善养吾浩然之气。”“敢问何谓浩然之气？”曰：“难言也。其为气也，至大至刚，以直养而无害，则塞于天地之间。其为气也，配义与道；无是，馁也。是集义所生者，非义袭而取之也。行有不慊于心，则馁矣。我故曰，告子未尝知义，以其外之也。必有事焉，而勿正，心勿忘，勿助长也。无若宋人然：宋人有闵其苗之不长而揠之者，芒芒然归，谓其人曰：‘今日病矣！予助苗长矣！’其子趋而往视之，苗则槁矣。天下之不助苗长者寡矣。以为无益而舍之者，不耘苗者也；助之长者，揠苗者也，非徒无益，而又害之。”", "“何谓知言？”曰：“诐辞知其所蔽，淫辞知其所陷，邪辞知其所离，遁辞知其所穷。生于其心，害于其政；发于其政，害于其事。圣人复起，必从吾言矣。”", "“宰我、子贡善为说辞，冉牛、闵子、颜渊善言德行。孔子兼之，曰：‘我于辞命，则不能也。’”"], "id": 220}, {"title": "逍遥游（节选）", "author": "庄子", "tag": "选修", "cat": "高中必背", "lines": ["惠子谓庄子曰：“魏王贻我大瓠之种，我树之成而实五石。以盛水浆，其坚不能自举也。剖之以为瓢，则瓠落无所容。非不呺然大也，吾为其无用而掊之。”庄子曰：“夫子固拙于用大矣。宋人有善为不龟手之药者，世世以洴澼絖为事。客闻之，请买其方百金。聚族而谋曰：‘我世世为洴澼絖，不过数金。今一朝而鬻技百金，请与之。’客得之，以说吴王。越有难，吴王使之将。冬，与越人水战，大败越人，裂地而封之。能不龟手一也，或以封，或不免于洴澼絖，则所用之异也。今子有五石之瓠，何不虑以为大樽而浮乎江湖，而忧其瓠落无所容？则夫子犹有蓬之心也夫！”", "惠子谓庄子曰：“吾有大树，人谓之樗。其大本拥肿而不中绳墨，其小枝卷曲而不中规矩，立之涂，匠人不顾。今子之言，大而无用，众所同去也。”庄子曰：“子独不见狸狌乎？卑身而伏，以候敖者；东西跳梁，不辟高下；中于机辟，死于罔罟。今夫斄牛，其大若垂天之云。此能为大矣，而不能执鼠。今子有大树，患其无用，何不树之于无何有之乡，广莫之野，彷徨乎无为其侧，逍遥乎寝卧其下。不夭斤斧，物无害者，无所可用，安所困苦哉！”"], "id": 221}, {"title": "谏逐客书", "author": "李斯", "tag": "必修下册", "cat": "高中必背", "lines": ["臣闻吏议逐客，窃以为过矣。昔缪公求士，西取由余于戎，东得百里奚于宛，迎蹇叔于宋，来丕豹、公孙支于晋。此五子者，不产于秦，而缪公用之，并国二十，遂霸西戎。孝公用商鞅之法，移风易俗，民以殷盛，国以富强，百姓乐用，诸侯亲服，获楚、魏之师，举地千里，至今治强。惠王用张仪之计，拔三川之地，西并巴、蜀，北收上郡，南取汉中，包九夷，制鄢、郢，东据成皋之险，割膏腴之壤，遂散六国之从，使之西面事秦，功施到今。昭王得范雎，废穰侯，逐华阳，强公室，杜私门，蚕食诸侯，使秦成帝业。此四君者，皆以客之功。由此观之，客何负于秦哉！向使四君却客而不内，疏士而不用，是使国无富利之实而秦无强大之名也。", "今陛下致昆山之玉，有随、和之宝，垂明月之珠，服太阿之剑，乘纤离之马，建翠凤之旗，树灵鼍之鼓。此数宝者，秦不生一焉，而陛下说之，何也？必秦国之所生然后可，则是夜光之璧不饰朝廷，犀象之器不为玩好，郑、卫之女不充后宫，而骏良駃騠不实外厩，江南金锡不为用，西蜀丹青不为采。所以饰后宫、充下陈、娱心意、说耳目者，必出于秦然后可，则是宛珠之簪、傅玑之珥、阿缟之衣、锦绣之饰不进于前，而随俗雅化佳冶窈窕赵女不立于侧也。夫击瓮叩缶，弹筝搏髀，而歌呼呜呜快耳者，真秦之声也；《郑》《卫》《桑间》《昭》《虞》《武》《象》者，异国之乐也。今弃击瓮叩缶而就《郑》《卫》，退弹筝而取《昭》《虞》，若是者何也？快意当前，适观而已矣。今取人则不然，不问可否，不论曲直，非秦者去，为客者逐。然则是所重者在乎色、乐、珠玉，而所轻者在乎
