/* ---------------- 拼音内联编辑（浮在字上方，不进入正文文本流） ---------------- */
var pyEditEl = null;
function closePyEdit(){
  if(pyEditEl && pyEditEl.parentNode) pyEditEl.parentNode.removeChild(pyEditEl);
  pyEditEl = null;
}
function pyBase(ch, gi){
  var z = curKey ? ZY[curKey] : null;
  if(z && z.off && z.off[gi]) return '';
  if(z && z.one && z.one[gi] != null) return z.one[gi];
  if(PYCUSTOM[ch]) return PYCUSTOM[ch];
  ensurePY();
  return PYMAP[ch] || '';
}
function openPyEdit(gi){
  closePyEdit();
  var span = document.querySelector('#mbody [data-gi="'+gi+'"]')
          || document.querySelector('#ovMbody [data-gi="'+gi+'"]');
  if(!span) return;
  var ch = chAt(gi);
  var inp = document.createElement('input');
  inp.className = 'py-input';
  inp.type = 'text';
  inp.value = pyBase(ch, gi);
  inp.setAttribute('spellcheck', 'false');
  inp.setAttribute('placeholder', '输入拼音');
  document.body.appendChild(inp);
  inp.style.width = Math.max(74, Math.round(curFs()*4.6)) + 'px';
  inp.style.fontSize = Math.max(13, Math.round(curFs()*0.68)) + 'px';
  var r = span.getBoundingClientRect();
  inp.style.left = (r.left + r.width/2) + 'px';
  if(r.top > 64){
    inp.style.top = (r.top - 5) + 'px';
    inp.style.transform = 'translate(-50%,-100%)';
  }else{
    inp.style.top = (r.bottom + 6) + 'px';
    inp.style.transform = 'translate(-50%,0)';
  }
  inp.addEventListener('keydown', function(e){
    e.stopPropagation();
    if(e.key === 'Enter'){ e.preventDefault(); savePy(gi, inp.value); }
    else if(e.key === 'Escape'){ e.preventDefault(); cancelPyEdit(); }
  });
  inp.addEventListener('blur', function(){
    setTimeout(function(){ if(pyEditEl === inp) savePy(gi, inp.value); }, 140);
  });
  pyEditEl = inp;
  setTimeout(function(){ try{ inp.focus(); inp.select(); }catch(e){} }, 30);
}
function cancelPyEdit(){
  var z = curKey ? ZY[curKey] : null;
  if(z) z.edit = null;
  closePyEdit();
  repaint();
}
function savePy(gi, val){
  var z = curKey ? ZY[curKey] : null;
  closePyEdit();
  if(!z) return;
  var ch = chAt(gi);
  val = String(val == null ? '' : val).trim();
  if(val){
    if(ch) PYCUSTOM[ch] = val;
    z.one[gi] = val;
  }else{
    if(ch) delete PYCUSTOM[ch];
    delete z.one[gi];
  }
  saveLS('yk.pinyin.v1', PYCUSTOM);
  z.edit = null;
  repaint(); refreshBars();
  toast(val ? ('「'+ch+'」的拼音已改为 '+val) : ('已清除「'+ch+'」的拼音'));
}

/* ---------------- 选中文字单独全屏（朗诵） ---------------- */
function focusSelection(){
  if(!CTX){ toast('请先选择一篇文稿'); return; }
  var info = recentSel();
  if(!info){ toast('请先选中要全屏显示的文字'); return; }
  if(info.cross){ toast('暂不支持跨段落选择，请在同一段内选取'); return; }
  var all = (CTX.paras || []).join('');
  var s = all.slice(info.base + info.a, info.base + info.b);
  if(!s.replace(/[\s\u3000]/g, '').length){ toast('请先选中要全屏显示的文字'); return; }
  /* 记下这段文字在全文里的起始位置，聚焦层才能照常用注音和停顿连接重音 */
  openFocus(s, info.base + info.a);
}

function focusClass(){
  return 'focus-text' + (CTX && CTX.serif ? ' serif' : '')
    + (CTX && CTX.align === 'center' ? ' align-center'
       : (CTX && CTX.align === 'right' ? ' align-right' : ''))
    + (CTX && CTX.indent ? ' indent' : '')
    + (zyOn(curKey) ? ' note' : '');
}
/* 聚焦层正文：按原文的字符索引渲染，所以注音与三类标注都能正常落在原文上 */
function focusBodyHTML(){
  var note = zyOn(curKey);
  var lines = String(OV.text == null ? '' : OV.text).split('\n');
  var h = '<div class="' + focusClass() + '" id="ovMbody" style="font-size:'
        + Math.round(curFs()*1.35) + 'px">';
  var b = OV.base || 0;
  lines.forEach(function(t){
    var cl = [];
    if(note && paraHasHan(t)) cl.push('py');
    h += '<p' + (cl.length ? ' class="'+cl.join(' ')+'"' : '') + ' data-base="'+b+'">'
       + markify(t, b) + '</p>';
    b += t.length;
  });
  h += '</div>';
  return h;
}

function openFocus(text, base){
  if(!CTX) return;
  var raw = String(text).replace(/\r/g, '');
  if(!raw.replace(/[\s\u3000]/g, '').length){ toast('选中的内容为空'); return; }
  var sel = window.getSelection(); if(sel) sel.removeAllRanges();
  hideSelbar();
  /* 记住是从哪儿进来的：从普通阅读页进来就退出到普通页，从全屏阅读进来才退回全屏 */
  OV.back = ($('overlay').classList.contains('show') && OV.mode === 'read') ? 'read' : 'page';
  OV.mode = 'focus';
  OV.base = base || 0;
  OV.text = raw;
  $('ovTitle').textContent = '聚焦显示' + (CTX.title ? ' · ' + CTX.title : '');
  $('ovBody').innerHTML = focusBodyHTML();
  renderOverlayTools();
  $('overlay').classList.add('show');
  $('ovBody').scrollTop = 0;
  reqFS();
}
/* 退出聚焦：从全屏进来的退回全屏阅读，从普通页进来的直接回到普通页 */
function exitFocus(){
  var to = OV.back || 'page';
  OV.back = 'page';
  if(to === 'read') backFromFocus();
  else closeFull();
}
function backFromFocus(){
  if(!CTX){ closeFull(); return; }
  OV.mode = 'read';
  $('ovTitle').textContent = CTX.title || '文稿';
  $('ovBody').innerHTML = '<div class="'+bodyClass()+'" id="ovMbody" style="font-size:'
    + curFs() + 'px">' + buildBodyHTML() + '</div>';
  renderOverlayTools();
  $('ovBody').scrollTop = 0;
}

/* ===================================================================
   阅读器 / 工具条 / 全屏
   =================================================================== */
function curFs(){
  return S.mod === 'news' ? S.news.fs : S.lang.fs;
}
function setFs(v){
  v = Math.max(13, Math.min(48, v));
  if(S.mod === 'news') S.news.fs = v; else S.lang.fs = v;
  var mb = $('mbody'); if(mb) mb.style.fontSize = v + 'px';
  var ovb = $('ovMbody');
  if(ovb) ovb.style.fontSize = (OV.mode === 'focus' ? Math.round(v*1.35) : v) + 'px';
  var lb = $('fsLabel'); if(lb) lb.textContent = Math.round(v/20*100) + '%';
  var olb = $('ovFsLabel'); if(olb) olb.textContent = Math.round(v/20*100) + '%';
}

function isReading(){ return S.mod === 'lang' || S.mod === 'news'; }

/* 顶部工具条与全屏层工具条一起刷新（按钮的开关状态两处要一致） */
function refreshBars(){
  renderTopbar();
  var ov = $('overlay');
  if(ov && ov.classList.contains('show')) renderOverlayTools();
}

/* 各模块工具条共用的尾部按钮：分享到课堂 / 输入课堂码 / 身份切换 */
function shareTools(){
  var h = '<span class="tb-sep"></span>';
  if(ROLE === 'student'){
    h += '<button class="tb" data-act="codein" title="输入老师给的课堂码">🔑 输入课堂码</button>';
  }else{
    h += '<button class="tb" data-act="share" title="把当前画面分享给学生">📣 分享到课堂</button>';
  }
  h += '<button class="tb'+(ROLE === 'student' ? ' on' : '')+'" data-act="role"'
     + ' title="切换老师 / 学生模式">👤 '+(ROLE === 'student' ? '学生' : '老师')+'</button>';
  return h;
}

function renderTopbar(){
  var tb = $('topbar');
  if(!isReading()){
    if(S.mod === 'jx'){
      tb.innerHTML = '<span class="tb-title">即兴评述 · 随机抽题</span>' +
        '<div class="tb-tools"><button class="tb drawer-btn" data-act="drawer">☰ 目录</button>'
        + shareTools() + '</div>';
    }else{
      tb.innerHTML = '<span class="tb-title">试卷生成</span>' +
        '<div class="tb-tools">' +
        '<button class="tb drawer-btn" data-act="drawer">☰ 设置</button>' +
        (ROLE !== 'student' ? '<button class="tb gold" data-act="build">🎲 重新生成</button>' : '') +
        '<button class="tb" data-act="print">🖨 另存为 PDF</button>' +
        shareTools() + '</div>';
    }
    return;
  }
  var hasDoc = !!CTX;
  var title = CTX ? (CTX.title || (CTX.kind==='news' ? '新闻稿件' : '朗诵稿件'))
                  : (S.mod === 'news' ? '新闻联播 · 联播快讯' : '未选择文稿');
  var h = '<button class="tb drawer-btn" data-act="drawer">☰</button>';
  h += '<span class="tb-title">'+esc(title)+'</span>';
  if(FOLLOW && ROLE === 'student') h += '<span class="follow-tag">跟随老师</span>';
  h += '<div class="tb-tools">';
  if(S.mod === 'news' && S.news.syncing && ROLE !== 'student') h += '<button class="tb danger" data-act="stopsync">■ 停止同步</button>';
  h += '<button class="tb gold" data-act="rand">🎲 随机一篇</button>';
  /* 没有打开文稿时，字号与标注按钮没有意义，隐掉免得误点 */
  if(hasDoc){
    h += '<button class="tb" data-act="fdown">A-</button>';
    h += '<span class="fs-label" id="fsLabel">'+Math.round(curFs()/20*100)+'%</span>';
    h += '<button class="tb" data-act="fup">A+</button>';
    h += '<button class="tb" data-act="full">⛶ 全屏</button>';
    /* 排版与聚焦只给朗诵；诗词默认居中，散文默认左对齐，都能随时改 */
    if(S.mod === 'lang'){
      h += '<span class="tb-sep"></span>';
      h += '<button class="tb'+(CTX.align==='left'?' on':'')+'" data-act="al-left" title="左对齐">左对齐</button>';
      h += '<button class="tb'+(CTX.align==='center'?' on':'')+'" data-act="al-center" title="居中">居中</button>';
      h += '<button class="tb'+(CTX.align==='right'?' on':'')+'" data-act="al-right" title="右对齐">右对齐</button>';
      h += '<button class="tb'+(CTX.indent?' on':'')+'" data-act="indent" title="首行缩进两个字符">缩进</button>';
      h += '<button class="tb gold" data-act="focussel" title="把选中的文字单独放大到整屏">⛶ 聚焦选中</button>';
    }
    h += '<span class="tb-sep"></span>';
    h += '<button class="tb purple" data-act="pause" title="选中相邻文字后点击，用 / 分隔">停顿</button>';
    h += '<button class="tb purple" data-act="conn" title="选中文字后点击，在下方加连接下划线">连接</button>';
    h += '<button class="tb purple" data-act="stress" title="选中文字后点击，在正下方加重音点">重音</button>';
    h += '<button class="tb" data-act="undo">↶ 撤销</button>';
    h += '<button class="tb" data-act="clearmark">清标注</button>';
    h += '<span class="tb-sep"></span>';
    h += '<button class="tb'+(zyOn(curKey)?' on':'')+'" data-act="zyin"'
      + ' title="选中文字则只给这些字注音；未选中则全文注音 / 取消注音">注音</button>';
    /* 联网查找常驻：选中一个汉字就能直接查，不要求先注音 */
    h += '<button class="tb gold" data-act="pysrch"'
      + ' title="选中一个汉字后点这里，用浏览器搜索它，该字的拼音随即可以修改">🔍 联网查找</button>';
  }
  if(S.mod === 'lang' && hasDoc && ROLE !== 'student'){
    h += '<span class="tb-sep"></span>';
    h += '<button class="tb" data-act="edit">'+(S.editing?'✓ 完成':'✎ 编辑')+'</button>';
    if(EDITS[CTX.rawId]) h += '<button class="tb" data-act="revert">还原</button>';
  }
  h += shareTools();
  h += '</div>';
  tb.innerHTML = h;
}

function renderOverlayTools(){
  var h = '';
  h += '<button class="tb" data-act="fdown">A-</button>';
  h += '<span class="fs-label" id="ovFsLabel">'+Math.round(curFs()/20*100)+'%</span>';
  h += '<button class="tb" data-act="fup">A+</button>';
  /* 聚焦层同样是「原文的一个视图」，注音、三类标注、联网查找在这里一样能用 */
  h += '<span class="tb-sep"></span>';
  h += '<button class="tb purple" data-act="pause" title="选中相邻文字后点击，用 / 分隔">停顿</button>';
  h += '<button class="tb purple" data-act="conn" title="选中文字后点击，在下方加连接下划线">连接</button>';
  h += '<button class="tb purple" data-act="stress" title="选中文字后点击，在正下方加重音点">重音</button>';
  h += '<button class="tb" data-act="undo">↶ 撤销</button>';
  h += '<span class="tb-sep"></span>';
  h += '<button class="tb'+(zyOn(curKey)?' on':'')+'" data-act="zyin">注音</button>';
  h += '<button class="tb gold" data-act="pysrch" title="选中一个汉字后点这里，用浏览器搜索它">🔍 联网查找</button>';
  h += '<span class="tb-sep"></span>';
  h += '<button class="tb exit" data-act="exitfull">'+(OV.mode === 'focus' ? '✕ 退出聚焦' : '✕ 退出全屏')+'</button>';
  $('ovTools').innerHTML = h;
}

function reqFS(){
  try{
    var el = document.documentElement;
    var p = el.requestFullscreen ? el.requestFullscreen() :
            (el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null);
    if(p && p.catch) p.catch(function(){});
  }catch(e){}
}
function exitFS(){
  try{
    if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function(){});
    else if(document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
  }catch(e){}
}

function openFull(){
  if(!CTX){ toast('请先选择一篇文稿'); return; }
  OV.mode = 'read';
  OV.back = 'page';
  closePyEdit();
  $('ovTitle').textContent = CTX.title || '文稿';
  $('ovBody').innerHTML = '<div class="'+bodyClass()+'" id="ovMbody" style="font-size:'+curFs()+'px">'+buildBodyHTML()+'</div>';
  renderOverlayTools();
  $('overlay').classList.add('show');
  $('ovBody').scrollTop = 0;
  reqFS();
}
function closeFull(){
  OV.mode = 'read';
  OV.back = 'page';
  OV.text = '';
  OV.base = 0;
  closePyEdit();
  $('overlay').classList.remove('show');
  exitFS();
  repaint();
  renderTopbar();
}

['fullscreenchange','webkitfullscreenchange'].forEach(function(evt){
  document.addEventListener(evt, function(){
    var inFs = document.fullscreenElement || document.webkitFullscreenElement;
    if(!inFs && $('overlay').classList.contains('show')) closeFull();
  });
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    if($('overlay').classList.contains('show')){
      if(OV.mode === 'focus') exitFocus(); else closeFull();
      return;
    }
    if($('mask').classList.contains('show')) closeDlg();
  }
  if(!$('overlay').classList.contains('show')) return;
  if(e.key === '+' || e.key === '='){ setFs(curFs()+2); }
  else if(e.key === '-' || e.key === '_'){ setFs(curFs()-2); }
});

/* ---------------- 顶部工具条事件（含全屏层，统一委托） ---------------- */
document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('[data-act]') : null;
  if(!b) return;
  var act = b.getAttribute('data-act');
  if(!act) return;
  switch(act){
    case 'drawer': $('sidebar').classList.toggle('open'); $('sideMask').classList.toggle('show'); break;
    case 'fup': setFs(curFs()+2); break;
    case 'fdown': setFs(curFs()-2); break;
    case 'full': openFull(); break;
    case 'exitfull': if(OV.mode === 'focus') exitFocus(); else closeFull(); break;
    case 'pause': applyMark('pause'); break;
    case 'conn': applyMark('conn'); break;
    case 'stress': applyMark('stress'); break;
    case 'undo': undoMark(); break;
    case 'clearmark': clearMarks(); break;
    case 'zyin': toggleZhuyin(); break;
    case 'pysrch': pySearch(); break;
    case 'focussel': focusSelection(); break;
    case 'al-left': setAlign('left'); break;
    case 'al-center': setAlign('center'); break;
    case 'al-right': setAlign('right'); break;
    case 'indent': toggleIndent(); break;
    case 'rand': doRandom(); break;
    case 'edit': toggleEdit(); break;
    case 'revert': revertEdit(); break;
    case 'build': buildPaper(true); break;
    case 'print': doPrint(); break;
    case 'sync': syncNews(); break;
    case 'stopsync': stopSync(); break;
    case 'manual': openManual(); break;
    case 'share': openShare(); break;
    case 'codein': openCodeEntry(); break;
    case 'role': switchRole(); break;
  }
});

/* 划词后浮出操作条（阅读模块） */
function hideSelbar(){
  var el = $('selbar');
  if(el) el.classList.remove('show');
}
document.addEventListener('mouseup', function(e){
  if(!isReading()) return;
  if(e.target.closest && e.target.closest('.selbar')) return;
  setTimeout(function(){
    var info = selInfo();
    var el = $('selbar');
    if(!info || info.cross){ hideSelbar(); return; }
    var sel = window.getSelection();
    if(!sel || !sel.rangeCount){ hideSelbar(); return; }
    var r = sel.getRangeAt(0).getBoundingClientRect();
    if(!r || (!r.width && !r.height)){ hideSelbar(); return; }
    el.innerHTML =
      '<button class="tb purple" data-act="pause">停顿</button>' +
      '<button class="tb purple" data-act="conn">连接</button>' +
      '<button class="tb purple" data-act="stress">重音</button>' +
      '<button class="tb'+(zyOn(curKey)?' on':'')+'" data-act="zyin">注音</button>' +
      (S.mod === 'lang' ? '<button class="tb gold" data-act="focussel">⛶ 全屏显示</button>' : '');
    el.classList.add('show');
    /* 优先落在选区下方：苹果设备的系统菜单会占住选区上方，浮条放上面会被顶掉 */
    var top = r.bottom + 8;
    if(top + el.offsetHeight > window.innerHeight - 6) top = r.top - el.offsetHeight - 8;
    if(top < 6) top = 6;
    var left = r.left + r.width/2 - el.offsetWidth/2;
    left = Math.max(8, Math.min(window.innerWidth - el.offsetWidth - 8, left));
    el.style.top = top + 'px';
    el.style.left = left + 'px';
  }, 10);
});
document.addEventListener('mousedown', function(e){
  if(!e.target.closest){ hideSelbar(); return; }
  if(e.target.closest('.selbar')){ e.preventDefault(); return; }
  /* 关键：点标注类按钮时保住选区，否则选中文字会丢失 */
  var b = e.target.closest('[data-act]');
  if(b){
    var a = b.getAttribute('data-act');
    if(a === 'pause' || a === 'conn' || a === 'stress' || a === 'zyin' || a === 'focussel'){
      e.preventDefault(); hideSelbar(); return;
    }
  }
  hideSelbar();
});
document.addEventListener('scroll', hideSelbar, true);

/* ===================================================================
   模块一：朗诵稿件
   =================================================================== */
var LANGS = LANG_DATA.map(function(x){ return Object.assign({}, x); });
var CORS_ORDER = ['小学必背','初中必背','高中必背','普通话60篇','唐诗','宋词','古诗·乐府','古文','毛泽东诗词','现代诗','现代文名篇','朗诵稿件'];
var CATS = (function(){
  var set = {};
  LANGS.forEach(function(x){ set[x.cat] = (set[x.cat]||0)+1; });
  var arr = CORS_ORDER.filter(function(c){ return set[c]; });
  Object.keys(set).forEach(function(c){ if(arr.indexOf(c) < 0) arr.push(c); });
  return arr.map(function(c){ return {name:c, n:set[c]}; });
})();

function langItem(id){ return LANGS.find(function(x){ return x.id === id; }); }
function langData(it){
  var e = EDITS[it.id];
  if(!e) return it;
  return Object.assign({}, it, e);
}
function langMatches(it, q){
  if(!q) return true;
  var d = langData(it);
  var body = (d.lines||[]).join(' ');
  return (d.title+' '+(d.author||'')+' '+(d.tag||'')+' '+body).toLowerCase().indexOf(q) >= 0;
}
function langFiltered(){
  var q = S.lang.q.toLowerCase();
  return LANGS.filter(function(it){
    if(S.lang.cat !== '全部' && it.cat !== S.lang.cat) return false;
    return langMatches(it, q);
  });
}

function renderLangSide(){
  var h = '';
  h += '<div class="side-search"><input id="qLang" type="search" placeholder="搜索篇名 / 作者 / 正文…" value="'+esc(S.lang.q)+'" autocomplete="off"><button class="clr" id="clrLang">×</button></div>';
  h += '<div class="sec-title">分类筛选 <span class="n">'+CATS.length+'</span></div>';
  h += '<div class="cats">';
  h += '<button class="cbtn'+(S.lang.cat==='全部'?' on':'')+'" data-c="全部">全部<b>'+LANGS.length+'</b></button>';
  CATS.forEach(function(c){
    h += '<button class="cbtn'+(S.lang.cat===c.name?' on':'')+'" data-c="'+esc(c.name)+'">'+esc(c.name)+'<b>'+c.n+'</b></button>';
  });
  h += '</div>';
  var rows = langFiltered();
  h += '<div class="sec-title">稿件列表 <span class="n">'+rows.length+'</span></div>';
  h += '<div class="list">';
  if(!rows.length){
    h += '<div class="empty">没有匹配的稿件</div>';
  }else{
    var q = S.lang.q;
    rows.forEach(function(it){
      var d = langData(it);
      var snip = (d.lines||[]).join('');
      if(q){
        var i = snip.toLowerCase().indexOf(q.toLowerCase());
        if(i >= 0){
          var a = Math.max(0, i-8), b = Math.min(snip.length, i+q.length+20);
          snip = (a>0?'…':'') + esc(snip.slice(a,b)) + (b<snip.length?'…':'');
        }else{ snip = esc(snip.slice(0,34)); }
      }else{
        snip = esc(snip.slice(0,34));
      }
      h += '<div class="item'+(S.lang.cur===it.id?' cur':'')+'" data-id="'+it.id+'">';
      h += '<div class="t">'+esc(d.title)+'</div>';
      h += '<div class="s"><span class="tag">'+esc(d.cat)+'</span><span>'+esc(d.author||'佚名')+'</span></div>';
      h += '<div class="snip">'+snip+'</div>';
      h += '</div>';
    });
  }
  h += '</div>';
  var sb = $('sideBody');
  sb.innerHTML = h;

  var qi = $('qLang');
  qi.addEventListener('input', function(){
    S.lang.q = this.value;
    var pos = this.selectionStart;
    renderLangSide();
    var nq = $('qLang'); nq.focus(); try{ nq.setSelectionRange(pos,pos); }catch(e){}
  });
  $('clrLang').addEventListener('click', function(){ S.lang.q=''; renderLangSide(); });
  $$('.cbtn', sb).forEach(function(b){
    b.addEventListener('click', function(){
      S.lang.cat = b.getAttribute('data-c');
      renderLangSide();
    });
  });
  $$('.item', sb).forEach(function(el){
    el.addEventListener('click', function(){ openLang(parseInt(el.getAttribute('data-id'),10)); });
  });
}

function openLang(id){
  var raw = langItem(id);
  if(!raw) return;
  S.lang.cur = id;
  var d = langData(raw);
  var rawBody = (d.lines||[]);
  var paras = rawBody.slice();
  CTX = {
    kind: 'lang',
    title: d.title,
    meta: [d.author || '佚名', d.cat, d.tag].filter(Boolean),
    paras: paras,
    subs: [],
    align: layOf('lang-'+id, CEN_CATS.indexOf(d.cat) >= 0 ? 'center' : 'left').align,
    indent: layOf('lang-'+id).indent,
    serif: ['唐诗','宋词','古文','古诗·乐府','毛泽东诗词','现代诗','小学必背','初中必背','高中必背'].indexOf(d.cat) >= 0,
    key: 'lang-'+id,
    rawId: id
  };
  curKey = CTX.key;
  S.editing = false;
  renderLangSide();
  renderTopbar();
  renderReader();
}
function renderReader(){
  var v = $('view');
  closePyEdit();
  if(!CTX){
    v.innerHTML = '<div class="r-empty"><div class="big">📖</div><div class="t1">请从左侧选择一篇稿件</div>'
      + '<div class="t2">也可以点上方「随机一篇」，随机范围跟随左侧选中的分类。<br>随机后可用工具条上的停顿、连接、重音按钮做播读标记。</div></div>';
    return;
  }
  var h = '<div class="pad"><div class="reader">';
  h += '<div class="r-head"><div class="r-title">'+esc(CTX.title)+'</div>';
  if(CTX.meta && CTX.meta.length){
    h += '<div class="r-meta">';
    CTX.meta.forEach(function(m,i){ h += '<span'+(i>0?' class="tag"':'')+'>'+esc(m)+'</span>'; });
    h += '</div>';
  }
  h += '</div>';
  h += '<div class="'+bodyClass()+'" id="mbody" style="font-size:'+curFs()+'px"'+'>'+buildBodyHTML()+'</div>';
  h += '<div style="margin-top:34px;padding-top:14px;border-top:1px dashed rgba(255,255,255,.12);font-size:11.5px;color:#6b7199;line-height:1.9">'
    + '选中文字后可用工具条的「停顿 / 连接 / 重音」做标记。停顿插入斜杠，连接加下划线，重音在字下加点。<br>'
    + '「注音」：不选文字时给全篇加拼音，选中文字则只给这些字注音；选中单个汉字后再点「联网查找」，会打开搜索并允许直接改写拼音。<br>'
    + '朗诵稿件里选中一段文字后，还可以点「全屏显示」把它单独放大到整屏。<br>'
    + '标注只在本次会话中保留，刷新页面即清空；另存为 PDF 时不会打印这些符号。</div>';
  h += '</div></div>';
  v.innerHTML = h;
  v.scrollTop = 0;
  if(S.editing) enterEditMode();
}

function doRandom(){
  if(S.mod === 'lang'){
    var pool = S.lang.cat === '全部' ? LANGS : LANGS.filter(function(x){ return x.cat === S.lang.cat; });
    if(!pool.length){ toast('当前分类下没有稿件'); return; }
    var it = pickOne(pool);
    openLang(it.id);
    toast('已随机抽到：' + langData(it).title + (S.lang.cat !== '全部' ? '（分类：'+S.lang.cat+'）' : ''));
  }else if(S.mod === 'news'){
    var list = S.news.items.filter(function(x){ return x.paras && x.paras.length; });
    if(!list.length){ toast('还没有新闻文稿，请先在左侧点「同步最近5天」'); return; }
    var n = pickOne(list);
    openNews(n);
    toast('已随机抽到：' + n.title + '（' + fmtDate(n.date) + ' ' + n.kind + '）');
  }
}

/* --- 编辑当前稿件 --- */
function enterEditMode(){

/* ===================================================================
   模块二：新闻联播
   =================================================================== */
var NEWS_KEY = 'yk.news.v2';
var NEWS_KEY_OLD = 'yk.news.v1';
var NEWS_DAYS = 5;    /* 往前取最近 5 个已播出日 */
var NEWS_CAP  = 30;   /* 本次同步新增满 30 条即自动停止 */
var NEWS_ABORT = { flag:false, ctls:[] };
var CHAN_PENALTY = {};   /* 本次会话内各通道失败计数，用来把坏通道排到最后 */

function fmtDate(ds){
  if(!ds || ds.length !== 8) return ds || '';
  return ds.slice(0,4) + '年' + parseInt(ds.slice(4,6),10) + '月' + parseInt(ds.slice(6,8),10) + '日';
}
function dateShift(base, n){
  var d = new Date(base.getTime());
  d.setDate(d.getDate() + n);
  var p = function(x){ return (x<10?'0':'')+x; };
  return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate());
}

function nlog(msg, cls){
  S.news.logs.push({ m: msg, c: cls || '' });
  var el = $('newsLogs');
  if(el){
    el.innerHTML = S.news.logs.map(function(x){
      return '<div class="'+x.c+'">'+esc(x.m)+'</div>';
    }).join('');
    el.scrollTop = el.scrollHeight;
  }
}

/* --- 跨域取文：多通道轮询 --- */
function fetchT(url, ms){
  var ctl = new AbortController();
  NEWS_ABORT.ctls.push(ctl);
  var timer = setTimeout(function(){ ctl.abort(); }, ms);
  var fin = function(){
    clearTimeout(timer);
    var i = NEWS_ABORT.ctls.indexOf(ctl);
    if(i >= 0) NEWS_ABORT.ctls.splice(i, 1);
  };
  return fetch(url, { signal: ctl.signal, cache: 'no-store' }).then(function(r){
    fin();
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r;
  }, function(e){
    fin();
    throw e;
  });
}
var CHANNELS = [
  { name:'主通道',   build:function(u){ return 'https://api.allorigins.win/get?url=' + encodeURIComponent(u); }, json:true, tmo:30000 },
  { name:'备用通道', build:function(u){ return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); }, tmo:30000 },
  { name:'第三通道', build:function(u){ return 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u); }, tmo:12000 }
];
function okContent(t){
  return t && t.length > 400 && (t.indexOf('cctv') >= 0 || t.indexOf('VIDE') >= 0 || t.indexOf('央视') >= 0 || t.indexOf('新闻联播') >= 0);
}
/* 通道排序：上次成功的通道优先，本次失败的通道排到最后，避免反复空等 */
function orderChannels(){
  var last = loadLS('yk.news.chan', '');
  return CHANNELS.slice().sort(function(a, b){
    var pa = CHAN_PENALTY[a.name] || 0, pb = CHAN_PENALTY[b.name] || 0;
    if(pa !== pb) return pa - pb;
    if(a.name === last) return -1;
    if(b.name === last) return 1;
    return 0;
  });
}
/* 依次尝试各通道，失败间隔 400ms 再换 */
function fetchVia(target){
  var list = orderChannels();
  var i = 0, lastErr = null;
  function next(){
    if(NEWS_ABORT.flag) return Promise.reject(new Error('已停止'));
    if(i >= list.length) return Promise.reject(lastErr || new Error('全部通道均失败'));
    var ch = list[i++];
    return fetchT(ch.build(target), ch.tmo).then(function(r){
      return r.text().then(function(t){
        if(ch.json){ try{ var j = JSON.parse(t); t = j.contents || ''; }catch(e){} }
        if(!okContent(t)) throw new Error(ch.name + ' 返回内容异常');
        CHAN_PENALTY[ch.name] = 0;
        saveLS('yk.news.chan', ch.name);
        return t;
      });
    }).catch(function(e){
      lastErr = e;
      CHAN_PENALTY[ch.name] = (CHAN_PENALTY[ch.name] || 0) + 1;
      if(NEWS_ABORT.flag) throw new Error('已停止');
      if(i >= list.length) throw lastErr;
      return sleep(400).then(next);
    });
  }
  return next();
}

/* --- 解析每日条目页 --- */
function parseDay(html, ds){
  var doc = new DOMParser().parseFromString(html, 'text/html');
  var out = [], seen = {};
  var as = doc.querySelectorAll('a[href]');
  for(var i=0;i<as.length;i++){
    var a = as[i];
    var href = a.getAttribute('href') || '';
    if(href.indexOf('.shtml') < 0) continue;
    if(href.indexOf('VIDE') < 0) continue;
    if(href.indexOf('http') !== 0) href = 'https://tv.cctv.com' + (href.charAt(0)==='/'?'':'/') + href;
    if(seen[href]) continue;
    seen[href] = 1;
    var title = (a.getAttribute('title') || a.textContent || '').replace(/\s+/g,' ').trim();
    var kind = '';
    if(title.indexOf('国内联播快讯') >= 0) kind = '国内联播快讯';
    else if(title.indexOf('国际联播快讯') >= 0) kind = '国际联播快讯';
    if(kind) out.push({ date: ds, kind: kind, url: href });
  }
  return out;
}

/* --- 解析正文页：返回 [{t:段落文字, h:是否小标题}] --- */
function parseBlocks(html){
  var doc = new DOMParser().parseFromString(html, 'text/html');
  var box = doc.querySelector('.content_area') || doc.querySelector('#content_area');
  var out = [];
  if(!box) return out;
  var ps = box.querySelectorAll('p');
  for(var i=0;i<ps.length;i++){
    var p = ps[i];
    var txt = (p.textContent || '').replace(/\s+/g,' ').trim();
    if(!txt) continue;
    if(txt.indexOf('央视网消息') === 0) continue;
    var st = p.querySelector('strong');
    var isTitle = false;
    if(st){
      /* 整段只有加粗的小标题、没有别的文字 —— 这一行就是一条新闻的标题 */
      var rest = txt.replace(st.textContent, '').replace(/[\s:：]/g, '');
      if(rest.length === 0 && txt.length <= 60) isTitle = true;
    }
    out.push({ t: txt, h: isTitle });
  }
  return out;
}

/* --- 把一个栏目切成一条条独立新闻 ---
   加粗小标题 = 这条新闻的标题，紧跟其后的段落 = 这条新闻的内容 */
function splitSubNews(blocks, kind, date, srcUrl){
  var items = [], cur = null, no = 0;
  (blocks || []).forEach(function(b){
    if(!b || !b.t) return;
    if(b.h){
      no++;
      cur = { date:date, kind:kind, title:b.t, paras:[], url:srcUrl, no:no };
      items.push(cur);
    }else{
      if(!cur){
        cur = { date:date, kind:kind, title:(kind || '联播快讯'), paras:[], url:srcUrl, no:0 };
        items.push(cur);
      }
      cur.paras.push(b.t);
    }
  });
  return items.filter(function(x){ return x.paras.length; });
}

/* --- 手动导入用：按行判断，短行且无句末标点视为一条新闻的标题 --- */
function splitSubNewsByLines(lines, kind, date, srcUrl){
  var blocks = (lines || []).map(function(l){
    var s = String(l).trim();
    var isTitle = s.length <= 32 && s.indexOf('。') < 0 && !/[。；！？，,]$/.test(s);
    return { t: s, h: isTitle };
  });
  return splitSubNews(blocks, kind, date, srcUrl);
}

/* 一条新闻的唯一标识：日期 + 栏目 + 标题 */
function itemKey(x){ return x.date + '|' + x.kind + '|' + x.title; }

/* --- 并入新闻库：同日同栏目同标题视为同一条，覆盖正文，不重复堆积 --- */
function mergeNews(list){
  var map = {}, added = 0, upd = 0;
  S.news.items.forEach(function(x){ map[itemKey(x)] = x; });
  (list || []).forEach(function(x){
    var k = itemKey(x);
    if(map[k]){ map[k].paras = x.paras; upd++; }
    else { map[k] = x; added++; }
  });
  S.news.items = Object.keys(map).map(function(k){ return map[k]; });
  sortNews();
  return { added: added, upd: upd };
}
function sortNews(){
  S.news.items.sort(function(a,b){
    if(a.date !== b.date) return a.date < b.date ? 1 : -1;
    if(a.kind !== b.kind) return a.kind > b.kind ? 1 : -1;
    return (a.no || 0) - (b.no || 0);
  });
}

/* --- 同步：往前 5 个已播出日，库内满 30 条或点停止即收工 --- */
var NEWS_STAGE = { text:'', t0:0 };
function stageSet(text){ NEWS_STAGE.text = text; NEWS_STAGE.t0 = Date.now(); }
function updNewsLog(){
  var el = $('newsLogs');
  if(el){
    el.innerHTML = S.news.logs.map(function(x){ return '<div class="'+x.c+'">'+esc(x.m)+'</div>'; }).join('');
    el.scrollTop = el.scrollHeight;
  }
  var bar = $('syncBar');
  if(bar){
    var ex = NEWS_STAGE.t0 ? Math.round((Date.now() - NEWS_STAGE.t0) / 1000) : 0;
    bar.innerHTML = '同步中… ' + (NEWS_STAGE.text ? esc(NEWS_STAGE.text) + '（已等待 ' + ex + ' 秒）　' : '')
      + '库内 <b>'+S.news.items.length+'</b>/'+NEWS_CAP+' 条　本次新增 <b>'+S.news.round+'</b> 条';
  }
}
/* 停止同步：中止当前所有请求，已抓到的照常留下并立即呈现 */
function stopSync(){
  if(!S.news.syncing) return;
  S.news.stop = true;
  NEWS_ABORT.flag = true;
  NEWS_ABORT.ctls.slice().forEach(function(c){ try{ c.abort(); }catch(e){} });
  NEWS_ABORT.ctls = [];
  nlog('收到停止指令，正在整理已同步的内容…', 'warn');
  updNewsLog();
  var b = $('btnStop');
  if(b){ b.disabled = true; b.textContent = '停止中…'; }
}

/* 正文获取交给 fetchVia（内部已按通道逐个重试）；
   某个栏目仍失败时该日不会被标记为完成，下次同步自动补齐 */

function syncNews(){
  if(S.news.syncing){ toast('正在同步中'); return; }
  S.news.syncing = true;
  S.news.stop = false;
  S.news.round = 0;
  S.news.logs = [];
  NEWS_ABORT.flag = false;
  NEWS_ABORT.ctls = [];
  CHAN_PENALTY = {};
  renderNewsSide();
  renderTopbar();
  runSync();
}

async function runSync(){
  var today = new Date();
  var daysGot = 0, guard = 0, roundAdded = 0, hitCap = false, failStreak = 0, gaveUp = false;
  nlog('开始同步：往前取最近 ' + NEWS_DAYS + ' 个已播出日（不含今天）；库内满 ' + NEWS_CAP
    + ' 条即自动停止，也可随时点「停止同步」。', 'warn');
  stageSet('准备中');
  updNewsLog();
  /* 每秒刷新一次「已等待 N 秒」，避免通道慢的时候界面看着像卡死 */
  var heartbeat = setInterval(updNewsLog, 1000);

  try{
    while(daysGot < NEWS_DAYS && guard < 14){
      if(NEWS_ABORT.flag) break;
      /* 至少先补最新一天，再按库内条数上限决定要不要继续往前抓 */
      if(daysGot > 0 && S.news.items.length >= NEWS_CAP){ hitCap = true; break; }
      /* 连续几天都抓不到，说明通道不通，别再空转 */
      if(failStreak >= 2){
        gaveUp = true;
        nlog('连续 2 天都未取到内容，判定公共通道暂时不可用，停止自动同步。', 'bad');
        break;
      }
      guard++;
      var ds = dateShift(today, -guard);

      if(S.news.done[ds]){
        nlog('· ' + fmtDate(ds) + ' 已在库中，跳过', 'mut');
        daysGot++;
        updNewsLog();
        continue;
      }

      nlog('正在获取 ' + fmtDate(ds) + ' …');
      stageSet('正在取 ' + fmtDate(ds) + ' 的条目页');
      updNewsLog();

      var html = null;
      try{
        html = await fetchVia('https://tv.cctv.com/lm/xwlb/day/' + ds + '.shtml');
      }catch(e){
        if(NEWS_ABORT.flag) break;
        failStreak++;
        nlog('✗ ' + fmtDate(ds) + ' 条目页获取失败：' + e.message + '（跳过，前移一天）', 'bad');
        updNewsLog();
        continue;
      }

      var list = parseDay(html, ds);
      if(!list.length){
        failStreak++;
        nlog('✗ ' + fmtDate(ds) + ' 未找到「联播快讯」条目（跳过，前移一天）', 'bad');
        updNewsLog();
        continue;
      }
      failStreak = 0;
      nlog('  找到 ' + list.length + ' 个快讯栏目，开始拆条取正文…');
      updNewsLog();

      /* 国内 / 国际两个栏目同时取，省掉一半等待时间 */
      stageSet('正在取 ' + fmtDate(ds) + ' 的快讯正文');
      updNewsLog();
      var okPillar = 0;
      var results = await Promise.all(list.map(function(pit){
        return fetchVia(pit.url).then(function(h2){
          return { pit: pit, subs: splitSubNews(parseBlocks(h2), pit.kind, ds, pit.url) };
        }, function(e){
          return { pit: pit, err: e };
        });
      }));
      results.forEach(function(res){
        if(res.err){
          if(!NEWS_ABORT.flag) nlog('  ✗ ' + res.pit.kind + ' 获取失败：' + (res.err.message || res.err), 'bad');
          return;
        }
        if(!res.subs.length){
          nlog('  ! ' + res.pit.kind + ' 未解析到小段落', 'warn');
          return;
        }
        var r = mergeNews(res.subs);
        roundAdded += r.added;
        S.news.round = roundAdded;
        okPillar++;
        nlog('  ✓ ' + res.pit.kind + '：' + res.subs.length + ' 条'
          + (r.upd ? '（其中 ' + r.upd + ' 条为更新）' : ''), 'ok');
      });
      var stopped = NEWS_ABORT.flag;
      updNewsLog();
      renderNewsSide();

      if(okPillar === list.length) S.news.done[ds] = 1;
      else if(okPillar > 0) nlog('· ' + fmtDate(ds) + ' 只取到 ' + okPillar + '/' + list.length + ' 个栏目，下次同步会补齐', 'warn');

      if(okPillar > 0){
        daysGot++;
        if(!stopped) nlog('  · ' + fmtDate(ds) + ' 完成', 'ok');
      }else{
        nlog('✗ ' + fmtDate(ds) + ' 未取得正文，继续前移', 'bad');
      }

      saveNewsCache();
      renderNewsSide();
      updNewsLog();
      if(stopped) break;
      await sleep(700);
    }
  }catch(e){
    nlog('同步中断：' + (e && e.message ? e.message : e), 'bad');
  }

  clearInterval(heartbeat);
  S.news.syncing = false;
  S.news.round = roundAdded;
  stageSet('');
  NEWS_ABORT.ctls = [];
  saveNewsCache();
  renderNewsSide();
  renderTopbar();
  updNewsLog();

  var n = S.news.items.length;
  if(NEWS_ABORT.flag) toast('已停止同步，当前共 ' + n + ' 条新闻');
  else if(!n) toast(gaveUp ? '公共通道暂时不可用，请稍后再试，或点「手动导入」粘贴文稿' : '未取得文稿，请用「手动导入」粘贴内容');
  else if(hitCap) toast('同步完成：库内已有 ' + n + ' 条（满 ' + NEWS_CAP + ' 条上限），本次新增 ' + roundAdded + ' 条');
  else toast('同步完成，库内共 ' + n + ' 条新闻' + (roundAdded ? '（本次新增 ' + roundAdded + ' 条）' : ''));
  if(n && !(S.news.cur && S.news.cur.paras && S.news.cur.paras.length)) openNews(S.news.items[0]);
}

function saveNewsCache(){
  try{
    var slim = S.news.items.map(function(x){
      return { date:x.date, kind:x.kind, title:x.title, paras:x.paras, url:x.url, no:x.no };
    });
    localStorage.setItem(NEWS_KEY, JSON.stringify({ items: slim, done: S.news.done }));
  }catch(e){}
}
function loadNewsCache(){
  var c = loadLS(NEWS_KEY, null);
  if(c && c.items && c.items.length){
    S.news.items = c.items;
    S.news.done = c.done || {};
    sortNews();
    return;
  }
  /* 兼容上一版缓存（按栏目整篇存）：就地拆成一条条新闻，省得重新抓一遍 */
  var old = loadLS(NEWS_KEY_OLD, null);
  if(old && old.length){
    var out = [];
    old.forEach(function(x){
      if(!x || !x.paras || !x.paras.length) return;
      var blocks = x.paras.map(function(t, i){
        return { t: t, h: (x.subs || []).indexOf(i) >= 0 };
      }).filter(function(b){
        return b.t && b.t.indexOf('央视网消息') !== 0;
      });
      splitSubNews(blocks, x.kind, x.date, x.url).forEach(function(it){ out.push(it); });
    });
    if(out.length){
      S.news.items = [];
      mergeNews(out);
      var byDate = {};
      out.forEach(function(x){ (byDate[x.date] = byDate[x.date] || {})[x.kind] = 1; });
      Object.keys(byDate).forEach(function(d){
        if(byDate[d]['国内联播快讯'] && byDate[d]['国际联播快讯']) S.news.done[d] = 1;
      });
      saveNewsCache();
    }
  }
}

function renderNewsSide(){
  var h = '';

  /* 顶部操作：同步中换成停止按钮。学生模式不给这些会改动内容或联网的入口 */
  if(ROLE !== 'student'){
    h += '<div style="display:flex;gap:7px;margin-bottom:9px">';
    if(S.news.syncing){
      h += '<button class="tb danger" id="btnStop" style="flex:1;justify-content:center">■ 停止同步</button>';
    }else{
      h += '<button class="tb gold" id="btnSync" style="flex:1;justify-content:center">⟳ 同步最近5天</button>';
      h += '<button class="tb" id="btnManual" style="justify-content:center">手动导入</button>';
      if(S.news.items.length) h += '<button class="tb" id="btnClear" style="justify-content:center" title="清空新闻库">🗑</button>';
    }
    h += '</div>';
  }
  if(S.news.syncing){
    h += '<div class="sync-bar" id="syncBar">同步中… 库内 <b>'+S.news.items.length+'</b>/'+NEWS_CAP+' 条'
      + '　本次新增 <b>'+(S.news.round||0)+'</b> 条</div>';
  }

  /* 条目多时给个筛选框（新闻小标题很长，靠它找得快） */
  if(S.news.items.length > 12){
    h += '<div class="side-search"><input id="qNews" type="search" placeholder="筛选标题 / 日期 / 栏目…" value="'+esc(S.news.q)+'" autocomplete="off">'
      + '<button class="clr" id="clrNews">&times;</button></div>';
  }

  var q = (S.news.q || '').trim();
  var list = S.news.items.filter(function(x){
    if(!q) return true;
    return ((x.title || '') + ' ' + fmtDate(x.date) + ' ' + (x.kind || '')).indexOf(q) >= 0;
  });
  var allDays = uniq(S.news.items.map(function(x){ return x.date; }));

  if(S.news.items.length){
    h += '<div class="sec-title">已获取 <span class="n">'+allDays.length+' 天 · '+S.news.items.length+' 条</span>'
      + (q ? '　筛选出 '+list.length+' 条' : '') + '</div>';
    if(!list.length){
      h += '<div class="empty">没有匹配的新闻</div>';
    }
    uniq(list.map(function(x){ return x.date; })).sort().reverse().forEach(function(d){
      var day = list.filter(function(x){ return x.date === d; });
      h += '<div class="grp"><span>'+fmtDate(d)+'</span><span>'+day.length+' 条</span></div>';
      day.forEach(function(it){
        var tk = it.kind.indexOf('国际') === 0 ? '国际' : '国内';
        var isCur = S.news.cur && itemKey(S.news.cur) === itemKey(it);
        h += '<div class="item'+(isCur ? ' cur' : '')+'" data-k="'+esc(itemKey(it))+'">';
        h += '<div class="t" title="'+esc(it.title)+'">'+esc(it.title)+'</div>';

function openNews(it){

    '<div style="font-size:13px;line-height:2;color:#c3c8e6">将删除本地保存的 <b style="color:#ffd86b">'+n+'</b> 条新闻（含所有日期与栏目），'
    + '并重置同步记录。<br>清空后可以重新点「同步最近5天」再抓一次。<br>此操作只影响本机这个网页里的新闻缓存，不会影响央视网。</div>',
    '<button class="tb" id="clrCancel">取消</button><button class="tb danger" id="clrOk">确认清空</button>');

function openManual(){

    + '<div style="display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap">'
    + '<button class="tb gold" id="mOpen">↗ 打开央视网当天条目页</button>'
    + '<span style="font-size:11px;color:#6b7199">在打开的页面里点开「国内联播快讯」或「国际联播快讯」，把正文整段复制过来</span>'
    + '</div>'
    + '<textarea id="mText" placeholder="把正文粘贴到这里，一行一段，例如：&#10;央视网消息（新闻联播）：&#10;第二十六届中国国际投资贸易洽谈会成果丰硕&#10;第二十六届中国国际投资贸易洽谈会今天（9月11日）在福建厦门闭幕……&#10;整治低价无序竞争 重要工业品成本核算要求明确&#10;国家发展改革委、市场监管总局近日联合印发……"></textarea>'
    + '<div class="hint">一条新闻 = 一行小标题 + 紧跟其后的正文段落。判断规则：不超过 32 字、且不含句号的短行会被当成一条新闻的小标题，它下面的段落就是这条新闻的内容。没有小标题的整段文字会被合成一条「联播快讯」条目。</div></div>';
  openDlg('手动导入新闻文稿', html,
    '<button class="tb" id="mCancel">取消</button><button class="tb gold" id="mSave">保存到新闻库</button>');

  $('mOpen').addEventListener('click', function(){
    window.open('https://tv.cctv.com/lm/xwlb/day/' + $('mDate').value + '.shtml', '_blank');
  });
  $('mCancel').addEventListener('click', closeDlg);
  $('mSave').addEventListener('click', function(){
    var ds = $('mDate').value;
    var kind = $('mKind').value;
    var raw = $('mText').value.replace(/\r/g,'');
    var lines = raw.split('\n').map(function(s){ return s.trim(); }).filter(function(s){ return s.length; });
    if(!lines.length){ toast('请先粘贴正文'); return; }
    var subs = splitSubNewsByLines(lines, kind, ds, 'manual-' + ds + '-' + kind);
    if(!subs.length){ toast('没有解析到内容'); return; }
    var r = mergeNews(subs);

    if(target) openNews(target);
  });
}

function normNews(x, i){ return { cat:'news', idx:i, title:x.t||'', paras:x.p||[], tips:x.tips||[] }; }
function normOther(s, i){ return { cat:'other', idx:i, title:'', paras:[s], tips:[] }; }

function jxBuildPool(){
  var pool = [];
  if(S.jx.mode === 'all'){
    TOPICS.news.forEach(function(x, i){ pool.push(normNews(x, i)); });
    TOPICS.other.forEach(function(x, i){ pool.push(normOther(x, i)); });
  }else if(S.jx.mode === 'news'){
    TOPICS.news.forEach(function(x, i){ pool.push(normNews(x, i)); });
  }else{
    TOPICS.other.forEach(function(x, i){ pool.push(normOther(x, i)); });
  }
  S.jx.pool = pool;
  S.jx.drawn = 0;
}

  h += '<div class="sec-title" style="margin-top:14px">本次进度</div>';

function jxResetCards(){
  var c = $('jxCards'); if(!c) return;
  var cat = S.jx.mode === 'news' ? '新 闻' : (S.jx.mode === 'other' ? '其 他' : '题 库');

      + '</div></div>';
  }

function calcFontSize(totalLen){
  if(totalLen<=60)  return 20;
  if(totalLen<=110) return 18;
  if(totalLen<=180) return 16;
  if(totalLen<=280) return 14;
  if(totalLen<=420) return 12.5;
  return 11.5;
}
function jxBackHTML(item){
  var totalLen = item.title.length + item.paras.join('').length;
  var fs = calcFontSize(totalLen);
  var h = '<div class="qhead">';
  h += '<span class="tag '+(item.cat==='other'?'other':'')+'">'+(item.cat==='news'?'新闻类':'其他类')+'</span>';
  if(item.title) h += '<span class="qtitle">'+esc(item.title)+'</span>';
  h += '</div><div class="qscroll" style="font-size:'+fs+'px">';
  item.paras.forEach(function(p){ h += '<p>'+esc(p)+'</p>'; });
  if(item.tips && item.tips.length){
    h += '<div class="tips"><div class="tips-toggle">▸ 分析参考（点击展开）</div><div class="tips-body">';
    item.tips.forEach(function(t){ h += '<p>'+esc(t)+'</p>'; });
    h += '</div></div>';
  }
  h += '</div><div class="zoombtn">⛶ 放大阅读</div>';
  return h;
}

function jxDraw(){
  if(S.jx.animating) return;
  var c = $('jxCards');
  if(!S.jx.pool.length){
    c.innerHTML = '<div style="text-align:center;color:#9aa0c4;padding:50px 0;width:100%;">'
      + '<div style="font-size:42px;margin-bottom:12px;">🎯</div>'
      + '<div style="font-size:17px;letter-spacing:2px;">当前题库已全部抽完</div>'
      + '<div style="font-size:12.5px;color:#6b7199;margin-top:8px;">点「重置题库」重新开始</div></div>';
    return;
  }
  seedRand(newSeed());
  var n = Math.min(3, S.jx.pool.length);
  shuffle(S.jx.pool);
  var picked = S.jx.pool.splice(0, n);
  S.jx.drawn += n;
  S.jx.last = picked;
  $('jxDraw').textContent = '🎲 再抽一次';
  jxRenderCards(picked, true);
}

/* 把题目渲染成卡片：本机抽题与学生端跟随共用。
   fresh 为 false 时不写入抽取记录（跟随来的题不算自己抽的）。 */
function jxRenderCards(picked, fresh){
  var c = $('jxCards');
  c.innerHTML = '';
  picked.forEach(function(item, i){
    var card = document.createElement('div');
    card.className = 'card anim';
    card.innerHTML = '<div class="face front">'
      + '<span class="num">第 '+(i+1)+' 题</span>'
      + '<span class="cat '+(item.cat==='news'?'news':'')+'">'+(item.cat==='news'?'新 闻':'其 他')+'</span>'
      + '<div class="big">?</div><div class="hint">点 击 翻 牌</div>'
      + '<div class="tap">▽ 轻触卡片查看题目 ▽</div>'
      + '</div><div class="face back">'+jxBackHTML(item)+'</div>';
    card.addEventListener('click', function(e){
      var tg = e.target.closest('.tips-toggle');
      if(tg){
        e.stopPropagation();
        tg.nextElementSibling.classList.toggle('open');
        tg.textContent = tg.nextElementSibling.classList.contains('open') ? '▾ 分析参考（点击收起）' : '▸ 分析参考（点击展开）';
        return;
      }
      var zb = e.target.closest('.zoombtn');
      if(zb){ e.stopPropagation(); openJxOverlay(item); return; }
      if(card.classList.contains('flipped')) return;
      card.classList.add('flipped');
    });
    c.appendChild(card);
    if(fresh){
      S.jx.history.unshift({
        cat: item.cat,
        label: item.title || (item.paras[0] || '').slice(0, 22),
        data: item
      });
    }
  });
  if(S.jx.history.length > 200) S.jx.history.length = 200;
  S.jx.animating = true;
  setTimeout(function(){ S.jx.animating = false; }, 900);
  jxUpdateCount();
}

/* seed 传值时按该种子复现（学生端跟随用），不传则现取一颗新种子 */
function buildPaper(force, seed){
  var cfg = S.paper.cfg;
  var newsPool = S.news.items.filter(function(x){ return x.paras && x.paras.length; });
  if(cfg.news > 0 && !newsPool.length){
    toast('新闻稿件为空，请先到「新闻联播」模块同步或手动导入');
    if(force){ renderPaper(true); }
    return;
  }
  S.paper.seed = (seed == null ? newSeed() : ((seed >>> 0) & 0xffff));
  seedRand(S.paper.seed);
  var items = { lang: [], news: [], jx: [] };
  var i, k;
  for(i=0;i<cfg.lang;i++) items.lang.push(pickOne(LANGS));
  for(i=0;i<cfg.news;i++) items.news.push(pickOne(newsPool));
  for(i=0;i<cfg.jxNews;i++){
    k = Math.floor(rnd() * TOPICS.news.length);
    items.jx.push({ cat:'news', idx:k, d: TOPICS.news[k] });
  }
  for(i=0;i<cfg.jxOther;i++){
    k = Math.floor(rnd() * TOPICS.other.length);
    items.jx.push({ cat:'other', idx:k, d: TOPICS.other[k] });
  }
  S.paper.items = items;
  S.paper.built = true;
  renderPaper(false);
  renderTopbar();
  toast('试卷已生成：点着就能改，选中文字按删除键删字，按 Ctrl+Z 可撤销');
}

function renderPaperView(){
  var v = $('view');
  if(!S.paper.built){
    v.innerHTML = '<div class="r-empty"><div class="big">📝</div><div class="t1">还没有生成试卷</div>'
      + '<div class="t2">在左侧设置各部分题量，然后点「生成试卷」。<br>生成后整张卷子可以直接点着改，改完点顶部「另存为 PDF」打印。</div></div>';
    return;
  }
  renderPaper(false);
}

function renderPaper(emptyNotice){
  var v = $('view');
  var it = S.paper.items;
  if(!it){ renderPaperView(); return; }
  var h = '<div class="pad"><div class="paper-wrap">';
  h += '<div class="paper-hint no-print">整卷可以直接点着改：点进文字按退格删字，'

/* ===================================================================
   课堂分享
   老师把当前画面压成「课堂码」（7 位，只装题库内内容）或「链接」（含新闻正文时用），
   学生打开链接 / 输入码，本地用同一份题库与同一颗种子还原出完全相同的画面。
   全程不需要服务器，静态托管即可。
   =================================================================== */
var ROLE_KEY = 'yk.role.v1';
var ROLE = loadLS(ROLE_KEY, '');
var FOLLOW = false;                /* 学生是否正跟随老师分享的内容 */
var SHARE_BASE = location.href.split('?')[0].split('#')[0];

/* Crockford Base32：去掉了容易看错的 I L O U */
var B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function b32enc(n, len){
  var s = '';
  for(var i=0;i<len;i++){ s = B32.charAt(n % 32) + s; n = Math.floor(n / 32); }
  return s;
}
function b32dec(str){
  var n = 0;
  str = String(str || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
  if(!str.length) return -1;
  for(var i=0;i<str.length;i++){
    var ch = str.charAt(i);
    if(ch === 'I' || ch === 'L') ch = '1';
    else if(ch === 'O') ch = '0';
    var v = B32.indexOf(ch);
    if(v < 0) return -1;
    n = n * 32 + v;
  }
  return n;
}

/* 字号 13 至 48 压成 6 位 */
function fsCode(fs){ return Math.max(0, Math.min(63, Math.round(fs) - 13)); }
function codeFs(c){ return (c || 0) + 13; }
/* 试卷题量（每项 0 至 5）压成一个整数 */
function cfgCode(c){ return ((c.lang*6 + c.news)*6 + c.jxNews)*6 + c.jxOther; }
function codeCfg(n){
  var c = {};
  c.jxOther = n % 6; n = Math.floor(n/6);
  c.jxNews  = n % 6; n = Math.floor(n/6);
  c.news    = n % 6; n = Math.floor(n/6);
  c.lang    = n % 6;
  return c;
}
/* 即兴题目：固定 3 个槽，每槽 1 位分类 + 9 位下标，空槽记 1023 */
function jxCode(list){
  var n = 0;
  for(var i=0;i<3;i++){
    var x = (list || [])[i];
    var v = 1023;
    if(x) v = (x.cat === 'news' ? 512 : 0) + ((x.idx || 0) % 512);
    n = n * 1024 + v;
  }
  return n;
}
function codeJx(n){
  var out = [], i;
  for(i=0;i<3;i++){ out.unshift(n % 1024); n = Math.floor(n/1024); }
  return out.filter(function(v){ return v !== 1023; }).map(function(v){
    return { cat: (v >= 512 ? 'news' : 'other'), idx: v % 512 };
  });
}

/* 当前画面 -> 分享状态。含新闻正文时只能走链接，因为学生的机器里不一定有这条新闻 */
function shareState(){
  var st = { v:1, m:S.mod, fs:curFs(), zy: zyOn(curKey) ? 1 : 0 };
  if(S.mod === 'lang' && S.lang.cur != null){
    st.langId = S.lang.cur;
  }else if(S.mod === 'jx'){
    st.jx = (S.jx.last || []).map(function(x){ return { cat:x.cat, idx:x.idx }; });
  }else if(S.mod === 'news' && S.news.cur){
    st.news = { date:S.news.cur.date, kind:S.news.cur.kind, title:S.news.cur.title,
                paras:S.news.cur.paras, subs:S.news.cur.subs, url:S.news.cur.url };
  }else if(S.mod === 'paper' && S.paper.built && S.paper.items){
    var it = S.paper.items;
    st.paper = {
      cfg: S.paper.cfg, seed: S.paper.seed,
      langIds: it.lang.map(function(x){ return x.id; }),
      news: it.news.map(function(x){
        return { date:x.date, kind:x.kind, title:x.title, paras:x.paras, subs:x.subs, url:x.url };
      }),
      jx: it.jx.map(function(x){ return { cat:x.cat, idx:x.idx }; })
    };
  }
  return st;
}
/* 当前有没有可分享的内容 */
function canShare(){
  if(ROLE === 'student') return { ok:false, msg:'学生模式下不提供分享，切到老师模式即可' };
  var st = shareState();
  if(st.m === 'lang') return st.langId != null ? { ok:true } : { ok:false, msg:'请先打开一篇朗诵稿件' };
  if(st.m === 'jx')   return (st.jx && st.jx.length) ? { ok:true } : { ok:false, msg:'请先抽一次题' };
  if(st.m === 'news') return st.news ? { ok:true } : { ok:false, msg:'请先打开一条新闻' };
  if(st.m === 'paper') return (S.paper.built && st.paper) ? { ok:true } : { ok:false, msg:'请先生成一张试卷' };
  return { ok:false, msg:'' };
}
/* 内容里没有新闻正文时，七位课堂码就够 */
function shareShort(st){
  if(st.m === 'lang') return st.langId != null;
  if(st.m === 'jx') return !!(st.jx && st.jx.length);
  if(st.m === 'paper') return !!(st.paper && !st.paper.news.length);
  return false;
}
function packCode(st){
  var mIdx = (st.m === 'lang' ? 0 : (st.m === 'jx' ? 1 : 2));
  var payload;
  if(st.m === 'lang')       payload = st.langId * 64 + fsCode(st.fs);
  else if(st.m === 'jx')    payload = jxCode(st.jx);
  else                      payload = st.paper.seed * 2048 + cfgCode(st.paper.cfg);
  return b32enc((4 + mIdx) * 1073741824 + payload, 7);   /* 版本 1 占 3 位 + 模块 2 位 + 载荷 30 位 */
}
function unpackCode(code){
  var n = b32dec(code);
  if(n < 0 || n < 4294967296) return null;               /* 至少要有版本与模块那几位 */
  var head = Math.floor(n / 1073741824);
  var payload = n % 1073741824;
  if(Math.floor(head / 4) !== 1) return null;
  var m = ['lang','jx','paper'][head % 4];
  if(m === 'lang')  return { v:1, m:'lang',  langId: Math.floor(payload / 64), fs: codeFs(payload % 64) };
  if(m === 'jx')    return { v:1, m:'jx',    jx: codeJx(payload) };
  return { v:1, m:'paper', paper: { cfg: codeCfg(payload % 2048), seed: Math.floor(payload / 2048) } };
}
/* lz-string 的输出用了 A 至 Z、a 至 z、0 至 9、加号、减号；
   加号在查询串里可能被当成空格，统一换成点号（点号不会与原有字符冲突）。 */
function lzSafe(s){ return String(s).replace(/\+/g, '.'); }
function lzUnsafe(s){ return String(s).replace(/\./g, '+').replace(/ /g, '+'); }

function buildShare(){
  var st = shareState();
  var short = shareShort(st);
  var url, code = '';
  if(short){
    code = packCode(st);
    url = SHARE_BASE + '?c=' + code;
  }else{
    url = SHARE_BASE + '?d=' + lzSafe(LZString.compressToEncodedURIComponent(JSON.stringify(st)));
  }
  return { st: st, code: code, url: url, long: !short };
}

/* 学生端：把分享内容还原成本地画面 */
function applyShare(st){
  if(!st || !st.m) return false;
  FOLLOW = true;
  if(st.fs){
    if(st.m === 'news') S.news.fs = Math.max(13, Math.min(48, st.fs));
    else S.lang.fs = Math.max(13, Math.min(48, st.fs));
  }
  var openZy = function(){
    if(!st.zy || !curKey) return;
    var z = zyOf(curKey);
    if(z){ ensurePY(); z.all = true; repaint(); }
  };
  if(st.m === 'lang' && st.langId != null){
    if(!langItem(st.langId)) return false;
    S.lang.cur = st.langId;
    switchMod('lang');
    openLangSilent(st.langId);
    openZy();
  }else if(st.m === 'news' && st.news){
    mergeNews([{ date:st.news.date, kind:st.news.kind, title:st.news.title,
                 paras:st.news.paras || [], subs:st.news.subs || [],
                 url:st.news.url || ('share-' + st.news.date + '-' + st.news.title) }]);
    saveNewsCache();
    switchMod('news');
    var hit = S.news.items.find(function(x){
      return x.date === st.news.date && x.title === st.news.title && (x.paras || []).length;
    });
    if(!hit) return false;
    openNews(hit);
    openZy();
  }else if(st.m === 'jx' && st.jx){
    switchMod('jx');
    var picked = [];
    st.jx.forEach(function(x){
      var d = (x.cat === 'news' ? TOPICS.news : TOPICS.other)[x.idx];
      if(d) picked.push(x.cat === 'news' ? normNews(d, x.idx) : normOther(d, x.idx));
    });
    if(!picked.length) return false;
    S.jx.last = picked;
    jxRenderCards(picked, false);
  }else if(st.m === 'paper' && st.paper){
    S.paper.cfg = st.paper.cfg || S.paper.cfg;
    if(st.paper.news && st.paper.news.length){
      mergeNews(st.paper.news.map(function(x){
        return { date:x.date, kind:x.kind, title:x.title, paras:x.paras || [],
                 subs:x.subs || [], url:x.url || ('share-' + x.date + '-' + x.title) };
      }));
      saveNewsCache();
    }
    if(st.paper.langIds && st.paper.langIds.length){
      var items = { lang:[], news:[], jx:[] };
      st.paper.langIds.forEach(function(id){ var it = langItem(id); if(it) items.lang.push(it); });
      (st.paper.news || []).forEach(function(x){
        var got = S.news.items.find(function(y){
          return y.date === x.date && y.title === x.title && (y.paras || []).length;
        });
        if(got) items.news.push(got);
      });
      (st.paper.jx || []).forEach(function(x){
        var d = (x.cat === 'news' ? TOPICS.news : TOPICS.other)[x.idx];
        if(d) items.jx.push({ cat:x.cat, idx:x.idx, d:d });
      });
      S.paper.seed = st.paper.seed || 0;
      S.paper.items = items;
      S.paper.built = true;
      switchMod('paper');
      renderPaper(false);
    }else{
      switchMod('paper');
      buildPaper(false, st.paper.seed);
    }
  }else{
    FOLLOW = false;
    return false;
  }
  renderTopbar();
  return true;
}

/* 分享面板 */
function qrSvg(text){
  try{
    var qr = qrcode(0, 'L');
    qr.addData(text);
    qr.make();
    return qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
  }catch(e){
    return '';
  }
}
function openShare(){
  var cs = canShare();
  if(!cs.ok){
    openDlg('分享到课堂', '<div class="hint">' + (cs.msg || '当前没有可分享的内容') + '。</div>');
    return;
  }
  var sh = buildShare();
  var h = '';
  if(sh.long){
    h += '<div class="share-note">这一份包含新闻正文，新闻不在学生的本地题库里，'
       + '所以只能扫码或点链接打开，不能手输课堂码。</div>';
  }else{
    h += '<div class="share-code-label">课堂码（让学生打开网站后输入）</div>';
    h += '<div class="share-code">' + sh.code + '</div>';
  }
  h += '<div class="share-qr" id="shareQr"></div>';
  h += '<div class="share-url-row"><input id="shareUrl" readonly value="' + esc(sh.url) + '">'
     + '<button class="tb gold" id="shareCopy">复制链接</button></div>';
  h += '<div class="hint">这个链接指向你现在正在展示的内容。学生打开就是同一篇文稿、同一组题、同一张卷子，'
     + '连字号和注音开关都一样。内容更新后重新分享一次即可。</div>';
  openDlg('分享到课堂', h, '<button class="tb" id="shareClose">关闭</button>');

  var url = sh.url;
  if(url.length > 1800){
    $('shareQr').innerHTML = '<div class="share-warn">内容较长（链接约 ' + url.length
      + ' 字符），二维码可能装不下，建议改用「复制链接」发给学生。</div>';
  }else{
    var svg = qrSvg(url);
    $('shareQr').innerHTML = svg || '<div class="share-warn">内容较长，二维码生成失败，请改用「复制链接」。</div>';
  }
  $('shareClose').addEventListener('click', closeDlg);
  $('shareCopy').addEventListener('click', function(){
    var el = $('shareUrl');
    try{
      el.removeAttribute('readonly'); el.select(); el.setSelectionRange(0, 99999);
      var ok = document.execCommand('copy');
      el.setAttribute('readonly', 'readonly');
      if(ok){ toast('链接已复制'); return; }
    }catch(e){}
    try{ el.select(); }catch(e2){}
    toast('请按 Ctrl+C 复制选中的链接');
  });
}

    + '<span>完整功能：编辑稿件、同步新闻、生成试卷、分享到课堂</span></button>'
    + '<button class="role-btn" data-role="student">我是学生'
    + '<span>只读模式：跟随老师分享的内容，可调字号、注音、做标注</span></button>'
    + '</div>';
  openDlg('你是老师还是学生', h, '<span></span>');
  $$('#dlgBody [data-role]').forEach(function(b){
    b.addEventListener('click', function(){
      ROLE = b.getAttribute('data-role');
      saveLS(ROLE_KEY, ROLE);
      closeDlg();
      renderTopbar();
      renderLangSide();
      toast(ROLE === 'teacher' ? '已进入老师模式' : '已进入学生模式');
    });
  });
}
function switchRole(){
  if(ROLE === 'student'){
    openDlg('切换到老师模式',
      '<div class="hint">老师模式会打开编辑、同步新闻、生成试卷、分享到课堂等全部功能。</div>',
      '<button class="tb" id="rCancel">取消</button><button class="tb gold" id="rOk">切换到老师模式</button>');
    $('rCancel').addEventListener('click', closeDlg);
    $('rOk').addEventListener('click', function(){
      ROLE = 'teacher'; saveLS(ROLE_KEY, ROLE);
      FOLLOW = false; closeDlg();
      renderTopbar(); renderLangSide(); renderNewsSide();
      toast('已进入老师模式');
    });
  }else{
    openDlg('切换到学生模式',
      '<div class="hint">学生模式只保留阅读与练习功能：字号、注音、标注、全屏、聚焦、打印，'
      + '以及输入课堂码跟随老师的内容。</div>',
      '<button class="tb" id="rCancel">取消</button><button class="tb gold" id="rOk">切换到学生模式</button>');
    $('rCancel').addEventListener('click', closeDlg);
    $('rOk').addEventListener('click', function(){
      ROLE = 'student'; saveLS(ROLE_KEY, ROLE); closeDlg();
      renderTopbar(); renderLangSide(); renderNewsSide();
      toast('已进入学生模式');
    });
  }
}

/* ===================================================================
   模块路由
   =================================================================== */
function switchMod(m){
  S.mod = m;
  S.editing = false;
  hideSelbar();
  $$('#modes .mbtn').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-mod') === m);
    b.classList.toggle('purple', b.getAttribute('data-mod') === 'news');
  });
  if(m !== 'lang' && m !== 'news'){ CTX = null; curKey = null; }
  if(m === 'jx'){ CTX = null; curKey = null; }

  /* 注意顺序：先定好 CTX（打开文稿），最后再渲染工具条。
     否则切回本模块时 CTX 还是空的，工具条会停在「未选择文稿」的样子。 */
  if(m === 'lang'){
    renderLangSide();
    if(S.lang.cur != null) openLangSilent(S.lang.cur); else renderReader();
    renderTopbar();
  }
  else if(m === 'news'){
    renderNewsSide();
    if(S.news.cur && S.news.cur.paras && S.news.cur.paras.length) openNews(S.news.cur);
    else if(S.news.items.length) openNews(S.news.items[0]);
    else renderNewsEmpty();
    renderTopbar();
  }
  else if(m === 'jx'){
    if(!S.jx.inited){ S.jx.inited = true; jxBuildPool(); }
    renderJxView();
    renderTopbar();
  }
  else if(m === 'paper'){ renderPaperSide(); renderPaperView(); renderTopbar(); }

  $('sidebar').classList.remove('open');
  $('sideMask').classList.remove('show');
}

function renderNewsEmpty(){
  CTX = null; curKey = null;
  $('view').innerHTML = '<div class="r-empty"><div class="big">📰</div><div class="t1">还没有新闻</div>'
    + '<div class="t2">在左侧点「同步最近5天」，会自动抓取最近 5 个已播出日的《新闻联播》'
    + '「国内联播快讯」与「国际联播快讯」。<br><br>'
    + '每个小段落都会被拆成独立一条新闻：标题就是段首加粗的小标题，点标题看正文。<br>'
    + '库内满 ' + NEWS_CAP + ' 条会自动停止，也可以随时点「停止同步」，已经抓到的照常能用。<br><br>'
    + '自动抓取通过公共通道联网读取央视网，偶发失败时可点「手动导入」粘贴文稿。</div></div>';
}

function openLangSilent(id){
  var raw = langItem(id);
  if(!raw){ renderReader(); return; }
  var d = langData(raw);
  CTX = {
    kind:'lang', title:d.title,
    meta:[d.author||'佚名', d.cat, d.tag].filter(Boolean),
    paras:(d.lines||[]).slice(), subs:[],
    align: layOf('lang-'+id, CEN_CATS.indexOf(d.cat) >= 0 ? 'center' : 'left').align,
    indent: layOf('lang-'+id).indent,
    serif:['唐诗','宋词','古文','古诗·乐府','毛泽东诗词','现代诗','小学必背','初中必背','高中必背'].indexOf(d.cat)>=0,
    key:'lang-'+id, rawId:id
  };
  curKey = CTX.key;
  renderReader();
}

$('modes').addEventListener('click', function(e){
  var b = e.target.closest('.mbtn');
  if(b) switchMod(b.getAttribute('data-mod'));
});
$('sideMask').addEventListener('click', function(){
  $('sidebar').classList.remove('open');
  $('sideMask').classList.remove('show');
});
window.addEventListener('resize', hideSelbar);

/* ===================================================================
   启动
   =================================================================== */
function boot(){
  loadNewsCache();

  var qs = String(location.search || '');
  var mC = /[?&]c=([^&]+)/.exec(qs);
  var mD = /[?&]d=([^&]+)/.exec(qs);
  var applied = false, badMsg = '';

  if(mC){
    var st = unpackCode(decodeURIComponent(mC[1]));
    if(st){
      ROLE = 'student'; saveLS(ROLE_KEY, ROLE);
      applied = applyShare(st);
      if(!applied) badMsg = '这个课堂码指向的内容，本机题库里找不到';
    }else{
      badMsg = '课堂码无效，请让老师重新分享一次';
    }
  }else if(mD){
    try{
      var json = LZString.decompressFromEncodedURIComponent(lzUnsafe(decodeURIComponent(mD[1])));
      var st2 = JSON.parse(json);
      ROLE = 'student'; saveLS(ROLE_KEY, ROLE);
      applied = applyShare(st2);
      if(!applied) badMsg = '分享链接里的内容无法还原';
    }catch(e){
      badMsg = '分享链接已损坏或不完整';
    }
  }

  if(!applied) switchMod('lang');
  if(!ROLE) askRole();
  renderTopbar();

  if(badMsg) setTimeout(function(){ toast(badMsg); }, 700);
}
boot();
})();

</script>
