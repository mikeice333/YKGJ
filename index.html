家之间大规模对抗性的大赛，才可以唤起那种遥远而神圣的情感，那就是：为祖国而战！"], "id": 431}, {"title": "作品12号", "author": "节选自 峻青《海滨仲夏夜》", "tag": "", "cat": "普通话60篇", "lines": ["夕阳落山不久，西方的天空，还燃烧着一片橘红色的晚霞。大海，也被这霞光染成了红色，而且比天空的景色更要壮观。因为它是活动的，每当一排排波浪涌起的时候，那映照在浪峰上的霞光，又红又亮，简直就像一片片霍霍燃烧着的火焰，闪烁着，消失了。而后面的一排，又闪烁着，滚动着，涌了过来。", "天空的霞光渐渐地淡下去了，深红的颜色变成了绯红，绯红又变成浅红。最后，当这一切红光都消失了的时候，那突然显得高而远了的天空，则呈现出一片肃穆的神色。最早出现的启明星，在这蓝色的天幕上闪烁起来了。它是那么大，那么亮，整个广漠的天幕上只有它在那里放射着令人注目的光辉，活像一盏悬挂在高空的明灯。", "夜色加浓，苍空中的“明灯”越来越多了。而城市各处的真的灯火也次第亮了起来，尤其是围绕在海港周围山坡上的那一片灯光，从半空倒映在乌蓝的海面上，随着波浪，晃动着，闪烁着，像一串流动着的珍珠，和那一片片密布在苍穹里的星斗互相辉映，煞是好看。", "在这幽美的夜色中，我踏着软绵绵的沙滩，沿着海边，慢慢地向前走去。海水，轻轻地抚摸着细软的沙滩，发出温柔的刷刷声。晚来的海风，清新而又凉爽。我的心里，有着说不出的兴奋和愉快。", "夜风轻飘飘地吹拂着，空气中飘荡着一种大海和田禾相混合的香味，柔软的沙滩上还残留着白天太阳炙晒的余温。那些在各个工作岗位上劳动了一天的人们，三三两两地来到这软绵绵的沙滩上，他们浴着凉爽的海风，望着那缀满了星星的夜空，尽情地说笑，尽情地休憩。"], "id": 432}, {"title": "作品13号", "author": "节选自童裳亮《海洋与生命》", "tag": "", "cat": "普通话60篇", "lines": ["生命在海洋里诞生绝不是偶然的，海洋的物理和化学性质，使它成为孕育原始生命的摇篮。", "我们知道，水是生物的重要组成部分，许多动物组织的含水量在百分之八十以上，而一些海洋生物的含水量高达百分之九十五。水是新陈代谢的重要媒介，没有它，体内的一系列生理和生物化学反应就无法进行，生命也就停止。因此，在长时期内动物缺水要比缺少食物更加危险。水对今天的生命是如此重要，它对脆弱的原始生命，更是举足轻重了。生命在海洋里诞生，就不会有缺水之忧。", "水是一种良好的溶剂。海洋中含有许多生命所必需的无机盐，如氯化钠、氯化钾、碳酸盐、磷酸盐，还有溶解氧，原始生命可以毫不费力地从中吸取它所需要的元素。", "水具有很高的热容量，加之海洋浩大，任凭烈日曝晒，冬季寒风扫荡，它的温度变化却比较小。因此，巨大的海洋就像是天然的“温箱”。是孕育原始生命的温床。", "阳光虽然为生命所必需，但是阳光中的紫外线却有扼杀原始生命的危险。水能有效地吸引紫外线，因而又为原始生命提供了天然的“屏障”。", "这一切都是原始生命得以产生和发展的必要条件。"], "id": 433}, {"title": "作品14号", "author": "节选自（台湾）林清玄《和时间赛跑》", "tag": "", "cat": "普通话60篇", "lines": ["读小学的时候，我的外祖母去世了。外祖母生前最疼爱我，我无法排除自己的忧伤，每天在学校的操场上一圈儿又一圈儿地跑着，跑得累倒在地上，扑在草坪上痛哭。", "那哀痛的日子，断断续续地持续了很久，爸爸妈妈也不知道如何安慰我。他们知道与其骗我说外祖母睡着了，还不如对我说实话：外祖母永远不会回来了。", "“什么是永远不会回来？”我问着。", "“所有时间里的事物，都永远不会回来了。你的昨天过去，它就永远变成昨天，你不能再回到昨天。爸爸以前也和你一样小，现在也不能回到你这么小的童年了；有一天你会长大，你会像外祖母一样老；有一天你度过了你的时间，就永远不会回来了。”爸爸说。", "爸爸等于给我一个谜语，这谜语比课本上的“日历挂在墙壁，一天撕去一页，使我心里着急”和“一寸光阴一寸金，寸金难买寸光阴”还让我感到可怕；也比作文本上的“光阴似箭，日月如梭”更让我觉得有一种说不出的滋味。", "时间过得那么飞快，使我的小心眼里不只是着急，而是悲伤。有一天我放学回家，看到太阳快落山了，就下决心说：“我要比太阳更快地回家。”我狂奔回去，站在庭院前喘气的时候，看到太阳还露着半边脸，我高兴地跳跃起来，那一天我跑赢了太阳。以后我就时常做那样的游戏，有时和太阳赛跑，有时和西北风比快，有时一个暑假才能做完的作业，我十天就做完了；那时我三年级，常常把哥哥五年级的作业拿来做。每一次比赛胜过时间，我就快乐得不知道怎么形容。", "如果将来我有什么要教给我的孩子，我会告诉他：假期你一起和时间比赛，你就可以成功！"], "id": 434}, {"title": "作品15号", "author": "节选自陈灼主编《实用汉语中级教程》（上）中《胡适的白话电报》", "tag": "", "cat": "普通话60篇", "lines": ["三十年代初，胡适在北京大学任教授。讲课时他常常对白话文大加称赞，引起一些只喜欢文言文而不喜欢白话文的学生的不满。", "一次，胡适正讲得得意的时候，一位姓魏的学生突然站了起来，生气地问：“胡先生，难道说白话文就毫无缺点吗？”胡适微笑着回答说：“没有。”那位学生更加激动了：“肯定有！白话文废话大多，打电报用字多，花钱多。”胡适的目光顿时变亮了。轻声地解释说：“不一定吧！前几天有位朋友给我打来电报，请我去政府部门工作，我决定不去，就回电拒绝了。复电是用白话写的，看来也很省字。请同学们根据我这个意思，用文言文写一个回电，看看空间是白话文省字，还是文言文省字？”胡教授刚说完，同学们立刻认真地写了起来。", "十五分钟过去，胡适让同学举手，报告用字的数目，然后挑了一份用字最少的文言电报稿，电文是这样写的：", "“才疏学浅，恐难胜任，不堪从命。”白话文的意思是：学问不深，恐怕很难担任这个工作，不能服从安排。", "胡适说，这份写得确实不错，仅用了十二个字。但我的白话电报却只用了五个字：", "“干不了，谢谢！”", "胡适又解释说：“干不了”就有才疏学浅、恐难胜任的意思；“谢谢”既对朋友的介绍表示感谢，又有拒绝的意思。所以，废话多不多，并不看它是文言文还是白话文，只要注意选用字词，白话文是可以比文言文更省字的。"], "id": 435}, {"title": "作品16号", "author": "节选自（俄）柯罗连科《火光》，张铁夫译", "tag": "", "cat": "普通话60篇", "lines": ["很久以前，在一个漆黑的秋天的夜晚，我泛舟在西伯利亚一条阴森森的河上。船到一个转弯处，只见前面黑黢黢的山峰下面一星火光蓦地一闪。", "火光又明又亮，好像就在眼前……", "“好啦，谢天谢地！”我高兴地说，“马上就到过夜的地方啦！”", "船夫扭头朝向后的火光望了一眼，又不以为然地划桨来。", "“远着呢！”", "我不相信他的话，因为火光冲破朦胧的夜色，明明就在那儿闪烁。不过船夫是对的，事实上，火光的确还远着呢。", "这些黑夜的火光的特点是：驱散黑暗，闪闪发亮，近在眼前，令人神往。乍一看，再划几下就到了……其实却还远着呢！……", "我们在漆黑如墨的河上又划了很久。一个个峡谷和悬崖，迎面驶来，又向后移去，仿佛消失在茫茫的远方，而火光却依然停在前头，闪闪发亮，令人神往――依然是这么近，又依然是这么远 ……", "现在，无论是这条被悬崖峭壁的阴影笼罩的漆黑的河流，还是那一星明亮的火光，都经常浮现在我的脑际，在这以前和在这以后，曾有许多火光，似乎近在咫尺，不止使我一人心驰神往。可是生活之河却仍然在那阴森森的两岸之间流着，而火光也依旧非常遥远。因此，必须加劲划桨……", "然而，火光啊……毕竟……毕竟就在前头！"], "id": 436}, {"title": "作品17号", "author": "节选自老舍《济南的冬天》", "tag": "", "cat": "普通话60篇", "lines": ["对于一个在北平住惯的人，像我，冬天要是不刮风，便觉得是奇迹；济南的冬天是没有风声的。对于一个刚由伦敦回来的人，像我，冬天要能看得见日光，便觉得是怪事；济南的冬天是响晴的。自然，在热带的地方，日光是永远那么毒，响亮的天气，反有点叫人害怕。可是，在北中国的冬天，而能有温晴的天气，济南真得算个宝地。", "设若单单是有阳光，那有算不了出奇。请闭上眼睛想：一个老城，有山有水，全在天底下晒着阳光，暖和安适地睡着，只等春风来把它们唤醒，这是不是理想的境界？小山整把济南围了个圈儿，只有北边缺着点口儿。这一圈小山在冬天特别可爱，好像是把济南放在一个小摇篮里，它们安静不动地低声说：“你们放心吧，这儿准保暖和。”济南的人们在冬天是面上含笑的。他们一看那些小山，心中便觉得有了着落，有了依靠。他们由天上看到山上，便不知不觉地想起：“明天也许就是春天了吧？这样的温暖，今天夜里山草也许就绿起来了吧？”就是这点幻想不能一时实现，他们也并不着急，因为这样慈善的冬天，干什么还希望别的呢！", "最妙的是下点小雪呀。看吧，山上的矮松越发的青黑，树尖上顶着一髻儿白花，好像日本看护妇。山尖全白了，给蓝天镶上一道银边。山坡上，有的地方雪厚点，有的地方草色还露着；这样，一道儿白，一道儿暗黄，给山们穿上一件带水纹的花衣；看着看着，这件花衣好像被风儿吹动，叫你希望看见一点更美的山的肌肤。等到快日落的时候，微黄的阳光斜射在山腰上，那点薄雪好像忽然害羞，微微露出点粉色。就是下小雪吧，济南是受不住大雪的，那些小山太秀气。"], "id": 437}, {"title": "作品18号", "author": "节选自郑莹《家乡的桥》", "tag": "", "cat": "普通话60篇", "lines": ["纯朴的家乡村边有一条河，曲曲弯弯，河中架一弯石桥，弓样的小桥跨两岸。", "每天，不管是鸡鸣晓月，日丽中天，还是月华泻地，小桥都印下串串足迹，洒落串串汗珠。那是乡亲为了追求多棱的希望，兑现美好的遐想。弯弯小桥，不时荡过轻吟低唱，不时露出舒心的笑容。", "因而，我稚小的心灵，曾将心声献给小桥：你是一弯银色的新月，给人间普照光辉；你是一把闪亮的镰刀，割刈着欢笑的花果；你是一根晃悠悠的扁担，挑起了彩色的明天！哦，小桥走进我的梦中。", "我在飘泊他乡的梦，心中总涌动着故乡的河水，梦中总看到弓样的小桥。当我访南疆探北国，眼帘闯进座座雄伟的长桥时，我的梦变得丰满了，增添了赤橙黄绿青蓝紫。", "三十多年过去，我带着满头霜花回到故乡，第一紧要的便是去看望小桥。", "啊！小桥呢？小桥躲起来？河中一道长虹，浴着朝霞熠熠闪光。哦，雄浑的大桥敞开胸怀，汽车的呼啸、摩托的笛音、自行车的叮铃，合奏着进行交响乐；南来的钢筋、花布，北往的柑橙、家禽，绘出交流欢跃图……", "啊！蜕变的桥，传递了家乡进步的消息，透露了家乡富裕的声音。时代的春风，美好的追求，我蓦地记起儿时唱给小桥的歌，哦，明艳艳的太阳照耀了，芳香甜蜜的花果捧来了，五彩斑斓的岁月拉开了！", "我心中涌动的河水，激荡起甜美的浪花。我仰望一碧蓝天，心底轻声呼喊：家乡的桥啊，我梦中的桥！"], "id": 438}, {"title": "作品19号", "author": "节选自游宇明《坚守你的高贵》", "tag": "", "cat": "普通话60篇", "lines": ["多年前，建筑设计师莱伊恩受命设计了英国温泽市政府大厅。他运用工程力学的知识，依据自己多年的实践，巧妙地设计了只用一根柱子支撑的大厅天花板。一年以后，市政府权威人士进行工程验收时，却说只用一根柱子支撑天花板太危险，要求莱伊恩再多加几根柱子。", "莱伊恩自信只要一根紧固的柱子足以保证大厅安全，他的“固执”惹恼了市政官员，险些被送上法庭。他非常苦恼，坚持自己原先的主张吧，市政官员肯定会另找人修改设计；不坚持吧，又有悖自己为人的准则，矛盾了很长一段时间，莱伊恩终于想出了一条妙计，他在大厅里增加了四根柱子，不过这些柱子并未与天花板接触，只不过是装装样子。", "三百年过去了，这个秘密始终没有被人发现。直到前两年，市政府准备修缮大厅的天花板，才发现莱伊恩看看的“弄虚作假”。消息传出后，世界各国的建筑专家和游客云集，当地政府对此也不加掩饰，在新世纪到来之际，特意将大厅作为一个旅游景点对外开放，旨在引导人们崇尚和相信科学。", "作为一名建筑师，莱伊恩并不是最出色的。但作为一个人，他无疑非常伟大，这种伟大表现在他始终恪守着自己的原则，给高贵的心灵一个美丽的住所：哪怕是到最大的阻力，也要想办法抵达胜利。"], "id": 439}, {"title": "作品20号", "author": "节选自陶猛译《金子》", "tag": "", "cat": "普通话60篇", "lines": ["自从传言有人在萨文河畔散步时无意发现了金子后，这里便常有来自四面八方的掏金者。他们都想成为富翁，于是寻遍了整个河床，还在河床上挖出很多大坑，希望借助它们找到更多的金子。的确，有一些人找到了，但另外一些人因为一无所得而只好扫兴归去。", "也有不甘心落后的，便驻扎在这里，继续寻找。彼得·弗雷特就是其中一员。他在河床附近买了一块没人要的土地，一个人默默地工作。他为了找金子，已把所有的钱都押在这块土地上。他埋头苦干了几个月，直到土地全变成了坑坑洼洼，他失望了——他翻遍了整块土地，但连一丁点儿金子都没看见。", "六个月后，他连买面包的钱都没有了。于是他准备离开这儿到别处去谋生。", "就在他即将离去的前一个晚上，天下起了倾盆大雨，并且一下就是三天三夜。雨终于停了，彼得走出小木屋，发现眼前的土地看上去好像和以前不一样：坑坑洼洼已被大水冲刷平整，松软的土地上长出一层绿茸茸的小草。", "“这里没找到金子，”彼得忽有所悟地说，“但这土地很肥沃，我可以用来种花，并且拿到镇上去卖给那些富人，他们一定会买些花装扮他们华丽的客//厅。如果真是这样的话，那么我一定会赚许多钱。有朝一日我也会成为富人……”", "于是他留了下来。彼得花了不少精力培育花苗，不久田地里长满了美丽鲜艳的各色鲜花。", "五年以后，彼得终于实现了他的梦想——成了一个富翁。“我是唯一一个找到真金的人！”他时常不无骄傲地告诉别人，“别人在这儿找不到金子后便远远地离开，而我的‘金子’是在这块土地里，只有诚实的人用勤劳才能采集到。”"], "id": 440}, {"title": "作品21号", "author": "节选自青白《捐诚》", "tag": "", "cat": "普通话60篇", "lines": ["我在加拿大学习期间遇到过两次募捐，那情景至今使我难以忘怀。", "一天，我在渥太华的街上被两个男孩子拦住去路，他们十来岁，穿得整整齐齐，每人头上戴着个做工精巧、色彩鲜艳的纸帽，上面写着“为帮助患小儿麻痹的伙伴募捐”。其中的一个，不由分说就坐在小凳上给我擦起皮鞋来，另一个则彬彬有礼地发问：“小姐，您是哪国人？喜欢渥太华吗？”“小姐，在你们国家有没有小孩儿患小儿麻痹？谁给他们医疗费？”一连串的问题，使我这个有生以来头一次在众目睽睽之下让别人擦鞋的异乡人，从近乎狼狈的窘态中解脱出来。我们像朋友一样聊起天来……", "几个月之后，也是在街上。一些十字路口处或车站坐着几位老人。他们满头银发，身穿各种老式军装，上面布满了大大小小形形色色的徽章、奖章，每人手捧一大束鲜花。有水仙、石竹、玫瑰及叫不出名字的，一色雪白。匆匆过往的行人纷纷止步，把钱投进这些老人身旁的白色木箱内，然后向他们微微鞠躬，从他们手中接过一朵花。我看了一会儿，有人投一两元，有人投几百元，还有人掏出支票填好后投进木箱。那些老军人毫不注意人们捐多少钱，一直不//停地向人们低声道谢。同行的朋友告诉我，这是为纪念二次大战中参战的勇士，募捐救济残废军人和烈士遗孀，每年一次；认捐的人可谓踊跃，而且秩序井然，气氛庄严。有些地方，人们还耐心地排着队。我想，这是因为他们都知道：正是这些老人们的流血牺牲换来了包括他们信仰自由在内的许许多多。", "我两次把那微不足道的一点钱捧给他们，只想对他们说声“谢谢”。"], "id": 441}, {"title": "作品22号", "author": "节选自王文杰《可爱的小鸟》", "tag": "", "cat": "普通话60篇", "lines": ["没有一片绿叶，没有一缕炊烟，没有一粒泥土，没有一丝花香，只有水的世界，云的海洋。", "一阵台风袭过，一只孤单的小鸟无家可归，落到被卷到洋里的木板上，乘流而下，姗姗而来，近了，近了！……", "忽然，小鸟张开翅膀，在人们头顶盘旋了几圈，“噗啦” 一声落到了船上。许是累了？还是发现了“新大陆”？水手撵它它不走，抓它，它乖乖地落在掌心。可爱的小鸟和善良的水手结成了朋友。", "瞧，它多美丽，娇巧的小嘴，啄理着绿色的羽毛，鸭子样的扁脚，呈现出春草的鹅黄。水手们把它带到舱里，给它“搭铺”，让它在船上安家落户，每天，把分到的一塑料桶淡水匀给它喝，把从祖国带来的鲜美的鱼肉分给它吃，天长日久，小鸟和水手的感情日趋笃厚。清晨，当第一束阳光射进舷窗时，它便敞开美丽的歌喉，唱啊唱，嘤嘤有韵，婉如春水淙淙。人类给它以生命，它毫不悭吝地把自己的艺术青春奉献给了哺育它的人。可能都是这样？艺术家们的青春只会献给尊敬他们的人。", "小鸟给远航生活蒙上了一层浪漫色调，返航时，人们爱不释手，恋恋不舍地想把它带到异乡。可小鸟憔悴了，给水，不喝！喂肉，不吃！油亮的羽毛失去了光泽。是啊，我们有自己的祖国，小鸟也有它的归宿，人和动物都是一样啊，哪儿也不如故乡好！", "慈爱的水手们决定放开它，让它回到大海的摇篮去，回到蓝色的故乡去。离别前，这个大自然的朋友与水手们留影纪念。它站在许多人的头上，肩上，掌上，胳膊上，与喂养过它的人们，一起融进那蓝色的画面……"], "id": 442}, {"title": "作品23号", "author": "节选自（台湾）刘墉《课不能停》", "tag": "", "cat": "普通话60篇", "lines": ["纽约的冬天常有大风雪，扑面的雪花不但令人难以睁开眼睛，甚至呼吸都会吸入冰冷的雪花。有时前一天晚上还是一片晴朗，第十天拉开窗帘，却已经积雪盈尺，连门都推不开了。", "遇到这样的情况，公司、商店常会停止上班，学校也通过广播，宣布停课。但令人不解的是，惟有公立小学，仍然开放。只见黄色的校车，艰难地在路边接孩子，老师则一大早就口中喷着热气，铲去车子前后的积雪，小心翼翼地开车去学校。", "据统计，十年来纽约的公立小学只因为超级暴风雪停过七次课。这是多么令人惊讶的事。犯得着在大人都无须上班的时候让孩子去学校吗？小学的老师也太倒霉了吧？", "于是，每逢大雪而小学不停课时，都有家长打电话去骂。妙的是，每个打电话的人，反应全一样――先是怒气冲冲地骂，然后满口道歉，最后笑容满面地挂上电话。原因是，学校告诉家长：", "在纽约有许多百万富翁，但也有不少贫困的家庭。后者白天开不起暖气，供不起午餐，孩子的营养全靠学校里免费的中饭，甚至可以多拿些回家当晚餐。学校停课一天，穷孩子就受一天冻，挨一天饿，所以老师们宁愿自己苦一点儿，也不能停课。", "或许有家长会说：何不让富裕的孩子在家里，让贫穷的孩子去学校享受暖气和营养午餐呢？", "学校的答复是：我们不愿让那些穷苦的孩子感到他们是在所接受救济，因为施舍的最高原则是保持受施者的尊严。"], "id": 443}, {"title": "作品24号", "author": "节选自严文井《莲花和樱花》", "tag": "", "cat": "普通话60篇", "lines": ["十年，在历史上不过是一瞬间。只要稍加注意，人们就会发现：在这一瞬间里，各种事物都悄悄经历了自己的千变万化。", "这次重新访日，我处处感到亲切和熟悉，也在许多方面发觉了日本的变化。就拿奈良的一个角落来说吧，我重游了为之感受很深的唐招提寺，在寺内各处匆匆走了一遍，庭院依旧，但意想不到还看到了一些新的东西。其中之一，就是近几年从中国移植来的“友谊之莲”。", "在存放鉴真遗像的那个院子里，几株中国莲昂然挺立，翠绿的宽大荷叶正迎风而舞，显得十分愉快。开花的季节已过，荷花朵朵已变为莲蓬累累。莲子的颜色正在由青转紫，看来已经成熟了。", "我禁不住想：“因”已转化为“果”。", "中国的莲花开在日本，日本的樱花开在中国，这不是偶然。我希望这样一种盛况延续不衰。可能有人不欣赏花，但决不会有人欣赏落在自己面前的炮弹。", "在这些日子里，我看到了不少多年不见的老朋友，又结识了一些新朋友。大家喜欢涉及的话题之一，就是古长安和古奈良。那还用得着问吗，朋友们缅怀过去，正是未来。瞩目于未来的人们必将获得未来。", "我不例外，也希望一个美好的未来。", "为了中日人民之间的友谊，我将不浪费今后生命的每一瞬间。"], "id": 444}, {"title": "作品25号", "author": "节选自朱自清《绿》", "tag": "", "cat": "普通话60篇", "lines": ["梅雨潭闪闪的绿色招引着我们；我们开始追捉她那离合的神光了。揪着草，攀着乱石，小心控身下去，又鞠躬过地一个石穹门，便到了汪汪一碧的潭边了。", "瀑布在襟袖之间；但我的心中已没有瀑布了。我的心随潭水的绿而摇荡。那醉人的绿呀！仿佛一张极大极大的荷叶铺着，满是奇异的绿呀。我想张开两臂抱住她；但这是怎样一个妄想呀。", "站在水边，望到那面，居然觉着有些远呀！这平铺着，厚积着的绿，着实可爱。她松松的皱缬着，像少妇拖着的裙幅；她轻轻的摆弄着，像跳动的初恋的处女的心；她滑滑的明亮着，像涂了\"明油\"一般，有鸡蛋清那样软，那样嫩，令人想着所曾触过的最嫩的皮肤；她又不杂些儿尘滓，宛然一块温润的碧玉，只清清的一色—－但你却看不透她！", "我曾见过北京什刹海地的绿杨，脱不了鹅黄的底子，似乎太淡了。我又曾见过杭州虎跑寺近旁高峻而深密的\"绿壁\"，丛叠着无穷的碧草与绿叶的，那又似乎太浓了。其余呢，西湖的波太明了，秦淮河的也太暗了。可爱的，我将什么来比拟你呢？我怎么比拟得出呢？大约潭是很深的，故能蕴蓄着这样奇异的绿；仿佛蔚蓝的天融了一块在里面似的，这才这般的鲜润呀。", "那醉人的绿呀！我若能裁你以为带，我将赠给那轻盈的舞女；她必能临风飘举了。我若能挹你以为眼，我将赠给你那善歌的盲妹；她必能明眸善睐了。我舍不得你；我怎舍得你呢？我用手拍着你，抚摩着你，如同一个十二三岁的小姑娘。我又掬你入口，便是吻着她了。我送你一个名字，我从此叫你\"女儿绿\"，好么？", "我第二次到仙岩的时候，我不禁惊诧于梅雨潭的绿了。"], "id": 445}, {"title": "作品26号", "author": "节选自许地山《落花生》", "tag": "", "cat": "普通话60篇", "lines": ["我们家的后园有半亩空地，母亲说：“让它荒着怪可惜的，你们那么爱吃花生，就开辟出来种花生吧。”我们姐弟几个都很高兴，买种，翻地，播种，浇水，没过几个月，居然收获了。", "母亲说：“今晚我们过一个收获节，请你们父亲也来尝尝我们的新花生，好不好？”我们都说好。母亲把花生做成了好几样食品，还吩咐就在后园的茅亭里过这个节。", "晚上天色不太好，可是父亲也来了，实在很难得。", "父亲说：“你们爱吃花生么？”", "我们争着答应：“爱！”", "“谁能把花生的好处说出来？”", "姐姐说：“花生的味美。”", "哥哥说：“花生可以榨油。”", "我说：“花的价钱便宜，谁都可以买来吃，都喜欢吃。这就是它的好处。”", "父亲说：“花生的好处很多，有一样最可贵，它的果实埋在地里，不像桃子、石榴、苹果那样，把鲜红嫩绿的果实高高地挂在枝头上，使人一见就生爱慕之心。你们看它矮矮地长在地上，等到成熟了，也不能立刻分辨出来它有没有果实，必须挖出来才知道。”", "我们都说是，母亲也点点头。", "父亲接下去说：“所以你们要像花生，它虽然不好看，可是很有用，不是外表好看而没有实用东西。”", "我说：“那么，人要做有用的人，不要做只讲体面，而对别人没有好处的人了。”", "父亲说：“对。这是我对你们的希望。”", "我们谈到夜深才散。花生做的食品都吃完了，父亲的话却深深地印在我的心上。"], "id": 446}, {"title": "作品27号", "author": "节选自（俄）屠格涅夫《麻雀》，巴金译", "tag": "", "cat": "普通话60篇", "lines": ["我打猎回来，沿着花园的林阴路走着，狗跑在我的前面。", "忽然，狗放慢脚步，蹑足潜行，好像嗅到了前边有什么野物。", "我顺着林阴路望去，见有一只嘴边还带着黄色，头生柔毛的小麻雀。风猛烈地吹打着林阴路上的白桦树，麻雀从巢里跌落下来，呆呆地伏在地上，孤立无援地张开两只羽毛还未丰满的小翅膀。", "我的狗慢慢向它靠近，忽然，从附近的树上飞下一只黑胸脯的老麻雀，像一颗石子似的落到狗的跟前。老麻雀全身倒竖着羽毛，惊慌万状，发出绝望、凄惨的叫声，接着向露出牙齿、大张着的狗嘴扑去。", "老麻雀是猛扑下来救护幼雀的。它用身体掩护着自己的幼儿......但它整个小小的身体因恐怖而战栗着！它小小的声音也变得粗暴嘶哑。它在牺牲自己！", "在它看来，这狗是多么庞大的怪物啊！然而它还是不能站在自己高高的安全的树枝上......一种比它的理智更强烈的力量，使它从那儿扑下身来。", "我的狗站住了，向后退了退......看来，它也感到这种力量。", "我赶紧唤住惊惶失措的狗，然后我怀着崇敬的心情，走开了。", "是啊，请不要见笑。我崇敬那只小小的、英勇的鸟儿，我崇敬它那种爱的力量和勇气。", "爱，我想，比死和死的恐惧更强大，只有依靠它，依靠这种爱，生命才能维持下去，发展下去。"], "id": 447}, {"title": "作品28号", "author": "节选自唐若水译《迷途笛音》", "tag": "", "cat": "普通话60篇", "lines": ["那年我6岁。离我家仅一箭之遥的小山坡旁，有一个早被废弃的采石场，双亲从来不准我去那儿，其实那儿风景十分迷人。", "一个夏季的下午，我随着一群小伙伴偷偷上那儿去了。就在我们穿越了一条孤寂的小路后，他们却把我一个人留在原地，然后奔向“更危险的地带”了。", "等他们走后，我惊慌失措地发现，再也找不到要回家的那条孤寂的小道了。像只无头的苍蝇，我到处乱钻，衣裤上挂满了芒刺。太阳已落山，而此时此刻，家里一定开始吃晚餐了，双亲正盼着我回家…… 想着想着，我不由得背靠着一棵树，伤心地呜呜大哭起来……", "突然，不远处传来了声声柳笛。我像找到了救星，急忙循声走去。一条小道边的树桩上坐着一位吹笛人，手里还正削着什么。走近细看，他不就是被大家称为“乡巴佬”的卡廷吗？", "“你好，小家伙，”卡廷说，“看天气多美，你是出来散步的吧？”", "我怯生生地点点头，答道：“我要回家了。”", "“请耐心等上几分钟，”卡廷说，“瞧，我正在削一支柳笛，差不多就要做好了，完工后就送给你吧！”", "卡廷边削边不时把尚未成形的柳笛放在嘴里试吹一下。没过多久，一支柳笛便递到我手中。我俩在一阵阵清脆悦耳的笛音中，踏上了归途……", "当时，我心中只充满感激，而今天，当我自己也成了祖父时，却突然领悟到他用心之良苦！那天当他听到我的哭声时，便判定我一定迷了路，但他并不想在孩子面前扮演“救星”的角色，于是吹响柳笛以便让我能发现他，并跟着他走出困境！卡廷先生以乡下人的纯朴，保护了一个小男孩强烈的自尊。"], "id": 448}, {"title": "作品29号", "author": "节选自小学《语文》第六册中《莫高窟》", "tag": "", "cat": "普通话60篇", "lines": ["在浩瀚无垠的沙漠里，有一片美丽的绿洲，绿洲里藏着一颗闪光的珍珠。这颗珍珠就是敦煌莫高窟。它坐落在我国甘肃省敦煌市三危和鸣沙山的怀抱中。", "鸣沙山东麓是平均高度为十七米的崖壁。在一千六百多米长的崖壁上，凿有大小洞窟七百余个，形成了规模宏伟的石窟群。其中四百九十二个洞窟中，共有彩色塑像两千一百余尊，各种壁画共四万五千多平方米。莫高窟是我国古代无数艺术匠师留给人类的珍贵文化遗产。", "莫高窟的彩塑，每一尊都是一件精美的艺术品。最大的有九层楼那么高，最小的还不如一个手掌大。这些彩塑个性鲜明，神态各异。有慈眉善目的菩萨，有威风凛凛的天王，还有强壮勇猛的力士.....", "莫高窟壁画的内容丰富多彩，有的是描绘古代劳动人民打猎、捕鱼、耕田、收割的情景，有的是描绘人们奏乐、舞蹈、演的场面，还有的是描绘大自然的美丽风光。其中最引人注目的是飞天。壁画上的飞天，有的臂挎花篮，采摘鲜花；有的反弹琵琶，轻拨银弦；有的倒悬身子，自天而降；有的彩带飘拂，漫天遨游；有的舒展着双臂，翩翩起舞。看着这些精美动人的壁画，就像走进了灿烂辉煌的艺术殿堂。", "莫高窟里还有一个面积不大的洞窟――藏经洞。洞里曾藏有我国古代的各种经卷、文书、帛画、刺绣、铜像等共六万多件。由于清朝政府腐败无能，大量珍贵的文物被外国强盗掠走。仅存的部分经卷，现在陈列于北京故宫等处。", "莫高窟是举世闻名的艺术宝库。这里的每一尊彩塑、每一幅壁画、每一件文物，都是中国古代人民智慧的结晶。"], "id": 449}, {"title": "作品30号", "author": "节选自张抗抗《牡丹的拒绝》", "tag": "", "cat": "普通话60篇", "lines": ["其实你在很久以前并不喜欢牡丹，因为它总被人作为富贵膜拜。后来你目睹了一次牡丹的落花，你相信所有的人都会为之感动：一阵清风徐来，妖艳鲜嫩的盛期牡丹忽然整朵整朵地坠落，铺撒一地绚丽的花瓣。那花瓣落地时依然鲜艳在地上，如同一只奉上祭坛的大鸟脱落的羽毛，低吟着壮烈的悲歌离去。", "牡丹没有花谢花败之时，要么烁于枝头，要么归于泥土，它跨越萎顿和衰老，由青春而死亡，由美丽而消遁。它虽美却不吝惜生命，即使告别也要展示给人最后一次的惊心动魄。", "所以在这阴冷的四月里，奇迹不会发生。任凭游人扫兴和诅咒，牡丹依然安之若素。它不苟且、不俯就、不妥协、不媚俗，甘愿自己冷落自己。它遵循自己的花期自己的规律，它有权利为自己选择每年一度的盛大节日。它为什么不拒绝寒冷？", "天南海北的看花人，依然络绎不绝地涌入洛阳城。人们不会因牡丹的拒绝而拒绝它的美。如果它再被贬谪十次，也许它就会繁衍出十个洛阳牡丹城。", "于是你在无言的遗憾中感悟到，富贵与高贵只是一字之差。同人一样，花儿也是有灵性的，更有品位之高低。品位这东西为气为魂为筋骨为神韵，只可意会。你叹服牡丹卓尔不群之姿，方知品位是多么容易被世俗忽略或是漠视的美。"], "id": 450}, {"title": "作品31号", "author": "节选自《“能吞能吐”的森林》", "tag": "", "cat": "普通话60篇", "lines": ["森林涵养水源，保持水土，防止水旱灾害的作用非常大。据专家测算，一片十万亩面积的森林，相当于一个两百万立方米的水库，这正如农谚所说的：“山上多栽树，等于修水库。雨多它能吞，雨少它能吐。”", "说起森林的功劳，那还多得很。它除了为人类提供木材及许多种生产、生活的原料之外，在维护生态环境方面也是功劳卓著，它用另一种“能吞能吐”的特殊功能孕育了人类。因为地球在形成之初，大气中的二氧化碳含量很高，氧气很少，气温也高，生物是难以生存的。大约在四亿年之前，陆地才产生了森林。森林慢慢将大气中的二氧化碳吸收，同时吐出新鲜氧气，调节气温：这才具备了人类生存的条件，地球上才最终有了人类。", "森林，是地球生态系统的主体，是大自然的总调度室，是地球的绿色之肺。森林维护地球生态环境的这种“能吞能吐”的特殊功能是其他任何物体都不能取代的。然而，由于地球上的燃烧物增多，二氧化碳的排放量急剧增加，使得地球生态环境急剧恶化，主要表现为全球气候变暖，水分蒸发加快，改变了气流的循环，使气候变化加剧，从而引发热浪、飓风、暴雨、洪涝及干旱。", "为了使地球的这个“能吞能吐”的绿色之肺能恢复健壮，以改善生态环境，抑制全球变暖，减少水旱等自然灾害，我们应该大力造林、护林，使每一座荒山都绿起来。"], "id": 451}, {"title": "作品32号", "author": "节选自（台湾）杏林子《朋友和其他》", "tag": "", "cat": "普通话60篇", "lines": ["朋友即将远行。", "暮春时节，又邀了几位朋友在家小聚，虽然都是极熟的朋友，却是终年难得一见，偶尔电话里相遇，也无非是几句寻常话。一锅小米稀饭，一碟大头菜，一盘自家酿制的泡菜，一只巷口买回的烤鸭，简简单单，不像请客，倒像家人团聚。", "其实，友情也好，爱情也好，久而久之都会转化为亲情。", "说也奇怪，和新朋友会谈文学、谈哲学、谈人生道理等等，和老朋友却只话家常，柴米油盐，细细碎碎，种种琐事。很多时候，心灵的契合已经不需要太多的言语来表达。", "朋友新烫了个头，不敢回家见母亲，恐怕惊骇了老人家，却欢天喜地来见我们，老朋友颇能以一种趣味性的眼光欣赏这个改变。", "年少的时候，我们差不多都在为别人而活，为苦口婆心的父母活，为循循善诱的师长活，为许多观念、许多传统的约束力而活。年岁逐增，渐渐挣脱外在的限制与束缚，开始懂得为自己活，照自己的方式做一些自己喜欢的事，不在乎别人的批评意见，不在乎别人的诋毁流言，只在乎那一分随心所欲的舒坦自然。偶尔，也能够纵容自己放浪一下，并且有一种恶作剧的窃喜。", "就让生命顺其自然，水到渠成吧，犹如窗前的乌桕，自生自落之间，自有一分圆融丰满的喜悦。春雨轻轻落着，没有诗，没有酒，有的只是一分相知相属的自在自得。", "夜色在笑语中渐渐沉落，朋友起身告辞，没有挽留，没有送别，甚至也没有问归期。", "已经过了大喜大悲的岁月，已经过了伤感流泪的年华，知道了聚散原来是这样的自然和顺理成章，懂得这点，便懂得珍惜每一次相聚的温馨，离别便也欢喜。"], "id": 452}, {"title": "作品33号", "author": "节选自莫怀戚《散步》", "tag": "", "cat": "普通话60篇", "lines": ["我们在田野散步：我，我的母亲，我的妻子和儿子。", "母亲本不愿出来的。她老了，身体不好，走远一点儿就觉得很累。我说，正因为如此，才应该多走走。母亲信服地点点头，便去拿外套。她现在很听我的话，就像我小时候很听她的话一样。", "这南方初春的田野，大块小块的新绿随意地铺着，有的浓，有的淡，树上的嫩芽也密了，田里的冬水也咕咕地起着水泡。这一切都使人想着一样东西――生命。", "我和母亲走在前面，我的妻子和儿子走在后面。小家伙突然叫起来：“前面是妈妈和儿子，后面也是妈妈和儿子。”我们都笑了。", "后来发生了分歧，母亲要走大路，大路平顺；我的儿子要走小路，小路有意思。不过，一切都取决于我。我的母亲老了，她早已习惯听从她强壮的儿子；我的儿子还小，他还习惯听从他高大的父亲；妻子呢，在外面，她总是听我的。一霎时我感到了责任的重大。我想找一个两全的办法，找不出；我想拆散一家人，分成两路，各得其所，终不愿意。我决定委屈儿子，因为我伴同他的时日还长。我说：“走大路。”", "但是母亲摸摸孙儿的小脑瓜，变了主意：“还是走小路吧。”她的眼随小路望去：那里有金色的菜花，两行整齐的桑树，尽头一口水波粼粼的鱼塘。“我走不过去的地方，你就背着我。”母亲对我说。", "这样，我们在阳光下，向着那菜花、桑树和鱼塘走去。到了一处，我蹲下来，背起了母亲；妻子也蹲下来，背起了儿子。我和妻子都是慢慢地，稳稳地，走得很仔细，好像我背上的同她背上的加起来，就是整个世界。"], "id": 453}, {"title": "作品34号", "author": "罗威尔《神秘的“无底洞”》", "tag": "", "cat": "普通话60篇", "lines": ["地球上是否真的存在“无底洞”？按说地球是圆的，由地壳、地幔和地核三层组成，真正的“无底洞”是不应存在的，我们所看到的各种山洞、残品、裂缝，甚至火山口也都只是地壳浅部的一种现象。然而中国一些古籍却多次提到海外有个深奥莫测的无底洞。事实上地球上确实有这样一个“无底洞”。", "它位于希腊亚各斯古城的海滨。由于濒临大海，大涨潮时，汹涌的海水便会排山倒海般地涌入洞中，形成一股湍湍的急流。据测，每天注入洞内的海水量达三万多吨。奇怪的是，如此大量的海水灌入洞中，却从来没有把洞灌满。曾有人怀疑，这个“无底洞”会不会就像石灰岩地区的漏斗、竖井、落水洞一类的地形。然而从十二世纪三十年代以来，人们就做了多种努力企图寻找它的出口，却都是枉费心机。", "为了揭开这个秘密，一九五八年美国地理学会派出一支考察队，他们把一种经久不变的带色染料溶解在海水中，观察染料是如何随着海水一起沉下去。接着又察看了附近海面以及岛上的各条河、湖，满怀希望地寻找这种带颜色的水，结果令人失望。难道是海水量太大把有色水稀释得太淡，以致无法发现？", "至今谁也不知道为什么这里的海水会没完没了地“漏”下去，这个“无底洞”的出口又在哪里，每天大量的海水究竟都流到哪里去了？"], "id": 454}, {"title": "作品35号", "author": "节选自（奥）茨威格《世间最美的坟墓》", "tag": "", "cat": "普通话60篇", "lines": ["我在俄国所见到的景物再没有比托尔斯泰墓更宏伟、更感人的了。", "完全按照托尔斯泰的愿望；他的墓成了世间最美的、给人印象最深刻的、最感人的坟墓。它只是树林中的一个小小长方形土丘，上面开满鲜花――没有十字架，没有墓碑，没有墓志铭，连托尔斯泰这个名字也没有。", "这个比谁都感到受自己的声名所累的伟人，却像偶尔被发现的流浪汉，不为人知的士兵，不留名姓地被人埋葬了。谁都可以踏进他最后的安息地，围在四周的稀疏的木栅栏是不关闭的——保护列夫·托尔斯泰得以安息的没有任何别的东西，惟有人们的敬意；而通常，人们却总是怀着好奇，去破坏伟人墓地的宁静。", "这里，逼人的朴素禁锢住任何一种观赏的闲情，并且不容许你大声说话。风儿在俯临，在这座无名者之墓的树木之间飒飒响着，和暖的阳光在坟头嬉戏；冬天，白雪温柔地覆盖这片幽暗的土地。无论你在夏天还是冬天经过这儿，你都想象不到，这个小小的、隆起的长方体里安放着一位当代最伟大的人物。", "然而，恰恰是这座不留姓名的坟墓，比所有挖空心思用大理石和奢华装饰建造的坟墓更扣人心弦。在今天这个特殊的日子里，到他的安息地来的成百上千人中间，没有一个有勇气，哪怕仅仅从这幽暗的土丘上摘下一朵花留作纪念。人们重新感到，世界上再没有比托尔斯泰最后留下的、这座纪念碑式的朴素坟墓，更打动人心的了。"], "id": 455}, {"title": "作品36号", "author": "节选自叶圣陶《苏州园林》", "tag": "", "cat": "普通话60篇", "lines": ["我国的建筑，从古代的宫殿到近代的一般住房，绝大部分是对称的，左边怎么样，右边怎么样。苏州园林可绝不讲究对称，好像故意避免似的。东边有了一个亭子或者一道回廊，西边决不会来一个同样的亭子或者一道同样的回廊。这是为什么？我想，用图画来比方，对称的建筑是图案画，不是美术画，而园林是美术画，美术画要求自然之趣，是不讲究对称的。", "苏州园林里都有假山和池沼。", "假山的堆叠，可以说是一项艺术而不仅是技术。或者是重峦叠嶂，或者是几座小山配合着竹子花木，全在乎设计者和匠师们生平多阅历，胸中有丘壑，才能使浏览者攀登的时候忘却苏州城市，只觉得身在山间。", "至于池沼，大多引用活水。有些园林池沼宽敞，就把池沼作为全园的中心，其他景物配合着布置。水面假如成河道模样，往往安排桥梁。假如安排两座以上的桥梁，那就一座一个样，决不雷同。", "池沼或河道的边沿很少砌齐整的石岸，问题高低屈曲任其自然。还在那儿布置几块玲珑的石头，或者种些花草。这也是为了取得从各个角度看都成一幅画的效果。池沼里养着金鱼或各色鲤鱼，夏秋季节荷花或睡莲开放，浏览者看“鱼戏莲叶”间，又是入画的一景。"], "id": 456}, {"title": "作品37号", "author": "节选自《态度创造快乐》", "tag": "", "cat": "普通话60篇", "lines": ["一位访美中国女作家，在纽约遇到一位卖花的老太太。老太太穿着破旧，身体虚弱，但脸上的神情却是那样祥和兴奋。女作家挑了一朵花说：“看起来，你很高兴。”老太太面带微笑地说：“是的，一切都这么美好，我为什么不高兴呢？”“对烦恼，你倒真能看得开。”女作家又说了一句。没料到，老太太的回答更令女作家大吃一惊：“耶稣在星期五被钉上十字架时，是全世界最糟糕的一天，可三天后就是复活节。所以，当我遇到不幸时，就会等待三天，这样一切就恢复正常了。”", "“等待三天”，多么富于哲理的话语，多么乐观的生活方式。它把烦恼和痛苦抛下，全力去收获快乐。", "沈从文在“文革”期间，陷入了非人的境地。可他毫不在意，他在咸宁时给他的表侄、画家黄永玉写信说：“这里的荷花真好，你若来。。。”身陷苦难却仍为荷花的盛开欣喜赞叹不已，这是一种趋于澄明的境界，一种旷达洒脱的胸襟，一种面临磨难坦荡从容的气度。一种对生活童子般的热爱和对美好事物无限向往的生命情感。", "由此可见，影响一个人快乐的，有时并不是困境及磨难，而是一个人的心态。如果把自己浸泡在积极、乐观、向上的心态中，快乐必然会占据你的每一天。"], "id": 457}, {"title": "作品38号", "author": "节选自杨朔《泰山极顶》", "tag": "", "cat": "普通话60篇", "lines": ["泰山极顶看日出，历来被描绘成十分壮观的奇景。有人说：登泰山而看不到日出，就像一出大戏没有戏眼，味儿终究有点寡淡。", "我去爬山那天，正赶上个难得的好天，万里长空，去彩丝儿都不见，素常，烟雾腾腾的山头，显得眉目分明。同伴们都喜的说：“明儿早晨准可以看见日出了。”我也是抱着这种想头，爬上山去。", "一路上从山脚往上爬，细看山景，我觉得挂在眼前的不是五岳独尊的泰山，却像一幅规模惊人的青绿山水画，从下面倒展开来。最先露出在画卷的是山根底那座明朝建筑岱宗坊，慢慢地便现出王母池、斗母宫、经石峪。……山是一层比一层深，一叠比一叠奇，层层叠叠，不知还会有多深多奇。万山丛中，时而点染着极其工细的人物。王母池旁边吕祖殿里有不少尊明塑，塑着吕洞宾等一些人，姿态神情是那样有生气，你看了，不禁会脱口赞叹说：“活啦。”", "画卷继续展开，绿荫森森的柏洞露面不太久，便来到对松山。两面奇峰对峙着，满山峰都是奇形怪状的老松，年纪怕都上千岁了，颜色竟那么浓，浓得好像要流下来似的。来到这儿你不妨权当一次画里的写意人物，坐在路旁的对松亭里，看看山色，听听流水的松涛。", "一时间，我又觉得自己不仅是在看画卷，却又像是在零零乱乱翻动着一卷历史稿本。"], "id": 458}, {"title": "作品39号", "author": "节选自《陶行知的“四块糖果”》", "tag": "", "cat": "普通话60篇", "lines": ["育才小学校长陶行知在校园看到学生王友用泥块砸自己班上的同学，陶行知当即喝止了他，并令他放学后到校长室去。无疑，陶行知是要好好教育这个“顽皮”的学生。那么他是如何教育的呢？", "放学后，陶行知来到校长室，王友已经等在门口准备挨训了。可一见面，陶行知却掏出一块糖果送给王友，并说：“这是奖给你的，因为你按时来到这里，而我却迟到了。”王友惊疑地接过糖果。", "随后，陶行知又掏出一块糖果放到他手里，说：“这第二块糖果也是奖给你的，因为当我不让你再打人时，你立即就住手了，这说明你很尊敬我，我应该奖你。”王友更惊疑了，他眼睛睁得大大的。", "陶行知又掏出第三块糖果塞到王友手里，说：“我调查过了，你用泥块砸那些男生，是因为他们不守游戏规则，欺负女生；你砸他们，说明你很正直善良，且有批评不良行为的勇气，应该奖励你啊!”王友感动极了，他流着泪后悔地喊道：“陶。。。陶校长你打我两下吧!我砸的不是坏人，而是自己的同学啊。。。”", "陶行知满意地笑了，他随即掏出第四块糖果递给王友，说：“为你正确地认识错误，我再奖给你一块糖果，只可惜我只有这一块糖果了。我的糖果没有了，我看我们的谈话也该结束了吧!”说完，就走出了校长室。"], "id": 459}, {"title": "作品40号", "author": "节选自毕淑敏《提醒幸福》", "tag": "", "cat": "普通话60篇", "lines": ["享受幸福是需要学习的，当幸福即将来临的时刻需要提醒。人可以自然而然地学会感官的享乐，人却无法天生地掌握幸福的韵律。灵魂的快意同器官的舒适像一对孪生兄弟，时而相傍相依，时而南辕北辙。", "幸福是一种心灵的振颤。它像会倾听音乐的耳朵一样，需要不断地训练。", "简言之，幸福就是没有痛苦的时刻。它出现的频率并不像我们想象的那样少。人们常常只是在幸福的金马车已经驶过去很远，捡起地上的金鬃毛说，原来我见过它。", "人们喜爱回味幸福的标本，却忽略幸福披着露水散发清香的时刻。那时候我们往往步履匆匆，瞻前顾后不知在忙着什么。", "世上有预报台风的，有预报蝗虫的，有预报瘟疫的，有预报地震的。没有人预报幸福。其实幸福和世界万物一样，有它的征兆。", "幸福常常是朦胧的，很有节制地向我们喷洒甘霖。你不要总希望轰轰烈烈的幸福，它多半只是悄悄地扑面而来。你也不要企图把水龙头拧得更大，使幸福很快地流失。你需要静静地以平和之心，体验它的真谛。", "幸福绝大多数是朴素的。它不会像信号弹似的，在很高的天际闪烁红色的光芒。它披着本色外衣，亲//切温暖地包裹起我们。", "幸福不喜欢喧嚣浮华，它常常在暗淡中降临。贫困中相濡以沫的一块糕饼，患难中心心相印的一个眼神，父亲一次粗糙的抚摸，女友一个温馨的字条……这都是千金难买的幸福啊。像一粒粒缀在旧绸子上的红宝石，在凄凉中愈发熠熠夺目。"], "id": 460}, {"title": "作品41号", "author": "节选自刘燕敏《天才的造就》", "tag": "", "cat": "普通话60篇", "lines": ["在里约热内卢的一个贫民窟里，有一个男孩子，他非常喜欢足球，可是又买不起，于是就踢塑料盒，踢汽水瓶，踢从垃圾箱里拣来的椰子壳。他在胡同里踢，在能找到的任何一片空地上踢。", "有一天，当他在一处干涸的水塘里猛踢一个猪膀胱时，被一位足球教练看见了。他发现这个男孩儿踢得很像是那么回事，就主动提出要送给他一个足球。小男孩儿得到足球后踢得更卖劲了。不久，他就能准确地把球踢进远处随意摆放的一个水桶里。", "圣诞节到了，孩子的妈妈说：“我们没有钱买圣诞礼物送给我们的恩人，就让我们为他祈祷吧。”", "小男孩儿跟随妈妈祈祷完毕，向妈妈要了一把铲子便跑了出去。他来到一座别墅前的花园里，开始挖坑。", "就在他快要挖好坑的时候，从别墅里走出一个人来，问小孩儿在干什么，孩子抬起满是汗珠的脸蛋儿，说：“教练，圣诞节到了，我没有礼物送给您，我愿给您的圣诞树挖一个树坑。”", "教练把小男孩儿从树坑里拉上来，说，我今天得到了世界上最好的礼物。明天你就到我的训练场去吧。", "三年后，这位十七岁的男孩儿在第六届足球锦标赛上独进二十一球，为巴西第一次捧回了金杯。一个原来不为世人所知的名字——贝利，随之传遍世界。"], "id": 461}, {"title": "作品42号", "author": "节选自（法）加里《我的母亲独一无二》", "tag": "", "cat": "普通话60篇", "lines": ["记得我十三岁时，和母亲住在法国东南部的耐斯城。母亲没有丈夫，也没有亲戚，够清苦的，但她经常能拿出令人吃惊的东西，摆在我面前。她从来不吃肉，一再说自己是素食者。然而有一天，我发现母亲正仔细地用一小块碎面包擦那给我煎牛排用的油锅。我明白了她称自己为素食者的真正原因。", "我十六岁时，母亲成了耐斯市美蒙旅馆的女经理。这时，她更忙碌了。一天，她瘫在椅子上，脸色苍白，嘴唇发灰。马上找来医生，做出诊断：她摄取了过多的胰岛素。直到这里我才知道母亲多年一直对我隐瞒的疾痛――糖尿病。", "她的头歪向枕头一边，痛苦地用手抓挠胸口。床架上方，则挂着一枚我一九三二年赢得耐斯市少年乒乓球冠军的银质奖章。", "啊，是对我的美好前途的憧憬支撑着她活下去，为了给她那荒唐的梦至少加一点真实的色彩，我只能继续努力，与时间竞争，直至一九三八年我被征入空军。巴黎很快失陷，我辗转调到英国皇家空军。刚到英国就接到了母亲的来信。这些信是由在瑞士的一个朋友秘密地转到伦敦，送到我手中的。", "现在我要回家了，胸前佩带着醒目的绿黑两色的解放十字绶带，上面挂着五六枚我终身难忘的勋章，肩上还佩带着军官肩章。到达旅馆时，没有一个人跟我打招呼。原来，我母亲在三年半以前就已经离开人间了。", "在她死前的几天中，她写了近二百五十封信，把这些信交给她在瑞士的朋友，请这个朋友定时寄给我。就这样，在母亲死后的三年半的时间里，我一直从她身上吸取着力量和勇气――这使我能够继续战斗到胜利那一天。"], "id": 462}, {"title": "作品43号", "author": "节选自（波兰）玛丽居里《我的信念》", "tag": "", "cat": "普通话60篇", "lines": ["生活对于任何人都非易事，我们必须有坚韧不拔的精神。最要紧的，还是我们自己要有信心。我们必须相信，我们对每一件事情都具有天赋的才能，并且，无论付出任何代价，都要把这件事完成，当事情结束的时候，你要能问心无愧地说：“我已经尽我所能了。”", "有一年的春天，我因病被迫在家里休息数周。我注视着我的女儿们所养的蚕正在结茧，这使我很感兴趣。望着这些蚕执著地、勤奋地工作，我感到和它们非常相似。像它们一样，我总是耐心地把自己的努力集中在一个目标上。我之所以如此，或许是因为有某种力量在鞭策着我――正如蚕被鞭策着去结茧一般。", "近五十年来，我致力于科学研究，而研究，就是对真理的探讨。我有许多美好快乐的记忆。少女时期我在巴黎大学，孤独地过着求学的岁月；在后来献身科学的整个时期，我丈夫和我专心致志，像在梦幻中一般，坐在简陋的书房里艰辛地研究，后来我们就在那里发现了镭。", "我永远追求安静的工作和简单的家庭生活。为了实现这个理想，我竭力保持宁静的环境，以免受人事的干扰和盛名的拖累。", "我深信，在科学方面我们有对事业而不是对财富的兴趣。我的惟一奢望是在一个自由国家中，以一个自由学者的身份从事研究工作。", "我一直沉醉于世界的优美之中，我所热爱的科学也不断增加它崭新的远景。我认定科学本身就具有伟大的美。"], "id": 463}, {"title": "作品44号", "author": "节选自（美）贝得勒《我为什么当教师》", "tag": "", "cat": "普通话60篇", "lines": ["我为什么非要教书不可？是因为我喜欢当教师的时间安排表和生活节奏。七、八、九三个月给我提供了进行回顾、研究、写作的良机，并将三者有机融合，而善于回顾、研究和总结正是优秀教师素质中不可缺少的成分。", "干这行给了我多种多样的“甘泉”去品尝，找优秀的书籍去研读，到“象牙塔”和实际世界里去发现。教学工作给我提供和继续学习的时间保证，以及多种途径、机遇和挑战。", "然而，我爱这一行的真正原因，是爱我的学生。学生们在我的眼前成长变化。当教师意味着亲历“创造”过程的发生――恰似亲手赋予一团泥土以生命，没有什么比目睹它开始呼吸更激动人心的了。", "权利我也有了：我有权利去启发诱导，去激发智慧的火花，去问费心思考的问题，去赞扬回答的尝试，去推荐书籍，去指点迷津。还有什么别的权利能与之相比呢？", "而且，教书还给我金钱和权利之外的东西，那就是爱心。不仅有对学生的爱，对书籍的爱，对知识的爱，还有老师才能感受到的对“特别”学生的爱。这些学生，有如冥顽不灵的泥块，由于接受了老师的挚爱才勃发了生机。", "所以，我爱教书，还因为，在那些勃发生机的“特别”学生身上，我有时发现自己和他们呼吸相通，忧乐与共。"], "id": 464}, {"title": "作品45号", "author": "节选自《西部文化和西部开发》", "tag": "", "cat": "普通话60篇", "lines": ["中国西部我们通常是指黄河与秦岭相连一线以西，包括西北和西南的二十个省、市、自治区。这块广袤的土地面积为五百四十六万平方公里，占国土总面积的百分之五十七；人口二点八亿，占全国总人口的百分之二十三。", "西部是华夏文明的源头。华夏祖先的脚步是顺着水边走的：长江上游出土过元谋人牙齿化石，距今约一百七十万年；黄河中游出土过蓝田人头盖骨，距今约七十万年。这两处古人类都比距今约五十万年的北京猿人资格更老。", "西部地区是华夏文明的重要发源地。秦皇汉武以后，东西方文化在这里交汇融合，从而有了丝绸之路的驼铃声声，佛院深寺的暮鼓晨钟。敦煌莫高窟是世界文化史上的一个奇迹，它在继承汉晋艺术传统的基础上，形成了自己兼收并蓄的恢宏气度，展现出精美绝伦的艺术形式和博大精深的文化内涵。秦始皇兵马俑、西夏王陵、楼兰古国、布达拉宫、三星堆、大足石刻等历史文化遗产，同样为世界所瞩目，成为中华文化重要的象征。", "西部地区又是少数民族及其文化的集萃地，几乎包括了我国所有的少数民族。在一些偏远的少数民族地区，仍保留了一些久远时代的艺术品种，成为珍贵的“活化石”，如纳西古乐、戏曲、剪纸、刺绣、岩画等民间艺术和宗教艺术。特色鲜明、丰富多彩，犹如一个巨大的民族民间文化艺术宝库。", "我们要充分重视和利用这些得天独厚的资源优势，建立良好的民族民间文化生态环境，为西部大开发做出贡献。"], "id": 465}, {"title": "作品46号", "author": "节选自王蒙《喜悦》", "tag": "", "cat": "普通话60篇", "lines": ["高兴，这是一种具体的被看得到摸得着的事物所唤起的情绪。它是心理的，更是生理的。它容易来也容易去，谁也不应该对它视而不见失之交臂，谁也不应该总是做那些使自己不高兴也使旁人不高兴的事。让我们说一件最容易做也最令人高兴的事吧，尊重你自己，也尊重别人，这是每一个人的权利，我还要说这是每一个人的义务。", "快乐，它是一种富有概括性的生存状态、工作状态。它几乎是先验的，它来自生命本身的活力，来自宇宙、地球和人间的吸引，它是世界的丰富、绚丽、阔大、悠久的体现。快乐还是一种力量，是埋在地下的根。消灭一个人的快乐比挖掘掉一棵大树的根要难得多。", "欢欣，这是一种青春的、诗意的情感。它来自面向着未来伸开双臂奔跑的冲力，它来自一种轻松而又神秘、朦胧而又隐秘的激动，它是激情即将到来的预兆，它又是大雨过后的比下雨还要美妙得多也久远得多的回味。。。", "喜悦，它是一种带有形而上的修养的境界。与其说它是一种情绪，不如说它是一种智慧、一种超拔、一种悲天悯人的宽容和理解，一种饱经沧桑的充裕和自信，一种光明的理性，一种坚定的成熟，一种战胜了烦恼和庸俗的清明澄澈。它是一潭浅水，它是一抹朝霞，它是无边的平原，它是沉默的地平线。多一点儿、再多一点儿喜悦吧，它是翅膀，也是归巢。它是一杯美酒，也是一朵永远开不败的莲花。"], "id": 466}, {"title": "作品47号", "author": "节选自舒乙《香港：最贵的一棵树》", "tag": "", "cat": "普通话60篇", "lines": ["在湾仔，香港最热闹的地方，有一棵榕树，它是最贵的一棵树，不光在香港，在全世界，都是最贵的。", "树，活的树，又不卖，何言其贵？只因它老，它粗，是个香港百年沧桑的活见证，香港人不忍看着它被砍伐，或者被移走，便跟要占用这片山坡的建筑者谈条件：可以在这儿建大楼盖商厦，但一不准砍树，二不准挪树，必须把它原地精心养起来，成为香港闹市中的一景。太古大厦的建设者最后签了合同，占用这个大山坡建豪华商厦，先决条件是同意保留这棵老树。", "树长在半山坡上，计划将树下面的成千上万方山石全部掏空取走，腾出地方来盖楼。把树架在大楼上面，仿佛它原本是长在楼顶似的。建设者就地造了一个直径十八米、深十米的大花盆，先固定好这棵老树，再在大花盆底下盖楼，光这一手就花了两千三百八十九万港币，这也堪称是最昂贵的保护措施了。", "太古大厦落成之后，人们可以乘滚动扶梯一次到位，来到太古大厦的顶层。出后门，那儿是一片自然景色。一棵大树出现在人们面前，树干直径有一米半粗，树冠直径足有二十多米，独木成林，非常壮观，形成一座以它为中心的小公园，取名叫“榕圃”。树前面插着铜牌，说明原由。此情此景，如不看铜牌的说明，绝对想不到巨树根底下还有一座宏伟的现代大楼。"], "id": 467}, {"title": "作品48号", "author": "节选自巴金《鸟的天堂》", "tag": "", "cat": "普通话60篇", "lines": ["我们的船渐渐地逼近榕树了。我有机会看清它的真面目：是一棵大树，有数不清的丫枝，枝上又生根，有许多根一直垂到地上，伸进泥土里。一部分树枝垂到水面，从远处看，就像一棵大树斜躺在水面上一样。", "现在正是枝繁叶茂的时节。这棵榕树好像在把它的全部生命力展示给我们看。那么多的绿呀，一簇堆在另一簇的上面，不留一点缝隙。翠绿的颜色明亮地在我们的眼前闪耀，似乎每一片树叶上都有一个新的生命在颤动，这美丽的南国的树！", "船在树下泊了片刻，岸上很湿，我们没有上去。朋友说这里是“鸟的天堂”，有许多鸟在这棵树上做窝，农民不许人去捉它们。我仿佛听见几只鸟扑翅的声音，但是等到我的眼睛注意地看那里时，我却看不见一只鸟的影子。只有无数的树根立在地上，像许多根木桩。地是湿的，大概涨潮时河水常常冲上岸去。“鸟的天堂”里没有一只鸟，我这样想到。船开了，一个朋友拨着船，缓缓地流到河中间去。", "第二天，我们划着船到一个朋友的家乡去，就是那个有山有塔的地方。从学校出发，我们又经过那“鸟的天堂”。", "这一次是在早晨，阳光照在水面上，也照在树梢上。一切都显得非常光明。我们的船也在树下泊了片刻。", "起初四周围非常清静。后来忽然起了一声鸟叫。我们把手一拍，便看见一只大鸟飞了起来，接着又看见第二只，第三只。我们继续拍掌，很快地这个树林就变得很热闹了。到处都是鸟声，到处都是鸟影。大的，小的，花的，黑的，有的站在枝上叫，有的飞起来，在扑翅膀。"], "id": 468}, {"title": "作品49号", "author": "节选自夏衍《野草》", "tag": "", "cat": "普通话60篇", "lines": ["有这样一个故事。", "有人问：世界上什么东西的气力最大？回答纷纭的很，有的说“象”，有的说“狮”，有人开玩笑似的说：是“金刚”，金刚有多少气力，当然大家全不知道。", "结果，这一切答案完全不对，世界上气力最大的，是植物的种子。一粒种子所可以显现出来的力，简直是超越一切。", "人的头盖骨，结合得非常致密与坚固，生理学家和解剖学者用尽了一切的方法，要把它完整地分出来，都没有这种力气。后来忽然有人发明了一个方法，就是把一些植物的种子放在要剖析的头盖骨里，给它以温度与湿度，使它发芽，一发芽，这些种子便以可怕的力量，将一切机械力所不能分开的骨骼，完整地分开了。植物种子力量之大，如此如此。", "这，也许特殊了一点儿，常人不容易理解，那么，你看见笋的成长吗？你看见过被压在瓦砾和石块下面的一颗小草的生成吗？他为着向往阳光，为着达成它的生之意志，不管上面的石块如何重，石块与石块之间如何狭，它必定要曲曲折折地，但是顽强不屈地透到地面上来，它的根往土壤钻，它的芽望地面挺，这是一种不可抗的力，阻止它的石块，结果也被它掀翻，一粒种子的力量的大，如此如此。", "没有一个人将小草叫做“大力士”，但是它的力量之大，的确是世界无比。这种力，是一般人看不见的生命力。只要生命存在，这种力就要显现。上面的石块，丝毫不足以阻挡。因为它是一种“长期抗战”的力；有弹性，能屈能伸的力；有韧性，不达目的不止的力。"], "id": 469}, {"title": "作品50号", "author": "节选自纪广洋《一分钟》", "tag": "", "cat": "普通话60篇", "lines": ["著名教育家班杰明曾经接到一个青年人的求教电话，于是与那个向往成功、渴望指点的青年人约好了见面的时间和地点。", "等到那位青年人如约而至时，班杰明的房门敞开着，眼前的景象令青年人颇感意外---班杰明的房间里乱七八糟、狼藉一片。", "没等青年人开口，班杰明就招呼道：\"你看我这房间，太不整洁了，请你在门外等候一分钟，我收拾一下，你再进来吧。\"一边说着，班杰明就轻轻关上了房门。", "不到一分钟的时间，班杰明又打开了房门并热情地把青年人让进客厅。这时，青年人的眼前展现出另一番景象---房间里的一切已变得井然有序，而且有两杯刚刚倒好的红酒，在淡淡的香水气息里还漾着微波。", "可是，没等青年人把满腹的有关人生和事业的疑难问题向班杰明讲出来，班杰明就非常客气地说道：\"干杯。你可以走了。\"", "青年人手持酒杯一下子愣住了，既尴尬又非常遗憾地说：\"可是，我……我还没向您请教呢……\"", "\"这些……难道还不够吗？\"班杰明一边微笑着一边扫视着自己的房间，轻言细语地说，\"你进来又有一分钟了。\"", "\"一分钟……一分钟……\"青年人若有所思地说，\"我懂了，您让我明白了一分钟的时间可以做许多事情，可以改变许多事情的深刻道理。\"", "班杰明舒心地笑了。青年人把杯里的红酒一饮而尽，向班杰明连连道谢之后，开心地走了。", "其实，把握好了生命中的每一分钟，也就是把握了理想的人生。"], "id": 470}, {"title": "作品51号", "author": "节选自张玉庭《一个美丽的故事》", "tag": "", "cat": "普通话60篇", "lines": ["有个塌鼻子的小男孩儿，因为两岁时得过脑炎，智力受损，学习起来很吃力。打个比方，别人写作文能写二三百字，他却只能写三五行。但即便这样的作文，他同样能写得很动人。", "那是一次作文课，题目是《愿望》。他极其认真的想了半天，然后极认真地写，那次作文极短。只有三句话：我有两个愿望，第一个是，妈妈天天笑眯眯地看着我说：“你真聪明。”第二个是，老师天天笑眯眯地看着我说：“你一点也不笨。”", "于是就是这篇作文，深深地打动了他的老师，那位妈妈式的老师不仅给了他最高分，在班上带感情朗诵了这篇作文，还一笔一画地批道：你很聪明，你的作文写得非常感人，请放心，妈妈肯定会格外喜欢你的，老师肯定会格外喜欢你的，大家肯定会格外喜欢你的。", "捧着作文本，他笑了，蹦蹦跳跳地回家了，像只喜鹊。但他并没有把作文本拿给妈妈看，他是在等待，等待着一个美好的时刻。", "那个时刻终于到了，是妈妈的生日——一个阳光灿烂的星期天。那天，他起得特别早，把作文本装在一个亲手做的美丽的大信封里，等着妈妈醒来。妈妈刚刚睁眼醒来，他就笑眯眯地走到妈妈跟前说：“妈妈，今天是您的生日，我要送给您一件礼物。”", "果然，看着这篇作文，妈妈甜甜地涌出了两行热泪，然后一把搂住小男孩儿，搂得很紧很紧。", "是的，智力可以受损，但爱永远不会。"], "id": 471}, {"title": "作品52号", "author": "节选自苦伶《永远的记忆》", "tag": "", "cat": "普通话60篇", "lines": ["小学的时候，有一次我们去海边远足，妈妈没有做便饭，给了我十块钱买午餐。好像走了很久，很久，终于到海边，大家坐下来便吃饭，荒凉的海边没有商店，我一个人跑到防风林外面去，级任老师要大家把吃剩的饭菜分给我一点儿。有两三个男生留下一点儿给我，还有一个女生，她的米饭拌了酱油，很香。我吃完的时候，她笑眯眯地看着我，短头发，脸圆圆的。", "她的名字叫翁香玉。", "每天放学的时候，她走的是经过我们家的一条小路，带着一位比她小的男孩儿，可能是弟弟。小路边是一条清澈见底的小溪，两旁竹阴覆盖，我总是远远地跟在后面。夏日的午后特别炎热，走到半路她会停下来，拿手帕在溪水里浸湿，为小男孩儿擦脸。我也在后面停下来，把肮脏手帕弄湿了擦脸，再一路远远地跟着她回家。", "后来我们家搬到镇上去了，过几年我也上了中学。有一天放学回家，在火车上，看见斜对面一位短头发、圆圆脸的女孩，一身素净的白衣黑裙。我想她一定不认识我了。火车很快到站了，我随着人群挤向门口，她也走近了，叫我的名字。这是她第一次和我说话。", "她笑眯眯的，和我一起走过月台。以后就没有再见过她了。", "这篇文章收在我出版的《少年心事》这本书里。", "书出版后半年，有一天我忽然收到出版社转来的一封信，信封上是陌生的字迹，但清楚地写着我本名。", "信里面说她看到了这篇文章心里非常激动，没想到在离开家乡，漂泊异地这么久之后，会看见自己仍然在一个人的记忆里，她自己也深深记得这其中的每一幕，只是没想到越过遥远的时空，竟然另一个人也深深记得。"], "id": 472}, {"title": "作品53号", "author": "节选自小学《语文》第六册中《语言的魅力》", "tag": "", "cat": "普通话60篇", "lines": ["在繁华地巴黎大街的路旁，站着一个衣衫褴褛、头发斑白、双目失明的老人。他不像其他乞丐那样伸手向过路行人乞讨，而是在身旁立一块木牌，上面写着：“我什么也看不见！”街上过往的行人很多，看了木牌上的字都无动于衷，有的还淡淡一笑，便姗姗而去了。", "这天中午，法国著名诗人让·彼浩勒也经过这里。他看看木牌上的字，问盲老人：“老人家，今天上午有人给你钱吗？”", "盲老人叹息着回答：“我，我什么也没有得到。”说着，脸上的神情非常悲伤。", "让·彼浩勒听了，拿起笔悄悄地在那行字的前面添上了“春天到了，可是”几个字，就匆匆地离开了。", "晚上，让·彼浩勒又经过这里，问那个盲老人下午的情况。盲老人笑着回答说：“先生，不知为什么，下午给我钱的人多极了！” 让·彼浩勒听了，捋着胡子满意地笑了。", "“春天到了，可是我什么也看不见！”这富有诗意的语言，产生这么大的作用，就在于它有非常浑厚的感情色彩。是的，春天是美好的，那蓝天白云，那绿树红花，那莺歌燕舞，那流水人家，怎么不叫人陶醉呢？但这良辰美景，对于一个双目失明的人来说，只是一片漆黑。当人们想到这个盲老人，一生中竟连万紫千红的春天都不曾看到，怎能不对他产生同情之心呢？"], "id": 473}, {"title": "作品54号", "author": "节选自蒲昭和《赠你四味长寿药》", "tag": "", "cat": "普通话60篇", "lines": ["有一次，苏东坡的朋友张鹗拿着一张宣纸来求他写一幅字，而且希望他写一点儿关于养生方面的内容。苏东坡思索了一会儿，点点头说：“我得到了一个养生长寿古方，药只有四味，今天就赠给你吧。”于是，东坡的狼毫在纸上挥洒起来，上面写着：“一曰无事以当贵，二曰早寝以当富，三曰安步以当车，四曰晚食以当肉。”", "这哪里有药？张鹗一脸茫然地问。苏东坡笑着解释说，养生的要诀，全在这四句里面。", "所谓“无事以当贵”，是指人不要把功名利禄、荣辱得失看得太重，如能在情志上潇洒大度，随遇而安，无事以求，这比富贵更能使人终其天年。", "“早寝以当富”，指吃好穿好、财货充足，并非就能使你长寿。对老年人来说，养成良好的起居习惯，尤其是早睡早起，比获得任何财富更加宝贵。", "“安步以当车”，指人不要过于讲求安逸、肢体不劳，而应多以步行来替代骑马乘车，多运动才可以强健体魄，通畅气血。", "“晚食以当肉”，意思是人应该用已饥方食、未饱先止代替对美味佳肴的贪吃无厌。他起步解释，饿了以后才进食，虽然是粗茶淡饭，但其香甜可口会胜过山珍；如果饱了还要勉强吃，即使美味佳肴摆在眼前也难以下咽。", "苏东坡的四味“长寿药”，实际上是强调了情志、睡眠、运动、饮食四个方面对养生长寿的重要性，这种养生观点即使在今天仍然值得借鉴。"], "id": 474}, {"title": "作品55号", "author": "节选自（美）本杰明.拉什《站在历史的枝头微笑》", "tag": "", "cat": "普通话60篇", "lines": ["人活着，最要紧的是寻觅到那片代表着生命绿色和人类希望的丛林，然后选一高高的枝头站在那里观览人生，消化痛苦，孕育歌声，愉悦世界！", "这可真是一种潇洒的人生态度，这可真是一种心境爽朗的情感风貌。", "站在历史的枝头微笑，可以减免许多烦恼。在那里，你可以从众生相所包含的甜酸苦辣、百味人生中寻找你自己，你境遇中的那点苦痛，也许相比之下，再也难以占据一席之地，你会较容易地获得从不悦中解脱灵魂的力量，使之不致变得灰色。", "人站得高些，不但能有境早些领略到希望的曙光，还能有幸发现生命的立体的诗篇。每一个人的人生，都是这诗篇中的一个词、一个句子或者一个标点。你可能没有成为一个美丽的词，一个引人注目的句子，一个惊叹号，但你依然是这生命的立体诗篇中的一个音节、一个停顿、一个必不可少的组成部分。这足以使你放弃前嫌，萌生为人类孕育新的歌声的兴致，为世界带来更多的诗意。", "最可怕的人生见解，是把多维的生存图景看成平面。因为那平面上刻下的大多是凝固了的历史──过去的遗迹；但活着的人们，活得却是充满着新生智慧的，由不断逝去的“现在”组成的未来。人生不能像某些鱼类躺着游，人生也不能像某些兽类爬着走，而应该站着向前行，这才是人类应有的生存姿态。"], "id": 475}, {"title": "作品56号", "author": "节选自《中国的宝岛――台湾》", "tag": "", "cat": "普通话60篇", "lines": ["中国的第一大岛、台湾省的主岛台湾，位于中国大陆架的东南方，地处东海和南海之间，台湾海峡和大陆相望。天气晴朗的时候，站在福建沿海较高的地方，就可以隐隐约约地望见岛上的高山和云朵。", "台湾岛形状狭长，从东到西，最宽处只有一百四十多公里；由南到北，最长的地方约有三百九十多公里。地形像一个纺织用的梭子。", "台湾岛上的山脉纵贯南北，中间的中央山脉犹如全岛的脊梁。西部为海拔近四千米的玉山山脉，是中国东部的最高峰。全岛约有三分之一的地方是平地，其余为山地。岛内有缎带般的，蓝宝石似的湖泊，四季常青的森林和果园，十分优美。西南部的阿里山和日月潭，台北市郊的大屯山风景区，都是闻名世界的浏览胜地。", "台湾岛地处热带和温带之间，四面环海，雨水充足，气温受到海洋的调剂，冬暖夏凉，四季如春，这给水稻和果木生长提供了优越的条件。水稻、甘蔗、樟脑是台湾的“三宝”。", "岛上还是一个闻名世界的“蝴蝶王国”。岛上的蝴蝶共有四百多个品种，其中有不少是世界稀有的珍贵品种。岛上还有不少鸟语花香的蝴蝶谷，岛上居民利用蝴蝶制作的标本的艺术品，远销许多国家。"], "id": 476}, {"title": "作品57号", "author": "节选自小思《中国的牛》", "tag": "", "cat": "普通话60篇", "lines": ["对于中国的牛，我有特别的尊敬感情。", "留给我印象最深的，要算一回在田垄上的“相遇”。", "一群朋友郊游，我领头在狭窄的阡陌上走，怎料迎面来了几只耕牛，狭道容不下人和牛，终有一方要让路。它们还没有走近，我们已经预计斗不过畜牲，恐怕难免踩到稻田泥水里，弄得鞋袜又泥又湿了。正在踟蹰的时候，带头的一只牛，在离我们不远的地方停下来，抬起头看看，稍迟疑一下，就自动走下田去，一队耕牛，跟住它全走离阡陌，从我们身边经过。", "我们都呆了，回过头来，看着深褐色的牛队，在路的尽头消失，忽然觉得自己受了很大恩惠。", "中国的牛，永远沉默地为人类做着沉重的工作。在大地上，在晨光或烈日下，它拖着沉重的犁，低头一步又一步，拖出了身后一列又一列松土，好让人们下种。等到满地金黄或农闲时候，它可能还得担当搬运负重的工作，或终日绕着石磨，朝同一方向，走不计程的路。", "在它沉默劳动中，人便得到应得的收成。", "那时候，也许，它可以松一肩重担，站在树下，吃几口嫩草。偶尔摇摇尾巴，摆摆耳朵，赶走飞附在它身上的苍蝇，已经算是它最闲适的生活了。", "中国的牛，没有成群奔跑的习惯，永远沉沉实实的。默默地工作，平心静气，这就是中国的牛。"], "id": 477}, {"title": "作品58号", "author": "节选自老舍《住的梦》", "tag": "", "cat": "普通话60篇", "lines": ["不管我的梦想能否成为事实，说出来总是好玩儿的：", "春天，我将要住在杭州。二十年前，旧历的二月初，在西湖上我看见了嫩柳与菜花，碧浪与翠竹。由我看到的那点春光，已经可以断定，杭州的春天必定会教人整天生活在诗与图画之中。所以，春天我的家应当是在杭州。", "夏天，我想青城山应当算作最理想的地方。在那里，我虽然只住过十天，可是它的幽静已拴住了我的心灵。在我所看见过的山水中，只有这里没有使我失望。到处都是绿，目之所及，那片淡而光润的绿色都在轻轻地颤动，仿佛要流入空中与心中去似的。这个绿色会像音乐似的，涤清了心中的万虑。", "秋天一定要住北平。天堂是什么样子，我不晓得，但是从我的生活经验去判断，北平之秋便是天堂。论天气，不冷不热。论吃的，苹果、梨、柿子、枣儿、葡萄，都每样有若干种。论花草，菊花种类之多，花式之奇，可以甲天下。西山有红叶可见，北海可以划船——虽然荷花已残，荷叶可还有一片清香。衣食住行，在北平的秋天，是没有一项不使人满意的。", "冬天，我还没有打好主意，成都或者相当的合适，虽然并不怎样和缓，可是为了水仙，素心腊梅，各色的茶花，仿佛就受一点儿寒冷，也颇值得去了。昆明的花也多，而且天气比成都好，可是旧书铺与精美而便宜的小吃远不及成都的那么多。好吧，就暂这么规定：冬天不住成都便住昆明吧。", "在抗战中，我没能发了国难财。我想，抗战结束以后，我必能阔起来。那时候，假若飞机减价，一二百元就能买一架的话，我就自备一架，择黄道吉日慢慢地飞行。"], "id": 478}, {"title": "作品59号", "author": "节选自宗璞《紫藤萝瀑布》", "tag": "", "cat": "普通话60篇", "lines": ["我不由停住了脚步。", "从未见过开得这样盛的藤萝，只见一片辉煌的淡紫色，像一条瀑布，从空中垂下，不见其发端，也不见其终极，只是深深浅浅的紫，仿佛在流动，在欢笑，在不停地生长。紫色的大条幅上，泛着点点银光，就像迸溅的水花。仔细看时，才知那是每一朵紫花中的最浅谈的部分，在和阳光互相挑逗。", "这里除了光彩，还有淡淡的芳香。香气似乎也是浅紫色的，梦幻一般轻轻地笼罩着我。忽然记起十多年前，家门外过一大株紫藤萝，它依傍一株枯槐爬得很高，但花朵从来都稀落，东一穗西一串伶仃地挂在树梢，好像在察颜观色，试探什么。后来索性连那稀零的花串也没有了。园中别的紫藤花架也都拆掉，改种了果树。那时的说法是，花和生活腐化有着必然关系。我曾遗憾地想：这里再看不见藤萝花了。", "过了这么多年，藤萝又开花了，而且开得这样盛，这样密，紫色的瀑布遮住了粗壮的盘虬卧龙般的枝干，不断地流着，流着，流向人的心底。", "花和人都会遇到各种各样的不幸，但是生命的长河是无止境的。我抚摸了一下那小小的紫色的花舱，那里满装生命的酒酿，它张满了帆，在这闪光的花的河流上航行。它是万花中的一朵，也正是由每一个一朵，组成了万花灿烂的流动的瀑布。", "在这浅紫色的光辉和浅紫色的芳香中，我不觉加快了脚步。"], "id": 479}, {"title": "作品60号", "author": "节选自林光如《最糟糕的发明》", "tag": "", "cat": "普通话60篇", "lines": ["在一次名人访问中，被问及上个世纪最重要的发明是什么时，有人说是电脑，有人说是汽车，等等。但新加坡的一位知名人士却说是冷气机。他解释，如果没有冷气，热带地区如东南亚国家，就不可能有高的生产力，就不可能达到今天的生活水准。他的回答实事求是，有理有据。", "看了有关报道，我突发奇想：为什么没有记者问：“20世纪最糟糕的发明是什么？”其实二OO二年十月中旬，英国的一家报纸就评出了“人类最糟糕的发明”。获此“殊荣”的，就是人们每天大量使用的塑料袋。", "诞生于上个世纪三十年代的塑料袋，其家族包括用塑料制成的快餐饭盒、包装纸、餐用杯盘、饮料瓶、酸奶杯、雪糕杯等等。这些废弃物形成的垃圾，数量多、体积大、重量轻、不降解，给治理工作带来很多技术难题和社会问题。", "比如，散落在田间、路边及草丛中的塑料餐盒，一旦被牲畜吞食，就会危及健康甚至导致死亡。填埋废弃塑料袋、塑料餐盒的土地，不能生长庄稼和树木，造成土地板结。而焚烧处理这些塑胶垃圾，则会释放出多种化学有毒气体，其中一种称为二噁英的化合物，毒性极大。", "此外，在生产塑料袋、塑料餐盒的过程中使用的氟里昂，对人体免疫系统和生态环境造成的破坏也极为严重。"], "id": 480}]</script>
<script id="d-topics" type="application/json">{"news": [{"t": "穹顶之下·雾霾相关", "p": ["2015年2月28日上午，人民网发布了《柴静调查：穹顶之下》的专题和专访柴静的文章。由此引爆了公众对该纪录片的关注和对雾霾的讨论。", "中午，《穹顶之下》上线腾讯视频、优酷网、乐视网等各大视频网站。在播出之后，引发了网民的关注。下午开始，朋友圈等社交网络被柴静的雾霾调查刷屏。", "雾霾何时引起关注的呢？2013年，“雾霾”成为年度关键词。2013年1月，4次雾霾过程笼罩30个省（区、市），在北京，仅有5天不是雾霾天。", "早在1952年12月5日，雾霾就已经存在，12月的伦敦连续数日空气寂静无风。从12月5日到12月8日的4天里，伦敦市死亡人数达4000人。而在12月9日之后，由于天气变化，毒雾逐渐消散，但在此之后两个月内，有近8000人因为烟雾事件而死于呼吸系统疾病!", "雾霾来了我们怎么进行自我防护呢？答案是：调整出行、关闭门窗、避开人群、减少户外锻炼、戒烟、佩戴专业防护口罩"], "tips": []}, {"t": "穹顶之下相关事件", "p": ["截止2015.8.4日下午18:37分，网上在线观看的《穹顶之下》都无法播放，网站显示“视频已下线”。", "2015年3月1日，新任环保部部长陈吉宁在媒体见面会上表示，他昨晚认真地看了柴静的纪录片，今天一早就给她发短信，对她表示感谢。陈吉宁说，柴静的纪录片从公众健康的角度唤醒公众的环保意识，值得敬佩。对柴静的报道，用积极和善意的态度来鼓励这种行为。陈吉宁说，面对面的互动交流很重要，将认真采纳落实媒体意见。", "针对《穹顶之下》的评论，有不同的声音，大家从不同的角度解读，有人认为柴静的数据有问题，有人认为柴静的调查不够专业，有人认为不是两桶油的错，有人认为柴静从煽情入手是其惯用伎俩，更有人开始挖掘柴静的隐私……更有人认为柴静是美国的间谍。"], "tips": []}, {"t": "暴雨", "p": ["2015年5月5日以来，重庆、贵州、江西、广东等南方部分省份相继遭受暴雨袭击，重庆、贵州同时伴随大风冰雹天气。其中重庆137万人受灾，31人死亡，1人失踪，8.5万余人紧急转移；截至8日18时，江西23万人受灾，死亡7人、失踪5人；湖南省169万人不同程度受灾，目前已有13人因灾死亡或失踪。而至8日16时，广东已有16人死亡4人失踪。"], "tips": []}, {"t": "地铁站自杀 网友冷漠应对", "p": ["2月12日早上，北京地铁1号线发生一起悲剧，一名50多岁的男乘客跳下站台，列车进站两节后紧急停车，工作人员采取接触轨停电措施进行处理，急救中心赶到现场后确认该乘客已死亡。因车下空间狭小，无法抬出乘客，采取了很多措施才为抬出乘客留出空间，近一个小时后1号线才逐步恢复正常运营。", "事发时正值早高峰，这一事件对不少乘客的出行造成了很大影响，因此网上不少言论便指向了那名跳下站台身亡的乘客——有人说：跑地铁自杀，这属于严重危害公共安全；有人说：要死找个清净的、不影响别人的地方死不行么？还有人说，又来讹诈纳税人的钱，今天上班又要迟到了。"], "tips": []}, {"t": "彭宇案", "p": ["2006年11月20日早晨，一位老太在南京市水西门广场一公交站台等83路车。", "人来人往中，老太被撞倒摔成了骨折，鉴定后构成8级伤残，医药费花了不少。老太指认撞人者是刚下车的小伙彭宇。老太告到法院索赔13万多元。法院认为本次事故双方均无过错。按照公平的原则，当事人对受害人的损失应当给予适当补偿。因此，判决彭宇给付受害人损失的40%，共45876.6元。对于调解结果，彭宇在2012年1月左右也表示，在2006年11月发生的意外中，徐寿兰确实与其发生了碰撞，事后经法院调解，他对结果表示满意。"], "tips": []}, {"t": "小悦悦事件", "p": ["2011年10月13日，2岁的小悦悦在佛山南海黄岐广佛五金城相继被两车碾压，7分钟内，18名路人路过但都视而不见，漠然而去，最后一名拾荒阿姨陈贤妹上前施以援手，引发网友广泛热议。2011年10月21日，小悦悦经医院全力抢救无效，在零时32分离世。"], "tips": []}, {"t": "酒店万用毛巾", "p": ["2015年4月30日，有媒体曝光了杭城部分酒店在公共用品清洁消毒的过程操作不规范的问题，严重的甚至存在漱口杯、洗脸盆、马桶等用一块抹布擦到底的现象。被曝光的除了价格便宜的经济型酒店外，也不乏高档的星级酒店。"], "tips": []}, {"t": "三鹿奶粉", "p": ["2008年，很多食用三鹿集团生产的奶粉的婴儿被发现患有肾结石，随后在其奶粉中被发现化工原料三聚氰胺。根据公布数字，截至2008年9月21日，因使用婴幼儿奶粉而接受门诊治疗咨询且已康复的婴幼儿累计39,965人，正在住院的有12,892人，此前已治愈出院1,579人，死亡4人，另截至到9月25日，香港有5个人、澳门有1人确诊患病。事件引起各国的高度关注和对乳制品安全的担忧。"], "tips": []}, {"t": "纸馅包子", "p": ["訾北佳，原北京电视台生活频道《透明度》栏目临时人员。2007年6月间，他通过查访，在没有发现有人制作、出售肉馅内掺纸的包子的情况下，为了谋取所谓的业绩，化名“胡月”，冒充建筑工地负责人，到本市朝阳区太阳宫乡十字口村13号院内，对制作早餐的陕西省来京人员卫全峰等四人谎称需定购大量包子，要求卫全峰等人为其加工制作。后訾北佳携带秘拍设备、纸箱和自己购买的面粉、肉馅等再次来到十字口村13号院。訾北佳以喂狗为由，要求卫全峰等人将浸泡后的纸箱板剁碎掺入肉馅，制作了20余个“纸箱馅包子”。与此同时，訾北佳秘拍了卫全峰等人制作“纸箱馅包子”的过程。在节目后期制作中，訾北佳采用剪辑画面、虚假配音等方法，编辑制作了虚假电视专题片《纸做的包子》播出带，对北京电视台隐瞒了事实真相，使该虚假新闻得以于2007年7月8日在北京电视台生活频道《透明度》栏目播出，造成了恶劣影响，严重损害了相关行业商品的声誉。"], "tips": []}, {"t": "成都路怒症", "p": ["5月3日下午，一段35秒视频在网上疯传：在成都市娇子立交处，一名男司机将一女司机逼停后当街殴打，整个过程触目惊心。这段视频引发数万网友转发，数万网友谴责男子下手太重。", "锦江警方初步调查后认定，张某涉嫌寻衅滋事，于5月4日凌晨2时对其实施刑拘。4日，锦江公安分局公布了张某的道歉视频。", "当天，一位网友公布了行车记录仪，两人开“斗气车”的全过程曝光。视频显示，女司机多次强行变道，危及男司机和其他车辆的安全。舆论顿时逆转，纷纷指责女司机不顾他人安危，并“人肉”女司机各种行为。最终，女司机也发表声明，对自己的行为道歉。"], "tips": []}, {"t": "武汉路怒症", "p": ["2015年7月15日，两司机驾车在长江大桥上“互别”斗气，先后造成5车连环相撞（右图为现场视频截图），而且事故发生后，两人不忙着救人，而是当街厮打。武汉晚报记者昨从长江大桥交通大队获悉，此事故中的犯罪嫌疑人梁某、陈某，因涉嫌以危险方法危害公共安全罪，被汉阳警方刑事拘留。"], "tips": []}, {"t": "女友路怒症", "p": ["9月26日10点左右，白鹭洲天天渔港门口，一辆奥迪A8轿车连撞6辆车。肇事者为一女子，她和男友吵架，赌气开男友的车，故意冲撞了6辆车。后经警方调查，女子涉嫌酒驾。此外，据中国刑法，故意撞车或犯法，数额巨大或者有其他特别严重情节的，处三年以上七年以下有期徒刑。"], "tips": []}, {"t": "父子“路怒症”", "p": ["昨天上午10点48分左右，马鞍山市雨山路与军民路交叉口，一辆奔驰S350和一辆宝马Z4相互追逐，猛烈撞击，整个缠斗过程持续了三四分钟后，两车均严重损坏。", "记者调查获悉，两车驾驶员是一对父子，事发后弃车离去。"], "tips": []}, {"t": "你赔得起40万的车吗", "p": ["紫荆网9月30日北京电：据现代快报报道，9月27日中秋节当天，南通如皋市百花苑小区附近，一名疑似酒驾的男子因车辆发生轻微碰擦，将一名骑自行车的少年拽下来就打。附近居民上前阻拦，这名开宝马的男子还骂骂咧咧，最终被赶来的民警制服并带走。男子因殴打他人已被警方处以行政拘留。", "据知情人士戴先生介绍，当天下午2点10分左右，就在两车交错而过时，由于车距较近，自行车与轿车的右侧反光镜碰撞了一下。“那个小孩没有停车，继续往前走。张某直接把车往路边一停，拉开车门走了下来。”目击者称，当时张某满身酒气，下车后走过去直接把男孩从自行车上拽了下来，随即挥拳就打，“我这车四十多万，你赔得起吗？”"], "tips": []}, {"t": "电梯吞人", "p": ["7月27日，湖北荆州市安良百货商场尚在正常营业，5至7楼的手扶电梯被蓝色的幕布遮挡着，但市民仍能通过直达升降电梯上楼。就在一天前，幕布内的手扶电梯吞噬了一位31岁的年轻妈妈。", "27日晚，在荆州市政府举行的新闻发布会上，荆州市安监局局长陈观鑫通报，发生事故5分钟前，商场工作人员发现电梯盖板有松动翘起现象，但并未采取停梯检修等应急措施，导致当事人踏在已松动翘起的盖板最末端时盖板发生翻转，坠入上机房驱动站内防护挡板与梯级回转部分的间隙内，属于安全生产责任事故。"], "tips": []}, {"t": "大妈殴打环卫工", "p": ["昨日，62岁环卫工陈阿姨在郑州某处打扫卫生，健身大妈说受到影响，抢过扫帚跺成两截，用力向她敲去，还说“让你在这干就干，不让你干明天就让你滚蛋。”陈阿姨手背被敲出大包。大妈还报警称环卫工打她，目击者纷纷作证称其满嘴瞎话。"], "tips": []}, {"t": "大妈不让学生玩手机", "p": ["近日，网上一位大妈投诉乘客玩手机的视频在网上流传，引起网友关注。大妈看到自己坐的公交上，几乎每个人都在玩手机，于是大妈直接在车上打热线电话，投诉车上的乘客玩手机，大妈在电话称：“年轻人都在车上玩手机会辐射老年人皮肤，危害别人身体健康，都活不下去了。车上玩手机和吸烟危害都是一样，坐车玩手机就得罚钱。要有担当。”"], "tips": []}, {"t": "讽刺的“最美女教师”", "p": ["2006年前后，郜艳敏的故事被许多国内外媒体报道。一时间，郜艳敏、她的家人、她所在的下岸村乃至曲阳县都陷入了舆论的漩涡。", "今年7月28日，一篇名为《最美乡村教师候选郜艳敏：被拐女成为山村女教师》的旧文被网友翻出，郜艳敏再次成为舆论热点。"], "tips": []}, {"t": "日本出租车道歉态度", "p": ["海外网8月1日电近日，微博网友@蔡成平爆料称，自己在日本坐出租车，遭遇拒载，愤而投诉。事后，日方整个出租车公司都被惊动，几位高管登门道歉，携带道歉信。决定严厉处分司机，公司将在7/31、8/1召开特别研修会，对全体员工就拒载问题彻底强化意识教育。"], "tips": []}, {"t": "天津爆炸  “逆行者”", "p": ["2015年8月12日23:30左右，天津滨海新区第五大街与跃进路交叉口的一处集装箱码头发生爆炸，发生爆炸的是集装箱内的易燃易爆物品。现场火光冲天，在强烈爆炸声后，高数十米的灰白色蘑菇云瞬间腾起。随后爆炸点上空被火光染红，现场附近火焰四溅。", "第一次爆炸发生在2015年8月12日23时34分6秒，近震震级ML约2.3级，相当于3吨TNT；第二次爆炸发生在30秒钟后，近震震级ML约2.9级，相当于21吨TNT。", "国家地震台网官方微博“中国地震台网速报”发布消息称，“综合网友反馈，天津塘沽、滨海等，以及河北河间、肃宁、晋州、藁城等地均有震感。 ”", "2015年8月12日晚22时50分接警后，最先到达现场的，是天津港公安局消防支队。", "截止2015年8月13日早8点，距离爆炸已经有8个多小时，大火仍未完全扑灭。因为需要沙土掩埋灭火，需要很长时间。相关企业负责人已被控制。"], "tips": []}, {"t": "真·老坏人", "p": ["渝北区金港国际某皮具店里，一个500多元的黑色皮包不翼而飞。调监控录像却发现，四个六七十岁的老人将皮包偷走了，一位爷爷，三位奶奶……警方分析，该团伙作案手法相当熟练，怀疑不是初次作案，目前正在侦破当中。"], "tips": []}, {"t": "大爷用衣服擦公交车地板", "p": ["据华商报报道，2015年9月18日，山东威海市文登区3路公交车，遇一个大爷坐公交，刚投了一元钱，司机却让他下车，因为大爷拿的东西漏水。大爷说钱怎么办？", "司机说，钱投了就投了。大爷不舍得一块钱，不下车，最后没办法，脱了自己的衣服跪在公交车上擦车！目前，该司机已被做停职处理。"], "tips": []}, {"t": "人大教授断绝师生关系", "p": ["2015年9月20日，中国人民大学历史学院教授孙家洲发布公开信，申明要断绝与新招硕士生郝相赫的师生关系，原因是学生郝相赫在朋友圈发布的微信“居然对北大阎步克教授、人大韩树峰教授无端嘲讽”。该学生发表“情况说明”进行反驳，昨天又收回“情况说明”，并进行道歉。校方表示将按程序处理。"], "tips": []}, {"t": "正能量·4毛钱处方", "p": ["据10月12日消息，西安刘女士的爱人王先生患有高血压，一直吃着降压药控制病情，然而，在国庆期间，王先生的血压一直降不下去，吃药也没用。10月7日，刘女士和孩子将王先生送到家附近的五二一医院挂急诊，医生居然只开了4毛钱的药就让王先生的血压降下来了，刘女士对此非常惊喜，表示“很少见”“很不可思议”，同时也“很开心”，刘女士称，“我活了53岁，第一次碰到这样的好大夫。"], "tips": []}, {"t": "以死相逼买苹果手机", "p": ["近日，重庆一22岁小伙逼母亲买6s新闻让网友感到十分荒谬。据悉该小伙嫌弃自己iPhone4S抢红包速度太慢，逼母亲买6s。母亲不同意，他就摔掉了旧手机，还要跳楼自杀。", "小王的母亲李女士告诉民警，儿子今年22岁，几个月前曾在一家理发店打过3个月的工，因为嫌工作苦、工资低就辞职了，至今一直在家待业。自己已经退休在家，退休金每个月只有1000多元，丈夫在广东打工，每个月寄回来的钱也不多，根本拿不出那么多钱给儿子换新手机，儿子一气之下摔了自己的手机，还嚷着要自杀。"], "tips": []}, {"t": "老师扔学生手机", "p": ["浙江传媒学院社会学教师戴老师是社会学博士，有七年教学生涯。10月26日下午，她有一节社会学概论课，听课的是播音专业的学生。到课却不听课，学生上课低头玩手机，如今非常普遍。戴老师从一开始，就以“最卖力的方式”说出了狠话，来严肃课堂纪律。她认为上她的课，就要遵循她制定的规章制度，否则走人。她对学生们的低头行为深恶痛绝，多次要求学生们认真听课。戴老师曾在朋友圈中写道：我自知才学有限，但从来不敢懈怠课堂，始终视之为最神圣的所在。平心而论，父母赚钱不易，谁都不应肆意破坏。但强调了八周之后，10月26日，她还是看到了她最不想看到的一幕——有两位播音专业的学生，低着头闷声玩手机，完全没有理会课堂。戴老师终于爆发了，两台iPhone6s从窗口飞了出去。"], "tips": []}, {"t": "乱踩花田没道德", "p": ["2015年10月20日，十月中旬左右，位于上海金山区吕巷镇一片烟粉色的粉黛乱子草花田意外走红，不少市民组团前往探访美丽的田野。然而，短短几天时间，成片的粉黛乱子草花田被踩秃，梦幻花田已经面目全非。经过上个双休日，这片花田的主人单先生发现，部分植株的根部被践踏后受损严重，可能明年无法再发芽生长。为了自救，10月19日单先生安排收割机进场，将受损最厉害的8亩粉黛乱子草提前收割。"], "tips": []}, {"t": "孙楠退赛 汪涵应变", "p": ["2015年3月27日《我是歌手》第三季总决赛直播现场，孙楠临时宣布退出总决赛第二轮竞演，汪涵紧急救场，临危不乱，体现出一个主持人超高的专业素养，网友们纷纷点赞，并评价说：“安排时间，安抚观众，表明立场，很含蓄的讲话不失分寸，淡定从容。”同时调侃道，“汪涵才是最大的赢家。”"], "tips": []}, {"t": "杨澜应变", "p": ["1991年杨澜在一次在广州体育中心演出时，没留神下台阶时摔了一跤。在众目睽睽之下，出现这种现象，的确令人难堪。杨澜非常沉着地爬起来，凭着主持人特有的口才，对台下的观众说：“我刚才这个动作可不怎么优美，可是在接下来的杂技表演中，您将欣赏到精彩的动作表演狮子滚绣球。”"], "tips": []}, {"t": "春晚黑色三分钟", "p": ["2007年的春节联欢晚会，在倒计时之前，主持人串词接连发生口误，抢词、忘词等连续不断的出现，被网友们称之为“央视春晚黑色三分钟”，该视频在网上大量流传，成为央视春晚的一大败笔。为了不让“抢词事件”继续扩大，央视在初一重播的春晚已经是重新经过剪辑，重播的“零点敲钟前”的节目是15日录制的备播带。"], "tips": []}, {"t": "明星婚礼秀", "p": ["从文章、陈赫出轨，黄海波嫖娼开始，明星的私生活总会在互联网上掀起波澜。更何况是前段时间周杰伦和昆凌、黄晓明和杨颖的婚礼，更是让网友们如同打了鸡血一般，微博和朋友圈里几乎都在传播着明星们的私生活。直到官方媒体人民网发声了：“明星婚礼秀”可以少搞些！"], "tips": []}, {"t": "马加爵", "p": ["马加爵，从小到大成绩优异，2000年至2004年就读于云南大学生化学院生物技术专业；2004年2月13日晚杀一人，2月14日晚杀一人，2月15日再杀两人，后从昆明火车站出逃。2004年3月15日被公安部列为A级通缉犯；2004年6月17日被执行死刑。"], "tips": []}, {"t": "学生捅老师", "p": ["2017年11月12日，江市第三中学47岁的中学班主任鲍方，在办公室被他所带的实验班的16岁的学生罗军刺了26刀，在送医途中死亡。"], "tips": []}, {"t": "幼儿园针眼", "p": ["2017年11月22日，有十多名幼儿家长反映北京朝阳区管庄红黄蓝幼儿园（新天地分园）国际小二班的幼儿遭遇老师扎针，喂不明白色药片，并提供孩子身上多个针眼的照片。据新京报报道，朝阳警方已介入事件调查。幼儿园工作人员表示，院长正在配合警方调查因此无法接受媒体采访。"], "tips": []}, {"t": "豫章书院", "p": ["近日，有网友在微博爆料称江西豫章书院修身教育专修学校(简称：豫章书院)打死了一名学生，紧接着就有网友爆料称很多小孩子在里面受到了非人的虐待。", "有网友称，这个学校比杨永信的戒网瘾学校还黑暗，声称是为了保护未成年人，实际上是在虐待学生。有网友气愤的称他和集中营没有什么区别。"], "tips": []}, {"t": "携程亲子园", "p": ["携程亲子园，是携程开办的企业内部托幼点，委托《现代家庭》杂志社读者服务部（为了孩子学苑）日常运营管理，自2016年春节后正式运营。", "2017年11月初，携程托管亲子园教师打孩子的视频在网上流传，视频显示，教师除了殴打孩子，还强喂幼儿疑似芥末物。[1]", "2017年11月9日，长宁警方于以涉嫌虐待被监护、看护人罪对携程亲子园的三名工作人员依法予以刑事拘留；11月13日以涉嫌虐待被监护、看护人罪，对携程亲子园实际负责人郑某依法予以刑事拘留。"], "tips": []}, {"t": "食品安全法", "p": ["6月11日下午,全国加强食品安全工作电视电话会议在京召开。会议指出,新修订的食品安全法较好地体现了广大人民群众的意愿,标志着我国食品安全工作在法治轨道上又迈出了重大步伐。会议强调,各地各部门要充分认识加强食品安全工作的重大意义,切实增强忧患意识和责任意识,认真贯彻落实中央关于食品安全工作的决策部署和新修订的食品安全法,努力保障人民群众“舌尖上的安全”。", "会上,公安部、国家质监总局、食药监总局等部门负责人就贯彻落实新食品安全法进行了部署。会议要求加快制修订食品安全标准,加大信息公开力度,建立食品质量追溯体系,加快构建全社会共同参与的食品安全监管体系,不断提高食品安全保障水平。", "据介绍,我国现行的食品安全法于2009年施行,今年4月24日,十二届全国人大常委会第十四次会议24日表决通过了新修订的食品安全法,新食品安全法体现严惩重处原则,强化了食品安全刑事责任的追究,被称为“史上最严”,新法将于今年10月1日起施行。"], "tips": []}, {"t": "校服规定", "p": ["7月14日，继国家标准委发布中国首个专门针对中小学生校服产品的国家标准后，教育部、工商总局、质检总局、国家标准委联合下发《关于进一步加强中小学生校服管理工作的意见》。《意见》允许学生按照所在学校校服款式、颜色，自行选购、制作校服。", "昨天，记者从我市部分中小学了解到，武汉市已经有部分中小学试水个性校服，今后，也将有越来越多的校服会慢慢“靓起来”。"], "tips": []}, {"t": "学驾照", "p": ["继去年热播韩剧《来自星星的你》引发国人对炸鸡啤酒的狂热追捧后，近来又出现一股国人赴韩考驾照的热潮，尤其是前往对中国人免签的济州岛。", "韩国官方数据显示，2010年有68名中国人在济州岛取得驾照，到2014年猛增至991人。截至5月，今年济州岛已向1093名外国人发放了驾照，其中中国人占了90％。", "记者调查发现，容易通过、价格低廉、拿证快捷是国人舍近求远，扎堆济州岛考驾照的主要原因。这也让不少人看中其中的商机：许多济州岛驾校雇佣了中文翻译人员，不少旅行社更是推出“驾照＋观光”的旅行产品。"], "tips": []}, {"t": "女士停车位", "p": ["昨日，贵阳某医院在停车场入口处，特设7个只允许外来女司机停车的专用车位。对此，有市民认为是性别歧视，也有市民认为医院的做法体现了人性化。", "经开区某医院内停车场开出7个停车位，专为外来女司机停车所用，车位开放仅一个小时就被停满。在这些特殊的停车位外围，有一排贴有标语的安全锥，上面还写着“外来女司机专用停车”。"], "tips": []}, {"t": "卖水果老夫妇", "p": ["今天（7月31日）凌晨，郑州街头发生一起悲剧。一对进城卖水果的老夫妇，因为晚上没有住处，在一家酒店门口席地而睡，然而，在睡梦中却遭到一辆轿车碾压，老大爷当场身亡。"], "tips": []}, {"t": "地铁不许喝饮料", "p": ["《南京轨道交通管理条例》（以下简称《条例》）正式实施，新条例增加了禁止在列车内饮食等规定。现代快报记者了解到，自从《条例》实施以来，乘客在地铁上吃东西的现象大大减少了。不过，9月28日，一条关于一对夫妻在南京地铁车厢内喝饮料被处罚的消息在微博上引发讨论。对此，南京地铁方面曾表示，在车厢内喝水是否会被处罚，要根据现场情况界定。现代快报记者 李宇龙"], "tips": []}, {"t": "地铁跷二郎腿", "p": ["10月15日，杭州地铁官网转发了一条“文明乘坐地铁，拒绝车厢二郎腿”的倡议。一时间，引起网友广泛讨论。", "不少网友吐槽：难道坐地铁的姿势也要管？网友里白说，我在地铁里面怎么坐都要管，那我走路是不是也应该有个标准啊？难道叫我走慢四步吗？", "但也有网友认为，公共场合跷二郎腿既影响通行又不雅观。网友许先生说，一方面是容易刮蹭到他人、影响通行；另一方面或多或少挤占了其他乘客的站立空间，在公共场所，要为他人着想。据《钱江晚报》"], "tips": []}, {"t": "八项规定下的中秋月饼", "p": ["昨日中秋节。“八项规定”实施第3年，尽管全国总工会规定基层工会逢年过节可以向全体员工发放少量节日慰问品，深圳市总工会昨日也向南都记者表示，反对借“八项规定”之名削减正常福利待遇。但深圳大多政府部门已经不再发月饼，有一位副处级官员甚至认为，没有必要去冒发月饼“这个风险”，想吃自己买。"], "tips": []}, {"t": "青岛大虾", "p": ["2015年10月4日，有网友爆料称，在青岛市乐凌路“善德活海鲜烧烤家常菜”", "吃饭时遇到宰客事件[1]，该网友称点菜时已向老板确认过“海捕大虾”是38元一份，结果结账时变成是38元一只，一盘虾要价1500余元。经游客报警之后，经过警察协调，买单一千三百多。"], "tips": []}, {"t": "张家界低价游宰客太猖狂！导游：信不信让你走不了", "p": ["湖南张家界国家森林公园，400左右的低价两日游到处都是，称费用全包。", "上车后自费项目竟必须交钱，诱骗游客加钱走“特殊路线”。面对质疑，导游放言：此路是我开！还威胁游客：信不信让你走不了.……这又是要整出一个“天价虾景区版”的节奏吗？9日晚，张家界市旅游主管部门对两起旅游宰客事件依法依规进行顶格查处，并于10日公布了处理决定，其中包括处以严格罚款、报请吊销涉事单位证照、涉事导游暂扣导游证等处罚。"], "tips": []}, {"t": "职业打假人一口气买10万元存在质量问题的牛肉干", "p": ["山东广播电视台10月14日讯因为在邹城百货大楼发现天和隆牌的牛肉干价格明显低于市场价，济宁的王大哥一口气买了十万块钱的牛肉干，找相关机构检测发现牛肉干没有牛肉成分，天和隆公司的销售人员称，牛肉干的生产厂家在广西，但当地食药局工作人员调查发现，销售人员口中的食品厂已经荒废。王大哥是传说中的“职业打假人”。王大哥没有避讳，他也承认自己购买有问题的牛肉干，就是要根据《食品安全法》的规定，假一赔十，获得索赔。"], "tips": []}, {"t": "关于指导家庭教育工作的意见", "p": ["（2015年10月29日）“‘狼爸’打孩子是教育的艺术吗？”“‘虎妈’的教育理念有没有合理性？”……关于家庭教育，很多人有自己的看法，却也容易“说不好”，迷失在各种似是而非甚至南辕北辙的理念中。", "日前，教育部印发了《关于加强家庭教育工作的指导意见》，明确了家长在家庭教育中的主体责任，要求广大家长依法履行家庭教育职责，严格遵循孩子成长规律，不断提升家庭教育水平。看似松散宽泛的家庭教育，有了政府指导意见和“国标”。"], "tips": []}, {"t": "旅游线路调查", "p": ["新京报讯昨日上午，中国消费者协会发布《国内部分旅游线路体验式调查报告》。报告显示，本次体验调查的96条线路中，74%以上的线路存在相对严重的问题。其中，超三成的体验员反映，导游有安排超计划购物、强迫购物的行为。", "对于强制或诱导购物问题，不少导游表示因为工资太少，收入主要靠购物回扣。", "对此，国家旅游局监督管理司副司长余繁表示，目前国家旅游局正在研究推动导游体制改革，近期将会选择一些地方进行试点。"], "tips": []}, {"t": "电视购物问题多", "p": ["据法制晚报报道，今天上午，中消协召开电视购物服务评测通报会，会上披露，中消协的工作人员以普通消费者身份对33家卫视购物栏目和12家专业购物频道(7-8月间播放)进行信息采集和样品购买，并与8-10月就电视购物服务中涉及的售后服务、样品部分指标、宣传信息等方面对进行了体验、测试和评价。", "从体验来看，发现一、卫视购物栏目样品购物发票和购物单据缺失严重；二、七天无理由退换货服务体验差;三、部分电视购物商家物流信息确实较多;四、个人信息保护存隐忧。", "从部分指标测试和查验结果来看，本次评测活动送检样品118款，有17款电视购物样品存在产品相关证件过期或不符、产品标示或代号缺失、卫生指标、安全指标或功能指标等不符合国家相关标准等问题。"], "tips": []}, {"t": "禁止个人募捐", "p": ["央广网北京11月9日消息                                 据中国之声《新闻晚高峰》报道，近日，《中华人民共和国慈善法（草案）》首次提请全国人大常委会审议。其中，草案第31条规定：不具有公开募捐资格的组织或者个人，不得采取公开募捐方式开展公开募捐。专家分析，禁止个人募捐的提法，是针对近年来各种各样的骗捐事件而划出的法律“红线”，无疑是为了慈善事业的健康发展。然而，这样的提法也引发了很多求助者和公益人士的担忧。", "有人表示，尽管慈善领域有乱象，并不代表所有以个人身份向社会求救募捐的都是骗取爱心。特别是“自救型”个人募款，不该被一刀切划入禁止范围内。你认为，在慈善组织尚不发达的当下，是否该禁止个人募捐？区分辨别求助募捐信息的真伪，你有什么好的建议？"], "tips": []}, {"t": "为玩游戏用救命钱", "p": ["两年前，22岁的安徽小伙小张因尿毒症在浙大一院肾脏病中心做了活体肾移植手术，当时，他妈妈将自己的一个肾脏捐给他。手术后，小张开始麻痹大意。小张发现偶尔几次忘了吃抗排异药物，也没感觉到有任何异样，每次到医院检查，结果都正常。过了半年，小张觉得人没力气，胃口也不好，到医院检查才发现，移植的肾脏已经失去功效，不起作用了。小张在追问下终于说了实话：这两年来，他并没有按照医嘱吃药做检查，他把家人给的医药费偷偷省下来，到网吧里玩游戏了。"], "tips": []}, {"t": "男孩在课堂上猝死", "p": ["11月10日早晨，南阳市十三中九年级十二班学生云博，因心脏骤停突然晕倒在早自习的课堂上，待120急救车赶到时已无生命体征。", "据了解，云博今年15岁，一个学习勤奋努力的男孩，生活在一个单亲家庭。", "当天早晨7时左右父亲将他送到校门口后离开。7时30分左右，云博在早读课堂上突然出现昏迷，被120急救车送往医院抢救无效死亡。头天晚上写作业写到12点多，早晨6时20分起床，没有发现啥异常情况。"], "tips": []}, {"t": "高考乱象", "p": ["因户籍限制，张图无法在京高考。父亲无奈下将孩子送进国际班，准备出国留学。随后，有美国国籍的前妻提供援助，儿子很快能以美国公民身份参加“美国高考”", "。奇妙的是，变成美国人，孩子又能在京高考，根据政策，外国侨民享有参加北京高考资格。", "其他"], "tips": []}, {"t": "励志肉夹馍小贩", "p": ["——人生之道", "来自河南洛阳的谢云峰只能听懂one、two、three，连four都听不懂，但是这不妨碍他在哥伦比亚大学（位于纽约曼哈顿）门前做摊车小贩，卖肉夹馍、凉皮之类，生意好的时候一天可以有七八百美元的收入。"], "tips": []}, {"t": "公共餐具喂狗", "p": ["2017年8                                月                                 19日中午，在大连柏威年地下一层美食广场，一对男女把奶茶倒进公共餐具后，让宠物狗舔食碗里的奶茶。现场照片被传到网上后，引发了网友的热议。这件事儿，你是怎么看的？"], "tips": []}, {"t": "发帖吐槽食堂被刑拘", "p": ["近期，河北邯郸涉县一男子因为发帖吐槽新医院食堂价高难吃，被涉县公安以涉嫌扰乱公共秩序的理由行政拘留，引发了网友热议。邯郸警方不久后在微博回应称：涉县公安局原处罚决定已撤销，当事民警已被追责。", "对于此事，你怎么看？"], "tips": []}, {"t": "八达岭公园又出事", "p": ["2017年8月18日，八达岭野生动物园再次发生自驾游客擅自开窗遭动物袭击事件。游客陈先生打开车窗投喂食物，结果被熊咬伤左臂。昨日下午，野生动物园方面回应新京报记者称，在该乘客进入时，园区已经向其发放了“不许开窗”通知。"], "tips": []}, {"t": "正能量·大妈见义勇为", "p": ["8月14日，河南杞县4岁多男童小海（化名）意外坠入一口深达15米的深井中，路过看到这一幕的68岁村民蒲金花来不及多想，滑入井中将孩子从水里救起。半小时后，赶来的村民合力将二人拉上来。", "当日，翟伟夫妇给蒲金花送去一面写有“见义勇为，舍己救人”的锦旗，翟伟欲酬谢蒲金花，被婉言谢绝。18日，蒲金花救落井儿童的行为被确认属于见义勇为。杞县县委宣传部工作人员表示，该县已向全县广大干部群众发出倡议，向蒲金花学习，学习她奋不顾身、舍己救人的壮举，争做见义勇为的模范。"], "tips": []}, {"t": "海底捞火锅", "p": ["今年5月初，记者通过面试和入职培训后进入海底捞劲松店。入职第一天，记者就在后厨的洗杯间发现了老鼠的踪迹。接下来的几天里，记者陆续在海底捞劲松店后厨的配料房、上菜房、水果房、洗碗间、洗杯间等各处发现了老鼠的踪迹。有的老鼠会爬进装着食物的柜子里。", "事件曝光后，海底捞迅速（8小时内）进行回应，承认媒体的相关报道属实。同时，发出了致歉信。"], "tips": []}, {"t": "“艺术点亮生命”活动", "p": ["对于现在的刷爆朋友圈却又在关键信息上并未公开的“艺术点亮生命”慈善募捐活动，你怎么看？No.8"], "tips": []}, {"t": "不看好孩子", "p": ["前两天，在江西赣州安远街头，上演惊险一幕，一辆电动三轮车突然像发了狂一样，冲入人群里，一名八旬老汉遭遇不测。", "警方调查发现，肇事的电动三轮车，之所以会突然失控撞倒老人，与一名4岁大的小女孩误操作了电动三轮车有关。当时她叔叔带着女孩骑着电动三轮车在街上买东西。女孩的叔叔看到卖鱼头的，就问老板买鱼头，当时车钥匙没有拔，女孩就模仿大人，猛加电动三轮车的油门，结果就出了意外。"], "tips": []}, {"t": "民警执法过度", "p": ["9月1日上午，一段“抱孩子女子推搡交警被撂倒”的视频在朋友圈热传，警方执法方式引发争议。", "这段被热传的视频显示，一名身着粉色上衣的中年女子抱着孩子，与两名交警发生口头争执，女子上前推搡一名交警，随后被两名交警撂倒。孩子被摔在地上，大声痛哭，后被路过市民抱起。"], "tips": []}, {"t": "挪用公款打游戏", "p": ["西安一位24岁女子皇甫某在该市一家电器公司上班，主要负责网络销售工作。但她却利用职务便利，挪用单位公款达108万之多。而挪来的钱竟全用来购买Q币玩游戏。由于无法及时还清欠款，还曾有企图删除销售信息来掩饰自己犯罪的行为，其被公司告上了法庭。而皇甫某的母亲为了帮她还钱，已卖掉了老家唯一的住宅。"], "tips": []}, {"t": "大妈地铁偷手机", "p": ["大学生小薛反映，9月4日她从武昌乘地铁2号线前去江汉路面试，快到积玉桥站时因低血糖发作晕倒在车厢，一群好心人给她喂吃的，但一名花衣大妈却趁机将小薛的手机和身份证等偷走。事后，小薛和男方联系上花衣大妈，对方索要800元酬金。", "报道此事后，花衣大妈的行为引起广大网友愤慨，武汉轨道警方也高度重视，连日侦办此案。今日，据轨道警方介绍，9月12日晚11时许，办案民警在嫌疑人家中将其抓获，追回被盗手机、身份证和公交卡。经查，嫌疑人张某58岁，武汉人，其承认9月4日在武汉地铁2号线偷走女大学生手机等物品的违法行为。今天上午，武汉轨道警方依据《治安管理处罚法》第四十九条对张某予以治安拘留7天的处罚。"], "tips": []}, {"t": "快递延误“救命药”", "p": ["10月6日，杭州的王先生接到老家四川阆中的电话，说亲戚在医院抢救，病情危急，急需一种叫“申捷针”的特效药，但这种药在阆中买不到，家里人让他试试在浙江能不能买到.10月9日，王先生委托同事花了3200多元买了10支“申捷针”，他还让买药的同事跟工作人员强调：“这是抢救病人的急需的药”。接单的快递员承诺4天以内可以送达。", "10月13日下午，王先生的亲戚被医院宣布脑死亡，而快递还在成都准备发往南充。"], "tips": []}, {"t": "鱼眼中“诡异的光”", "p": ["浙江今年高考阅读题《一种美味》描述了贫寒的一家五口拿着六岁的小儿子从水沟里捉到的草鱼烧鱼汤的情景。文章结尾有这么一句话：“现在，它早已死了，只是眼里还闪着一丝诡异的光”。而最后一题问的也是“诡异的光指的是什么？”而该文作者巩高峰发微博表示，自己对于自己的文章也只能“阅读”无法“理解”，并称：“标准答案没出来，我怎么知道我想表达什么，我怎么知道结尾有什么意义”"], "tips": []}, {"t": "万圣节抢糖果", "p": ["昨晚在上海某便利店，有家长万圣节装束的小朋友进到店内，拿了许多巧克力和糖果后，对店员说道“不给糖果就捣乱”。最后，超市的店员为这些孩子拿的糖果买了单。据网友了解，来店内的隔壁小区的邻居带来的小孩，且店家不希望接受采访。"], "tips": []}, {"t": "手挽手，挡车牌", "p": ["10月18日晚十点左右，因河为辖区出现大雾，德州辖区通向河北的省际收费站封闭，导致部分路段出现压车现象。10月19日上午，德州高速交警视频巡逻人员在工作中发现，在青银高速446公里河北方向，有两辆小型汽车，在应急车道缓慢行驶。与此同时，更为滑稽的是有两名女性乘车人，在摄像头可视范围内手挽手，并排与车同步前行。", "其目的显而易见，就是为了将机动车号牌进行遮挡，再违法占用应急车道行驶，妄想能逃避摄像头抓拍处罚。"], "tips": []}, {"t": "校园暴力被判刑", "p": ["2017年11月2日，北京五名未成年少女因校园欺凌，分别获刑一年及11个月。今年2月，这五名女生和在校内无故殴打、辱骂两名同学，造成其中一人精神抑郁，至今无法正常生活学习。法官认为虽是未成年人，但随意殴打他人致伤，已构成寻衅滋事罪，依法应予惩处。"], "tips": []}, {"t": "规范外卖，必须有实体店", "p": ["西部网讯（陕西广播电视台广播新闻部记者王兵兵）国家食品药品监督管理总局11月10日发布《网络餐饮服务食品安全监督管理办法》，其中，明确规定“入网餐饮服务提供者应当具有实体经营门店”。", "本次发布的《网络餐饮服务食品安全监督管理办法》共46条，其中规定，入网餐饮服务提供者应当具有实体经营门店并依法取得食品经营许可证，按照食品经营许可证载明的主体业态、经营项目从事经营活动，不得超范围经营。网络销售的餐饮食品应当与实体店销售的餐饮食品质量安全保持一致。", "此外，《办法》还要求网络餐饮服务第三方平台提供者，对入网餐饮服务提供者的食品经营许可证进行审查，保证入网餐饮服务提供者信息真实。县级以上地方食品药品监督管理部门查处的入网餐饮服务提供者有严重违法行为的，网络餐饮服务第三方平台提供者，要立即停止对其提供网络交易平台服务。据了解，本次新规将于2018年1月1号起施行。"], "tips": []}, {"t": "孕妇自杀事件", "p": ["8月31日，在陕西榆林市第一医院，待产孕妇马某跳楼自杀身亡，一尸两命。之后，医院发表声明称，院方之前向产妇、家属建议实施剖宫产，然而家属坚持顺产，并在《产妇住院知情同意书》上签字，表示希望顺产。"], "tips": []}, {"t": "租女友", "p": ["2017年1月，沈阳皇姑区的一家婚介所，临近过年“租女朋友”回家过年相当火爆，价格也是明码标价，让父母见一见，不过夜的几百块钱，2天1夜2000元-3000元不等！但过夜的话，婚介所的人得跟着。据悉，被“出租”的女孩是在改婚介所征婚的，也就过年才配合他们借这个业务。律师：“租女友”不受法律保护。"], "tips": []}, {"t": "最严交规实施:闯黄灯扣6分", "p": ["被称为“史上最严交规”的修订版《机动车驾驶证申领和使用规定》于2013年1月1日起施行。新交规中对闯黄灯、故意遮挡号牌等违法行为也大了处罚力度，而这在车主中引发不少争议。", "新规规定，驾驶机动车违反道路交通信号灯通行的，一次扣6分。抢黄灯行为属于违反道路交通信号灯通行，对驾驶人处20元以上200元以下罚款，记6分。"], "tips": ["1.新交规实施后交通情况改善2.后期交规变更为“闯红灯”迫于压力，黄灯的作用为何？"]}, {"t": "农民工坐轻轨怕弄脏座椅蹲在门边 网友感动钦佩", "p": ["1月16日下午，重庆轨道交通官方微博发了这样一条微博：“1号线列车内，一位农民工兄弟宁愿一直蹲着依偎在妻子身旁，也不愿坐下，怕自己的衣服弄脏坐椅。兄弟，看穿着就知道你进城打工很辛苦，累了就坐下吧。即使你衣服上的尘土弄脏了坐椅，列车到终点我们的保洁人员也会及时清洁的。”"], "tips": ["1.农民工歧视问题2.“有素质的”农民工行为和“没素质的”文明人轻轨恶习"]}, {"t": "24岁女大学生就落水儿童溺亡,生前已被保研", "p": ["1月31日下午,放寒假回到四川老家的山东科技大学大四学生谢小利,外出时勇救落水儿童不幸溺水身亡,年仅24岁。谢小利生前学习成绩优异,已被保送本校研究生。谢小利不会游泳。"], "tips": ["1.大学生和落水儿童的社会价值辨析2.理智救人，掂量自己能力再救人"]}, {"t": "老汉公交车上暴打未让座女孩 揪其头发拳脚相加", "p": ["郑州一网友上传了一段时长33秒的视频，并很快在网络上传开。在视频中，公交车上，一名头戴黑色帽子、约60岁的男子拽住一名年轻女孩，将其拖至下客门口，并挥拳打在女孩身上，此时下客门打开，老人试图拽住女孩将其拖下车，几名乘客上前将二人分开，老人随后跳下车离开，车门关闭，女孩试图追下车被其他乘客拦住。女孩站在下客门带着哭腔指着已经下车的老人说：“你太过分了，你站在旁边，我根本就没看到你，说一句不就妥了，你还这样！”车上不少乘客批评老人的行为：“咦，这老头咋这样？太过分了！”"], "tips": ["1.让座是否必须？", "2.矛盾的源头和焦点是美德与素质。"]}, {"t": "千万富翁嫌没有地位考公务员:不想办事时低声下气", "p": ["年近三十的浩宇大学毕业后，接管了家里的生意，当上了老板。几年里，他的生意越做越大，去年身价已达到千万，在当地也是小有名气。在外人眼里，浩宇家庭幸福、事业有成，可浩宇却渐渐有了新想法。“虽然衣食无忧，但总觉得少点什么，心里不踏实。”", "浩宇告诉记者，每当看着身边在体制内当公务员的朋友，工资虽然不多，只有1000多元，但生活品质很高，出门很让人尊敬，很让他羡慕。2月24日下午，正月十五这一天，浩宇独自启程来到哈尔滨，开始了一个月的公务员考试培训学习。浩宇希望用公务员的身份来改变之前到相关部门办事时低声下气的窘状。"], "tips": ["1.当中国公务员为何这么“受欢迎”", "2.国考大军的现状"]}, {"t": "“大概8点20分发”", "p": ["2013年央视3·15晚会制造的一条网络流行语。晚会播出过程中，何润东突然以“#315在行动#”为标签在微博上指责苹果手机，但内容结尾竟出现一句“大概8点20分发”，此举立即被网友质疑是为央视3·15晚会当“托”。后何润东否认自己所发并报警，引发网友口水战。"], "tips": ["无论是否是明星为315晚会当托，明星都必须注意自己的言论。", "“315”晚会是打假晚会，如果自己都需要托，那便失去了打假的意义。"]}, {"t": "17岁女孩扶孕妇回家遭猥亵杀害", "p": ["17岁女孩扶孕妇回家遭猥亵杀害，博友悼念！黑龙江孕妇谭某为满足丈夫白某性需求，装病骗17岁女孩胡伊萱扶其回家，将其迷晕后白某对正在生理期的女孩实施猥亵后杀害并掩埋尸体。31日晚桦南县千余名市民自发组织祭奠。为天使女孩点一支蜡烛，愿天堂里没有伤害！"], "tips": ["以道德底线或良知底线方向分析延伸到我们到底还要不要保留善良之心"]}, {"t": "复旦大学投毒案", "p": ["复旦投毒案27日在上海市二中院开庭审理，林森浩涉嫌以投毒方式故意杀人被提起公诉。今年4月，复旦硕士研究生黄某饮用寝室饮水机中的水后中毒去世。在庭审中，被告人林某陈述，因为愚人节临近，自己曾听说有拿化学制剂捉弄同学的先例，就想捉弄一下黄洋。"], "tips": ["室友之间遇到矛盾应多交流，不要走极端法律应从严处罚还是从轻处罚?"]}, {"t": "清明节高速公路免费通行3天", "p": ["今年清明节期间，从4月4日零时至4月6日24时，高速公路在上述时间段将对小型客车(7座及7座以下)实施免费通行。与去年国庆节和今年春节情况有所不同的是，在清明小长假期间，扫墓祭祖、踏青游玩的车辆更容易集中在某些路段，因此也更容易发生拥堵。据了解，今年清明假期将对免费通行车辆继续采取入口不发卡，出口不收费的快速通行模式。"], "tips": ["免费高速公路却还是要一车一栏，造成拥堵，便民措施需要“便民思维”。", "后期改进后略微畅通，但节假日出游拥堵现象的本质还是因为节日太少导致只能集中出游。"]}, {"t": "媒体称昆明为拉动GDP上炼油项目，民众担忧环境", "p": ["刚刚过去的这个周末，春城昆明并非一派春意盎然。年规模千万吨的中石油炼油项目的上马引发了当地民众对周边环境的担忧。", "梳理各方信息发现，争议中的这个炼油项目是云南能源战略的一部分，也是中缅原油管道配套建设项目。该项目自2004年以来开始酝酿，计划于２０１３年建成。", "除了缓解“油荒”外，这个项目的愿景还包括千亿GDP的拉动。在项目落户地、昆明下辖的安宁市表态“以超常规的力度推动工作开展”的同时，官方亦强调项目在环境、安全等方面符合国家标准。", "而从安宁官方人士和一些专家的分析来看，项目对包括水资源在内的环境承载不无压力。不过，尚无权威信息显示这个炼油项目中包含昆明民众担忧的PX（对二甲苯）项目。", "在近年来各地纷纷上马化工项目之时，这并不是民众第一次对环保问题表达自己的关切和诉求。如何在工业文明与环境承载之间找到平衡，并找到权衡各方利益的“重心”，这是摆在地方政府面前的考题。"], "tips": ["生态环境日益恶化和GDP日益增长的矛盾。", "经济的快速发展与经济的可持续发展的思考。"]}, {"t": "消息称广电总局拟黄金档禁播抗日神剧，各卫视紧急应对", "p": ["新组建的国家新闻出版广电总局正在内部整合、制定三定方案，有望6月底出台。有权威人士透露，关于规范卫视黄金档电视剧播出的通知将下发，其中特别规定：所有抗日剧都需重新审查，抗日传奇剧、戏说剧等将禁止播出"], "tips": ["抗日变身娱乐，传统变为卖俗。", "广电禁令控制大众审美与娱乐。"]}, {"t": "非京户籍少年在京被拒高考。获美国绿卡后直接参考并加分", "p": ["因户籍限制，张图无法在京高考。父亲无奈下将孩子送进国际班，准备出国留学。随后，有美国国籍的前妻提供援助，儿子很快能以美国公民身份参加“美国高考”。奇妙的是，变成美国人，孩子又能在京高考，根据政策，外国侨民享有参加北京高考资格。"], "tips": ["1.国家教育制度漏洞与不公平。", "2.虽然少数无法代表多数情况，但对于“户口”“海归”等限制应当具体情况具体对待。"]}, {"t": "埃及古神庙被刻到此一游", "p": ["“在埃及最难过的一刻，无地自容。”网友“空游无依”的一条微博迅速引发热议，他在埃及卢克索神庙的浮雕上看到有人用中文刻上“丁锦昊到此一游”，为国人轻易毁坏千年文物的行为感到震惊和羞愧。许多网友对此均表示气愤，大呼“丁锦昊，你要火了”。曾带队赴埃及多次的资深导游张先生表示，毁坏和私藏文物出入境已经触犯了当地法律，一旦被发现且情节严重，可能要坐牢。"], "tips": ["中国人文物保护意识不强，可联系国外厕所有中国提示标语“便后冲水”。", "中国人在国外没素质的形象如何改变？"]}, {"t": "我国婴幼儿奶粉将按药品监管", "p": ["国务院总理李克强5月31日主持召开国务院常务会议，研究部署进一步加强婴幼儿奶粉质量安全工作。会议提出五大措施提升婴幼儿奶粉的质量安全和消费者对国产奶粉的信心，其中一项为，按照严格的药品管理办法监管婴幼儿奶粉质量，采用电子监管码等手段，做到全程可追溯。"], "tips": ["奶粉安全，食品安全，吃什么可以放心？", "中国奶粉质量不高，“中国制造”什么东西质量高？"]}, {"t": "国内多地出现大黄鸭造型各异被指山寨", "p": ["记者了解到，像碧桂园这样亮相大黄鸭的，最近在杭州、佛山、芜湖、无锡、全国城市的开发商中都有出现。", "记者联系上广州一家专做充气模型的厂，公司销售人员称，由于香港大黄鸭最近比较火，因此最近来自全国各地要求模仿香港维多利亚港口的大黄鸭比较多，多数以房地产开发商居多。一般一只3米高的需要不停充气的大黄鸭模型只要几千元，若是6米高就要达到上万元。"], "tips": ["借大黄鸭为房地产商或其他商家造势合适吗？", "创新能力欠缺，不仅山寨大黄鸭，还有山寨...？"]}, {"t": "全国高考生人数连续五年下降，今年仅有912万人参加考试", "p": ["教育部昨天公布了全国高考准备情况。今年，全国高考生达到912万，比去年减少3万人。2008年，考生总数是1050万；2009年为1020万人；2010年考生人数跌破千万，降至957万；2011年为933万，2012年变为915万，今年已是“五连降”。今年本市报名参加高考的考生达到72736人，比去年有所减少。"], "tips": ["高考是否是选拔人才的唯一标准？", "高考人数减少象征着什么？这种现象好吗？为什么好？好在何处？为什么不好？不好在什么地方？"]}, {"t": "国足一比五不敌泰国，遭球迷围攻", "p": ["北京时间6月15日，国足在热身赛中1-5不敌泰国，缔造中国足球历史上最大的主场耻辱失利。赛后上千球迷强烈不满结果，围攻国足大巴。卡马乔成为中国足球历史上带队胜率最低的主教练。下个月FIFA公布的新一期国家队排名中，国足排名将铁定刷新108名的最低排名"], "tips": ["国足屡遭诟病，为什么“输成了习惯”？", "怪队员，怪教练，到底该怪谁？"]}, {"t": "洛阳大叔在美国名校门前卖肉夹馍1天赚800美元", "p": ["来自河南洛阳的谢云峰只能听懂one、two、three，连four都听不懂，但是这不妨碍他在哥伦比亚大学（位于纽约曼哈顿）门前做摊车小贩，卖肉夹馍、凉皮之类，生意好的时候一天可以有七八百美元的收入。"], "tips": ["大学生毕业后该创业还是择业？是做外国小贩还是做中国公务员？", "洛阳大叔的优势在哪？每个人都能成为洛阳大叔吗？"]}, {"t": "女航天员王亚平今日太空授课（类似新闻“神十上天”）", "p": ["据介绍，这次太空授课将于今天（6月20日）上午10时04分至10时55分开课，中国女航天员王亚平将在距离地面约300公里的浩瀚太空为青少年授课，成为中国首位“太空教师”。", "这次太空授课活动安排的实验项目，将展示失重环境下物体运动特性、液体表面张力特性等物理现象。为确保太空授课活动顺利实施，航天员们进行了认真备课，载人航天工程各系统将为太空授课活动提供全面支持和保障。"], "tips": ["中国科技发展速度加快时有网友说“中国解决贪腐问题、食品安全问题比登天还难”，这是一种短视的表现，民生问题不应与科技发展混为一谈，科技发展后我们才能更好的服务民生，不应把两者对立。", "教育无时无刻在进行，更可贵的是女航天员授课，证明官方态度积极诚恳。"]}, {"t": "贝克汉姆同济行发生踩踏事故", "p": ["北京时间6月20日消息，今日下午贝克汉姆(微博)一行原计划赴同济大学参加足球互动活动，但由于现场观众人数过多，在小贝走进同济大学球场后，上千学生涌向球场铁门时发生了踩踏事故，同济大学官方确认共有7人受伤，原定的小贝互动活动取消。"], "tips": ["追星要淡定，盲目追星造成的只是笑料和悲剧。（杜海涛下跪事件，爱慕刘德华女孩追星事件）"]}, {"t": "安徽父子各驾百万豪车斗气，闹市追逐互撞", "p": ["昨天上午10点48分左右，马鞍山市雨山路与军民路交叉口，一辆奔驰S350和一辆宝马Z4相互追逐，猛烈撞击，整个缠斗过程持续了三四分钟后，两车均严重损坏。记者调查获悉，两车驾驶员是一对父子，事发后弃车离去。"], "tips": ["两父子斗气是否应该在公路上“撒泼”？毫无社会责任感。"]}, {"t": "数名快递员合力接住五楼坠下女童，监控录像全程记录", "p": ["中国宁波网讯小女孩双脚朝外坐在四楼窗台上大哭，一只鞋掉了下来，另一只也掉了下来，突然，人掉了下来……昨天上午11时许，随父母租住在宁海县桃源街道隔水洋村的两岁半女童琪琪从四楼坠下，幸运的是，楼下8名“快递哥”同时伸手去接，她安然无恙"], "tips": ["正能量传递与接力。", "父母是否应该管好孩子，这个事件如此，小悦悦事件如此。"]}, {"t": "雾霾", "p": ["据新华社电江苏、浙江、上海……刚入12月，中国中东部大部地区再次遭遇持续性雾霾天气。据中央气象台统计，截至4日18时，我国已有25个省(区、市)不同程度地出现过雾霾天气。中央气象台预计，4日夜间到5日上午，我国东部和南方大部地区仍有轻雾。江苏等地的部分地区有重度霾。"], "tips": ["雾霾天气不是突然出现，环境污染是主要论点。"]}, {"t": "九寨沟旅游滞留，节假日集中出游", "p": ["10月2日下午，九寨沟景区由于人太多，发生大规模游客滞留事件（详见成都晚报10月3日第04版）。据九寨沟管理局统计，截至19时许，景区共滞留游客4000余人。"], "tips": ["节假日集中导致旅游人数过多旅游要遵守各项规定，一味的哄抢是无法解决问题的。"]}, {"t": "人大代表提出“汉字考级”，避免提笔忘字", "p": ["日前,零点指标数据针对北京、上海、广州、武汉等12个城市进行的“中国人书法”系列最新调查显示:94.1%的受访者都曾遇到提笔忘字的情形,其中26.8%经常出现提笔忘字的情况。其实,提笔忘字缘于信息化时代我们对电子产品的依赖。”张颐武称,在当下,通过电子产品的拼音书写,我们应用起汉字来反而更简单方便了。"], "tips": ["赞成，从调查结果和中国传统文化入手。", "反对，从各种考级考试实际作用并不大和小题大做与人大代表身份入手。"]}, {"t": "香格里拉导游：不交钱刀架脖子上", "p": ["导游上车后要求须交纳藏民家访的费用，380元。对于不缴纳的，这位导游放言：香格里拉导游是非常恐怖的，有没有听说过？香格里拉导游会把刀子放在你的脖子上！你看我今天会不会把刀子放在你的脖子上！"], "tips": ["职业道德和职业黑幕"]}, {"t": "新快报新闻失实事件", "p": ["新快报记者陈永洲10月19日被长沙警方以涉嫌损害商业信誉刑拘。陈永洲曾发表10篇报道批中联重科，中联重科回应称其“从未就报道事宜采访过中联重科的任何一个人”，并就此向长沙警方报案。今日新快报头版刊文呼吁“请放人”，引用曾国藩对联称“敞报虽小，穷骨头，还是有那么两根的”"], "tips": ["新闻从业人员职业道德新闻真实性的不可亵渎"]}, {"t": "广场舞该不该跳", "p": ["前几天，武汉某小区居民在跳广场舞时被从天而降的粪便泼了满身，原因是楼上的居民不堪长期的噪音干扰，无奈以此方式来抗议。类似因跳广场舞引发的矛盾和争议还有不少。仔细留意就会发现，近几年，小区广场舞在各个地方悄然兴起，并备受欢迎。原本跳舞是项锻炼身体的运动方式，现在却成了大多数居民头疼的事。一个录音机、一个音响，有时再加上哗啦啦的道具，多管齐下，小区内成了“欢腾的海洋”。对于这个现象，济南市不少小区居民表示很无奈，多次与舞队交涉，物业、民警都出面，但还是得不到根本解决，几经周折，多方还是管不住一个“扬声器”。"], "tips": ["广场舞不对，那泼粪对吗？要怎样平衡需求？"]}, {"t": "老外撞大妈", "p": ["近日，一组配图网文引发诸多网友关注。该文称，一名外国小伙搀扶一名倒地女子时遭到该女子索赔。然而北青报记者调查后发现，当事女子正是被文中所提到的外国人驾驶摩托所撞倒的。而昨天晚上，“平安北京”微博也发文证明外国男子属无照驾驶，肇事车辆已经依法处理。"], "tips": ["一开始民众统一认为大妈就是讹人，这是一种道德上的优越感，看新闻的人会下意识的站队在道德崇高的一方去鞭挞另一方的过失。", "后来新闻失实，这是媒体的过失。"]}, {"t": "6岁女童被幼师扯裂耳朵：血口长约4厘米", "p": ["早上送去上学还好好的，下午回来耳朵已撕裂。12月13日，姚女士6岁的女儿在长安振安幼儿园上课时不听话，被老师王某扯伤左耳，出现一道约4厘米长的血口。事后，姚女士向幼儿园提出2万元赔偿，并向当地警方报案。前日下午，在长安警方和教育部门的协调下，双方达成和解，幼儿园决定辞退王某。"], "tips": ["幼师问题层出不穷，到底是为什么？如何加强教师素质？", "老师打人固然有错，但小孩没错吗？如何让熊孩子变成乖孩子？"]}, {"t": "朴槿惠向中国提出送还360具志愿军遗骸", "p": ["从抗战到维和，中国军人在东南亚，太平洋，朝鲜半岛以及非洲，中东等地献出他们的生命。他们是国家的英雄，但葬身异乡，远隔祖国与亲人，道阻且长，怀念不易，致敬亦难。从这件事可以看出中国军人坚强不屈，无私奉献的精神，而现在为了我们祖国的安宁仍坚守在各自的岗位上的中国军人值得我们敬佩，作为中学生，我们应该些什么。"], "tips": []}, {"t": "中纪委重拳打虎 一周打一个", "p": ["中纪委一线办案力量空前:“每周拿下一个省部级”，这是人们对最近反腐成果的一个总结。十八大后200多天，王岐山带领下的中纪委动作频频，增添2个一线办案监察室，打苍蝇更打老虎，火力全开。业内学者认为中央密集重拳出击惩治省部级腐败高官，体现了中央坚决“打老虎”的信心和决心。对国家来说去掉了蛀虫，对老百姓来说能够有更多公正公平的对待。"], "tips": []}, {"t": "让“看不见的污染损失”数字化", "p": ["如今，量化数据成为频繁引用的资料，2011年，世界卫生组织发布世界城市空气质量报告，在1082个城市中，北京市排名1035位，我国城市环境空气质量好的海口市排名在800位之后，这就是量化的力量，有数据才会让人为之惊心，而公众有压力，政府才会有压力。现在武汉的空气质量也很差，为什么会这样，是因为我们一些施工单位肆意排放污染气体等等。我们应该怎么做?有人建议今年过年尽量不燃放烟花爆竹减少污染，这也不失为一个可实施的办法。"], "tips": []}, {"t": "李天一因强奸罪被判刑10年", "p": ["李天一的案子终于有了一个结果，这让大家心里好受了一些，而作为父亲的李双江也知是家教失败致李天一犯强奸罪被判刑十年，幼时李天一打父亲仍被纵容。这说明家庭教育对一个孩子的影响至关重要，溺爱孩子是害孩子。父母是孩子的第一任老师，所以父母的教育会对孩子的人生观，价值观形成有很大的影响，但父母该如何教育孩子呢?孩子错的时候一定得让他知道并告诉他正确的做法等等。只有孩子们好了，我们祖国的未来才会好。"], "tips": []}, {"t": "江苏花7000万建地标河豚塔", "p": ["这样一个巨型“地标”，也因此引发了不小的争议。一种声音认为，扬中本来就是中华河豚之乡，河豚塔的建设，有利于提高城市的品牌形象，促进城市的发展，且能够为市民创造更好的休闲空间。而相反的声音则认为，打造城市形象不一定非得花巨资建这样一个实用性并不高的建筑。我的看法是在中央八项规定、厉行节约等要求和精神下，与“面子工程”相比，民生实事才更加紧迫。中央去年12月就出台了八项规定，倡导厉行节约、反对浪费和面子工程，而当时河豚塔项目并没有真正进入施工建设阶段，且“河豚”在某种意义上恰好是公款吃喝的代名词。此后中央出台的有关六项禁令、禁止政府机关新建楼堂馆所等政令，其精神也都一脉相承。更何况，当前最迫切的不是城市景观这类形象工程，而是民生实事。正如网友“@小王大伟”的评论：“身为纳税人，更希望这笔钱用于污染防治、关爱贫困儿童等民生问题上。我们其实没有那么富，不需要去刻意制造这些意义不大的世界之最。”或者从另一方面说。"], "tips": []}, {"t": "房姐龚爱爱获刑3年 房产合法", "p": ["最近，有关“多重户口”的新闻刺激着公众的神经。陕西省榆林市一个被网友称为“房姐”的人，竟拥有价值10亿元的房产和多重户籍，除了陕西神木的两个户口外，还有另外两个户口：一个在神木，另一个在北京。此事引起举国关注。对照北京市落户政策，按照国家关于“一人一户”的规定，根本不可能办到的事情竟被房姐轻松办到了，这是什么，这就是特权。没有特权的人为了落户大城市，甘愿揣着研究生学历去扫地，有特权的人一个条子就可以搞定一切……特权吞噬着社会公平。一些掌握公权力者，不以“堕为特权阶层为耻辱”，反而以网罗特权圈子为能事。围绕这个圈子，他们因对社会各方面公共资源的独占和优先引发民众的反感。一个特权个体背后往往是一种特权现象，一种特权现象背后往往依附着一个特权圈子。特权圈子的危害，还不仅在于造成资源分配的局部不公，从更长远来看，它还可能导致阶层利益的固化，堵塞普通人向上流动的正常通道，这是关乎国家和社会健康发展的要害性问题。我们怎么办？关键是要管好圈子中心的人，以遏制住特权思维、特权现象、特权圈子，这是社会发展的每一个时期都必须正视的问题。反腐败、反特权是个庞大的系统工程，指望找到某种捷径一蹴而成可能不现实。不过，揪住某一类突出的问题和现象，以雷霆手段彻底清查，捍卫法律和制度的尊严，却是维护社会公平，确立制度公信力的必要举措。具体到多重户口事件，从现有的线索着手，彻查相关问题极其根源，并以党纪国法的利器，揪出特权圈子的中心人物，继而敲碎“房姐”们周围的特权圈子，才能树立法治权威，才能让民众对反腐败、反特权确立信心。"], "tips": []}, {"t": "北京重摔女童案", "p": ["二名驾车男子因不满一名推着婴儿车的女士挡道，双方发生争执。过程中一名男子将该女士打倒后，又将婴儿车内的女童摔在地上，导致女童严重受伤。一场口角引发的矛盾，夺去了一个无辜女童的生命。这个脆弱的生命才两岁，正是牙牙学语的时候，给家人带来了无限的欢乐，而这一切都在那辆白色现代轿车前戛然而止。而摔死女童的韩磊也迅速成为了世人口诛笔伐的对象。他不是有预谋的，只是一时冲动就犯下了不可饶恕的错误。国内激情犯罪近年愈演愈烈。有关统计显示，在我国，激情犯罪案件已经占到一般刑事案件的三分之一，而且近年来有愈演愈烈的趋势。据国外一组针对因严重暴力犯罪而受惩处的罪犯所进行的调查显示，85%的罪犯都不是预谋后实施暴力犯罪，中国人民公安大学犯罪心理学教授李玫瑾建议，社会要对潜在极端行为者进行心理疏导，避免恶性事件再次发生，同时她认为，极端暴力事件会对家庭和社会造成伤害，并导致公众普遍产生恐慌心态。北京大学政府管理学院教授赵成根则表示，政府应对实施者依法严加惩处，原则问题绝不能含糊。"], "tips": []}, {"t": "习近平考察武汉 与女市民打招呼:美女你好", "p": ["7月22日上午，习大大视察武汉市民之家，与市民郭婷婷握手时，竟然来了一句：“美女，你好！”", "周围的人都笑了：没想到，习大大还真会聊天！回到单位后，郭婷婷对着同事高喊：“看你们以后谁还敢说我不是美女，习大大都说我是美女了！”", "“美女，你好”，一句普普通通的话，缘何受到热捧？作为国家最高领导人，对市民冷不丁地蹦出一句“美女，你好”，的确让人忍俊不禁。", "“美女，你好”闪现着习主席的亲民风采。用百姓的话和百姓打招呼，没有官腔，不摆架子，一个平易近人、温和可亲的国家领导人在“美女，你好”中闪现出来。", "在群众路线教育中，扫除“官僚主义”作风之弊，是紧要的任务之一。与某些装腔作势、拿捏作态的政府官员相比，习主席让人觉得可亲可近。“骑在人民头上的，人民把他摔垮；给人民做牛马的，人民永远记住他”，其实，作为领导干部，不必给人民做牛做马，只要心中真的装着人民，与人民平等对话，民亦知足。反之，无论你自己努力把自己伪装得多么高大，历史都会证明你很渺小。郭婷婷与最高领导人的这样一次握手，这样一次亲密接触，这样一句“中国好声音”，虽然不是惊天动地的大事，却能让无数群众心生感动，能传递无穷的正能量。", "“美女，你好”体现出习主席的真性情。不凡之人出凡语，细微之处见真情。人之为人，最中要的是一个“真”字，只有“真”才能让人与人之间灵魂对话，只有“真”才能建立和谐的人际关系，只有“真”才能坦荡为人磊落做事。"], "tips": []}, {"t": "解密选秀节目编剧，悲惨身世完美爱情都是编的", "p": ["今年夏天，音乐真人秀节目迎来竞争最激烈的时刻：《快乐男声》《中国好声音》《中国梦之声》《最美和声》……十余档选秀节目争相登场。为了在收视上拔得头筹，各档节目都使出浑身解数：选手身世越来越传奇，导师越来越会卖萌，热泪盈眶已经是小意思，哭到鼻涕一把泪一把也不罕见，每场不仅有亮点，还有埋伏笔，剧情的连续性冲突性，都快把电视剧给比了下去了。", "真人秀为何会变成电视剧？答案很简单，每档热播节目背后，都有一个人数众多的制作团队，他们分工明确，有编剧，有剪辑，更有导演。为了收视率这个终极目标，他们贴身跟进每个重点选手，妙笔生花写出一个个动人的故事，给选手贴上漂亮又洋气的标签，把路人瞬间变明星…", "不夸张地说，2013年的选秀，已经完全脱离了“真”的初衷，大步朝着电视剧方向狂奔而去。选手抹泪煽情，评委佯装聆听，不明真相的观众台下抽泣，隔些天各种“八卦”“爆料”再铺满网络……观众欢乐了，选手出名了，收视率也上去了。这，就是如今选秀节目的真实状态。", "没错，电视剧般的选秀节目也确实能娱乐到观众，然而时间长了，观众会逐渐厌恶节目娱乐功能所掩饰的虚假情感，厌恶导师们脱离了音乐本身的夸张表演，也厌恶了选手在台上心机重重的作秀。到那个时候，靠“好故事”逆袭成功的中国选秀节目们，又该靠什么走下去呢？"], "tips": []}, {"t": "多车碾压老人后逃逸，最后一车停车报警，被判赔40万元", "p": ["成都市龙泉驿一条道路上，多辆汽车先后撞上60多岁的老人曾一，前面的几辆车逃逸了，最后一辆车车主没有跑，还主动报了警。由于找不到前面的肇事逃逸者，死者家属将最后一辆车车主及保险公司告到法院，要求其承担赔偿责任。据了解，当时老人家属坚决反对解剖老人，于是究竟是不是最后一名肇事车致老人死亡的，已经不得而知。当然，我们要追究的并不是责任在谁身上，这几名车主谁都有责任，谁也不能脱罪。只是，在面对错误负责的面前，最后一名车主却勇于报警，勇于承担责任，最后却落得如此下场。不得不说，这样的判决会抹杀更多市民的善良。只怕以后，会有更多逃逸的事件发生，或许，他们想回避的并不是事件本身，而是回避不合理的判决。在小悦悦等等事件后都呼吁要敢于做善事，为这个社会贡献温暖，只希望司法机构能够更公正公平的判决，不要让做好事的人心寒。"], "tips": []}, {"t": "7旬老夫妇为还3个儿子结婚债务捡废品十七年", "p": ["三个儿子相继结了婚盖了房，开封杞县的老房别提多高兴，然而因此欠下的债务谁来承担？心疼儿子的老两口为了还债，一起到郑州当起清洁工，起早贪黑，节衣缩食，一晃17年过去了，虽然租住的还是地下室，不过欠债基本还完了。老两口说，所有的苦和累都值了。", "可怜天下父母心，为了让孩子们生活的更好，宁愿担下债务，自己辛苦。我们是否也感受到了父母的辛苦，是否也体谅父母的不容易，是否也像父母关心我们一样去关心他们，我们是否也努力让自己做的更好减轻父母肩上的担子，是否现在努力学习，是否还为一些小事而对他们大吼小叫?作为中学生的我们应该努力完成好自己的学业，给望子成龙，望女成凤的父母一些安慰。"], "tips": []}, {"t": "小伙对母亲谎称去英国留学，藏身武当山习武三年", "p": ["一心想习武，又担心母亲不同意，湖南小伙王武假称去英国留学，3年来一直藏身武当山下的武馆习武。日前，王武的母亲得知儿子不在英国后大吃一惊，赶赴武当山寻子，最终在武当山出入境管理科工作人员的帮助下找到儿子。", "有梦就去追这是个好事，可是也得在学好文化和母亲同意的条件下，还好最后的结果还算是皆大欢喜的。我们可以学习他对于梦想执着追求的精神，我们很多人都不能像他那样坚定。可是他的莽撞也不行，一个单亲母亲拿出60万让他去学习很不容易，得体谅作为母亲望子成龙的心情，学好文化，回报母亲。"], "tips": []}, {"t": "安徽警察目睹少女被捅十刀，近在咫尺，不制止", "p": ["8月18日下午，安徽省蚌埠市禹会区马城镇发生一起命案：一名17岁的超市女收银员被歹徒连捅10多刀后遇害。一份案发时的监控显示：女孩被歹徒勒住脖子、用刀捅死时，两位民警就在面前，却不敢挺身而出上前制止。直到歹徒自残倒地后，两位民警才上前将其控制。两位民警的所为遭致死者家属的强烈愤怒。警方回应：现场民警反应有点迟钝。", "不管是反应迟钝还是胆小害怕，都不足以作为借口。作为一名警察，做好自己分内的事，遇到这样的情况，都应该及时出手救下少女，而不是失职不制止。就算不是警察，遇到这样的情况也应该伸出援助之手。现在很多人都缺乏责任意识，这正是我们和谐社会所需要的。见义勇为的我们要大力赞扬。作为中学生，我们要有意识的培养起自己的责任意识承担起一份社会责任。"], "tips": []}, {"t": "撞死高考生逃逸肇事司机被刑拘", "p": ["取得440余分较好成绩的高考生小路，在回家途中遭遇车祸意外身亡，肇事司机——溧水国税局干部甘某旋即逃逸，8天后被溧水警方抓获。", "小路是个艺术生，虽然艺术类的文化课相对于普通学生的分数线比较低，但440余分足以证明他是一个非常优秀的孩子。", "事故发生8天后，甘某被溧水警方抓获归案，被证实为该县国税局干部，随即就被革职并刑拘。据了解，事发时，甘某刚刚参加完同学聚会，带着6岁的儿子赶回家。"], "tips": []}, {"t": "一亿人受益保障房", "p": ["2日，住房城乡建设部住房保障司副司长张学勤首次透露了迄今为止受惠于保障房建设的总人数：约3000万户，将近一亿人。据初步统计，截至2011年底，全国累计用实物方式解决了2650万户城镇低收入和中等偏下收入家庭的住房困难，实物住房保障受益户数占城镇家庭总户数的比例达到11%。这一部分统计数据包括了廉租房、经济适用房、限价房和公租房，还有一部分棚户区改造计划的受益居民。", "网友有话说：我们又被受益了。不管你信不信，反正我信了。"], "tips": []}, {"t": "城管成立武装部不会加重暴力色彩", "p": ["今天，一则“8月1日武汉市汉阳区城管局成立武装部，战时可参军参战”的消息引起众多网友议论。晚间汉阳区委、武装部、城管局对此回应称，城管成立武装部是管理预备役人员，以此庆祝八一建军节的到来。", "汉阳区城管局一位负责人表示：“民兵城管”接受的是军事训练、国防教育、作风和制度建设等多方面的训练，将强化统一行动、积极向上的工作态度，对个别思想懒散、态度粗暴的队员将是改正和提高的机会，只会让城管执法树立和谐形象，不会加重暴力色彩。"], "tips": []}, {"t": "叶诗文：被逼问时我心里想砸桌子", "p": ["女子400米个人混合泳夺冠后，有西方媒体公开质疑，认为叶诗文肯定是服用了兴奋剂。", "叶诗文则表示“你知道吗，那天晚上那个外国记者这么问我，我都想要砸桌子了，实在太叫人生气了。我从到伦敦开始一直到现在，已经接受了3次兴奋剂检测。"], "tips": []}, {"t": "韩国奥委会欲为“哭闹女”申雅岚申请银牌", "p": ["韩国击剑选手申雅岚因裁判争议错失奖牌的事件持续发酵。韩国奥委会2日表示，正同国际剑联协商向国际奥委会提出向击剑选手申雅岚颁发银牌的方案。国际剑联此前曾建议向申雅岚颁发特别奖，韩体育会已接受了该提议。中新网"], "tips": []}, {"t": "牛！反贪部门挖出一堆铁耗子", "p": ["因在铁道部宣传片《中国铁路》制作过程中涉嫌严重违纪，铁路文联副秘书长陈谊涵、其夫铁道部运输局车辆部副主任刘瑞扬已被立案查处。联想此前刘志祥、刘志军兄弟以及张曙光之流，断言铁路系统是一锅老鼠屎熬的汤，甚为经济适用和简明扼要"], "tips": []}, {"t": "普通人的交流比数字更重要：中非关系的另一种视角", "p": ["2000年中非贸易额为106亿美元，2006年已达555亿美元，到2011年，已经是惊人的1663亿美元，是10年前的16倍。但并不是所有的非洲人都满足于如此“数字化”的成绩。“普通的非洲人可不能拿那些数字过日子，它们不能吃也不能喝。”"], "tips": []}, {"t": "京城暴雨", "p": ["7月21日晚，北京市主要积水道路63处，造成交通大面积拥堵。直到昨晚9点30分，城区最后一处积水断路地点——玉泉营北侧的双营桥抽水完毕恢复通车。此时距离“7·21”特大暴雨造成积水已经超过24小时。", "对此，北京排水集团副总经理郑江回应，在78个下沉式桥区的雨水泵站中，有一半以上为一年一遇，仅能抵抗每小时30毫米的降雨，而21日全市平均降水量达170毫米。"], "tips": []}, {"t": "", "p": ["热点一：西安一家幼儿园在未告知家长的情况下，长期给园内幼儿集体服用抗病毒药物“病毒灵”。不少孩子被发现存在头晕、腿疼、肚子疼等相同症状，此事一经曝光，引来社会舆论一片哗然。"], "tips": []}, {"t": "", "p": ["热点二：2014年3月，媒体曝光了对“东莞丐帮”的调查，犯罪团伙用各种非常手段使人致残，逼人乞讨。此报道引网友热议，称犯罪团伙的做法令人发指。对于碰到职业化乞丐该不该给钱，也成了网友议论的焦点。"], "tips": []}, {"t": "", "p": ["热点三：自今年1月以来，全国已曝出十余起自来水异味事件，而其中有多数“问题水”经当地机构检测认定“水质达标”，一些水务部门甚至拍胸脯告知民众“可放心饮用”，但是经过调查后却发现了大问题。"], "tips": []}, {"t": "", "p": ["热点四：市场上各类口罩产品大都宣称具有防尘、防霾功能，然而，中消协发布的试验结果显示，37款样品中，既防霾效果好，又呼吸顺畅的样品只有9款，仅占试验样品总量的24.3%。一种199元的口罩过滤效果竟然和1元的一个样。"], "tips": []}, {"t": "", "p": ["热点五：2014年1月至3月近50天的时间，广州市“婴儿安全岛”共接收弃婴262名，急速增长的婴儿数量使福利院的床位、人手、隔离设施等都不堪重负。广州市宣布暂停儿童福利院弃婴岛试点。"], "tips": []}, {"t": "", "p": ["3月28日至29日，世界超级摩托车锦标赛（WSBK）葡萄牙站，中国摩托车制造商“张雪机车”在中量级组别中夺得冠军，打破了杜卡迪、雅马哈等国际品牌长达数十年的垄断，这是中国摩托车品牌首次登顶国际摩托车顶级赛事。"], "tips": []}, {"t": "", "p": ["4月底， 自媒体博主“耿同学讲故事”发布举报视频，直指南开大学生命科学院院长陈佺作为通讯作者发表于《自然》子刊的论文存在严重数据异常。陈佺不仅是国家 “杰出青年基金”、教育部“长江学者”计划等称号获得者，还在2025年8月入选中国科学院院士增选有效候选人名单。这一视频的发布，将公众对学术造假的关注推向顶峰，也让顶尖学者学术诚信问题成为舆论热议的焦点。"], "tips": []}, {"t": "", "p": ["9月22日，中央网信办发布通告，开展为期2个月的“清朗·整治恶意挑动负面情绪问题”专项行动。“过度渲染消极悲观情绪”问题被特别提及，列为着力整治的对象。自知名躺平博主“小A在上网”被封禁以来，多名躺平博主账号陆续被禁言、禁止关注，引发了广泛关注与讨论。"], "tips": []}, {"t": "", "p": ["2026年以来，从手机到电脑，消费电子市场正经历一轮由存储芯片驱动的全面涨价。各主流品牌先后调价，主流中端手机机型普遍提价300至1000元，部分专业数码产品涨幅超过3000元。行业普遍认为，此轮涨价核心是AI算力需求爆发“虹吸”先进存储产能，各大存储厂商将多数产能投向高附加值AI存储，消费级供给收缩，存储价格暴涨直接传导至终端。"], "tips": []}, {"t": "", "p": ["3月24日中午，峰学蔚来创始人张雪峰在公司跑步后出现不适，被紧急送至医院。同日晚，苏州峰学蔚来教育科技有限公司发布讣告：张雪峰因心源性猝死全力抢救无效，于3月24日15时50分在苏州逝世，终年41岁。"], "tips": []}, {"t": "", "p": ["6月17日，韩红作为影片免费配乐主创出席老友冯小刚新片《抓特务》首映礼，出于私人交情现场用北方口语呼吁本地观众观影捧场，方言词汇“走个面儿”本意是线下熟人语境的“捧个场、给个情面”。"], "tips": []}, {"t": "", "p": ["5月8日，OPPO联合《三联生活周刊》发起母亲节征集活动，其中的配套宣传文案：“我妈有两个‘老公’，一个是我爸，另一个一年见两回。跟我爸约会基本不打扮，见另一个，她恨不得穿婚纱”，搭配母亲追星举应援牌的画面，以子女视角描述母亲追星的状态。 舆论发酵后，OPPO随即下架全部争议物料，发布致歉声明。"], "tips": []}, {"t": "", "p": ["蓝领坐电梯被拒，要求其去坐货梯，你怎么看？"], "tips": []}, {"t": "", "p": ["对于在最危险的地方没有中国记者的身影，你怎么看"], "tips": []}, {"t": "", "p": ["谈谈你对“李亚力二字醉驾打交警，警察集体做伪证”的看法"], "tips": []}, {"t": "", "p": ["谈谈你对“教师将作业本分层次来辨别学生好差”的看法"], "tips": []}, {"t": "", "p": ["谈谈你对“山西三名十岁女童相约跳楼”的看法"], "tips": []}, {"t": "", "p": ["谈谈你对“大学请明星当教授”的看法"], "tips": []}, {"t": "", "p": ["谈谈你对“高考加面试”的看法"], "tips": []}, {"t": "", "p": ["小贩收200元假钞，被气身亡，摊前700斤水果被群众一抢而空。对于这件事情你怎么看"], "tips": []}, {"t": "", "p": ["唐艺博天生脆骨病，被学校劝退，后来也多次被学校退学"], "tips": []}, {"t": "", "p": ["刘翔的瓶颈，两次没有参加奥运会，你怎么看？"], "tips": []}, {"t": "", "p": ["目前，中小学开学第一课堂的主题为幸福成长，提出幸福健康成长比成绩更重要"], "tips": []}, {"t": "", "p": ["谈谈你对伊朗核问题的看法"], "tips": []}, {"t": "", "p": ["WTO带给中国的是什么"], "tips": []}, {"t": "", "p": ["谈谈你对目前大学生就业难现象的看法"], "tips": []}, {"t": "", "p": ["谈谈青藏铁路开通的意义"], "tips": []}, {"t": "", "p": ["前不久，某西餐店开办到故宫博物院里，引起了很大的争议，谈谈你的看法"], "tips": []}, {"t": "", "p": ["据媒体报道，在我国的某些大城市，一些商家开始要求员工对顾客进行“跪式服务”，引起了很大的争议，谈谈你的看法"], "tips": []}, {"t": "", "p": ["社会上有人称“80后”是垮掉的一代，谈谈你的看法"], "tips": []}, {"t": "", "p": ["2006年是长征胜利70周年。70年前，中国共产党领导红军将士完成了震惊世界的长征，开辟了中国革命继往开来的光明道路，奠定了中国革命胜利前进的重要基础。谈谈你对长征精神的理解。"], function uniq(a){ var o={},r=[]; a.forEach(function(x){ if(!o[x]){o[x]=1;r.push(x);} }); return r; }

var toastTimer = null;
function toast(msg){
  var el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2400);
}

function classOf(gi){

  var c = '';
  if(m.p[gi]) c += ' m-p';
  if(m.c[gi]) c += ' m-c';
  if(m.s[gi]) c += ' m-s';

/* 把一段文字渲染成 HTML：只给被标注（或带注音）的字符加 span，其余保持纯文本。
   注音用伪元素 ::before + data-py 呈现，不产生文本节点，
   这样 range.toString() 拿到的长度仍等于原文长度，标注索引不会错位。 */
function markify(text, base){
  var z = curKey ? ZY[curKey] : null;
  var note = zyOn(curKey);
  var h = '', buf = '';
  for(var i=0;i<text.length;i++){
    var gi = base + i;
    var cls = classOf(gi);
    var ch = text.charAt(i);
    var py = (note && isHan(ch)) ? pyOf(ch, gi, z) : '';
    if(cls || py){
      if(buf){ h += esc(buf); buf = ''; }
      var cl = (cls ? cls + ' ' : '') + (py ? 'zh' : '');
      var k = py ? pyScale(py) : 1;
      h += '<span class="'+cl+'" data-gi="'+gi+'"'
        + (py ? ' data-py="'+esc(py)+'"' : '')
        + (k < 1 ? ' style="--pyk:'+k+'"' : '') + '>'+esc(ch)+'</span>';
    }else{
      buf += ch;
    }
  }
  if(buf) h += esc(buf);
  return h;
}
function paraHasHan(t){
  for(var i=0;i<t.length;i++){ if(isHan(t.charAt(i))) return true; }
  return false;
}

/* 拼音偏长时会盖住邻字的拼音。按实际宽度算一个横向压缩比（CSS 变量 --pyk），
   把拼音压回本字宽度以内；短拼音不压，结果按拼音缓存。 */
var PYK = {}, _mctx = null;
function pyScale(py){
  if(PYK[py] != null) return PYK[py];
  var k = 1;
  try{
    if(!_mctx){
      _mctx = document.createElement('canvas').getContext('2d');
    }
    _mctx.font = '600 100px "Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif';
    var real = (_mctx.measureText(py).width / 100) * 0.5;   /* 拼音字号是 .5em，换算成字宽倍数 */
    if(real > 1) k = 1 / real;
    k = Math.max(0.55, Math.round(k * 100) / 100);
  }catch(e){ k = 1; }
  PYK[py] = k;
  return k;
}

function buildBodyHTML(){
  if(!CTX) return '';
  var paras = CTX.paras || [], subs = CTX.subs || [];
  var note = zyOn(curKey);
  var h = '', base = 0;
  for(var i=0;i<paras.length;i++){
    var cl = [];
    if(subs.indexOf(i) >= 0) cl.push('sub');
    if(note && paraHasHan(paras[i])) cl.push('py');
    h += '<p'+(cl.length ? ' class="'+cl.join(' ')+'"' : '')+' data-base="'+base+'">'
      + markify(paras[i], base) + '</p>';
    base += paras[i].length;
  }
  return h;
}

function bodyClass(){

/* 取当前生效的正文容器（全屏层优先） */
function liveBody(){

/* 选区 -> 字符索引 */
function nodeP(node, container){
  var n = node.nodeType === 1 ? node : node.parentNode;
  while(n && n !== container){
    if(n.tagName === 'P') return n;
    n = n.parentNode;
  }
  return null;
}
function offIn(p, node, o){
  var r = document.createRange();
  try{ r.setStart(p, 0); r.setEnd(node, o); }catch(e){ return -1; }
  return r.toString().length;
}
function selInfo(){
  var sel = window.getSelection();
  if(!sel || !sel.rangeCount) return null;
  var r = sel.getRangeAt(0);
  if(r.collapsed) return null;
  var box = liveBody();
  if(!box || !box.contains(r.startContainer) || !box.contains(r.endContainer)) return null;
  var p1 = nodeP(r.startContainer, box), p2 = nodeP(r.endContainer, box);
  if(!p1 || !p2) return null;
  if(p1 !== p2) return {cross:true};
  var base = parseInt(p1.getAttribute('data-base')||'0', 10);
  var a = offIn(p1, r.startContainer, r.startOffset);
  var b = offIn(p1, r.endContainer, r.endOffset);
  if(a < 0 || b < 0) return null;
  return { base: base, a: Math.min(a,b), b: Math.max(a,b) };
}

/* 手机上（尤其苹果设备）点工具条按钮时，系统会先弹自己的「拷贝 / 查询」菜单并收起选区，
   于是按钮拿不到选区、功能像失灵。这里把最近一次有效选区记下来，取不到时回退到它。
   缓存两分钟有效，且必须还是同一篇文稿。 */
var LASTSEL = null;
function rememberSel(){
  var info = selInfo();
  if(info && !info.cross && info.b > info.a){
    LASTSEL = { key: curKey, base: info.base, a: info.a, b: info.b, t: Date.now() };
  }
}
function recentSel(){
  var info = selInfo();
  if(info && !info.cross && info.b > info.a) return info;
  if(LASTSEL && LASTSEL.key === curKey && (Date.now() - LASTSEL.t) < 120000){
    return { base: LASTSEL.base, a: LASTSEL.a, b: LASTSEL.b, cached: true };
  }
  return null;
}
document.addEventListener('mouseup', function(){ setTimeout(rememberSel, 20); });
document.addEventListener('touchend', function(){ setTimeout(rememberSel, 160); });

function pushUndo(){
  var m = M(); if(!m) return;
  m.undo.push(JSON.stringify({p:m.p, c:m.c, s:m.s}));
  if(m.undo.length > 100) m.undo.shift();
}

/* 重绘正文，保持滚动位置 */

  var ovb = $('ovMbody');
  var osc = 0;
  var ovWrap = $('ovBody');
  if(ovWrap) osc = ovWrap.scrollTop;
  /* 聚焦显示时全屏层里放的是选中的片段，按同一套索引重绘，注音与标注才跟得上 */
  if(OV.mode === 'focus'){ $('ovBody').innerHTML = focusBodyHTML(); }
  else if(ovb){ ovb.className = bodyClass(); ovb.innerHTML = buildBodyHTML(); }
  if(ovWrap) ovWrap.scrollTop = osc;
  if(view) view.scrollTop = sc;
}

function applyMark(kind){
  if(!CTX) return;
  var info = selInfo();
  if(!info){ toast('请先在正文中选中文字'); return; }
  if(info.cross){ toast('暂不支持跨段落选择，请在同一段内选取'); return; }
  var base = info.base, a = info.a, b = info.b;
  var len = b - a;
  if(len <= 0){ toast('请先选中文字'); return; }
  var m = M(); if(!m) return;
  if(kind === 'pause' && len < 2){ toast('停顿需要至少选中相邻的两个文字'); return; }

  var key = (kind === 'pause') ? 'p' : (kind === 'conn' ? 'c' : 's');
  var from = a, to = (kind === 'pause') ? b - 1 : b;   /* 停顿落在相邻字之间，标记盖到前一个字 */
  var on = 0, allOn = true;
  for(var t = from; t < to; t++){
    if(m[key][base + t]) on++; else allOn = false;
  }
  pushUndo();
  if(on > 0 && allOn){
    /* 在已经标好的地方再点一次 = 取消 */
    for(var i = from; i < to; i++) delete m[key][base + i];
    toast(kind === 'pause' ? '已取消这些停顿符'
        : (kind === 'conn' ? '已取消这些连接下划线' : '已取消这些重音记号'));
  }else{
    for(var j = from; j < to; j++) m[key][base + j] = 1;
    toast(kind === 'pause' ? '已在选中的相邻文字之间加入停顿符'
        : (kind === 'conn' ? '已为选中的文字加上连接下划线' : '已为选中的文字加上重音记号'));
  }
  var sel = window.getSelection(); if(sel) sel.removeAllRanges();
  hideSelbar();
  repaint();
}

function undoMark(){
  var m = M();

  var s = JSON.parse(m.undo.pop());

function clearMarks(){

/* ===================================================================
   注音
   =================================================================== */
function toggleZhuyin(){
  if(!CTX){ toast('请先选择一篇文稿'); return; }
  var z = zyOf(curKey);
  if(!z) return;
  var info = selInfo();

  /* 有选区：给选中的汉字注音；若这些字本来都有拼音，再点一次就取消掉 */
  if(info && !info.cross && info.b > info.a){
    ensurePY();
    var list = [], allOn = true;
    for(var gi = info.base + info.a; gi < info.base + info.b; gi++){
      var ch = chAt(gi);
      if(!isHan(ch)) continue;
      list.push({ gi: gi, ch: ch });
      if(!pyOf(ch, gi, z)) allOn = false;
    }
    if(!list.length){ toast('选中的内容里没有汉字'); return; }
    var sel = window.getSelection(); if(sel) sel.removeAllRanges();
    hideSelbar();
    if(allOn){
      /* 二次点击 = 取消 */
      list.forEach(function(x){ delete z.one[x.gi]; z.off[x.gi] = 1; });
      if(z.single != null) z.single = null;
      repaint(); refreshBars();
      toast(list.length === 1
        ? ('已取消「'+list[0].ch+'」的拼音，再点一次可以加回来')
        : ('已取消选中的 '+list.length+' 个汉字的拼音'));
    }else{
      list.forEach(function(x){
        delete z.off[x.gi];
        z.one[x.gi] = PYCUSTOM[x.ch] || PYMAP[x.ch] || '';
      });
      z.single = (list.length === 1) ? list[0].gi : null;
      repaint(); refreshBars();
      toast(list.length === 1
        ? ('已为「'+list[0].ch+'」加上拼音' + (zyHasSingle(curKey) ? '，可用「联网查找」核对' : ''))
        : ('已为选中的 '+list.length+' 个汉字加上拼音'));
    }
    return;
  }

  /* 无选区：全文注音 / 取消注音 */
  if(zyOn(curKey)){
    z.all = false; z.one = {}; z.off = {}; z.single = null; z.edit = null;
    closePyEdit();
    repaint(); refreshBars();
    toast('已取消注音');
  }else{
    ensurePY();
    z.all = true;
    repaint(); refreshBars();
    toast('已开启全文注音');
  }

/* 联网查找：常驻按钮。选中一个汉字就用它搜索并把拼音变成可修改；
   选中多个字就整段拿去搜（拼音修改只对单个汉字有意义）。 */
function pySearch(){
  if(!CTX){ toast('请先打开一篇文稿'); return; }
  var info = recentSel();
  if(!info){ toast('请先选中一个汉字，再点联网查找'); return; }
  var all = (CTX.paras || []).join('');
  var seg = all.slice(info.base + info.a, info.base + info.b);
  var hz = [];
  for(var i=0;i<seg.length;i++){
    if(isHan(seg.charAt(i))) hz.push({ ch: seg.charAt(i), gi: info.base + info.a + i });
  }
  if(!hz.length){ toast('选中的内容里没有汉字'); return; }
  var one = (hz.length === 1);
  /* 顺手给这个字注上音，拼音才有落脚点可改 */
  if(one){

    ensurePY();
    if(z){
      delete z.off[hz[0].gi];
      if(z.one[hz[0].gi] == null) z.one[hz[0].gi] = PYCUSTOM[hz[0].ch] || PYMAP[hz[0].ch] || '';
      z.single = hz[0].gi;
    }

  if(one){
    openPyEdit(hz[0].gi);
    toast('已打开搜索，这个字的拼音可以直接改');
  }else{
    toast('已用选中的文字搜索；拼音修改只对单个汉字有效');
  }
