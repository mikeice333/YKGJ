人民也。此非所以跨海内、制诸侯之术也。", "臣闻地广者粟多，国大者人众，兵强则士勇。是以太山不让土壤，故能成其大；河海不择细流，故能就其深；王者不却众庶，故能明其德。是以地无四方，民无异国，四时充美，鬼神降福，此五帝三王之所以无敌也。今乃弃黔首以资敌国，却宾客以业诸侯，使天下之士退而不敢西向，裹足不入秦，此所谓“藉寇兵而赍盗粮”者也。", "夫物不产于秦，可宝者多；士不产于秦，而愿忠者众。今逐客以资敌国，损民以益仇，内自虚而外树怨于诸侯，求国无危，不可得也。"], "id": 222}, {"title": "兰亭集序", "author": "王羲之", "tag": "选择性必修下册", "cat": "高中必背", "lines": ["永和九年，岁在癸丑，暮春之初，会于会稽山阴之兰亭，修禊事也。群贤毕至，少长咸集。此地有崇山峻岭，茂林修竹，又有清流激湍，映带左右，引以为流觞曲水，列坐其次。虽无丝竹管弦之盛，一觞一咏，亦足以畅叙幽情。", "是日也，天朗气清，惠风和畅。仰观宇宙之大，俯察品类之盛，所以游目骋怀，足以极视听之娱，信可乐也。", "夫人之相与，俯仰一世。或取诸怀抱，悟言一室之内；或因寄所托，放浪形骸之外。虽趣舍万殊，静躁不同，当其欣于所遇，暂得于己，快然自足，不知老之将至；及其所之既倦，情随事迁，感慨系之矣。向之所欣，俯仰之间，已为陈迹，犹不能不以之兴怀，况修短随化，终期于尽！古人云：“死生亦大矣。”岂不痛哉！", "每览昔人兴感之由，若合一契，未尝不临文嗟悼，不能喻之于怀。固知一死生为虚诞，齐彭殇为妄作。后之视今，亦犹今之视昔，悲夫！故列叙时人，录其所述，虽世殊事异，所以兴怀，其致一也。后之览者，亦将有感于斯文。"], "id": 223}, {"title": "滕王阁序", "author": "王勃", "tag": "选修", "cat": "高中必背", "lines": ["豫章故郡，洪都新府。星分翼轸，地接衡庐。襟三江而带五湖，控蛮荆而引瓯越。物华天宝，龙光射牛斗之墟；人杰地灵，徐孺下陈蕃之榻。雄州雾列，俊采星驰。台隍枕夷夏之交，宾主尽东南之美。都督阎公之雅望，棨戟遥临；宇文新州之懿范，襜帷暂驻。十旬休假，胜友如云；千里逢迎，高朋满座。腾蛟起凤，孟学士之词宗；紫电青霜，王将军之武库。家君作宰，路出名区；童子何知，躬逢胜饯。", "时维九月，序属三秋。潦水尽而寒潭清，烟光凝而暮山紫。俨骖騑于上路，访风景于崇阿；临帝子之长洲，得天人之旧馆。层峦耸翠，上出重霄；飞阁流丹，下临无地。鹤汀凫渚，穷岛屿之萦回；桂殿兰宫，即冈峦之体势。披绣闼，俯雕甍，山原旷其盈视，川泽纡其骇瞩。闾阎扑地，钟鸣鼎食之家；舸舰弥津，青雀黄龙之舳。云销雨霁，彩彻区明。落霞与孤鹜齐飞，秋水共长天一色。渔舟唱晚，响穷彭蠡之滨；雁阵惊寒，声断衡阳之浦。", "遥襟甫畅，逸兴遄飞。爽籁发而清风生，纤歌凝而白云遏。睢园绿竹，气凌彭泽之樽；邺水朱华，光照临川之笔。四美具，二难并。穷睇眄于中天，极娱游于暇日。天高地迥，觉宇宙之无穷；兴尽悲来，识盈虚之有数。望长安于日下，目吴会于云间。地势极而南溟深，天柱高而北辰远。关山难越，谁悲失路之人？萍水相逢，尽是他乡之客。怀帝阍而不见，奉宣室以何年？", "嗟乎！时运不齐，命途多舛。冯唐易老，李广难封。屈贾谊于长沙，非无圣主；窜梁鸿于海曲，岂乏明时？所赖君子见机，达人知命。老当益壮，宁移白首之心？穷且益坚，不坠青云之志。酌贪泉而觉爽，处涸辙以犹欢。北海虽赊，扶摇可接；东隅已逝，桑榆非晚。孟尝高洁，空余报国之情；阮籍猖狂，岂效穷途之哭！", "勃，三尺微命，一介书生。无路请缨，等终军之弱冠；有怀投笔，慕宗悫之长风。舍簪笏于百龄，奉晨昏于万里。非谢家之宝树，接孟氏之芳邻。他日趋庭，叨陪鲤对；今兹捧袂，喜托龙门。杨意不逢，抚凌云而自惜；钟期既遇，奏流水以何惭？", "呜呼！胜地不常，盛筵难再；兰亭已矣，梓泽丘墟。临别赠言，幸承恩于伟饯；登高作赋，是所望于群公。敢竭鄙怀，恭疏短引；一言均赋，四韵俱成。请洒潘江，各倾陆海云尔。"], "id": 224}, {"title": "黄冈竹楼记", "author": "王禹偁", "tag": "选修", "cat": "高中必背", "lines": ["黄冈之地多竹，大者如椽。竹工破之，刳去其节，用代陶瓦。比屋皆然，以其价廉而工省也。", "子城西北隅，雉堞圮毁，蓁莽荒秽，因作小楼二间，与月波楼通。远吞山光，平挹江濑，幽阒辽夐，不可具状。夏宜急雨，有瀑布声；冬宜密雪，有碎玉声。宜鼓琴，琴调虚畅；宜咏诗，诗韵清绝；宜围棋，子声丁丁然；宜投壶，矢声铮铮然：皆竹楼之所助也。", "公退之暇，被鹤氅衣，戴华阳巾，手执《周易》一卷，焚香默坐，消遣世虑。江山之外，第见风帆沙鸟、烟云竹树而已。待其酒力醒，茶烟歇，送夕阳，迎素月，亦谪居之胜概也。", "彼齐云、落星，高则高矣；井干、丽谯，华则华矣；止于贮妓女，藏歌舞，非骚人之事，吾所不取。", "吾闻竹工云：“竹之为瓦，仅十稔；若重覆之，得二十稔。”噫！吾以至道乙未岁，自翰林出滁上；丙申，移广陵；丁酉，又入西掖；戊戌岁除日，有齐安之命；己亥闰三月到郡。四年之间，奔走不暇，未知明年又在何处，岂惧竹楼之易朽乎？幸后之人与我同志，嗣而葺之，庶斯楼之不朽也。", "咸平二年八月十五日记。"], "id": 225}, {"title": "上枢密韩太尉书", "author": "苏辙", "tag": "选修", "cat": "高中必背", "lines": ["太尉执事：辙生好为文，思之至深。以为文者气之所形，然文不可以学而能，气可以养而致。孟子曰：“我善养吾浩然之气。”今观其文章，宽厚宏博，充乎天地之间，称其气之小大。太史公行天下，周览四海名山大川，与燕、赵间豪俊交游，故其文疏荡，颇有奇气。此二子者，岂尝执笔学为如此之文哉？其气充乎其中而溢乎其貌，动乎其言而见乎其文，而不自知也。", "辙生十有九年矣。其居家所与游者，不过其邻里乡党之人；所见不过数百里之间，无高山大野可登览以自广；百氏之书，虽无所不读，然皆古人之陈迹，不足以激发其志气。恐遂汩没，故决然舍去，求天下奇闻壮观，以知天地之广大。过秦、汉之故都，恣观终南、嵩、华之高，北顾黄河之奔流，慨然想见古之豪杰。至京师，仰观天子宫阙之壮，与仓廪、府库、城池、苑囿之富且大也，而后知天下之巨丽。见翰林欧阳公，听其议论之宏辩，观其容貌之秀伟，与其门人贤士大夫游，而后知天下之文章聚乎此也。太尉以才略冠天下，天下之所恃以无忧，四夷之所惮以不敢发，入则周公、召公，出则方叔、召虎。而辙也未之见焉。", "且夫人之学也，不志其大，虽多而何为？辙之来也，于山见终南、嵩、华之高，于水见黄河之大且深，于人见欧阳公，而犹以为未见太尉也。故愿得观贤人之光耀，闻一言以自壮，然后可以尽天下之大观而无憾者矣。", "辙年少，未能通习吏事。向之来，非有取于斗升之禄，偶然得之，非其所乐。然幸得赐归待选，使得优游数年之间，将以益治其文，且学为政。太尉苟以为可教而辱教之，又幸矣！"], "id": 226}, {"title": "古代文论选段", "author": "《毛诗序》等", "tag": "选修", "cat": "高中必背", "lines": ["诗者，志之所之也。在心为志，发言为诗。情动于中而形于言，言之不足，故嗟叹之；嗟叹之不足，故永歌之；永歌之不足，不知手之舞之，足之蹈之也。情发于声，声成文谓之音。治世之音安以乐，其政和；乱世之音怨以怒，其政乖；亡国之音哀以思，其民困。故正得失，动天地，感鬼神，莫近于诗。先王以是经夫妇，成孝敬，厚人伦，美教化，移风俗。", "气之动物，物之感人，故摇荡性情，形诸舞咏。照烛三才，晖丽万有，灵祇待之以致飨，幽微藉之以昭告。动天地，感鬼神，莫近于诗。若乃春风春鸟，秋月秋蝉，夏云暑雨，冬月祁寒，斯四候之感诸诗者也。嘉会寄诗以亲，离群托诗以怨。", "夫诗有别材，非关书也；诗有别趣，非关理也。然非多读书、多穷理，则不能极其至。所谓不涉理路、不落言筌者，上也。诗者，吟咏情性也。盛唐诸人惟在兴趣，羚羊挂角，无迹可求。故其妙处透彻玲珑，不可凑泊，如空中之音，相中之色，水中之月，镜中之象，言有尽而意无穷。", "词以境界为最上。有境界则自成高格，自有名句。五代、北宋之词所以独绝者在此。有造境，有写境，此理想与写实二派之所由分。然二者颇难分别。因大诗人所造之境，必合乎自然，所写之境，亦必邻于理想故也。古今之成大事业、大学问者，必经过三种之境界：“昨夜西风凋碧树。独上高楼，望尽天涯路。”此第一境也。“衣带渐宽终不悔，为伊消得人憔悴。”此第二境也。“众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。”此第三境也。"], "id": 227}, {"title": "静女", "author": "《诗经·邶风》", "tag": "必修上册", "cat": "高中必背", "lines": ["静女其姝，俟我于城隅。爱而不见，搔首踟蹰。", "静女其娈，贻我彤管。彤管有炜，说怿女美。", "自牧归荑，洵美且异。匪女之为美，美人之贻。"], "id": 228}, {"title": "无衣", "author": "《诗经·秦风》", "tag": "选择性必修上册", "cat": "高中必背", "lines": ["岂曰无衣？与子同袍。王于兴师，修我戈矛。与子同仇！", "岂曰无衣？与子同泽。王于兴师，修我矛戟。与子偕作！", "岂曰无衣？与子同裳。王于兴师，修我甲兵。与子偕行！"], "id": 229}, {"title": "离骚（节选）", "author": "屈原", "tag": "选择性必修下册", "cat": "高中必背", "lines": ["帝高阳之苗裔兮，朕皇考曰伯庸。", "摄提贞于孟陬兮，惟庚寅吾以降。", "皇览揆余初度兮，肇锡余以嘉名：", "名余曰正则兮，字余曰灵均。", "纷吾既有此内美兮，又重之以修能。", "扈江离与辟芷兮，纫秋兰以为佩。", "汩余若将不及兮，恐年岁之不吾与。", "朝搴阰之木兰兮，夕揽洲之宿莽。", "日月忽其不淹兮，春与秋其代序。", "惟草木之零落兮，恐美人之迟暮。", "不抚壮而弃秽兮，何不改乎此度？", "乘骐骥以驰骋兮，来吾道夫先路！"], "id": 230}, {"title": "涉江采芙蓉", "author": "《古诗十九首》", "tag": "必修上册", "cat": "高中必背", "lines": ["涉江采芙蓉，兰泽多芳草。", "采之欲遗谁？所思在远道。", "还顾望旧乡，长路漫浩浩。", "同心而离居，忧伤以终老。"], "id": 231}, {"title": "短歌行", "author": "曹操", "tag": "必修上册", "cat": "高中必背", "lines": ["对酒当歌，人生几何！譬如朝露，去日苦多。", "慨当以慷，忧思难忘。何以解忧？唯有杜康。", "青青子衿，悠悠我心。但为君故，沉吟至今。", "呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙。", "明明如月，何时可掇？忧从中来，不可断绝。", "越陌度阡，枉用相存。契阔谈䜩，心念旧恩。", "月明星稀，乌鹊南飞。绕树三匝，何枝可依？", "山不厌高，海不厌深。周公吐哺，天下归心。"], "id": 232}, {"title": "归园田居（其一）", "author": "陶渊明", "tag": "必修上册", "cat": "高中必背", "lines": ["少无适俗韵，性本爱丘山。误落尘网中，一去三十年。", "羁鸟恋旧林，池鱼思故渊。开荒南野际，守拙归园田。", "方宅十余亩，草屋八九间。榆柳荫后檐，桃李罗堂前。", "暧暧远人村，依依墟里烟。狗吠深巷中，鸡鸣桑树颠。", "户庭无尘杂，虚室有余闲。久在樊笼里，复得返自然。"], "id": 233}, {"title": "拟行路难（其四）", "author": "鲍照", "tag": "选择性必修下册", "cat": "高中必背", "lines": ["泻水置平地，各自东西南北流。", "人生亦有命，安能行叹复坐愁！", "酌酒以自宽，举杯断绝歌路难。", "心非木石岂无感？吞声踯躅不敢言。"], "id": 234}, {"title": "春江花月夜", "author": "张若虚", "tag": "选择性必修上册", "cat": "高中必背", "lines": ["春江潮水连海平，海上明月共潮生。", "滟滟随波千万里，何处春江无月明！", "江流宛转绕芳甸，月照花林皆似霰。", "空里流霜不觉飞，汀上白沙看不见。", "江天一色无纤尘，皎皎空中孤月轮。", "江畔何人初见月？江月何年初照人？", "人生代代无穷已，江月年年望相似。", "不知江月待何人，但见长江送流水。", "白云一片去悠悠，青枫浦上不胜愁。", "谁家今夜扁舟子？何处相思明月楼？", "可怜楼上月裴回，应照离人妆镜台。", "玉户帘中卷不去，捣衣砧上拂还来。", "此时相望不相闻，愿逐月华流照君。", "鸿雁长飞光不度，鱼龙潜跃水成文。", "昨夜闲潭梦落花，可怜春半不还家。", "江水流春去欲尽，江潭落月复西斜。", "斜月沉沉藏海雾，碣石潇湘无限路。", "不知乘月几人归，落月摇情满江树。"], "id": 235}, {"title": "山居秋暝", "author": "王维", "tag": "高中", "cat": "高中必背", "lines": ["空山新雨后，天气晚来秋。", "明月松间照，清泉石上流。", "竹喧归浣女，莲动下渔舟。", "随意春芳歇，王孙自可留。"], "id": 236}, {"title": "蜀道难", "author": "李白", "tag": "选择性必修下册", "cat": "高中必背", "lines": ["噫吁嚱，危乎高哉！蜀道之难，难于上青天！", "蚕丛及鱼凫，开国何茫然！尔来四万八千岁，不与秦塞通人烟。", "西当太白有鸟道，可以横绝峨眉巅。地崩山摧壮士死，然后天梯石栈相钩连。", "上有六龙回日之高标，下有冲波逆折之回川。", "黄鹤之飞尚不得过，猿猱欲度愁攀援。", "青泥何盘盘，百步九折萦岩峦。", "扪参历井仰胁息，以手抚膺坐长叹。", "问君西游何时还？畏途巉岩不可攀。", "但见悲鸟号古木，雄飞雌从绕林间。", "又闻子规啼夜月，愁空山。蜀道之难，难于上青天，使人听此凋朱颜！", "连峰去天不盈尺，枯松倒挂倚绝壁。", "飞湍瀑流争喧豗，砯崖转石万壑雷。", "其险也如此，嗟尔远道之人胡为乎来哉！", "剑阁峥嵘而崔嵬，一夫当关，万夫莫开。", "所守或匪亲，化为狼与豺。", "朝避猛虎，夕避长蛇；磨牙吮血，杀人如麻。", "锦城虽云乐，不如早还家。", "蜀道之难，难于上青天，侧身西望长咨嗟！"], "id": 237}, {"title": "梦游天姥吟留别", "author": "李白", "tag": "必修上册", "cat": "高中必背", "lines": ["海客谈瀛洲，烟涛微茫信难求；越人语天姥，云霞明灭或可睹。", "天姥连天向天横，势拔五岳掩赤城。", "天台四万八千丈，对此欲倒东南倾。", "我欲因之梦吴越，一夜飞度镜湖月。", "湖月照我影，送我至剡溪。", "谢公宿处今尚在，渌水荡漾清猿啼。", "脚著谢公屐，身登青云梯。", "半壁见海日，空中闻天鸡。", "千岩万转路不定，迷花倚石忽已暝。", "熊咆龙吟殷岩泉，栗深林兮惊层巅。", "云青青兮欲雨，水澹澹兮生烟。", "列缺霹雳，丘峦崩摧。洞天石扉，訇然中开。", "青冥浩荡不见底，日月照耀金银台。", "霓为衣兮风为马，云之君兮纷纷而来下。", "虎鼓瑟兮鸾回车，仙之人兮列如麻。", "忽魂悸以魄动，恍惊起而长嗟。", "惟觉时之枕席，失向来之烟霞。", "世间行乐亦如此，古来万事东流水。", "别君去兮何时还？且放白鹿青崖间，须行即骑访名山。", "安能摧眉折腰事权贵，使我不得开心颜！"], "id": 238}, {"title": "将进酒", "author": "李白", "tag": "选择性必修上册", "cat": "高中必背", "lines": ["君不见，黄河之水天上来，奔流到海不复回。", "君不见，高堂明镜悲白发，朝如青丝暮成雪。", "人生得意须尽欢，莫使金樽空对月。", "天生我材必有用，千金散尽还复来。", "烹羊宰牛且为乐，会须一饮三百杯。", "岑夫子，丹丘生，将进酒，杯莫停。", "与君歌一曲，请君为我倾耳听。", "钟鼓馔玉不足贵，但愿长醉不复醒。", "古来圣贤皆寂寞，惟有饮者留其名。", "陈王昔时宴平乐，斗酒十千恣欢谑。", "主人何为言少钱，径须沽取对君酌。", "五花马，千金裘，呼儿将出换美酒，与尔同销万古愁。"], "id": 239}, {"title": "燕歌行（并序）", "author": "高适", "tag": "选择性必修中册", "cat": "高中必背", "lines": ["开元二十六年，客有从御史大夫张公出塞而还者，作《燕歌行》以示适，感征戍之事，因而和焉。", "汉家烟尘在东北，汉将辞家破残贼。", "男儿本自重横行，天子非常赐颜色。", "摐金伐鼓下榆关，旌旆逶迤碣石间。", "校尉羽书飞瀚海，单于猎火照狼山。", "山川萧条极边土，胡骑凭陵杂风雨。", "战士军前半死生，美人帐下犹歌舞。", "大漠穷秋塞草腓，孤城落日斗兵稀。", "身当恩遇常轻敌，力尽关山未解围。", "铁衣远戍辛勤久，玉箸应啼别离后。", "少妇城南欲断肠，征人蓟北空回首。", "边庭飘飖那可度，绝域苍茫无所有。", "杀气三时作阵云，寒声一夜传刁斗。", "相看白刃血纷纷，死节从来岂顾勋！", "君不见沙场征战苦，至今犹忆李将军。"], "id": 240}, {"title": "蜀相", "author": "杜甫", "tag": "选择性必修下册", "cat": "高中必背", "lines": ["丞相祠堂何处寻？锦官城外柏森森。", "映阶碧草自春色，隔叶黄鹂空好音。", "三顾频烦天下计，两朝开济老臣心。", "出师未捷身先死，长使英雄泪满襟。"], "id": 241}, {"title": "客至", "author": "杜甫", "tag": "选择性必修下册", "cat": "高中必背", "lines": ["舍南舍北皆春水，但见群鸥日日来。", "花径不曾缘客扫，蓬门今始为君开。", "盘飧市远无兼味，樽酒家贫只旧醅。", "肯与邻翁相对饮，隔篱呼取尽余杯。"], "id": 242}, {"title": "登高", "author": "杜甫", "tag": "必修上册", "cat": "高中必背", "lines": ["风急天高猿啸哀，渚清沙白鸟飞回。", "无边落木萧萧下，不尽长江滚滚来。", "万里悲秋常作客，百年多病独登台。", "艰难苦恨繁霜鬓，潦倒新停浊酒杯。"], "id": 243}, {"title": "登岳阳楼", "author": "杜甫", "tag": "必修下册", "cat": "高中必背", "lines": ["昔闻洞庭水，今上岳阳楼。", "吴楚东南坼，乾坤日夜浮。", "亲朋无一字，老病有孤舟。", "戎马关山北，凭轩涕泗流。"], "id": 244}, {"title": "琵琶行（并序）", "author": "白居易", "tag": "必修上册", "cat": "高中必背", "lines": ["元和十年，予左迁九江郡司马。明年秋，送客湓浦口，闻舟中夜弹琵琶者，听其音，铮铮然有京都声。问其人，本长安倡女，尝学琵琶于穆、曹二善才，年长色衰，委身为贾人妇。遂命酒，使快弹数曲。曲罢悯然，自叙少小时欢乐事，今漂沦憔悴，转徙于江湖间。予出官二年，恬然自安，感斯人言，是夕始觉有迁谪意。因为长句，歌以赠之，凡六百一十六言，命曰《琵琶行》。", "浔阳江头夜送客，枫叶荻花秋瑟瑟。", "主人下马客在船，举酒欲饮无管弦。", "醉不成欢惨将别，别时茫茫江浸月。", "忽闻水上琵琶声，主人忘归客不发。", "寻声暗问弹者谁？琵琶声停欲语迟。", "移船相近邀相见，添酒回灯重开宴。", "千呼万唤始出来，犹抱琵琶半遮面。", "转轴拨弦三两声，未成曲调先有情。", "弦弦掩抑声声思，似诉平生不得志。", "低眉信手续续弹，说尽心中无限事。", "轻拢慢捻抹复挑，初为《霓裳》后《六幺》。", "大弦嘈嘈如急雨，小弦切切如私语。", "嘈嘈切切错杂弹，大珠小珠落玉盘。", "间关莺语花底滑，幽咽泉流冰下难。", "冰泉冷涩弦凝绝，凝绝不通声暂歇。", "别有幽愁暗恨生，此时无声胜有声。", "银瓶乍破水浆迸，铁骑突出刀枪鸣。", "曲终收拨当心画，四弦一声如裂帛。", "东船西舫悄无言，唯见江心秋月白。", "沉吟放拨插弦中，整顿衣裳起敛容。", "自言本是京城女，家在虾蟆陵下住。", "十三学得琵琶成，名属教坊第一部。", "曲罢曾教善才服，妆成每被秋娘妒。", "五陵年少争缠头，一曲红绡不知数。", "钿头银篦击节碎，血色罗裙翻酒污。", "今年欢笑复明年，秋月春风等闲度。", "弟走从军阿姨死，暮去朝来颜色故。", "门前冷落鞍马稀，老大嫁作商人妇。", "商人重利轻别离，前月浮梁买茶去。", "去来江口守空船，绕船月明江水寒。", "夜深忽梦少年事，梦啼妆泪红阑干。", "我闻琵琶已叹息，又闻此语重唧唧。", "同是天涯沦落人，相逢何必曾相识！", "我从去年辞帝京，谪居卧病浔阳城。", "浔阳地僻无音乐，终岁不闻丝竹声。", "住近湓江地低湿，黄芦苦竹绕宅生。", "其间旦暮闻何物？杜鹃啼血猿哀鸣。", "春江花朝秋月夜，往往取酒还独倾。", "岂无山歌与村笛，呕哑嘲哳难为听。", "今夜闻君琵琶语，如听仙乐耳暂明。", "莫辞更坐弹一曲，为君翻作《琵琶行》。", "感我此言良久立，却坐促弦弦转急。", "凄凄不似向前声，满座重闻皆掩泣。", "座中泣下谁最多？江州司马青衫湿。"], "id": 245}, {"title": "李凭箜篌引", "author": "李贺", "tag": "选择性必修中册", "cat": "高中必背", "lines": ["吴丝蜀桐张高秋，空山凝云颓不流。", "江娥啼竹素女愁，李凭中国弹箜篌。", "昆山玉碎凤凰叫，芙蓉泣露香兰笑。", "十二门前融冷光，二十三丝动紫皇。", "女娲炼石补天处，石破天惊逗秋雨。", "梦入神山教神妪，老鱼跳波瘦蛟舞。", "吴质不眠倚桂树，露脚斜飞湿寒兔。"], "id": 246}, {"title": "菩萨蛮（小山重叠金明灭）", "author": "温庭筠", "tag": "高中", "cat": "高中必背", "lines": ["小山重叠金明灭，鬓云欲度香腮雪。懒起画蛾眉，弄妆梳洗迟。", "照花前后镜，花面交相映。新帖绣罗襦，双双金鹧鸪。"], "id": 247}, {"title": "锦瑟", "author": "李商隐", "tag": "选择性必修中册", "cat": "高中必背", "lines": ["锦瑟无端五十弦，一弦一柱思华年。", "庄生晓梦迷蝴蝶，望帝春心托杜鹃。", "沧海月明珠有泪，蓝田日暖玉生烟。", "此情可待成追忆？只是当时已惘然。"], "id": 248}, {"title": "虞美人（春花秋月何时了）", "author": "李煜", "tag": "必修上册", "cat": "高中必背", "lines": ["春花秋月何时了？往事知多少。小楼昨夜又东风，故国不堪回首月明中。", "雕栏玉砌应犹在，只是朱颜改。问君能有几多愁？恰似一江春水向东流。"], "id": 249}, {"title": "望海潮（东南形胜）", "author": "柳永", "tag": "选择性必修下册", "cat": "高中必背", "lines": ["东南形胜，三吴都会，钱塘自古繁华。烟柳画桥，风帘翠幕，参差十万人家。云树绕堤沙，怒涛卷霜雪，天堑无涯。市列珠玑，户盈罗绮，竞豪奢。", "重湖叠巘清嘉，有三秋桂子，十里荷花。羌管弄晴，菱歌泛夜，嬉嬉钓叟莲娃。千骑拥高牙，乘醉听箫鼓，吟赏烟霞。异日图将好景，归去凤池夸。"], "id": 250}, {"title": "桂枝香·金陵怀古", "author": "王安石", "tag": "必修下册", "cat": "高中必背", "lines": ["登临送目，正故国晚秋，天气初肃。千里澄江似练，翠峰如簇。归帆去棹残阳里，背西风，酒旗斜矗。彩舟云淡，星河鹭起，画图难足。", "念往昔，繁华竞逐，叹门外楼头，悲恨相续。千古凭高对此，谩嗟荣辱。六朝旧事随流水，但寒烟衰草凝绿。至今商女，时时犹唱，《后庭》遗曲。"], "id": 251}, {"title": "江城子·乙卯正月二十日夜记梦", "author": "苏轼", "tag": "选择性必修上册", "cat": "高中必背", "lines": ["十年生死两茫茫，不思量，自难忘。千里孤坟，无处话凄凉。纵使相逢应不识，尘满面，鬓如霜。", "夜来幽梦忽还乡，小轩窗，正梳妆。相顾无言，惟有泪千行。料得年年肠断处，明月夜，短松冈。"], "id": 252}, {"title": "念奴娇·赤壁怀古", "author": "苏轼", "tag": "必修上册", "cat": "高中必背", "lines": ["大江东去，浪淘尽，千古风流人物。故垒西边，人道是，三国周郎赤壁。乱石穿空，惊涛拍岸，卷起千堆雪。江山如画，一时多少豪杰。", "遥想公瑾当年，小乔初嫁了，雄姿英发。羽扇纶巾，谈笑间，樯橹灰飞烟灭。故国神游，多情应笑我，早生华发。人生如梦，一尊还酹江月。"], "id": 253}, {"title": "登快阁", "author": "黄庭坚", "tag": "选择性必修下册", "cat": "高中必背", "lines": ["痴儿了却公家事，快阁东西倚晚晴。", "落木千山天远大，澄江一道月分明。", "朱弦已为佳人绝，青眼聊因美酒横。", "万里归船弄长笛，此心吾与白鸥盟。"], "id": 254}, {"title": "鹊桥仙（纤云弄巧）", "author": "秦观", "tag": "必修上册", "cat": "高中必背", "lines": ["纤云弄巧，飞星传恨，银汉迢迢暗度。金风玉露一相逢，便胜却人间无数。", "柔情似水，佳期如梦，忍顾鹊桥归路。两情若是久长时，又岂在朝朝暮暮。"], "id": 255}, {"title": "苏幕遮（燎沉香）", "author": "周邦彦", "tag": "高中", "cat": "高中必背", "lines": ["燎沉香，消溽暑。鸟雀呼晴，侵晓窥檐语。叶上初阳干宿雨，水面清圆，一一风荷举。", "故乡遥，何日去？家住吴门，久作长安旅。五月渔郎相忆否？小楫轻舟，梦入芙蓉浦。"], "id": 256}, {"title": "声声慢（寻寻觅觅）", "author": "李清照", "tag": "必修上册", "cat": "高中必背", "lines": ["寻寻觅觅，冷冷清清，凄凄惨惨戚戚。乍暖还寒时候，最难将息。三杯两盏淡酒，怎敌他、晚来风急！雁过也，正伤心，却是旧时相识。", "满地黄花堆积，憔悴损，如今有谁堪摘？守着窗儿，独自怎生得黑！梧桐更兼细雨，到黄昏、点点滴滴。这次第，怎一个愁字了得！"], "id": 257}, {"title": "书愤", "author": "陆游", "tag": "选择性必修中册", "cat": "高中必背", "lines": ["早岁那知世事艰，中原北望气如山。", "楼船夜雪瓜洲渡，铁马秋风大散关。", "塞上长城空自许，镜中衰鬓已先斑。", "出师一表真名世，千载谁堪伯仲间！"], "id": 258}, {"title": "临安春雨初霁", "author": "陆游", "tag": "选择性必修下册", "cat": "高中必背", "lines": ["世味年来薄似纱，谁令骑马客京华。", "小楼一夜听春雨，深巷明朝卖杏花。", "矮纸斜行闲作草，晴窗细乳戏分茶。", "素衣莫起风尘叹，犹及清明可到家。"], "id": 259}, {"title": "念奴娇·过洞庭", "author": "张孝祥", "tag": "必修下册", "cat": "高中必背", "lines": ["洞庭青草，近中秋，更无一点风色。玉鉴琼田三万顷，著我扁舟一叶。素月分辉，明河共影，表里俱澄澈。悠然心会，妙处难与君说。", "应念岭海经年，孤光自照，肝肺皆冰雪。短发萧骚襟袖冷，稳泛沧浪空阔。尽挹西江，细斟北斗，万象为宾客。扣舷独啸，不知今夕何夕！"], "id": 260}, {"title": "永遇乐·京口北固亭怀古", "author": "辛弃疾", "tag": "必修上册", "cat": "高中必背", "lines": ["千古江山，英雄无觅，孙仲谋处。舞榭歌台，风流总被，雨打风吹去。斜阳草树，寻常巷陌，人道寄奴曾住。想当年，金戈铁马，气吞万里如虎。", "元嘉草草，封狼居胥，赢得仓皇北顾。四十三年，望中犹记，烽火扬州路。可堪回首，佛狸祠下，一片神鸦社鼓。凭谁问：廉颇老矣，尚能饭否？"], "id": 261}, {"title": "菩萨蛮·书江西造口壁", "author": "辛弃疾", "tag": "高中", "cat": "高中必背", "lines": ["郁孤台下清江水，中间多少行人泪。西北望长安，可怜无数山。", "青山遮不住，毕竟东流去。江晚正愁余，山深闻鹧鸪。"], "id": 262}, {"title": "青玉案·元夕", "author": "辛弃疾", "tag": "高中", "cat": "高中必背", "lines": ["东风夜放花千树。更吹落，星如雨。宝马雕车香满路。凤箫声动，玉壶光转，一夜鱼龙舞。", "蛾儿雪柳黄金缕，笑语盈盈暗香去。众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。"], "id": 263}, {"title": "贺新郎（国脉微如缕）", "author": "刘克庄", "tag": "高中", "cat": "高中必背", "lines": ["国脉微如缕。问长缨何时入手，缚将戎主？未必人间无好汉，谁与宽些尺度？试看取当年韩五。岂有谷城公付授，也不干曾遇骊山母。谈笑起，两河路。", "少时棋柝曾联句。叹而今登楼揽镜，事机频误。闻说北风吹面急，边上冲梯屡舞。君莫道投鞭虚语。自古一贤能制难，有金汤便可无张许？快投笔，莫题柱。"], "id": 264}, {"title": "扬州慢（淮左名都）", "author": "姜夔", "tag": "选择性必修下册", "cat": "高中必背", "lines": ["淮左名都，竹西佳处，解鞍少驻初程。过春风十里，尽荠麦青青。自胡马窥江去后，废池乔木，犹厌言兵。渐黄昏，清角吹寒，都在空城。", "杜郎俊赏，算而今重到须惊。纵豆蔻词工，青楼梦好，难赋深情。二十四桥仍在，波心荡，冷月无声。念桥边红药，年年知为谁生？"], "id": 265}, {"title": "长亭送别（【正宫】【端正好】）", "author": "王实甫", "tag": "高中", "cat": "高中必背", "lines": ["【正宫】【端正好】碧云天，黄花地，西风紧，北雁南飞。", "晓来谁染霜林醉？总是离人泪。"], "id": 266}, {"title": "朝天子·咏喇叭", "author": "王磐", "tag": "高中", "cat": "高中必背", "lines": ["喇叭，唢呐，曲儿小腔儿大。官船来往乱如麻，全仗你抬声价。", "军听了军愁，民听了民怕。哪里去辨甚么真共假？眼见的吹翻了这家，吹伤了那家，只吹的水尽鹅飞罢！"], "id": 267}, {"title": "秋天的雨", "author": "陶金鸿", "tag": "三年级上册", "cat": "现代文名篇", "lines": ["秋天的雨，是一把钥匙。它带着清凉和温柔，轻轻地，轻轻地，趁你没留意，把秋天的大门打开了。", "秋天的雨，有一盒五彩缤纷的颜料。你看，它把黄色给了银杏树，黄黄的叶子像一把把小扇子，扇哪扇哪，扇走了夏天的炎热。它把红色给了枫树，红红的枫叶像一枚枚邮票，飘哇飘哇，邮来了秋天的凉爽。金黄色是给田野的，看，田野像金色的海洋。橙红色是给果树的，橘子、柿子你挤我碰，争着要人们去摘呢！菊花仙子得到的颜色就更多了，紫红的、淡黄的、雪白的……美丽的菊花在秋雨里频频点头。", "秋天的雨，藏着非常好闻的气味。梨香香的，菠萝甜甜的，还有苹果、橘子，好多好多香甜的气味，都躲在小雨滴里呢！小朋友的脚，常被那香味勾住。", "秋天的雨，吹起了金色的小喇叭。它告诉大家，冬天快要来了。小松鼠找来松果当粮食，小青蛙在加紧挖洞，准备舒舒服服地睡大觉。松柏穿上厚厚的、油亮亮的衣裳，杨树、柳树的叶子飘到树妈妈的脚下。它们都在准备过冬了。", "秋天的雨，带给大地的是一曲丰收的歌，带给小朋友的是一首欢乐的歌。"], "id": 268}, {"title": "荷花", "author": "叶圣陶", "tag": "三年级下册", "cat": "现代文名篇", "lines": ["清早，我到公园去玩，一进门就闻到一阵清香。我赶紧往荷花池边跑去。", "荷花已经开了不少了。荷叶挨挨挤挤的，像一个个碧绿的大圆盘。白荷花在这些大圆盘之间冒出来。有的才展开两三片花瓣儿。有的花瓣儿全展开了，露出嫩黄色的小莲蓬。有的还是花骨朵儿，看起来饱胀得马上要破裂似的。", "这么多的白荷花，一朵有一朵的姿势。看看这一朵，很美；看看那一朵，也很美。如果把眼前的一池荷花看作一大幅活的画，那画家的本领可真了不起。", "我忽然觉得自己仿佛就是一朵荷花，穿着雪白的衣裳，站在阳光里。一阵微风吹过来，我就翩翩起舞，雪白的衣裳随风飘动。不光是我一朵，一池的荷花都在舞蹈。风过了，我停止了舞蹈，静静地站在那儿。蜻蜓飞过来，告诉我清早飞行的快乐。小鱼在脚下游过，告诉我昨夜做的好梦……", "过了好一会儿，我才记起我不是荷花，我是在看荷花呢。"], "id": 269}, {"title": "燕子", "author": "郑振铎", "tag": "三年级下册", "cat": "现代文名篇", "lines": ["一身乌黑的羽毛，一对轻快有力的翅膀，加上剪刀似的尾巴，凑成了那样可爱的活泼的小燕子。", "二三月的春日里，轻风微微地吹拂着，如毛的细雨由天上洒落着，千条万条的柔柳，红的白的黄的花，青的草，绿的叶，都像赶集似的聚拢来，形成了烂漫无比的春天。这时候，那些小燕子，那么伶俐可爱的小燕子，也由南方飞来，加入这光彩夺目的图画中，为春光平添了许多生趣。", "小燕子带了它的剪刀似的尾巴，在阳光满地时，斜飞于旷亮无比的天空，叽的一声，已由这里的稻田上，飞到那边的高柳下了。"], "id": 270}, {"title": "火烧云", "author": "萧红", "tag": "三年级下册", "cat": "现代文名篇", "lines": ["天上的云从西边一直烧到东边，红彤彤的，好像是天空着了火。", "这地方的火烧云变化极多，一会儿红彤彤的，一会儿金灿灿的，一会儿半紫半黄，一会儿半灰半百合色。葡萄灰、梨黄、茄子紫，这些颜色天空都有。还有些说也说不出来、见也没见过的颜色。", "一会儿，天空出现一匹马，马头向南，马尾向西。马是跪着的，像等人骑上它的背，它才站起来似的。过了两三秒钟，那匹马大起来了，腿伸开了，脖子也长了，尾巴却不见了。看的人正在寻找马尾巴，那匹马变模糊了。", "忽然又来了一条大狗。那条狗十分凶猛，在向前跑，后边似乎还跟着好几条小狗。跑着跑着，小狗不知哪里去了，大狗也不见了。", "接着又来了一头大狮子，跟庙门前的石头狮子一模一样，也那么大，也那样蹲着，很威武很镇静地蹲着。可是一转眼就变了，再也找不着了。"], "id": 271}, {"title": "观潮", "author": "赵宗成、朱明元", "tag": "四年级上册", "cat": "现代文名篇", "lines": ["钱塘江大潮，自古以来被称为天下奇观。", "午后一点左右，从远处传来隆隆的响声，好像闷雷滚动。顿时人声鼎沸，有人告诉我们，潮来了！我们踮着脚往东望去，江面还是风平浪静，看不出有什么变化。过了一会儿，响声越来越大，只见东边水天相接的地方出现了一条白线，人群又沸腾起来。", "那条白线很快地向我们移来，逐渐拉长，变粗，横贯江面。再近些，只见白浪翻滚，形成一堵两丈多高的水墙。浪潮越来越近，犹如千万匹白色战马齐头并进，浩浩荡荡地飞奔而来；那声音如同山崩地裂，好像大地都被震得颤动起来。", "霎时，潮头奔腾西去，可是余波还在漫天卷地般涌来，江面上依旧风号浪吼。过了好久，钱塘江才恢复了平静。看看堤下，江水已经涨了两丈来高了。"], "id": 272}, {"title": "走月亮", "author": "吴然", "tag": "四年级上册", "cat": "现代文名篇", "lines": ["秋天的夜晚，月亮升起来了，从洱海那边升起来了。", "是在洱海里淘洗过吗？月盘是那样明亮，月光是那样柔和，照亮了高高的点苍山，照亮了村头的大青树，也照亮了，照亮了村间的大道和小路……", "这时候，阿妈喜欢牵着我，在洒满月光的小路上走着，走着……啊，我和阿妈走月亮！", "细细的溪水，流着山草和野花的香味，流着月光。灰白色的鹅卵石布满河床。哟，卵石间有多少可爱的小水塘啊，每个小水塘都抱着一个月亮！哦，阿妈，白天你在溪里洗衣裳，而我，用树叶做小船，运载许多新鲜的花瓣……哦，阿妈，我们到溪边去吧，去看看小水塘，看看水塘里的月亮，看看我采过野花的地方。", "多么奇妙的夜晚啊，我和阿妈走月亮！"], "id": 273}, {"title": "白鹭", "author": "郭沫若", "tag": "五年级上册", "cat": "现代文名篇", "lines": ["白鹭是一首精巧的诗。", "色素的配合，身段的大小，一切都很适宜。", "那雪白的蓑毛，那全身的流线型结构，那铁色的长喙，那青色的脚，增之一分则嫌长，减之一分则嫌短，素之一忽则嫌白，黛之一忽则嫌黑。", "在清水田里，时有一只两只白鹭站着钓鱼，整个的田便成了一幅嵌在玻璃框里的画。田的大小好像是有心人为白鹭设计的镜匣。", "白鹭实在是一首诗，一首韵在骨子里的散文诗。"], "id": 274}, {"title": "匆匆", "author": "朱自清", "tag": "六年级下册", "cat": "现代文名篇", "lines": ["燕子去了，有再来的时候；杨柳枯了，有再青的时候；桃花谢了，有再开的时候。但是，聪明的，你告诉我，我们的日子为什么一去不复返呢？——是有人偷了他们罢：那是谁？又藏在何处呢？是他们自己逃走了罢：现在又到了哪里呢？", "我不知道他们给了我多少日子；但我的手确乎是渐渐空虚了。在默默里算着，八千多日子已经从我手中溜去；像针尖上一滴水滴在大海里，我的日子滴在时间的流里，没有声音，也没有影子。我不禁头涔涔而泪潸潸了。", "去的尽管去了，来的尽管来着；去来的中间，又怎样地匆匆呢？早上我起来的时候，小屋里射进两三方斜斜的太阳。太阳他有脚啊，轻轻悄悄地挪移了；我也茫茫然跟着旋转。于是——洗手的时候，日子从水盆里过去；吃饭的时候，日子从饭碗里过去；默默时，便从凝然的双眼前过去。我觉察他去的匆匆了，伸出手遮挽时，他又从遮挽着的手边过去，天黑时，我躺在床上，他便伶伶俐俐地从我身上跨过，从我脚边飞去了。等我睁开眼和太阳再见，这算又溜走了一日。我掩着面叹息。但是新来的日子的影儿又开始在叹息里闪过了。", "在逃去如飞的日子里，在千门万户的世界里的我能做些什么呢？只有徘徊罢了，只有匆匆罢了；在八千多日的匆匆里，除徘徊外，又剩些什么呢？过去的日子如轻烟，被微风吹散了，如薄雾，被初阳蒸融了；我留着些什么痕迹呢？我何曾留着像游丝样的痕迹呢？我赤裸裸来到这世界，转眼间也将赤裸裸的回去罢？但不能平的，为什么偏要白白走这一遭啊？", "你聪明的，告诉我，我们的日子为什么一去不复返呢？"], "id": 275}, {"title": "草原", "author": "老舍", "tag": "六年级上册", "cat": "现代文名篇", "lines": ["这次，我看到了草原。那里的天比别处的更可爱，空气是那么清鲜，天空是那么明朗，使我总想高歌一曲，表示我满心的愉快。在天底下，一碧千里，而并不茫茫。四面都有小丘，平地是绿的，小丘也是绿的。羊群一会儿上了小丘，一会儿又下来，走在哪里都像给无边的绿毯绣上了白色的大花。那些小丘的线条是那么柔美，就像只用绿色渲染，不用墨线勾勒的中国画那样，到处翠色欲流，轻轻流入云际。这种境界，既使人惊叹，又叫人舒服，既愿久立四望，又想坐下低吟一首奇丽的小诗。在这境界里，连骏马和大牛都有时候静立不动，好像回味着草原的无限乐趣。", "我们访问的是陈巴尔虎旗。汽车走了一百五十里，才到达目的地。一百五十里全是草原。再走一百五十里，也还是草原。草原上行车十分洒脱，只要方向不错，怎么走都可以。初入草原，听不见一点儿声音，也看不见什么东西，除了一些忽飞忽落的小鸟。走了许久，远远地望见了一条迂回的明如玻璃的带子——河！牛羊多起来，也看到了马群，隐隐有鞭子的轻响。快了，快到了。忽然，像被一阵风吹来似的，远处的小丘上出现了一群马，马上的男女老少穿着各色的衣裳，群马疾驰，襟飘带舞，像一条彩虹向我们飞过来。这是主人来到几十里外欢迎远客。见到我们，主人们立刻拨转马头，欢呼着，飞驰着，在汽车左右与前面引路。静寂的草原热闹起来：欢呼声，车声，马蹄声，响成一片。车跟着马飞过小丘，看见了几座蒙古包。"], "id": 276}, {"title": "北京的春节", "author": "老舍", "tag": "六年级下册", "cat": "现代文名篇", "lines": ["照北京的老规矩，春节差不多在腊月的初旬就开始了。“腊七腊八，冻死寒鸦”，这是一年里最冷的时候。在腊八这天，家家都熬腊八粥。粥是用各种米，各种豆，与各种干果熬成的。这不是粥，而是小型的农业展览会。", "除此之外，这一天还要泡腊八蒜。把蒜瓣放进醋里，封起来，为过年吃饺子用。到年底，蒜泡得色如翡翠，醋也有了些辣味，色味双美，使人忍不住要多吃几个饺子。在北京，过年时，家家吃饺子。", "除夕真热闹。家家赶做年菜，到处是酒肉的香味。男女老少都穿起新衣，门外贴上了红红的对联，屋里贴好了各色的年画。除夕夜家家灯火通宵，不许间断，鞭炮声日夜不绝。在外边做事的人，除非万不得已，必定赶回家来吃团圆饭。这一夜，除了很小的孩子，没有什么人睡觉，都要守岁。"], "id": 277}, {"title": "春", "author": "朱自清", "tag": "七年级上册", "cat": "现代文名篇", "lines": ["盼望着，盼望着，东风来了，春天的脚步近了。", "一切都像刚睡醒的样子，欣欣然张开了眼。山朗润起来了，水涨起来了，太阳的脸红起来了。", "小草偷偷地从土里钻出来，嫩嫩的，绿绿的。园子里，田野里，瞧去，一大片一大片满是的。坐着，躺着，打两个滚，踢几脚球，赛几趟跑，捉几回迷藏。风轻悄悄的，草软绵绵的。", "桃树、杏树、梨树，你不让我，我不让你，都开满了花赶趟儿。红的像火，粉的像霞，白的像雪。花里带着甜味儿；闭了眼，树上仿佛已经满是桃儿、杏儿、梨儿。花下成千成百的蜜蜂嗡嗡地闹着，大小的蝴蝶飞来飞去。野花遍地是：杂样儿，有名字的，没名字的，散在草丛里，像眼睛，像星星，还眨呀眨的。", "“吹面不寒杨柳风”，不错的，像母亲的手抚摸着你。风里带来些新翻的泥土的气息，混着青草味儿，还有各种花的香，都在微微润湿的空气里酝酿。鸟儿将窠巢安在繁花嫩叶当中，高兴起来了，呼朋引伴地卖弄清脆的喉咙，唱出宛转的曲子，与轻风流水应和着。牛背上牧童的短笛，这时候也成天在嘹亮地响。", "雨是最寻常的，一下就是三两天。可别恼。看，像牛毛，像花针，像细丝，密密地斜织着，人家屋顶上全笼着一层薄烟。树叶子却绿得发亮，小草也青得逼你的眼。", "傍晚时候，上灯了，一点点黄晕的光，烘托出一片安静而和平的夜。乡下去，小路上，石桥边，有撑起伞慢慢走着的人；还有地里工作的农夫，披着蓑，戴着笠的。他们的草屋，稀稀疏疏的，在雨里静默着。", "天上风筝渐渐多了，地上孩子也多了。城里乡下，家家户户，老老小小，他们也赶趟儿似的，一个个都出来了。舒活舒活筋骨，抖擞抖擞精神，各做各的一份事去。“一年之计在于春”，刚起头儿，有的是工夫，有的是希望。", "春天像刚落地的娃娃，从头到脚都是新的，他生长着。", "春天像小姑娘，花枝招展的，笑着，走着。", "春天像健壮的青年，有铁一般的胳膊和腰脚，他领着我们上前去。"], "id": 278}, {"title": "济南的冬天", "author": "老舍", "tag": "七年级上册", "cat": "现代文名篇", "lines": ["对于一个在北平住惯的人，像我，冬天要是不刮风，便觉得是奇迹；济南的冬天是没有风声的。对于一个刚由伦敦回来的人，像我，冬天要能看得见日光，便觉得是怪事；济南的冬天是响晴的。自然，在热带的地方，日光是永远那么毒，响亮的天气，反有点叫人害怕。可是，在北中国的冬天，而能有温晴的天气，济南真得算个宝地。", "设若单单是有阳光，那也算不了出奇。请闭上眼睛想：一个老城，有山有水，全在天底下晒着阳光，暖和安适地睡着，只等春风来把它们唤醒，这是不是个理想的境界？", "最妙的是下点小雪呀。看吧，山上的矮松越发的青黑，树尖上顶着一髻儿白花，好像日本看护妇。山尖全白了，给蓝天镶上一道银边。山坡上，有的地方雪厚点，有的地方草色还露着；这样，一道儿白，一道儿暗黄，给山们穿上一件带水纹的花衣；看着看着，这件花衣好像被风儿吹动，叫你希望看见一点更美的山的肌肤。等到快日落的时候，微黄的阳光斜射在山腰上，那点薄雪好像忽然害了羞，微微露出点粉色。就是下小雪吧，济南是受不住大雪的，那些小山太秀气！", "那水呢，不但不结冰，倒反在绿萍上冒着点热气，水藻真绿，把终年贮蓄的绿色全拿出来了。天儿越晴，水藻越绿，就凭这些绿的精神，水也不忍得冻上，况且那些长枝的垂柳还要在水里照个影儿呢！看吧，由澄清的河水慢慢往上看吧，空中，半空中，天上，自上而下全是那么清亮，那么蓝汪汪的，整个的是块空灵的蓝水晶。这块水晶里，包着红屋顶，黄草山，像地毯上的小团花的小灰色树影。这就是冬天的济南。"], "id": 279}, {"title": "雨的四季", "author": "刘湛秋", "tag": "七年级上册", "cat": "现代文名篇", "lines": ["我喜欢雨，无论什么季节的雨，我都喜欢。她给我的形象和记忆，永远是美的。", "春天，树叶开始闪出黄青，花苞轻轻地在风中摆动，似乎还带着一种冬天的昏黄。可是只要经过一场春雨的洗淋，那种颜色和神态是难以想象的。每一棵树仿佛都睁开特别明亮的眼睛。树枝的手臂也顿时柔软了，而那萌发的叶子，简直就像起伏着一层绿茵茵的波浪。水珠子从花苞里滴下来，比少女的眼泪还娇媚。半空中似乎总挂着透明的水雾的丝帘，牵动着阳光的彩棱镜。这时，整个大地是美丽的。小草似乎像复苏的蚯蚓一样翻动，发出一种春天才能听到的沙沙声。呼吸变得畅快，空气里像有无数芳甜的果子，在诱惑着鼻子和嘴唇。真的，只有这一场雨，才完全驱走了冬天，才使世界改变了姿容。", "而夏天，就更是别有一番风情了。夏天的雨也有夏天的性格，热烈而又粗犷。天上聚集几朵乌云，有时连一点雷的预告也没有，你还来不及思索，豆粒大的雨点就打来了。可这时雨并不可怕，因为你浑身的毛孔都热得张开了嘴，巴望着那清凉的甘露。打伞、戴斗笠固然能保持身上的干爽，可光头浇，洗个雨澡更有滋味，只是淋湿的头发、额头、睫毛滴着水，挡着眼睛的视线，耳朵也有些痒嗦嗦的。这时，你会更喜欢这一切。"], "id": 280}, {"title": "从百草园到三味书屋", "author": "鲁迅", "tag": "七年级上册", "cat": "现代文名篇", "lines": ["不必说碧绿的菜畦，光滑的石井栏，高大的皂荚树，紫红的桑椹；也不必说鸣蝉在树叶里长吟，肥胖的黄蜂伏在菜花上，轻捷的叫天子（云雀）忽然从草间直窜向云霄里去了。单是周围的短短的泥墙根一带，就有无限趣味。油蛉在这里低唱，蟋蟀们在这里弹琴。翻开断砖来，有时会遇见蜈蚣；还有斑蝥，倘若用手指按住它的脊梁，便会拍的一声，从后窍喷出一阵烟雾。何首乌藤和木莲藤缠络着，木莲有莲房一般的果实，何首乌有臃肿的根。有人说，何首乌根是有像人形的，吃了便可以成仙，我于是常常拔它起来，牵连不断地拔起来，也曾因此弄坏了泥墙，却从来没有见过有一块根像人样。如果不怕刺，还可以摘到覆盆子，像小珊瑚珠攒成的小球，又酸又甜，色味都比桑椹要好得远。"], "id": 281}, {"title": "背影", "author": "朱自清", "tag": "八年级上册", "cat": "现代文名篇", "lines": ["我说道：“爸爸，你走吧。”他望车外看了看，说：“我买几个橘子去。你就在此地，不要走动。”我看那边月台的栅栏外有几个卖东西的等着顾客。走到那边月台，须穿过铁道，须跳下去又爬上去。父亲是一个胖子，走过去自然要费事些。我本来要去的，他不肯，只好让他去。我看见他戴着黑布小帽，穿着黑布大马褂，深青布棉袍，蹒跚地走到铁道边，慢慢探身下去，尚不大难。可是他穿过铁道，要爬上那边月台，就不容易了。他用两手攀着上面，两脚再向上缩；他肥胖的身子向左微倾，显出努力的样子，这时我看见他的背影，我的泪很快地流下来了。我赶紧拭干了泪。怕他看见，也怕别人看见。我再向外看时，他已抱了朱红的橘子往回走了。过铁道时，他先将橘子散放在地上，自己慢慢爬下，再抱起橘子走。到这边时，我赶紧去搀他。他和我走到车上，将橘子一股脑儿放在我的皮大衣上。于是扑扑衣上的泥土，心里很轻松似的。过一会说：“我走了，到那边来信！”我望着他走出去。他走了几步，回过头看见我，说：“进去吧，里边没人。”等他的背影混入来来往往的人里，再找不着了，我便进来坐下，我的眼泪又来了。"], "id": 282}, {"title": "白杨礼赞", "author": "茅盾", "tag": "八年级上册", "cat": "现代文名篇", "lines": ["那是力争上游的一种树，笔直的干，笔直的枝。它的干通常是丈把高，像是加过人工似的，一丈以内绝无旁枝。它所有的丫枝一律向上，而且紧紧靠拢，也像加过人工似的，成为一束，绝不旁逸斜出。它的宽大的叶子也是片片向上，几乎没有斜生的，更不用说倒垂了。它的皮光滑而有银色的晕圈，微微泛出淡青色。这是虽在北方风雪的压迫下却保持着倔强挺立的一种树。哪怕只有碗那样粗细，它却努力向上发展，高到丈许，两丈，参天耸立，不折不挠，对抗着西北风。", "它没有婆娑的姿态，没有屈曲盘旋的虬枝。也许你要说它不美。如果美是专指“婆娑”或“旁逸斜出”之类而言，那么，白杨树算不得树中的好女子。但是它伟岸，正直，朴质，严肃，也不缺乏温和，更不用提它的坚强不屈与挺拔，它是树中的伟丈夫！当你在积雪初融的高原上走过，看见平坦的大地上傲然挺立这么一株或一排白杨树，难道你就觉得它只是树？难道你就不想到它的朴质，严肃，坚强不屈，至少也象征了北方的农民？难道你竟一点也不联想到，在敌后的广大土地上，到处有坚强不屈，就像这白杨树一样傲然挺立的守卫他们家乡的哨兵？难道你又不更远一点想到，这样枝枝叶叶靠紧团结，力求上进的白杨树，宛然象征了今天在华北平原纵横决荡，用血写出新中国历史的那种精神和意志？"], "id": 283}, {"title": "紫藤萝瀑布", "author": "宗璞", "tag": "七年级下册", "cat": "现代文名篇", "lines": ["我不由得停住了脚步。", "从未见过开得这样盛的藤萝，只见一片辉煌的淡紫色，像一条瀑布，从空中垂下，不见其发端，也不见其终极。只是深深浅浅的紫，仿佛在流动，在欢笑，在不停地生长。紫色的大条幅上，泛着点点银光，就像迸溅的水花。仔细看时，才知道那是每一朵紫花中的最浅淡的部分，在和阳光互相挑逗。", "这里春红已谢，没有赏花的人群，也没有蜂围蝶阵。有的就是这一树闪光的、盛开的藤萝。花朵儿一串挨着一串，一朵接着一朵，彼此推着挤着，好不活泼热闹！", "“我在开花！”它们在笑。", "“我在开花！”它们嚷嚷。", "花和人都会遇到各种各样的不幸，但是生命的长河是无止境的。"], "id": 284}, {"title": "昆明的雨", "author": "汪曾祺", "tag": "八年级上册", "cat": "现代文名篇", "lines": ["我想念昆明的雨。", "昆明的雨季是明亮的、丰满的，使人动情的。城春草木深，孟夏草木长。昆明的雨季，是浓绿的。草木的枝叶里的水分都到了饱和状态，显示出过分的、近于夸张的旺盛。", "雨季的果子，是杨梅。卖杨梅的都是苗族女孩子，戴一顶小花帽子，穿着扳尖的绣了满帮花的鞋，坐在人家阶石的一角，不时吆唤一声：“卖杨梅——”声音娇娇的。她们的声音使得昆明雨季的空气更加柔和了。昆明的杨梅很大，有一个乒乓球那样大，颜色黑红黑红的，叫作“火炭梅”。这个名字起得真好，真是像一球烧得炽红的火炭！"], "id": 285}, {"title": "中国人失掉自信力了吗", "author": "鲁迅", "tag": "九年级上册", "cat": "现代文名篇", "lines": ["我们从古以来，就有埋头苦干的人，有拼命硬干的人，有为民请命的人，有舍身求法的人，……虽是等于为帝王将相作家谱的所谓“正史”，也往往掩不住他们的光耀，这就是中国的脊梁。", "这一类的人们，就是现在也何尝少呢？他们有确信，不自欺；他们在前仆后继的战斗，不过一面总在被摧残，被抹杀，消灭于黑暗中，不能为大家所知道罢了。说中国人失掉了自信力，用以指一部分人则可，倘若加于全体，那简直是诬蔑。", "要论中国人，必须不被搽在表面的自欺欺人的脂粉所诓骗，却看看他的筋骨和脊梁。自信力的有无，状元宰相的文章是不足为据的，要自己去看地底下。"], "id": 286}, {"title": "壶口瀑布", "author": "梁衡", "tag": "八年级下册", "cat": "现代文名篇", "lines": ["壶口在晋陕两省的边境上，我曾两次到过那里。", "第二次看黄河，我专选了个枯水季节。春寒刚过，山还未青，谷底显得异常开阔。我们从从容容地下到沟底，这时的黄河像是一张极大的石床，上面铺了一层软软的细沙，踏上去坚实而又松软。我一直走到河心，原来河心还有一条河，是突然凹下去的一条深沟，当地人叫“龙槽”，槽头入水处深不可测，这便是“壶口”。我倚在一块大石头上向上游看去，这龙槽顶着宽宽的河面，正好形成一个丁字。河水从五百米宽的河道上排排涌来，其势如千军万马，互相挤着、撞着，推推搡搡，前呼后拥，撞向石壁，排排黄浪霎时碎成堆堆白雪。山是青冷的灰，天是寂寂的蓝，宇宙间仿佛只有这水的存在。当河水正这般畅畅快快地驰骋着时，突然脚下出现一条四十多米宽的深沟，它们还来不及想一下，便一齐跌了进去，更涌、更挤、更急。沟底飞转着一个个漩涡，当地人说，曾有一头黑猪掉进去，再漂上来时，浑身的毛竟被拔得一根不剩。我听了不觉打了一个寒噤。"], "id": 287}, {"title": "荷塘月色", "author": "朱自清", "tag": "必修上册", "cat": "现代文名篇", "lines": ["曲曲折折的荷塘上面，弥望的是田田的叶子。叶子出水很高，像亭亭的舞女的裙。层层的叶子中间，零星地点缀着些白花，有袅娜地开着的，有羞涩地打着朵儿的；正如一粒粒的明珠，又如碧天里的星星，又如刚出浴的美人。微风过处，送来缕缕清香，仿佛远处高楼上渺茫的歌声似的。这时候叶子与花也有一丝的颤动，像闪电般，霎时传过荷塘的那边去了。叶子本是肩并肩密密地挨着，这便宛然有了一道凝碧的波痕。叶子底下是脉脉的流水，遮住了，不能见一些颜色；而叶子却更见风致了。", "月光如流水一般，静静地泻在这一片叶子和花上。薄薄的青雾浮起在荷塘里。叶子和花仿佛在牛乳中洗过一样；又像笼着轻纱的梦。虽然是满月，天上却有一层淡淡的云，所以不能朗照；但我以为这恰是到了好处——酣眠固不可少，小睡也别有风味的。月光是隔了树照过来的，高处丛生的灌木，落下参差的斑驳的黑影，峭楞楞如鬼一般；弯弯的杨柳的稀疏的倩影，却又像是画在荷叶上。塘中的月色并不均匀；但光与影有着和谐的旋律，如梵婀玲上奏着的名曲。"], "id": 288}, {"title": "故都的秋", "author": "郁达夫", "tag": "必修上册", "cat": "现代文名篇", "lines": ["秋天，无论在什么地方的秋天，总是好的；可是啊，北国的秋，却特别地来得清，来得静，来得悲凉。我的不远千里，要从杭州赶上青岛，更要从青岛赶上北平来的理由，也不过想饱尝一尝这“秋”，这故都的秋味。", "不逢北国之秋，已将近十余年了。在南方每年到了秋天，总要想起陶然亭的芦花，钓鱼台的柳影，西山的虫唱，玉泉的夜月，潭柘寺的钟声。在北平即使不出门去吧，就是在皇城人海之中，租人家一椽破屋来住着，早晨起来，泡一碗浓茶，向院子一坐，你也能看得到很高很高的碧绿的天色，听得到青天下驯鸽的飞声。从槐树叶底，朝东细数着一丝一丝漏下来的日光，或在破壁腰中，静对着像喇叭似的牵牛花（朝荣）的蓝朵，自然而然地也能够感觉到十分的秋意。说到了牵牛花，我以为以蓝色或白色者为佳，紫黑色次之，淡红色最下。最好，还要在牵牛花底，教长着几根疏疏落落的尖细且长的秋草，使作陪衬。", "北国的槐树，也是一种能使人联想起秋来的点缀。像花而又不是花的那一种落蕊，早晨起来，会铺得满地。脚踏上去，声音也没有，气味也没有，只能感出一点点极微细极柔软的触觉。扫街的在树影下一阵扫后，灰土上留下来的一条条扫帚的丝纹，看起来既觉得细腻，又觉得清闲，潜意识下并且还觉得有点儿落寞，古人所说的梧桐一叶而天下知秋的遥想，大约也就在这些深沉的地方。", "秋天，这北国的秋天，若留得住的话，我愿把寿命的三分之二折去，换得一个三分之一的零头。"], "id": 289}, {"title": "我与地坛", "author": "史铁生", "tag": "必修上册", "cat": "现代文名篇", "lines": ["我在好几篇小说中都提到过一座废弃的古园，实际就是地坛。许多年前旅游业还没有开展，园子荒芜冷落得如同一片野地，很少被人记起。", "地坛离我家很近。或者说我家离地坛很近。总之，只好认为这是缘分。地坛在我出生前四百多年就坐落在那儿了，而自从我的祖母年轻时带着我父亲来到北京，就一直住在离它不远的地方——五十多年间搬过几次家，可搬来搬去总是在它周围，而且是越搬离它越近了。我常觉得这中间有着宿命的味道：仿佛这古园就是为了等我，而历尽沧桑在那儿等待了四百多年。", "它等待我出生，然后又等待我活到最狂妄的年龄上忽地残废了双腿。四百多年里，它一面剥蚀了古殿檐头浮夸的琉璃，淡褪了门壁上炫耀的朱红，坍圮了一段段高墙又散落了玉砌雕栏，祭坛四周的老柏树愈见苍幽，到处的野草荒藤也都茂盛得自在坦荡。这时候想必我是该来了。十五年前的一个下午，我摇着轮椅进入园中，它为一个失魂落魄的人把一切都准备好了。那时，太阳循着亘古不变的路途正越来越大，也越红。在满园弥漫的沉静光芒中，一个人更容易看到时间，并看见自己的身影。", "一个人，出生了，这就不再是一个可以辩论的问题，而只是上帝交给他的一个事实；上帝在交给我们这件事实的时候，已经顺便保证了它的结果，所以死是一件不必急于求成的事，死是一个必然会降临的节日。"], "id": 290}, {"title": "记念刘和珍君", "author": "鲁迅", "tag": "选择性必修中册", "cat": "现代文名篇", "lines": ["真的猛士，敢于直面惨淡的人生，敢于正视淋漓的鲜血。这是怎样的哀痛者和幸福者？然而造化又常常为庸人设计，以时间的流驶，来洗涤旧迹，仅使留下淡红的血色和微漠的悲哀。在这淡红的血色和微漠的悲哀中，又给人暂得偷生，维持着这似人非人的世界。我不知道这样的世界何时是一个尽头！", "我们还在这样的世上活着；我也早觉得有写一点东西的必要了。离三月十八日也已有两星期，忘却的救主快要降临了罢，我正有写一点东西的必要了。"], "id": 291}, {"title": "拿来主义", "author": "鲁迅", "tag": "必修上册", "cat": "现代文名篇", "lines": ["中国一向是所谓“闭关主义”，自己不去，别人也不许来。自从给枪炮打破了大门之后，又碰了一串钉子，到现在，成了什么都是“送去主义”了。别的且不说罢，单是学艺上的东西，近来就先送一批古董到巴黎去展览，但终“不知后事如何”；还有几位“大师”们捧着几张古画和新画，在欧洲各国一路的挂过去，叫作“发扬国光”。听说不远还要送梅兰芳博士到苏联去，以催进“象征主义”，此后是顺便到欧洲传道。我在这里不想讨论梅博士演艺和象征主义的关系，总之，活人替代了古董，我敢说，也可以算得显出一点进步了。", "我在这里也并不想对于“送去”再说什么，否则太不“摩登”了。我只想鼓吹我们再吝啬一点，“送去”之外，还得“拿来”，是为“拿来主义”。", "所以我们要运用脑髓，放出眼光，自己来拿！", "总之，我们要拿来。我们要或使用，或存放，或毁灭。那么，主人是新主人，宅子也就会成为新宅子。然而首先要这人沉着，勇猛，有辨别，不自私。没有拿来的，人不能自成为新人，没有拿来的，文艺不能自成为新文艺。"], "id": 292}, {"title": "一个消逝了的山村", "author": "冯至", "tag": "选择性必修下册", "cat": "现代文名篇", "lines": ["在人口稀少的地带，我们走入任何一座森林，或是一片草原，总觉得它们在洪荒时代大半就是这样。人类的历史演变了几千年，它们却在人类以外，不起一些变化，千百年如一日，默默地对着永恒。其中可能发生的事迹，不外乎空中的风雨，草里的虫蛇，林中出没的走兽和树间的鸣鸟。我们刚到这里来时，对于这座山林，也是那样感想，绝不会问到：这里也曾有过人烟吗？但是一条窄窄的石路的残迹泄露了一些秘密。", "最可爱的是那条小溪的水源，从我们对面山的山脚下涌出的泉水；它不分昼夜地在那儿流，几棵树环绕着它，形成一个阴凉的所在。我们感谢它，若是没有它，我们就不能在这里居住，那山村也不会曾经在这里滋长。这清冽的泉水，养育我们，同时也养育过往日那村里的人们。人和人，只要是共同吃过一棵树上的果实，共同饮过一条河里的水，或是共同担受过一个地方的风雨，不管是时间或空间把它们隔离得有多么远，彼此都会感到几分亲切，彼此的生命都有些声息相通的地方。我深深理解了古人一首情诗里的句子：“日日思君不见君，共饮长江水。”", "两三年来，这一切，给我的生命许多滋养。但我相信它们也曾以同样的坦白和恩惠对待那消逝了的村庄。这些风物，好像至今还在述说它的运命。在风雨如晦的时刻，我踏着那村里的人们也踏过的土地，觉得彼此相隔虽然将及一世纪，但在生命的深处，却和他们有着意味不尽的关连。"], "id": 293}, {"title": "送杜少府之任蜀州", "author": "王勃", "tag": "", "cat": "唐诗", "lines": ["城阙辅三秦，风烟望五津。 与君离别意，同是宦游人。", "海内存知己，天涯若比邻。 无为在歧路，儿女共沾巾。"], "id": 294}, {"title": "黄鹤楼", "author": "崔颢", "tag": "", "cat": "唐诗", "lines": ["昔人已乘黄鹤去，此地空余黄鹤楼。黄鹤一去不复返，白云千载空悠悠。", "晴川历历汉阳树，芳草萋萋鹦鹉洲。日暮乡关何处是，烟波江上使人愁。"], "id": 295}, {"title": "出塞", "author": "王昌龄", "tag": "", "cat": "唐诗", "lines": ["秦时明月汉时关，万里长征人未还。但使龙城飞将在，不教胡马渡阴山。"], "id": 296}, {"title": "芙蓉楼送辛渐", "author": "王昌龄", "tag": "", "cat": "唐诗", "lines": ["寒雨连江夜入吴，平明送客楚山孤。洛阳亲友如相问，一片冰心在玉壶。"], "id": 297}, {"title": "山居秋暝", "author": "王维", "tag": "", "cat": "唐诗", "lines": ["空山新雨后，天气晚来秋。", "明月松间照，清泉石上流。", "竹喧归浣女，莲动下渔舟。", "随意春芳歇，王孙自可留。"], "id": 298}, {"title": "行路难（其一）", "author": "李白", "tag": "", "cat": "唐诗", "lines": ["金樽清酒斗十千，玉盘珍羞直万钱。停杯投箸不能食，拔剑四顾心茫然。", "欲渡黄河冰塞川，将登太行雪满山。闲来垂钓碧溪上，忽复乘舟梦日边。", "行路难！行路难！多歧路，今安在？长风破浪会有时，直挂云帆济沧海。"], "id": 299}, {"title": "蜀道难", "author": "李白", "tag": "", "cat": "唐诗", "lines": ["噫吁嚱，危乎高哉！蜀道之难，难于上青天！蚕丛及鱼凫，开国何茫然！", "尔来四万八千岁，不与秦塞通人烟。西当太白有鸟道，可以横绝峨嵋巅。", "地崩山摧壮士死，然后天梯石栈方钩连。上有六龙回日之高标，下有冲波逆折之回川。黄鹤之飞尚不得过，猿猱欲度愁攀援。青泥何盘盘，百步九折萦岩峦。", "扪参历井仰胁息，以手抚膺坐长叹。问君西游何时还？畏途巉岩不可攀。", "但见悲鸟号古木，雄飞从雌绕林间。又闻子规啼夜月，愁空山。", "蜀道之难，难于上青天，使人听此凋朱颜。", "连峰去天不盈尺，枯松倒挂倚绝壁。飞湍瀑流争喧豗，砯崖转石万壑雷。", "其险也若此，嗟尔远道之人，胡为乎来哉。剑阁峥嵘而崔嵬，一夫当关，万夫莫开。所守或匪亲，化为狼与豺。朝避猛虎，夕避长蛇，磨牙吮血，杀人如麻。", "锦城虽云乐，不如早还家。蜀道之难，难于上青天，侧身西望长咨嗟。"], "id": 300}, {"title": "将进酒", "author": "李白", "tag": "", "cat": "唐诗", "lines": ["君不见黄河之水天上来，奔流到海不复回。", "君不见高堂明镜悲白发，朝如青丝暮成雪。", "人生得意须尽欢，莫使金樽空对月。", "天生我材必有用，千金散尽还复来。", "烹羊宰牛且为乐，会须一饮三百杯。", "岑夫子，丹丘生，将进酒，杯莫停", "与君歌一曲，请君为我倾耳听。", "钟鼓馔玉不足贵，但愿长醉不愿醒", "古来圣贤皆寂寞，惟有饮者留其名。", "陈王昔时宴平乐，斗酒十千恣欢谑。", "主人何为言少钱,径须沽取对君酌。", "五花马，千金裘，", "呼儿将出换美酒，与尔同销万古愁。"], "id": 301}, {"title": "望岳", "author": "杜甫", "tag": "", "cat": "唐诗", "lines": ["岱宗夫如何？齐鲁青未了。造化钟神秀，阴阳割昏晓。", "荡胸生曾云，决眦入归鸟。会当凌绝顶，一览众山小。"], "id": 302}, {"title": "春望", "author": "杜甫", "tag": "", "cat": "唐诗", "lines": ["国破山河在，城春草木深。感时花溅泪，恨别鸟惊心。", "烽火连三月，家书抵万金。白头搔更短，浑欲不胜簪。"], "id": 303}, {"title": "春夜喜雨", "author": "杜甫", "tag": "", "cat": "唐诗", "lines": ["好雨知时节，当春乃发生。随风潜入夜，润物细无声。", "野径云俱黑，江船火独明。晓看红湿处，花重锦官城。"], "id": 304}, {"title": "闻官军收河南河北", "author": "杜甫", "tag": "", "cat": "唐诗", "lines": ["剑外忽传收蓟北，初闻涕泪满衣裳。却看妻子愁何在，漫卷诗书喜欲狂。", "白日放歌须纵酒，青春作伴好还乡。即从巴峡穿巫峡，便下襄阳向洛阳。"], "id": 305}, {"title": "登高", "author": "杜甫", "tag": "", "cat": "唐诗", "lines": ["风急天高猿啸哀，渚清沙白鸟飞回。无边落木萧萧下，不尽长江滚滚来。", "万里悲秋常作客，百年多病独登台。艰难苦恨繁霜鬓，潦倒新停浊酒杯。"], "id": 306}, {"title": "登岳阳楼", "author": "杜甫", "tag": "", "cat": "唐诗", "lines": ["昔闻洞庭水，今上岳阳楼。吴楚东南坼，乾坤日夜浮。", "亲朋无一字，老病有孤舟。戎马关山北，凭轩涕泗流。"], "id": 307}, {"title": "阁夜", "author": "杜甫", "tag": "", "cat": "唐诗", "lines": ["岁暮阴阳催短景，天涯霜雪霁寒宵。五更鼓角声悲壮，三峡星河影动摇。", "野哭千家闻战伐，夷歌数处起渔樵。卧龙跃马终黄土，人事音书漫寂寥。"], "id": 308}, {"title": "旅夜书怀", "author": "杜甫", "tag": "", "cat": "唐诗", "lines": ["细草微风岸，危樯独夜舟。星垂平野阔，月涌大江流。", "名岂文章著，官应老病休。飘飘何所似，天地一沙鸥。"], "id": 309}, {"title": "竹枝词", "author": "刘禹锡", "tag": "", "cat": "唐诗", "lines": ["杨柳青青江水平，闻郎江上踏歌声。东边日出西边雨，道是无晴却有晴。"], "id": 310}, {"title": "乌衣巷", "author": "刘禹锡", "tag": "", "cat": "唐诗", "lines": ["朱雀桥边野草花，乌衣巷口夕阳斜。", "旧时王谢堂前燕，飞入寻常百姓家。"], "id": 311}, {"title": "酬乐天扬州初逢席上见赠", "author": "刘禹锡", "tag": "", "cat": "唐诗", "lines": ["巴山楚水凄凉地，二十三年弃置身。怀旧空吟闻笛赋，到乡翻似烂柯人。", "沉舟侧畔千帆过，病树前头万木春。今日听君歌一曲，暂凭杯酒长精神。"], "id": 312}, {"title": "忆江南（其一）", "author": "白居易", "tag": "", "cat": "唐诗", "lines": ["江南好，风景旧曾谙。日出江花红胜火，春来江水绿如蓝。能不忆江南？"], "id": 313}, {"title": "江雪", "author": "柳宗元", "tag": "", "cat": "唐诗", "lines": ["千山鸟飞绝， 万径人踪灭。", "孤舟蓑笠翁， 独钓寒江雪。"], "id": 314}, {"title": "无题", "author": "李商隐", "tag": "", "cat": "唐诗", "lines": ["相见时难别亦难，东风无力百花残。春蚕到死丝方尽，蜡炬成灰泪始干。", "晓镜但愁云鬓改，夜吟应觉月光寒。蓬山此去无多路，青鸟殷勤为探看。"], "id": 315}, {"title": "夜雨寄北", "author": "李商隐", "tag": "", "cat": "唐诗", "lines": ["君问归期未有期，巴山夜雨涨秋池。", "何当共剪西窗烛，却话巴山夜雨时。"], "id": 316}, {"title": "锦瑟", "author": "李商隐", "tag": "", "cat": "唐诗", "lines": ["锦瑟无端五十弦，一弦一柱思华年。庄生晓梦迷蝴蝶，望帝春心托杜鹃。", "沧海月明珠有泪，蓝田日暖玉生烟。此情可待成追忆？只是当时已惘然。"], "id": 317}, {"title": "马嵬（其二）", "author": "李商隐", "tag": "", "cat": "唐诗", "lines": ["海外徒闻更九州，他生未卜此生休。空闻虎旅传宵柝，无复鸡人报晓筹。", "此日六军同驻马，当时七夕笑牵牛。如何四纪为天子，不及卢家有莫愁。"], "id": 318}, {"title": "秋兴八首·其一", "author": "杜甫", "tag": "", "cat": "唐诗", "lines": ["玉露凋伤枫树林，巫山巫峡气萧森。江间波浪兼天涌，塞上风云接地阴。", "丛菊两开他日泪，孤舟一系故园心。寒衣处处催刀尺，白帝城高急暮砧。"], "id": 319}, {"title": "咏怀古迹（其三）", "author": "杜甫", "tag": "", "cat": "唐诗", "lines": ["群山万壑赴荆门，生长明妃尚有村。 一去紫台连朔漠，独留青冢向黄昏。", "画图省识春风面， 环珮空归夜月魂。 千载琵琶作胡语，分明怨恨曲中论。"], "id": 320}, {"title": "蜀相", "author": "杜甫", "tag": "", "cat": "唐诗", "lines": ["丞相祠堂何处寻？锦官城外柏森森。映阶碧草自春色，隔叶黄鹂空好音。", "三顾频烦天下计，两朝开济老臣心。出师未捷身先死，长使英雄泪满襟。"], "id": 321}, {"title": "春江花月夜", "author": "张若虚", "tag": "", "cat": "唐诗", "lines": ["春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明。", "江流宛转绕芳甸，月照花林皆似霰。空里流霜不觉飞，汀上白沙看不见。", "江天一色无纤尘，皎皎空中孤月轮。江畔何人初见月？江月何年初照人？", "人生代代无穷已，江月年年望相似。 不知江月待何人，但见长江送流水。", "白云一片去悠悠，青枫浦上不胜愁。谁家今夜扁舟子？何处相思明月楼？", "可怜楼上月徘徊，应照离人妆镜台。 玉户帘中卷不去，捣衣砧上拂还来。", "此时相望不相闻，愿逐月华流照君。 鸿雁长飞光不度，鱼龙潜跃水成文。", "昨夜闲潭梦落花，可怜春半不还家。 江水流春去欲尽，江潭落月复西斜。", "斜月沉沉藏海雾，碣石潇湘无限路。 不知乘月几人归，落月摇情满江树。"], "id": 322}, {"title": "李凭箜篌引", "author": "李贺", "tag": "", "cat": "唐诗", "lines": ["吴丝蜀桐张高秋，空山凝云颓不流。江娥啼竹素女愁，李凭中国弹箜篌。", "昆山玉碎凤凰叫，芙蓉泣露香兰笑。十二门前融冷光，二十三丝动紫皇。", "女娲炼石补天处，石破天惊逗秋雨。梦入神山教神妪，老鱼跳波瘦蛟舞。", "吴质不眠倚桂树，露脚斜飞湿寒兔。"], "id": 323}, {"title": "琵琶行（并序）", "author": "白居易", "tag": "", "cat": "唐诗", "lines": ["元和十年，予左迁九江郡司马。明年秋，送客湓浦口，闻船中夜弹琵琶者，听其音，铮铮然有京都声。问其人，本长安倡女，尝学琵琶於穆曹二善才，年长色衰，委身为贾人妇。遂命酒，使快弹数曲。曲罢悯然。自叙少小时欢乐事，今漂沦憔悴，转徙於江湖间。予出官二年，恬然自安，感斯人言，是夕始觉有迁谪意。因为长句，歌以赠之，凡六百一十六言，命曰《琵琶行》。", "浔阳江头夜送客，枫叶荻花秋瑟瑟。主人下马客在船，举酒欲饮无管弦。 醉不成欢惨将别，别时茫茫江浸月。忽闻水上琵琶声，主人忘归客不发。寻声暗问弹者谁，琵琶声停欲语迟。移船相近邀相见，添酒回灯重开宴。千呼万唤始出来，犹抱琵琶半遮面。转轴拨弦三两声，未成曲调先有情。弦弦掩抑声声思，似诉平生不得志。低眉信手续续弹，说尽心中无限事。轻拢慢捻抹复挑，初为《霓裳》后《六么》。大弦嘈嘈如急雨，小弦切切如私语。嘈嘈切切错杂弹，大珠小珠落玉盘。间关莺语花底滑，幽咽泉流冰下难。冰泉冷涩弦凝绝，凝绝不通声暂歇。别有幽愁暗恨生，此时无声胜有声。银瓶乍破水浆迸，铁骑突出刀枪鸣。曲终收拨当心画，四弦一声如裂帛。 东船西舫悄无言，惟见江心秋月白。沉吟放拨插弦中，整顿衣裳起敛容。自言本是京城女，家在虾蟆陵下住。十三学得琵琶成，名属教坊第一部。曲罢曾教善才服，妆成每被秋娘妒。五陵年少争缠头，一曲红绡不知数。钿头银篦击节碎，血色罗裙翻酒污。今年欢笑复明年，秋月春风等闲度。弟走从军阿姨死，暮去朝来颜色故。门前冷落鞍马稀，老大嫁作商人妇。商人重利轻别离，前月浮梁买茶去。去来江口守空船，绕船月明江水寒。 夜深忽梦少年事，梦啼妆泪红阑干。我闻琵琶已叹息，又闻此语重唧唧。 同是天涯沦落人，相逢何必曾相识！我从去年辞帝京，谪居卧病浔阳城。浔阳地僻无音乐，终岁不闻丝竹声。住近湓江地低湿，黄芦苦竹绕宅生。其间旦暮闻何物？杜鹃啼血猿哀鸣。春江花朝秋月夜，往往取酒还独倾。岂无山歌与村笛，呕哑嘲哳难为听。今夜闻君琵琶语，如听仙乐耳暂明。莫辞更坐弹一曲，为君翻作《琵琶行》。感我此言良久立，却坐促弦弦转急。凄凄不似向前声，满座重闻皆掩泣。座中泣下谁最多？江州司马青衫湿。"], "id": 324}, {"title": "夜归鹿门歌", "author": "孟浩然", "tag": "", "cat": "唐诗", "lines": ["山寺钟鸣昼已昏，渔梁渡头争渡喧。人随沙岸向江村，余亦乘舟归鹿门。", "鹿门月照开烟树，忽到庞公栖隐处。岩扉松径长寂寥，惟有幽人自来去。"], "id": 325}, {"title": "虞美人", "author": "李煜", "tag": "", "cat": "宋词", "lines": ["春花秋月何时了？往事知多少！小楼昨夜又东风，故国不堪回首月明中。", "雕栏玉砌应犹在，只是朱颜改。问君能有几多愁？恰似一江春水向东流。"], "id": 326}, {"title": "相见欢", "author": "李煜", "tag": "", "cat": "宋词", "lines": ["无言独上西楼，月如钩。 寂寞梧桐深院锁清秋。", "剪不断，理还乱，是离愁。别是一般滋味在心头。"], "id": 327}, {"title": "浪淘沙", "author": "李煜", "tag": "", "cat": "宋词", "lines": ["帘外雨潺潺，春意阑珊。罗衾不耐五更寒。梦里不知身是客，一晌贪欢。", "独自莫凭栏，无限江山，别时容易见时难。流水落花春去也，天上人间。"], "id": 328}, {"title": "泊船瓜洲", "author": "王安石", "tag": "", "cat": "宋词", "lines": ["京口瓜洲一水间，钟山只隔数重山。春风又绿江南岸，明月何时照我还？"], "id": 329}, {"title": "江城子·乙卯正月二十日夜记梦", "author": "苏轼", "tag": "", "cat": "宋词", "lines": ["十年生死两茫茫，不思量，自难忘。千里孤坟，无处话凄凉。", "纵使相逢应不识，尘满面，鬓如霜。夜来幽梦忽还乡，小轩窗，正梳妆。", "相顾无言，惟有泪千行。料得年年肠断处，明月夜，短松冈。"], "id": 330}, {"title": "江城子·密州出猎", "author": "苏轼", "tag": "", "cat": "宋词", "lines": ["老夫聊发少年狂，左牵黄，右擎苍，锦帽貂裘，千骑卷平冈。为报倾城随太守，亲射虎，看孙郎。", "酒酣胸胆尚开张，鬓微霜，又何妨！持节云中，何日遣冯唐？会挽雕弓如满月，西北望，射天狼。"], "id": 331}, {"title": "水调歌头", "author": "苏轼", "tag": "", "cat": "宋词", "lines": ["丙辰中秋，欢饮达旦，大醉，作此篇，兼怀子由。", "明月几时有，把酒问青天。不知天上宫阙，今夕是何年？我欲乘风归去，又恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间！", "转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆？人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。"], "id": 332}, {"title": "鹊桥仙", "author": "秦观", "tag": "", "cat": "宋词", "lines": ["纤云弄巧，飞星传恨，银汉迢迢暗度。金风玉露一相逢，便胜却人间无数。", "柔情似水，佳期如梦，忍顾鹊桥归路。两情若是久长时，又岂在朝朝暮暮。"], "id": 333}, {"title": "如梦令（其二）", "author": "李清照", "tag": "", "cat": "宋词", "lines": ["昨夜雨疏风骤，浓睡不消残酒。试问卷帘人，却道海棠依旧。", "知否，知否？应是绿肥红瘦！"], "id": 334}, {"title": "满江红", "author": "岳飞", "tag": "", "cat": "宋词", "lines": ["怒发冲冠，凭阑处、潇潇雨歇。抬望眼，仰天长啸，壮怀激烈。三十功名尘与土，八千里路云和月。莫等闲、白了少年头，空悲切。", "靖康耻，犹未雪；臣子恨，何时灭？驾长车、踏破贺兰山缺。壮志饥餐胡虏肉，笑谈渴饮匈奴血。待从头、收拾旧山河，朝天阙。"], "id": 335}, {"title": "钗头凤", "author": "陆游", "tag": "", "cat": "宋词", "lines": ["红酥手，黄縢酒，满城春色宫墙柳。东风恶，欢情薄。一怀愁绪，几年离索。错、错、错。", "春如旧，人空瘦，泪痕红浥鲛绡透。桃花落，闲池阁。山盟虽在，锦书难托。莫、莫、莫！"], "id": 336}, {"title": "卜算子", "author": "陆游", "tag": "", "cat": "宋词", "lines": ["驿外断桥边，寂寞开无主。已是黄昏独自愁，更著风和雨。", "无意苦争春，一任群芳妒。零落成泥辗作尘，只有香如故。"], "id": 337}, {"title": "诉衷情", "author": "陆游", "tag": "", "cat": "宋词", "lines": ["当年万里觅封侯。匹马戍梁州。关河梦断何处？尘暗旧貂裘。", "胡未灭，鬓先秋，泪空流。此生谁料，心在天山，身老沧州。"], "id": 338}, {"title": "太常引", "author": "辛弃疾", "tag": "", "cat": "宋词", "lines": ["建康中秋夜，为吕叔潜赋", "一轮秋影转金波。飞镜又重磨。把酒问姮娥：被白发欺人奈何？", "乘风好去，长空万里，直下看山河。斫去桂婆娑，人道是清光更多。"], "id": 339}, {"title": "菩萨蛮·书江西造口壁", "author": "辛弃疾", "tag": "", "cat": "宋词", "lines": ["郁孤台下清江水，中间多少行人泪。西北望长安，可怜无数山。", "青山遮不住，毕竟东流去。江晚正愁余，山深闻鹧鸪。"], "id": 340}, {"title": "青玉案", "author": "辛弃疾", "tag": "", "cat": "宋词", "lines": ["东风夜放花千树，更吹落，星如雨。宝马雕车香满路。", "凤箫声动，玉壶光转，一夜鱼龙舞。蛾儿雪柳黄金缕，笑语盈盈暗香去。", "众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。"], "id": 341}, {"title": "西江月", "author": "辛弃疾", "tag": "", "cat": "宋词", "lines": ["明月别枝惊鹊，清风半夜鸣蝉。稻花香里说丰年，听取蛙声一片。", "七八个星天外，两三点雨山前。旧时茅店社林边，路转溪桥忽见。"], "id": 342}, {"title": "雨霖铃", "author": "柳永", "tag": "", "cat": "宋词", "lines": ["寒蝉凄切，对长亭晚，骤雨初歇。都门帐饮无绪，留恋处，兰舟催发。执手相看泪眼，竟无语凝噎。念去去，千里烟波，暮霭沉沉楚天阔。", "多情自古伤离别，更那堪，冷落清秋节！今宵酒醒何处？杨柳岸，晓风残月。此去经年，应是良辰好景虚设。便纵有千种风情，更与何人说。"], "id": 343}, {"title": "念奴娇·赤壁怀古", "author": "苏轼", "tag": "", "cat": "宋词", "lines": ["大江东去，浪淘尽，千古风流人物。故垒西边，人道是，三国周郎赤壁。乱石穿空，惊涛拍岸,卷起千堆雪。 江山如画，一时多少豪杰。", "遥想公瑾当年，小乔初嫁了，雄姿英发。羽扇纶巾，谈笑间，樯橹灰飞烟灭。故国神游，多情应笑我，早生华发。人生如梦，一樽还酹江月。"], "id": 344}, {"title": "定风波", "author": "苏轼", "tag": "", "cat": "宋词", "lines": ["三月七日，沙湖道中遇雨。雨具先去，同行皆狼狈，余独不觉。已而遂晴，故作此。", "莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。", "料峭春风吹酒醒，微冷，山头斜照却相迎。回首向来萧瑟处，归去，也无风雨也无晴。"], "id": 345}, {"title": "水龙吟·登建康赏心亭", "author": "辛弃疾", "tag": "", "cat": "宋词", "lines": ["楚天千里清秋，水随天去秋无际。遥岑远目，献愁供恨，玉簪螺髻。落日楼头，断鸿声里，江南游子。把吴钩看了，栏杆拍遍，无人会，登临意。", "休说鲈鱼堪脍，尽西风，季鹰归未？求田问舍，怕应羞见，刘郎才气。可惜流年，忧愁风雨，树犹如此!倩何人唤取，红巾翠袖，揾英雄泪！"], "id": 346}, {"title": "永遇乐·京口北固亭怀古", "author": "辛弃疾", "tag": "", "cat": "宋词", "lines": ["千古江山，英雄无觅，孙仲谋处。舞榭歌台，风流总被,雨打风吹去。斜阳草树，寻常巷陌，人道寄奴曾住。想当年，金戈铁马，气吞万里如虎。", "元嘉草草，封狼居胥，赢得仓皇北顾。四十三年，望中犹记，烽火扬州路。可堪回首，佛狸祠下，一片神鸦社鼓！凭谁问，廉颇老矣，尚能饭否?"], "id": 347}, {"title": "醉花阴", "author": "李清照", "tag": "", "cat": "宋词", "lines": ["薄雾浓云愁永昼，瑞脑销金兽。佳节又重阳，玉枕纱厨，半夜凉初透。", "东篱把酒黄昏后，有暗香盈袖。莫道不销魂，帘卷西风，人比黄花瘦。"], "id": 348}, {"title": "声声慢", "author": "李清照", "tag": "", "cat": "宋词", "lines": ["寻寻觅觅，冷冷清清，凄凄惨惨戚戚。乍暖还寒时候，最难将息。三杯两盏淡酒，怎敌他、晚来风急！", "雁过也，正伤心，却是旧时相识。满地黄花堆积，憔悴损，如今有谁堪摘？守着窗儿，独自怎生得黑!梧桐更兼细雨，到黄昏、点点滴滴。这次第，怎一个愁字了得!"], "id": 349}, {"title": "一剪梅", "author": "李清照", "tag": "", "cat": "宋词", "lines": ["红藕香残玉簟秋。轻解罗裳，独上兰舟。云中谁寄锦书来？雁字回时，月满西楼。", "花自飘零水自流。一种相思，两处闲愁。此情无计可消除，才下眉头，却上心头。"], "id": 350}, {"title": "书愤", "author": "陆游", "tag": "", "cat": "宋词", "lines": ["早岁那知世事艰，中原北望气如山。楼船夜雪瓜洲渡，铁马秋风大散关。", "塞上长城空自许，镜中衰鬓已先斑。出师一表真名世，千载谁堪伯仲间！"], "id": 351}, {"title": "扬州慢", "author": "姜夔", "tag": "", "cat": "宋词", "lines": ["淳熙丙申至日，余过维扬。夜雪初霁，荠麦弥望。入其城，则四顾萧条，寒水自碧，暮色渐起，戍角悲吟。予怀怆然，感慨今昔，因自度此曲。千岩老人以为有《黍离》之悲也。", "淮左名都，竹西佳处，解鞍少驻初程,。过春风十里，尽荠麦青青。自胡马窥江去后，废池乔木，犹厌言兵。渐黄昏，清角吹寒，都在空城。", "杜郎俊赏，算而今重到须惊。纵豆蔻词工，青楼梦好，难赋深情。二十四桥仍在，波心荡，冷月无声。念桥边红药，年年知为谁生?"], "id": 352}, {"title": "兰亭集序", "author": "王羲之", "tag": "", "cat": "古文", "lines": ["永和九年，岁在癸丑，暮春之初，会于会稽山阴之兰亭，修禊事也。群贤毕至，少长咸集。此地有崇山峻岭，茂林修竹，又有清流激湍，映带左右，引以为流觞曲水，列坐其次。虽无丝竹管弦之盛，一觞一咏，亦足以畅叙幽情。", "是日也，天朗气清，惠风和畅，仰观宇宙之大，俯察品类之盛，所以游目骋怀，足以极视听之娱，信可乐也。", "夫人之相与，俯仰一世。或取诸怀抱，悟言一室之内；或因寄所托，放浪形骸之外。虽趣舍万殊，静躁不同，当其欣于所遇，暂得于己，快然自足，不知老之将至；及其所之既倦，情随事迁，感慨系之矣。向之所欣，俯仰之间，已为陈迹，犹不能不以之兴怀，况修短随化，终期于尽！古人云：“死生亦大矣。”岂不痛哉！", "每览昔人兴感之由，若合一契，未尝不临文嗟悼，不能喻之于怀。固知一死生为虚诞，齐彭殇为妄作。后之视今，亦犹今之视昔，悲夫！故列叙时人，录其所述，虽世殊事异，所以兴怀，其致一也。后之览者，亦将有感于斯文。"], "id": 353}, {"title": "前赤壁赋", "author": "苏轼", "tag": "", "cat": "古文", "lines": ["壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。清风 徐来，水波不兴。举酒属客，诵明月之诗，歌窈窕之章。少焉，月出于东山之上，徘徊于斗牛之间。白露横江，水光接天。纵一苇之所如，凌万顷之茫然。浩浩乎如冯虚御风，而不知其所止；飘飘乎如遗世独立，羽化而登仙。", "于是饮酒乐甚，扣舷而歌之。歌曰：“桂棹兮兰桨，击空明兮溯流光。渺渺兮予怀，望美人兮天一方。”客有吹洞箫者，倚歌而和之。其声呜呜然，如怨如慕，如泣如诉，余音袅袅，不绝如缕。舞幽壑之潜蛟，泣孤舟之嫠妇。", "苏子愀然，正襟危坐而问客曰：“何为其然也？”客曰：“‘月明星稀，乌鹊南飞’,此非曹孟德之诗乎？西望夏口，东望武昌。山川相缪，郁乎苍苍，此非孟德之困于周郎者乎？方其破荆州，下江陵，顺流而东也，舳舻千里，旌旗蔽空，酾酒临江，横槊赋诗，固一世之雄也，而今安在哉?况吾与子渔樵于江渚之上，侣鱼虾而友麋鹿，驾一叶之扁舟，举匏樽以相属。寄蜉蝣于天地，渺沧海之一粟。哀吾生之须臾，羡长江之无穷。挟飞仙以遨游，抱明月而长终。知不可乎骤得，托遗响于悲风。”", "苏子曰：“客亦知夫水与月乎？逝者如斯，而未尝往也；盈虚者如彼，而卒莫消长也。盖将自其变者而观之，则天地曾不能以一瞬；自其不变者而观之，则物与我皆无尽也，而又何羡乎！且夫天地之间，物各有主，苟非吾之所有，虽一毫而莫取。惟江上之清风，与山间之明月，耳得之而为声，目遇之而成色，取之无禁，用之不竭，是造物者之无尽藏也，而吾与子之所共适。”", "客喜而笑，洗盏更酌 。肴核既尽，杯盘狼籍。相与枕藉乎舟中，不知东方之既白。"], "id": 354}, {"title": "游褒禅山记", "author": "王安石", "tag": "", "cat": "古文", "lines": ["于是余有叹焉。古人之观于天地、山川、草木、虫鱼、鸟兽，往往有得，以其求思之深而无不在也。夫夷以近，则游者众，险以远，则至者少。而世之奇伟、瑰怪、非常之观，常在于险远，而人之所罕至焉，故非有志者不能至也。有志矣，不随以止也，然力不足者，亦不能至也。有志与力，而又不随以怠，至于幽暗昏惑而无物以相之，亦不能至也。然力足以至焉，于人为可讥，而在已为有悔；尽吾志也而不能至者，可以无悔矣，其孰能讥之乎？此余之所得也."], "id": 355}, {"title": "劝学", "author": "荀子", "tag": "", "cat": "古文", "lines": ["君子曰：学不可以已。", "青，取之于蓝，而青于蓝；冰，水为之，而寒于水。木直中绳，輮以为轮，其曲中规，虽有槁暴，不复挺者，輮使之然也。故木受绳则直，金就砺则利，君子博学而日参省乎己，则知明而行无过矣。", "吾尝终日而思矣，不如须臾之所学也。吾尝跂而望矣，不如登高之博见也。登高而招，臂非加长也，而见者远；顺风而呼，声非加疾也，而闻者彰。假舆马者，非利足也，而致千里；假舟楫者，非能水也，而绝江河。君子生非异也，善假于物也。", "积土成山，风雨兴焉；积水成渊，蛟龙生焉；积善成德，而神明自得，圣心备焉。故不积跬步，无以至千里；不积小流，无以成江海。骐骥一跃，不能十步；驽马十驾，功在不舍。锲而舍之，朽木不折；锲而不舍，金石可镂。蚓无爪牙之利，筋骨之强，上食埃土，下饮黄泉，用心一也。蟹六跪而二螯，非蛇鳝之穴无可寄托者，用心躁也。"], "id": 356}, {"title": "过秦论", "author": "贾谊", "tag": "", "cat": "古文", "lines": ["及至始皇，奋六世之余烈，振长策而御宇内，吞二周而亡诸侯，履至尊而制六合，执敲扑而鞭笞天下，威振四海。南取百越之地，以为桂林、象郡；百越之君，俯首系颈，委命下吏。乃使蒙恬北筑长城而守藩篱，却匈奴七百余里；胡人不敢南下而牧马，士不敢弯弓而报怨。于是废先王之道，焚百家之言，以愚黔首；隳名城，杀豪杰；收天下之兵，聚之咸阳，销锋镝，铸以为金人十二，以弱天下之民。然后践华为城，因河为池，据亿丈之城，临不测之渊，以为固。良将劲弩守要害之处，信臣精卒陈利兵而谁何。天下已定，始皇之心，自以为关中之固，金城千里，子孙帝王万世之业也。", "始皇既没，余威震于殊俗。然陈涉瓮牖绳枢之子，氓隶之人，而迁徙之徒也；才能不及中人，非有仲尼、墨翟之贤，陶朱、猗顿之富；蹑足行伍之间，而倔起阡陌之中，率疲弊之卒，将数百之众，转而攻秦；斩木为兵，揭竿为旗，天下云集响应，赢粮而景从。山东豪俊遂并起而亡秦族矣。", "且夫天下非小弱也，雍州之地，崤函之固，自若也。陈涉之位，非尊于齐、楚、燕、赵、韩、魏、宋、卫、中山之君也；锄櫌棘矜，非铦于钩戟长铩也；谪戍之众，非抗于九国之师也；深谋远虑，行军用兵之道，非及向时之士也。然而成败异变，功业相反也，何也？试使山东之国与陈涉度长絜大，比权量力，则不可同年而语矣。然秦以区区之地，致万乘之势，序八州而朝同列，百有余年矣；然后以六合为家，崤函为宫；一夫作难而七庙隳，身死人手，为天下笑者，何也？仁义不施而攻守之势异也。"], "id": 357}, {"title": "师说", "author": "韩愈", "tag": "", "cat": "古文", "lines": ["李氏子蟠，年十七，好古文，六艺经传皆通习之，不拘于时，", "学于余。余嘉其能行古道，作《师说》以贻之。", "古之学者必有师。师者，所以传道受业解惑也。人非生而知之者，孰能无惑？惑而不从师，其为惑也，终不解矣。生乎吾前，其闻道也固先乎吾，吾从而师之；生乎吾后，其闻道也亦先乎吾，吾从而师之。吾师道也，夫庸知其年之先后生于吾乎？是故无贵无贱，无长无少，道之所存，师之所存也。", "嗟乎！师道之不传也久矣！欲人之无惑也难矣！古之圣人，其出人也远矣，犹且从师而问焉；今之众人，其下圣人也亦远矣，而耻学于师。是故圣益圣，愚益愚。圣人之所以为圣，愚人之所以为愚，其皆出于此乎？爱其子，择师而教之；于其身也，则耻师焉，惑矣。彼童子之师，授之书而习其句读者，非吾所谓传其道解其惑者也。句读之不知，惑之不解，或师焉，或不焉，小学而大遗，吾未见其明也。巫医乐师百工之人，不耻相师。士大夫之族，曰师曰弟子云者，则群聚而笑之。问之，则曰：“彼与彼年相若也，道相似也。位卑则足羞，官盛则近谀。”呜呼！师道之不复，可知矣。巫医乐师百工之人，君子不齿，今其智乃反", "不能及，其可怪也欤！", "圣人无常师。孔子师郯子、苌弘、师襄、老聃。郯子之徒，其贤不及孔子。孔子曰：“三人行，则必有我师。”是故弟子不必不如师，师不必贤于弟子，闻道有先后，术业有专攻，如是而已。"], "id": 358}, {"title": "廉颇蔺相如列传", "author": "司马迁", "tag": "", "cat": "古文", "lines": ["既罢，归国，以相如功大，拜为上卿，位在廉颇之右。廉颇曰：“我为赵将，有攻城野战之大功，而蔺相如徒以口舌为劳，而位居我上。且相如素贱人，吾羞，不忍为之下！”宣言曰：“我见相如，必辱之。”相如闻，不肯与会。相如每朝时，常称病，不欲与廉颇争列。已而相如出，望见廉颇，相如引车避匿。于是舍人相与谏曰：“臣所以去亲戚而事君者，徒慕君之高义也。今君与廉颇同列，廉君宣恶言，而君畏匿之，恐惧殊甚。且庸人尚羞之，况于将相乎？臣等不肖，请辞去。”蔺相如固止之，曰：“公之视廉将军孰与秦王？”曰：“不若也。”相如曰：“夫以秦王之威，而相如廷叱之，辱其群臣。相如虽驽，独畏廉将军哉？顾吾念之，强秦之所以不敢加兵于赵者，徒以吾两人在也。今两虎共斗，其势不俱生。吾所以为此者，以先国家之急而后私仇也。”廉颇闻之，肉袒负荆，因宾客至蔺相如门谢罪，曰：“鄙贱之人，不知将军宽之至此也！”卒相与欢，为刎颈之交。"], "id": 359}, {"title": "归去来兮辞（并序）", "author": "陶渊明", "tag": "", "cat": "古文", "lines": ["余家贫，耕植不足以自给。幼稚盈室，瓶无储粟，生生所资，未见其术。亲故多劝余为长吏，脱然有怀，求之靡途。会有四方之事，诸侯以惠爱为德，家叔以余贫苦，遂见用于小邑。于时风波未静，心惮远役，彭泽去家百里，公田之利，足以为酒。故便求之。及少日，眷然有归欤之情。何则？质性自然，非矫厉所得。饥冻虽切，违己交病。尝从人事，皆口腹自役。于是怅然慷慨，深愧平生之志。犹望一稔，当敛裳宵逝。寻程氏妹丧于武昌，情在骏奔，自免去职。仲秋至冬，在官八十余日。因事顺心，命篇曰《归去来兮》。乙巳岁十一月也。", "归去来兮，田园将芜胡不归？既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。实迷途其未远，觉今是而昨非。舟遥遥以轻飏，风飘飘而吹衣。问征夫以前路，恨晨光之熹微。乃瞻衡宇，载欣载奔。僮仆欢迎，稚子候门。三径就荒，松菊犹存。携幼入室，有酒盈樽。引壶觞以自酌，眄庭柯以怡颜。倚南窗以寄傲，审容膝之易安。园日涉以成趣，门虽设而常关。策扶老以流憩，时矫首而遐观。云无心以出岫，鸟倦飞而知还。景翳翳以将入，抚孤松而盘桓。", "归去来兮，请息交以绝游。世与我而相违，复驾言兮焉求？悦亲戚之情话，乐琴书以消忧。农人告余以春及，将有事于西畴。或命巾车，或棹孤舟。既窈窕以寻壑，亦崎岖而经丘。木欣欣以向荣，泉涓涓而始流。善万物之得时，感吾生之行休。", "已矣乎！寓形宇内复几时？曷不委心任去留？胡为乎遑遑欲何之？富贵非吾愿，帝乡不可期。怀良辰以孤往，或植杖而耘耔。登东皋以舒啸，临清流而赋诗。聊乘化以归尽，乐夫天命复奚疑！"], "id": 360}, {"title": "滕王阁序", "author": "王勃", "tag": "", "cat": "古文", "lines": ["时维九月，序属三秋。潦水尽而寒潭清，烟光凝而暮山紫。俨骖騑于上路，访风景于崇阿；临帝子之长洲，得天人之旧馆。层峦耸翠，上出重霄；飞阁流丹，下临无地。鹤汀凫渚，穷岛屿之萦回；桂殿兰宫，即冈峦之体势。", "披绣闼，俯雕甍，山原旷其盈视，川泽纡其骇瞩。闾阎扑地，钟鸣鼎食之家；舸舰弥津，青雀黄龙之舳。云销雨霁，彩彻区明。落霞与孤鹜齐飞，秋水共长天一色。渔舟唱晚，响穷彭蠡之滨；雁阵惊寒，声断衡阳之浦。"], "id": 361}, {"title": "逍遥游", "author": "庄周", "tag": "", "cat": "古文", "lines": ["故夫知效一官，行比一乡，德合一君而征一国者，其自视也，亦若此矣。而宋荣子犹然笑之。且举世而誉之而不加劝，举世而非之而不加沮，定乎内外之分，辩乎荣辱之境，斯已矣。彼其于世，未数数然也。虽然，犹有未树也。夫列子御风而行，泠然善也。旬有五日而后反。彼于致福者，未数数然也。此虽免乎行，犹有所待者也。若夫乘天地之正，而御六气之辩，以游无穷者，彼且恶乎待哉？故曰：至人无己，神人无功，圣人无名。"], "id": 362}, {"title": "陈情表", "author": "李密", "tag": "", "cat": "古文", "lines": ["臣密言：臣以险衅，夙遭闵凶。生孩六月，慈父见背；行年四岁，舅夺母志。祖母刘悯臣孤弱，躬亲抚养。臣少多疾病，九岁不行，零丁孤苦，至于成立。既无叔伯，终鲜兄弟，门衰祚薄，晚有儿息。外无期功强近之亲，内无应门五尺之僮，茕茕孑立，形影相吊。而刘夙婴疾病，常在床蓐，臣侍汤药，未曾废离。", "逮奉圣朝，沐浴清化。前太守臣逵察臣孝廉，后刺史臣荣举臣秀才。臣以供养无主，辞不赴命。诏书特下，拜臣郎中，寻蒙国恩，除臣洗马。猥以微贱，当待东宫，非臣陨首所能上报。臣具以表闻，辞不就职。诏书切峻，责臣逋慢。郡县逼迫，催臣上道；州司临门，急于星火。臣欲奉诏奔驰，则刘病日笃；欲苟顺私情，则告诉不许：臣之进退，实为狼狈。", "伏惟圣朝以孝治天下，凡在故老，犹蒙矜育，况臣孤苦，特为尤甚。且臣少任伪朝，历职郎署，本图宦达，不矜名节。今臣亡国贱俘，至微至陋。过蒙拔擢，宠命优渥，岂敢盘桓，有所希冀。但以刘日薄西山，气息奄奄，人命危浅，朝不虑夕。臣无祖母，无以至今日；祖母无臣，无以终余年。母孙二人，更相为命，是以区区不能废远。", "臣密今年四十有四，祖母刘今年九十有六，是臣尽节于陛下之日长，报养刘之日短也。乌鸟私情，愿乞终养。臣之辛苦，非独蜀之人士及二州牧伯所见明知，皇天后土实所共鉴。愿陛下矜悯愚诚，听臣微志，庶刘侥幸，保卒余年。臣生当陨首，死当结草。臣不胜犬马怖惧之情，谨拜表以闻。”"], "id": 363}, {"title": "梦游天姥吟留别", "author": "李白", "tag": "", "cat": "古文", "lines": ["海客谈瀛洲，烟涛微茫信难求；越人语天姥，云霞明灭或可睹。天姥连天向天横，势拔五岳掩赤城。天台四万八千丈，对此欲倒东南倾。", "我欲因之梦吴越，一夜飞度镜湖月。湖月照我影，送我至剡溪。谢公宿处今尚在，渌水荡漾清猿啼。脚著谢公屐，身登青云梯。半壁见海日，空中闻天鸡。千岩万转路不定，迷花倚石忽已暝。熊咆龙吟殷岩泉，栗深林兮惊层巅。云青青兮欲雨，水澹澹兮生烟。列缺霹雳，丘峦崩摧。洞天石扉，訇然中开。青冥浩荡不见底，日月照耀金银台。霓为衣兮风为马，云之君兮纷纷而来下。虎鼓瑟兮鸾回车，仙之人兮列如麻。忽魂悸以魄动，恍惊起而长嗟。惟觉时之枕席，失向来之烟霞。", "世间行乐亦如此，古来万事东流水。别君去兮何时还？且放白鹿青崖间，须行即骑访名山。安能摧眉折腰事权贵，使我不得开心颜?"], "id": 364}, {"title": "庖丁解牛", "author": "《庄子》", "tag": "", "cat": "古文", "lines": ["庖丁为文惠君解牛。手之所触，肩之所倚，足之所履，膝之所踦，砉然向然，奏刀騞然，莫不中音。合于《桑林》之舞，乃中《经首》之会。", "文惠君曰：“嘻，善哉！技盖至此乎？”", "庖丁释刀对曰：“臣之所好者，道也；进乎技矣。始臣之解牛之时，所见无非牛者。三年之后，未尝见全牛也。方今之时，臣以神遇而不以目视，官知止而神欲行。依乎天理，批大郤，导大窾，因其固然，技经肯綮之未尝，而况大軱乎！良庖岁更刀，割也；族庖月更刀，折也。今臣之刀十九年矣，所解数千牛矣，而刀刃若新发于硎。彼节者有间，而刀刃者无厚；以无厚入有间，恢恢乎其于游刃必有余地矣，是以十九年而刀刃若新发于硎。虽然，每至于族，吾见其难为，怵然为戒，视为止，行为迟。动刀甚微，謋然已解，如土委地。提刀而立，为之四顾，为之踌躇满志；善刀而藏之。”", "文惠君曰：“善哉！吾闻庖丁之言，得养生焉。”"], "id": 365}, {"title": "阿房宫赋", "author": "杜牧", "tag": "", "cat": "古文", "lines": ["六王毕，四海一。蜀山兀，阿房出。覆压三百余里，隔离天日。骊山北构而西折，直走咸阳。二川溶溶，流入宫墙。五步一楼，十步一阁；廊腰缦回，檐牙高啄；各抱地势，钩心斗角。盘盘焉，囷囷焉，蜂房水涡，矗不知其几千万落。长桥卧波，未云何龙？复道行空，不霁何虹？高低冥迷，不知西东。歌台暖响，春光融融；舞殿冷袖，风雨凄凄。一日之内，一宫之间，而气候不齐。", "妃嫔媵嫱，王子皇孙，辞楼下殿，辇来于秦。朝歌夜弦，为秦宫人。明星荧荧，开妆镜也；绿云扰扰，梳晓鬟也；渭流涨腻，弃脂水也；烟斜雾横，焚椒兰也。雷霆乍惊，宫车过也；辘辘远听，杳不知其所之也。一肌一容，尽态极妍，缦立远视，而望幸焉。有不见者，三十六年。燕赵之收藏，韩魏之经营，齐楚之精英，几世几年，剽掠其人，倚叠如山。一旦不能有，输来其间。鼎铛玉石，金块珠砾，弃掷逦迤，秦人视之，亦不甚惜。", "嗟乎！一人之心，千万人之心也。秦爱纷奢，人亦念其家。奈何取之尽锱铢，用之如泥沙？使负栋之柱，多于南亩之农夫；架梁之椽，多于机上之工女；钉头磷磷，多于在庾之粟粒；瓦缝参差，多于周身之帛缕；直栏横槛，多于九土之城郭；管弦呕哑，多于市人之言语。使天下之人，不敢言而敢怒。独夫之心，日益骄固。戍卒叫，函谷举，楚人一炬，可怜焦土！", "呜呼！灭六国者六国也，非秦也；族秦者秦也，非天下也。嗟乎！使六国各爱其人，则足以拒秦；使秦复爱六国之人，则递三世可至万世而为君，谁得而族灭也？秦人不暇自哀，而后人哀之；后人哀之而不鉴之，亦使后人而复哀后人也。"], "id": 366}, {"title": "春夜宴从弟桃花园序", "author": "李白", "tag": "", "cat": "古文", "lines": ["夫天地者万物之逆旅也；光阴者百代之过客也。而浮生若梦，为欢几何？古人秉烛夜游，良有以也。况阳春召我以烟景，大块假我以文章。会桃花之芳园，序天伦之乐事。群季俊秀，皆为惠连；吾人咏歌，独惭康乐。幽赏未已，高谈转清。开琼筵以坐花，飞羽觞而醉月。不有佳咏，何伸雅怀？如诗不成，罚依金谷酒数。"], "id": 367}, {"title": "项脊轩志", "author": "归有光", "tag": "", "cat": "古文", "lines": ["项脊轩，旧南阁子也。室仅方丈，可容一人居。百年老屋，尘泥渗漉，雨泽下注；每移案，顾视无可置者。又北向，不能得日，日过午已昏。余稍为修葺，使不上漏。前辟四窗，垣墙周庭，以当南日，日影反照，室始洞然。又杂植兰桂竹木于庭，旧时栏楯，亦遂增胜。借书满架，偃仰啸歌，冥然兀坐，万籁有声；而庭阶寂寂，小鸟时来啄食，人至不去。三五之夜，明月半墙，桂影斑驳，风移影动，珊珊可爱。"], "id": 368}, {"title": "上邪", "author": "汉乐府", "tag": "", "cat": "古诗·乐府", "lines": ["上邪！我欲与君相知，长命无绝衰。", "山无陵，江水为竭，冬雷震震，夏雨雪，天地合，乃敢与君绝！"], "id": 369}, {"title": "短歌行", "author": "曹操", "tag": "", "cat": "古诗·乐府", "lines": ["对酒当歌，人生几何？譬如朝露，去日苦多。", "慨当以慷，忧思难忘。何以解忧？唯有杜康。", "青青子衿，悠悠我心。但为君故，沉吟至今。", "呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙。", "明明如月，何时可掇？忧从中来，不可断绝。", "越陌度阡，枉用相存。契阔谈讌，心念旧恩。", "月明星稀，乌鹊南飞。绕树三匝，何枝可依？", "山不厌高，海不厌深。周公吐哺，天下归心。"], "id": 370}, {"title": "观沧海", "author": "曹操", "tag": "", "cat": "古诗·乐府", "lines": ["东临碣石，以观沧海。水何澹澹，山岛竦峙。树木丛生，百草丰茂。秋风萧瑟，洪波涌起。日月之行，若出其中；星汉灿烂，若出其里。幸甚至哉，歌以咏志。"], "id": 371}, {"title": "龟虽寿", "author": "曹操", "tag": "", "cat": "古诗·乐府", "lines": ["神龟虽寿，犹有竟时。腾蛇乘雾，终为土灰。老骥伏枥，志在千里；", "烈士暮年，壮心不已。盈缩之期，不但在天；养怡之福，可得永年。", "幸甚至哉，歌以咏志。"], "id": 372}, {"title": "饮酒", "author": "陶渊明", "tag": "", "cat": "古诗·乐府", "lines": ["结庐在人境，而无车马喧。问君何能尔？心远地自偏。", "采菊东篱下，悠然见南山。山气日夕佳，飞鸟相与还。", "此中有真意，欲辨已忘言。"], "id": 373}, {"title": "敕勒歌", "author": "北朝民歌", "tag": "", "cat": "古诗·乐府", "lines": ["敕勒川，阴山下。天似穹庐，笼盖四野。", "天苍苍，野茫茫，风吹草低见牛羊。"], "id": 374}, {"title": "氓", "author": "诗经", "tag": "", "cat": "古诗·乐府", "lines": ["氓之蚩蚩，抱布贸丝。", "匪来贸丝，来即我谋。", "送子涉淇，至于顿丘。", "匪我愆期，子无良媒。", "将子无怒，秋以为期。", "乘彼垝垣，以望复关。", "不见复关，泣涕涟涟。", "既见复关，载笑载言。", "尔卜尔筮，体无咎言。", "以尔车来，以我贿迁。", "桑之未落，其叶沃若。", "于嗟鸠兮，无食桑葚！", "于嗟女兮，无与士耽！", "士之耽兮，犹可说也；", "女之耽兮，不可说也！", "桑之落矣，其黄而陨。", "自我徂尔，三岁食贫。", "淇水汤汤，渐车帷裳。", "女也不爽，士贰其行。", "士也罔极，二三其德。", "三岁为妇，靡室劳矣；", "夙兴夜寐，靡有朝矣。", "言既遂矣，至于暴矣。", "兄弟不知，咥其笑矣。", "静言思之，躬自悼矣。", "及尔偕老，老使我怨。", "淇则有岸，隰则有泮。", "总角之宴，言笑晏晏。", "信誓旦旦，不思其反。", "反是不思，亦已焉哉！"], "id": 375}, {"title": "沁园春·长沙", "author": "毛泽东", "tag": "", "cat": "毛泽东诗词", "lines": ["独立寒秋，湘江北去，橘子洲头。看万山红遍，层林尽染；漫江碧透，百舸争流。鹰击长空，鱼翔浅底，万类霜天竞自由。怅寥廓，问苍茫大地，谁主沉浮？", "携来百侣曾游，忆往昔峥嵘岁月稠。恰同学少年，风华正茂；书生意气，挥斥方遒。指点江山，激扬文字，粪土当年万户侯。曾记否，到中流击水，浪遏飞舟？"], "id": 376}, {"title": "沁园春·雪", "author": "毛泽东", "tag": "", "cat": "毛泽东诗词", "lines": ["北国风光，千里冰封，万里雪飘。望长城内外，惟余莽莽；大河上下，顿失滔滔。山舞银蛇，原驰蜡象，欲与天公试比高。须晴日，看红装素裹，分外妖娆。", "江山如此多娇，引无数英雄竞折腰。惜秦皇汉武，略输文采；唐宗宋祖，稍逊风骚。一代天骄，成吉思汗，只识弯弓射大雕。俱往矣，数风流人物，还看今朝。"], "id": 377}, {"title": "念奴娇·昆仑", "author": "毛泽东", "tag": "", "cat": "毛泽东诗词", "lines": ["横空出世，莽昆仑，阅尽人间春色。飞起玉龙三百万，搅得周天寒彻。夏日消溶，江河横溢，人或为鱼鳖。千秋功罪，谁人曾与评说？", "而今我谓昆仑：不要这高，不要这多雪。安得倚天抽宝剑，把汝裁为三截？一截遗欧，一截赠美，一截还中国。太平世界，环球同此凉热。"], "id": 378}, {"title": "菩萨蛮·黄鹤楼", "author": "毛泽东", "tag": "", "cat": "毛泽东诗词", "lines": ["茫茫九派流中国，沉沉一线穿南北。烟雨莽苍苍，龟蛇锁大江。", "黄鹤知何去？剩有游人处。把酒酹滔滔，心潮逐浪高！"], "id": 379}, {"title": "七律·长征", "author": "毛泽东", "tag": "", "cat": "毛泽东诗词", "lines": ["红军不怕远征难，万水千山只等闲。", "五岭逶迤腾细浪，乌蒙磅礴走泥丸。", "金沙水拍云崖暖，大渡桥横铁索寒。", "更喜岷山千里雪，三军过后尽开颜。"], "id": 380}, {"title": "雨巷", "author": "戴望舒", "tag": "", "cat": "现代诗", "lines": ["撑着油纸伞，独自彷徨在悠长、悠长又寂寥的雨巷，我希望逢着一个丁香一样的结着愁怨的姑娘。", "她是有丁香一样的颜色，丁香一样的芬芳，丁香一样的忧愁，在雨中哀怨，哀怨又彷徨；她彷徨在这寂寥的雨巷，撑着油纸伞像我一样，像我一样地默默彳亍着冷漠、凄清，又惆怅。", "她静默地走近，走近，又投出太息一般的眼光她飘过像梦一般地，像梦一般地凄婉迷茫。", "像梦中飘过一枝丁香的，我身旁飘过这女郎；她静默地远了，远了，到了颓圮的篱墙，走尽这雨巷。", "在雨的哀曲里，消了她的颜色，散了她的芬芳，消散了，甚至她的太息般的眼光，丁香般的惆怅。", "撑着油纸伞，独自彷徨在悠长，悠长又寂寥的雨巷，我希望飘过一个丁香一样的结着愁怨的姑娘。"], "id": 381}, {"title": "再别康桥", "author": "徐志摩", "tag": "", "cat": "现代诗", "lines": ["轻轻的我走了，", "正如我轻轻的来；", "我轻轻的招手，", "作别西天的云彩。", "那河畔的金柳，", "是夕阳中的新娘；", "波光里的滟影，", "在我的心头荡漾。", "软泥上的青荇，", "油油的在水底招摇：", "在康河的柔波里，", "我甘心做一条水草！", "那榆荫下的一潭，", "不是清泉是天上的虹,", "揉碎在浮藻间,", "沉淀彩虹似的梦。", "寻梦撑一支长篙，", "向青草更青处漫溯，", "满载一船星辉，", "在星辉斑斓里放歌。", "但我不能放歌，", "悄悄是别离的笙箫；", "夏虫也为我沉默，", "沉默是今晚的康桥！", "悄悄的我走了，", "正如我悄悄的来；", "我挥一挥衣袖，", "不带走一片云彩。"], "id": 382}, {"title": "致橡树", "author": "舒婷", "tag": "", "cat": "现代诗", "lines": ["我如果爱你——", "绝不像攀援的凌霄花，", "借你的高枝炫耀自己：", "我如果爱你——", "绝不学痴情的鸟儿，", "为绿荫重复单调的歌曲；", "也不止像泉源，", "常年送来清凉的慰藉；", "也不止像险峰，增加你的高度，衬托你的威仪。", "甚至日光。", "甚至春雨。", "不，这些都还不够！", "我必须是你近旁的一株木棉，", "作为树的形象和你站在一起。", "根，紧握在地下，", "叶，相触在云里。", "每一阵风过，", "我们都互相致意，", "但没有人", "听懂我们的言语。", "你有你的铜枝铁干，", "像刀，像剑，", "也像戟，", "我有我的红硕花朵，", "像沉重的叹息，", "又像英勇的火炬，", "我们分担寒潮、风雷、霹雳；", "我们共享雾霭流岚、虹霓，", "仿佛永远分离，", "却又终身相依，", "这才是伟大的爱情，", "坚贞就在这里：", "不仅爱你伟岸的身躯，", "也爱你坚持的位置，脚下的土地。"], "id": 383}, {"title": "相信未来", "author": "食指", "tag": "", "cat": "现代诗", "lines": ["当蜘蛛网无情地查封了我的炉台", "当灰烬的余烟叹息着贫困的悲哀", "我依然固执地铺平失望的灰烬", "用美丽的雪花写下：相信未来", "当我的紫葡萄化为深秋的露水", "当我的鲜花依偎在别人的情怀", "我依然固执地用凝霜的枯藤", "在凄凉的大地上写下：相信未来", "我要用手指那涌向天边的排浪", "我要用手掌那托住太阳的大海", "摇曳着曙光那枝温暖漂亮的笔杆", "用孩子的笔体写下：相信未来", "我之所以坚定地相信未来", "是我相信未来人们的眼睛", "她有拨开历史风尘的睫毛", "她有看透岁月篇章的瞳孔", "不管人们对于我们腐烂的皮肉", "那些迷途的惆怅、失败的苦痛", "是寄予感动的热泪、深切的同情", "还是给以轻蔑的微笑、辛辣的嘲讽", "我坚信人们对于我们的脊骨", "那无数次的探索、迷途、失败和成功", "一定会给予热情、客观、公正的评定", "是的，我焦急地等待着他们的评定", "朋友，坚定地相信未来吧", "相信不屈不挠的努力", "相信战胜死亡的年轻", "相信未来、热爱生命"], "id": 384}, {"title": "走向远方", "author": "汪国真", "tag": "", "cat": "现代诗", "lines": ["是男儿总要走向远方，", "走向远方是为了让生命更辉煌。", "走在崎岖不平的路上，", "年轻的眼眸里装着梦更装着思想。", "不论是孤独地走着还是结伴同行，", "让每一个脚印都坚实而有力量。", "我们学着承受痛苦。", "学着把眼泪像珍珠一样收藏，", "把眼泪都贮存在成功的那一天流，", "那一天，哪怕流它个大海汪洋。", "我们学着对待误解。", "学着把生活的苦酒当成饮料一样慢慢品尝，", "不论生命经过多少委屈和艰辛，", "我们总是以一个朝气蓬勃的面孔，", "醒来在每一个早上。", "我们学着对待流言。", "学着从容而冷静地面对世事沧桑，", "\"猝然临之而不惊，无故加之而不怒\"，", "这便是我们的大勇，我们的修养。", "我们学着只争朝夕。", "人生苦短，", "道路漫长，", "我们走向并珍爱每一处风光，", "我们不停地走着，", "不停地走着的我们也成了一处风光。", "走向远方，", "从少年到青年，", "从青年到老年，", "我们从星星走成了夕阳。"], "id": 385}, {"title": "费希玛的金鱼", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["在遥远的波斯尼亚，妇人费希玛和丈夫及两个儿子生活在一个小村落里。有一天，在奥地利工作的丈夫马尔科奇回来，送给儿子一个鱼缸和两条金鱼。次年即1992年波斯尼亚爆发战争，在那个战火纷飞人人自危的年月，费希玛失去了丈夫，也失去了家园，不得不走上颠沛流离的逃难之路。", "在弃家而逃之际，费希玛不知道等待她和两个孩子的将是什么，一切是那么慌乱，那么仓促。但在这样的时刻，费希玛仍没忘记那两个金鱼，它们不仅是已逝的丈夫对孩子的爱，更是两条活生生的生命啊。于是，她捧起金鱼缸从容地走向湖边，将它们轻轻地放进蓝蓝的湖水里。", "几年后，战火平息，费希玛和孩子们结束逃难返回家乡。家乡处处都是废墟，一切都待从头做起，但他们在当年放生金鱼的湖边看到湖面泛着片片金光，仔细一看，是一群活泼美丽的金鱼，跟他们当初放生的两条长得一模一样。哦，原来是那两条金鱼繁殖的下一代。最值得庆幸的是，她的两个儿子还从当时放生金鱼的那片湖水中摸回了那个圆圆的金鱼缸，这可是他们的父亲当年送给他们的礼物啊。费希玛和她的孩子们多么高兴啊，仿佛与自己的亲人在乱世后重逢。于是，费希玛继续饲喂那些金鱼，平静的湖水中孕育着无限的生机。", "费希玛和她的金鱼的故事流传开来，人们纷纷前来观看，并顺便买两条回家送人。于是出售金鱼成为费希玛一家致富之路，费希玛和她的孩子们终于摆脱了战乱的贫穷，过上了安宁殷实的生活。", "当年，当费希玛捧着一缸金鱼走向湖边时，她未必知道自己播下了怎样的生命的种子，今天，这满湖的金光鳞鳞中每一片都是一枚美丽的果实。这就是善念的回报。"], "id": 386}, {"title": "钢铁是怎样炼成的", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["他沿着小镇上冷冷清清的街道踱着步子，不知不觉走到了松树林前，在岔路口停住了脚步。在当年竖立绞架的地方，保尔默默站了许久，然后他走下路边的陡坡，进了烈士公墓。", "也不知是哪位热心肠的人，用云杉枝条编织的花环，装点了那一排掩埋忠骨的坟墓。这儿是小镇的尽头，阴郁而冷清。只有松林轻声地沙沙作响。四野里复苏的大地散发出新春的气息。", "就在这里，故乡的同志们英勇地牺牲了。他们为了改变那些生于贫贱、生就作奴隶的人们的命运，为了使他们的生活变得美好，献出了自己年轻的生命。", "保尔缓缓摘下军帽。哀思，深沉的哀思充满了他的心：……这仅有的一次生命应当怎样度过呢？每当回忆往事的时候，能够不为虚度年华而悔恨，不因碌碌无为而羞耻；在临死的时候，他能够说：“我的整个生命和全部精力，都已经献给了世界上最壮丽的事业──为人类解放而进行的斗争。”", "人，应当赶快生活。", "保尔怀着这样的幽思，离开了烈士公墓。"], "id": 387}, {"title": "谈生命", "author": "冰心", "tag": "", "cat": "朗诵稿件", "lines": ["我不敢说生命是什么，我只能说生命像什么。", "生命像向东流的一江春水，他从最高处发源，冰雪是他的前身。他聚集起许多细流，合成一股有力的洪涛，向下奔注，他曲折的穿过了悬崖峭壁，冲倒了层沙积土，挟卷着滚滚的沙石，快乐勇敢地流走，一路上他享受着他所遭遇的一切。", "有时候他遇到巉岩前阻，他愤激地奔腾了起来，怒吼着，回旋着，前波后浪地起伏催逼，直到冲倒了这危崖，他才心平气和地一泻千里。有时候他经过了细细的平沙，斜阳芳草里，看见了夹岸红艳的桃花，他快乐而又羞怯，静静地流着，低低地吟唱着，轻轻地度过这一段浪漫的行程。", "终于有一天，他远远地望见了大海，呵！他已到了行程的终结，这大海，使他屏息，使他低头，她多么辽阔，多么伟大！多么光明，又多么黑暗！大海庄严的伸出臂儿来接引他，他一声不响地流入她的怀里。他消融了，归化了，说不上快乐，也没有悲哀！也许有一天，他再从海上蓬蓬地雨点中升起，飞向西来，再形成一道江流，再冲倒两旁的石壁，再来寻夹岸的桃花。然而我不敢说来生，也不敢相信来生！"], "id": 388}, {"title": "每天进步一点点", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["香港海洋公园里有一条大鲸鱼，虽然重达8600公斤，却不但能跃出水面6.6米，还能向游客表演各种杂技。面对这条创造奇迹的鲸鱼，有人向训练师请教训练的秘诀。训练师说，在最初开始训练时，我们会先把绳子放在水面之下，使鲸鱼不得不从绳子上方通过，每通过一次，鲸鱼就能得到奖励。渐渐地，我们会把绳子提高，只不过每次提高的幅度都很小，大约只有两厘米，这样鲸鱼不需花费多大的力气就有可能跃过去，并获得奖励。于是，这条常常受到奖励的鲸鱼，便很乐意地接受下一次训练。随着时间的推移，鲸鱼跃过的高度逐渐上升，最后竟然达到了6.6米。", "训练师最后总结到，他们训练鲸鱼成功的诀窍，是每次让它进步一点点。正是这微不足道的一点点积累起来，天长日久，便取得了惊人的进步。", "在计量单位上，有一个较小的质量单位叫盎司。它经常会被引用来借代微不足道的事情。然而，正如刚才说的训练师培训鲸鱼的方法那样，哪怕是每次进步一盎司，到了一定的程度，也会创造出伟大的奇迹！", "每次进步一盎司，贵在每次，也难在每次。相传，古代蒙古人在训练大力士时，也采用这个办法。具体是这样做的：他们会让小孩子每天抱着刚出生不久的小牛犊上山吃草，小牛犊这时往往不过十多斤重，孩子们完全能轻松胜任。这样，随着牛犊的一天天长大，孩子们的力气也越来越大，最后，当牛犊长成几百斤的大牛时，孩子们也练出了力能举鼎的神力！"], "id": 389}, {"title": "渴望是潜能激发的枢纽", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["1858年，瑞典一个富人家生下了一个女儿。然而不久，孩子染上了一种无法解释的瘫痪症，只能与轮椅相伴。", "一次，女孩一家人一起乘船去旅行。船长的太太给孩子讲船长有一只天堂鸟，她被这只鸟的描述迷住了，很想亲自去看一看。于是保姆把孩子留在甲板上，自己去找船长。孩子耐不住性子等待，她要求服务生立即带她去看天堂鸟。那服务生并不知道女孩的腿不能走路，而只顾带着她一道去看那只美丽的鸟。奇迹发生了，女孩因为过度地渴望，竟忘我地拉住了服务生的手，慢慢地走了起来。", "从此，孩子的病便痊愈了。女孩长大以后，又忘我地投入到文学创作中，最后成了第一位荣获诺贝尔文学奖的女性，她就是茜尔玛·拉格萝芙。"], "id": 390}, {"title": "梦想的力量", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["从前有一个穷孩子，父亲是鞋匠。父亲去世之后，母亲为了生活不得不带着他另嫁。有一天，他有机会去晋见王子，他满怀希望，在王子面前唱诗歌，朗诵剧本。表演完毕后，王子问他想要求什么赏赐？这个穷孩子大胆地提出要求：“我想写诗剧，而且在皇家剧院演戏。”王子把这个长着小丑般大鼻子的笨拙男孩从头到脚看了一遍，然后对他说：“能够背诵剧本，并不表示能够写剧本，那是两码事，我劝你还是去学一门有用的手艺吧。”", "但是，他回家以后，打破了自己的储钱罐，向母亲和从不关心自己的继父道别，离家去追寻自己的理想。这时候，他才14岁。", "他到了哥本哈根，挨家挨户地按门铃，几乎按遍了所有达官贵人的门铃，却没有人赏识他，他衣衫褴褛地落魄街头，却仍不减他心中的热情。", "终于在1835年，他发表的童话故事吸引了儿童的目光，开启了属于他的新篇章，他的童话故事被译成多种文字，除了《圣经》之外，没有任何一本书比得上。", "他就是丹麦的童话大师安徒生，这时，距离安徒生离开家已经有了16个年头。"], "id": 391}, {"title": "苍穹下的唐古拉", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["头一回听见你的名字，你是我怎么也猜不透的一个谜语；头一回捧读你的故事，你是我心中最神秘的寓言。头一回轻轻把你歌唱，你是我唱过的最神圣的歌谣；头一回向着你的方向祈祷，你是我心灵最浩阔的海洋。", "你手中紧握的，是怎样的一把魔杖？你脚下征服的，是怎样的一片蛮荒？你是一个高度，用一种岿然的姿态，屹立在云海之上，群山之巅。你是一把尺度，度量着每一副皮囊的厚薄，每一把骨头的轻重；你是一艘方舟，只把虔诚的信徒渡往梦想的花园。", "许多次在梦里，我听见了你的召唤；许多回在心中，我把你暗暗思念。可当我匍匐在你的脚下，吻你苍劲的大手，却惟有泪流满面。我是准备了很多年，有太多的话想对你诉说；我是筹划了千百遍，有太多的苦与乐想请你评点。可在你的怀抱，我惟有默默，默默无言。", "啊，唐古拉！在你的跟前，我是多么的渺小和脆弱；在你的怀抱，我是多么的坚强与豁达。玛尼堆上飘扬的经幡，是你雄浑旋律里的一个音节；雪山上粲然绽放的雪莲，是你威严面孔上的另一种解答。", "啊，唐古拉，我梦中的唐古拉！我没有芬芳的青稞酒，也没有浓香的酥油茶，我没有贵重的珠宝，也没有雪白的哈达，我是远方的一个信徒，为的是瞻仰你的非凡，感受你的庄严和伟大！愿你永远是苍穹下最美丽的神话，愿苍生大地永远安宁祥和，阳光普洒！"], "id": 392}, {"title": "祷告的手", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["那是1940年，丢勒和奈斯丁是一对好朋友，都是在奋斗的画家。由于贫苦，他们必须半工半读才能继续。", "可因为工作占去了他们许多时间，两人的画艺进步很慢。困惑了良久，两人想出一个办法，决定，一个人工作来支持彼此的生活费，另一个人则全心学习艺术。丢勒赢了，得以继续学习。而奈斯丁则辛勤工作，供应两个人的生活所需。", "几年后，丢勒成功了，他按照两人当初的约定找到了奈斯丁，履行支持奈斯丁学习的协议。可他发现，奈斯丁那双原本优美敏感的双手由于辛勤工作已经变得僵硬扭曲，无法灵敏的操作画笔了。丢勒心痛如绞。这天，丢勒去拜访奈斯丁，发现奈斯丁正合着双手，跪在地上，安静而诚挚的为他的成功祷告。艺术家双眼潮湿，将朋友那双祷告的手画了下来。", "这幅画成为举世闻名的《祷告的手》。其实，在我们每一个人的背后，都有着一双，或者更多双这样的手，值得那些成功的人们铭记，也值得那些没有成功的人们铭记。珍惜我们的成功，包括通往目标路上的机会，因为我们的踏梦而行不只是蕴聚着我们的汗水，还凝聚着很多身旁人们关心爱护的心血。"], "id": 393}, {"title": "老人与海", "author": "海明威", "tag": "", "cat": "朗诵稿件", "lines": ["那老人再一次扛起他的桨，朝海边走去，他慢慢的升起那张补过的旧帆，那帆看上去就像一面永不失败的旗帜。", "船划得久了，汗珠从脊背上一滴滴的流淌下来。不知过了多久，老人发现，那绿色的浮杆急速的往水底沉去，他拉了拉鱼绳，感到了沉重的分量，他想他这辈子再也不会遇到这么大的鱼了，他要最后再赢一次。", "太阳落下去了，夜晚来临，那鱼拖着老人的小船在海上游了一夜，他没想到等待一场搏斗需要那么长的时间，老人觉得自己快要撑不住了，那条大鱼挣扎着向他的小船冲过来，他用绵软的双手努力握紧鱼叉，将鱼叉举过头顶，他把鱼叉举到了不可能再高的高度，用最后的生命将鱼叉扎入了大鱼胸鳍后面的鱼腰里。那鳍停在空中高过老人的胸膛，老人扎中了大鱼的心脏，那鱼生气勃勃地做了最后一次挣扎，它跳出水面，越向空中，把它的长它的宽它的美和它全部的威力都展现出来，而后轰隆一声落入水中。", "老人赢了，他战胜了自己，战胜了那条大鱼，他没有发现一群无所畏惧的鲨鱼正嗅着血迹向这里涌来。成群结队的鲨鱼向船边的大鱼发起猛攻，那撕咬鱼肉的声音，使老人再一次站立起来，他决心捍卫自己的战利品，就像捍卫他的荣誉。当老人终于回到他出海的那个港口，天空第三次黑暗下来。", "老人在船上睡着了，他梦见年轻时的非洲，他梦见了狮子。"], "id": 394}, {"title": "相伴一生的逃票", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["有个中国男孩儿大学毕业去了一个欧洲国家半工半读，发现当地的公共交通几乎都是开放式的，不设检票口，也没有检票员，并且极少有随机性的抽查。", "他精确地估算了这样一个概率：逃票被查到的比例大约仅为万分之三，查到以后再补票也不是不可以嘛。之后，他便经常逃票乘车。", "几年过去了，名牌大学的博士文凭和优秀的学业成绩让他踌躇满志，他频频向当地一些跨国公司推销自己。然而，这些公司都是先热情有加，数日之后却又都是婉言拒绝。最后一次，他要求经理对不予录用给出一个明确的理由。", "对方说，我们对你没有歧视，相反，我们很重视你。从工作能力上，你就是我们所要找的人。遗憾的是，我们查了你的信用记录，发现你有三次逃票的记录。", "就为了这点小事？男孩儿叫起来。", "对方说，我们并不认为这是小事。第一次逃票是在你来我们国家后的第一个星期。检查人员相信了你的解释，只是给你补了票。但在这之后，你又两次逃票。", "那时刚好我口袋中没有零钱。男孩儿解释。", "我不能同意你这种解释。对方说，我相信在被查获前，你可能有数百次逃票的经历。此事证明了两点：一、你不尊重规则。不仅如此，你擅长发现规则中的漏洞并恶意使用；二、你不值得信任。", "男孩儿如梦方醒，懊悔难当。这才想起不知什么人的一句话：德行有可能弥补聪明的缺陷，聪明却填补不了德行的空白。"], "id": 395}, {"title": "罗伯特的世界", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["罗伯特被誉为“有史以来最伟大的战地摄影记者”，他一生痛恨战争，借影像来唤醒人们的良知，让人们不再彼此杀戮。", "1944年，法国光复。沙特尔城的人们在欢庆胜利的同时，没有忘记亡国之耻。于是，他们把复仇之愤泄到了曾经丧失气节的女人们身上。罗伯特是唯一跟随第一批盟军在诺曼底登陆的记者，他总放不下那些弱者，那些被伤害的人，他总是用胶片为他们投去悲情的一瞥。在他的镜头里，我们看到不幸的孩子一生下来就成了孽种，被游街的姑娘毫不顾忌周围侮辱 他们的人，呵护着怀里的婴儿。我们看到母爱在这样的时候超越了历史的纠葛，而围观的“正义”力量却如同强暴者的幸灾乐祸，一切在默默上演，没有获得任何人的拯救。战争的结束给了陈旧道德发散臭气的缺口，所谓的道德夸大中泯灭了人的善，放大了人的恶。罗伯特拍下了这些受辱的女子，有些垂怜，有些疼痛。", "他最伟大的作品，拍得都是“人”，所有渺小的、脆弱的、挣扎着努力生活的人。照片背后的罗伯特，充满同情的呼喊：所有卑微的受难者，亦有尊严。1938年武汉会战后的中国，1954年战争硝烟里的越南，都被记录在他的胶片里，留下了“罗伯特眼里的世界”，从此他活在了人们的记忆中，而他的世界也绽放着璀璨的生命之花。"], "id": 396}, {"title": "将军，你不能这样做！", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["我说什么?我怎么说?……你，是受人尊敬的前辈,我，是后之来者.你我之间隔着硝烟弥漫的三十年代、四十年代,批评你，我从来没有想过。不!将军，即使是这样我也要说,我更应该说! 记得么? 那年抢渡大渡河，身后：追兵!对岸：烈火! 革命在危崖上焦灼——那时候，你说的是什么? 你说的是：“最艰巨的任务，给我!给我!……”", "四十多年后，你英雄的身躯，竟会让功劳压得步履蹒跚，给你月亮你嫌太冷，给你太阳你嫌太热! 你想把地球搂在怀里，什么都要，你什么都要!你为什么就是不要你入党时的誓言?你为什么就是不要无产阶级的本色?将军，你怎么对得起牺牲在你怀里的战友最后的嘱托?怎么对得起那白发苍苍的《共产党宣言》的作者?", "去啊，将军，穿上当年的红缨草鞋，去吻吻你曾为之流血的土地吧——那一寸一寸从敌人手中夺过来的土地，在这新长征的路上且听前进的后人和前进的法律一道大喝一声：“将军！你不能这样做!”"], "id": 397}, {"title": "越王勾践·罪己诏", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["列祖列宗，勾践来看望你们了，面对列祖列宗，勾践有四大罪状：罪其一，不自量力，以弱国之兵力抗击强国，造成了黎民百姓的生灵涂炭；罪其二，国有良士不听劝告，一意孤行，把越国送上了覆亡之路；这罪其三，面对吴国，竟然屈膝投降，藏辱纳耻啊；罪其四，也是罪不可赦之处，居然沦为吴国之奴！", "列祖列宗啊，是你们流血流汗，开辟了这片蛮荒之地；是你们刀耕火种，经历了百年的沧桑，经历了礼乐的教化才形成了当今之越国，我们越国之弱小啊，是你们让它仍然挺立于诸强的环伺之地这是何等的不易！是勾践，是勾践不应该啊！葬送了列祖列宗的千秋伟业。", "列祖列宗在上，越国的王位是勾践夺来的，因为勾践以为，只有勾践才能富国强兵，只有勾践才能保全社稷之长存！但是，列祖列宗容许勾践说一句不敬之语吧，他们给勾践留下的是怎样的一个越国！越国的光辉早已暗淡无光，先民死地求生的欲望早已荡然无存！剩下的是什么？剩下的是朝中的奢靡，剩下的是后宫无耻的浪笑！", "更可怕的是，面对强势举国上下悲诿以退让！所以，面对吴国的凌辱勾践该如何是好呢？勾践选择了抗拒！虽然经过拼死一搏，但是还是把越国送上了覆亡之路！面对这一切，勾践应该粉身碎骨，以死来谢罪列祖列宗，谢罪国人！但是，勾践不想死，勾践，也不能死。", "不是勾践怕死，也不是勾践贪生！因为，勾践，心存不服！", "难道弱一定要被强所欺凌吗？小一定要被大所吞并吗？仁德一定要败给暴政？天理一定要输给强权吗？勾践，不服！", "今天面对列祖列宗勾践发下誓言，只要勾践一息尚存，一定要强兵富国，拯救黎民百姓于水火之中！逆转乾坤之倒转，还天理之公平！如若勾践不能实现此诺言，再让勾践黄沙遮面 尸骨不全吧！勾践在此别过了。"], "id": 398}, {"title": "商鞅之死", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["勒死他，勒死他，用这马央勒死他！为什么？为什么我一生下来我的亲生父亲就要勒死我？因为巫说，你是五岳之子冲克父母。巫？为什么巫要我死我就必须死？我，要成为人上之人，要翻天覆地倒转乾坤！", "我逃脱了驾驭生命的马央，活过来了，活了整整五十二年，五十二年！人之有为不在其身而在其志，任何时代都需要英雄，因为英雄能改变这个时代！我变法之所以成功正是因为遇上了这样的时代，这样的国家，这样的子民！我要让山川移位乾坤倒转，要让奴隶们见天日，令显贵们变脸色。", "百姓们，奴隶们，我，商鞅，就是为你们而变法的商鞅，你们是秦国的子民，为了秦国的现在和将来，有谁为我说句公道话啊？你们这些愚人！这四野的烈火正在熊熊的燃烧，这是我，亲手将它点燃的，而我将在这腾腾的烈焰中化为灰烬，商君！你被自己点燃的火焰吞噬了。秦国，秦国你们的商君将在这里永远的消失了，他将自己的生命浇铸进这秦国的大鼎之中，他用自己的生命铸造起这里的辉煌，而今天他却被自己拯救过的人们暴诛了！他死了，他走了，他升天了！", "你可知商鞅虽死，然商鞅之法千年不败，你可知商鞅虽死，然一百一十七年之后，秦王朝一统天下！"], "id": 399}, {"title": "红舞鞋", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["有一双非常漂亮、非常吸引人的红色舞鞋，女孩子把它穿在脚上，跳起舞来都会感到更加轻盈、富有活力。因此姑娘们见了这双红舞鞋，眼光都发亮，兴奋得喘不过气来，谁都想穿上这双红舞鞋翩翩起舞一番。可是姑娘们都只是想想而已，没有谁敢真地把它穿在脚上去跳舞。因为这双红舞鞋传说还是一双具有魔力的鞋，一旦穿上跳起舞来就会永无休止地跳下去，直到耗尽舞者的全部精力为止。", "但仍有一个擅舞的、年轻可爱的姑娘实在抵挡不住这双红舞鞋的魅力，不听家人的劝告，悄悄地穿上跳起舞来，果然，她的舞姿更加轻盈，她的激情更加奔放，姑娘感到有舞之不尽的热情与活力。她穿着红舞鞋跳过街头巷尾、跳过田野乡村，她跳得青春美丽焕发，真是人见人爱，人见人羡。姑娘自己也感到极大地满足和幸福，她不知疲倦地舞了又舞。", "夜幕在不知不觉之中降临了，观看姑娘跳舞地人群也都回家休息了。姑娘也开始感到了倦意，她想停止跳舞，可是，她无法停下脚步，因为红舞鞋还要跳下去。狂风暴雨袭来，姑娘想停下来去躲风避雨，可是脚上的红舞鞋仍然在快速地带着她旋转，姑娘只得勉强在风雨中跳下去。姑娘跳到了陌生的森林，她害怕起来，想回温暖的家，可是红舞鞋还在不知疲倦地带着她往前跳，姑娘只得在黑暗中一面哭一面继续跳下去。", "最后，当太阳升起来的时候，人们发现姑娘安静地躺在一片青青的草地上，她的双脚又红又肿，姑娘累死了，她的旁边散落着那双永不知疲倦的红舞鞋。"], "id": 400}, {"title": "母亲的姿势", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["这是一个真实的故事。他们一家人住在一套用木板隔成的两层商铺里。母亲半夜起床上厕所，突然闻到一股浓浓的烟味，便意识到家中出事了。等丈夫从梦中惊醒，楼下已是一片火海，两个女儿、三个儿子以及两位雇工都被困在大火中。孩子们被叫醒了，个个如受惊的小兔子，逐一聚拢到母亲身边。幸好阁楼上的天花板只有一层，砸开它，就可以攀上后墙逃生。绝望之余，父亲带着两个雇工砸开天花板，并第一个抢先翻过墙头。父亲出去后，再也没有回来，他只顾呼唤邻居救火。高墙里面，大火离母亲和五个孩子越来越近了。五个孩子中，最高的也仅有1．54米，而围墙有两米多高。他们没有一个人能单独攀上去。幸运的是，墙头上有一个雇工留了下来，他一手紧抓房顶横梁，另一只手伸向墙内的母亲和五个孩子。“别怕，踩着妈妈的手，爬上去!”母亲蹲在地上，抓牢大儿子的脚，大儿子用力一蹬，抓住雇工的手攀上了墙头，翻身脱离了险境。用同样的办法，母亲把二儿子和小儿子一一举过了墙。", "此刻，火舌已舔到脚掌，母亲奋力抓起二女儿。此时，她的力气已用尽，浑身不停地颤抖。大女儿急中生智，协助妈妈把妹妹举过了墙。火海中，仅剩母亲和大女儿。大火已卷上了她们的身体，烧着了她们的衣服。大女儿哭着让妈妈离开，但母亲坚决地将女儿拉了过来，拼尽最后一口气，将大女儿托过墙头。当工人再次把手伸向母亲的时候，她竟然连站立的力气也耗尽了，转眼间，便被大火吞没了。墙外，五个孩子声泪俱下地捶打着墙，大喊着“妈妈”，而墙内的母亲再也听不见了，永远地闭上了眼睛。", "消防人员赶到，20分钟便将大火扑灭。人们进去寻找这位母亲，看到了极为悲壮的一幕：母亲跪在阁楼内的墙下，双手向上高高举起，保持着托举的姿势。"], "id": 401}, {"title": "满仓娘", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["满仓娘是个盲人。满仓当兵的时候娘正患病在床。临走前，娘把满仓叫到床前摸了又摸，然后满仓一步三回头地当兵去了。", "满仓出事那晚，风很大，地上有水洼的地方结着薄薄的冰。满仓是在抢修线路时，水泥柱突然倒塌，压在他身上。在抬往连队的路上，满仓示意班长凑过头来，断断续续地说：“班长，不要让我娘晓得，不然她会受不了的。”说罢头一歪，去了。", "满仓去世后不久，连队掀起了学习满仓字体的热潮。满仓档案上填的是初中毕业，其实初中就上过一年。兵们比练庞中华的字帖还要投入地练着满仓的字。满仓家里有哪些人，有几亩地，几头猪，兵们都了解得清清楚楚，一封封信飞向那个小山旮旯儿，信首都称“娘”。", "满仓娘收到每一封信都欢天喜地的，请人念完后还要摸一摸，好像那就是满仓的脸。念信的人一念完，紧咬嘴唇，眼睛一红，赶紧往外跑。全村人都知道满仓其实已经永远地回来了，就埋在村口的东山坡上。满仓是他们指导员和政治部一位干事把他装在一个小木匣子里带回来的，这些只瞒着一个人——满仓娘。过年前，满仓说要回来看娘。过年的气氛很浓了，空气散发着炮仗的火药香味。满仓又来信说，有任务，不回来了。同时寄回来一张照片，还有些药物、营养品。其实那照片，只是个和满仓穿一样衣服的兵。满仓娘把照片贴在胸口，直唤满儿。", "又是一年，梧桐树叶落完了，满仓还是没有回来。满仓娘收到好多好多的信、药物、营养品，还有76张照片。满仓生前的连队那时正有七十六个兵。满仓已是“超期服役”了。初冬的一天，满仓娘突然病情加重，昏迷不醒。黄昏醒过来时，她把满仓的姐姐叫到床前吩咐说：“我见不到满儿了，我死了，千万不要让他晓得，他会伤心的，影响他干大事业„„”说完，满仓娘干枯的手轻轻地抚摸着那一叠厚厚的、盖着红色三角邮戳的信，停住不动了。", "满仓娘去世的消息传到连队，她那群儿子哭开了。"], "id": 402}, {"title": "北飞！北飞！", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["“你想飞吗？是铁血男儿，为驱除寇盗，当空军去”", "招贴画下，万头攒动。国民党空军军官学校在此招生。西装革履的小伙子们在争执画上那架飞机的型号，农村来的考生抓紧最后时间往嘴里塞鸡蛋。", "轮到他面试了,他衣衫褴褛,把腰上的皮带往里刹了刹", "“家里是干什么的？”左侧的军人问。", "“乡村医生。”小伙子答道。", "“文化水平？”右侧的军人问。", "“高中毕业。”小伙子回答。其实他还差一年才毕业，但他坚信自己能以优异的成绩通过高中水平的测试。", "“好了。你可以走了。”中间雪白额发的军人毫无表情地说。", "直到他走出考场才发现自己致命的悲哀,他们根本就没问自己的名字。", "他是瞒着家里,从东北逃出来的,一路上千辛万苦,九死一生,到河南商丘后,火车不通,他风餐露宿,还被土匪几次抢劫,日本人层层设防,发现了投奔抗日的青年学生,二话不说就喂狼狗。", "他不能回去，不能再做亡国奴。"], "id": 403}, {"title": "大漠深处的胡杨", "author": "海狼", "tag": "", "cat": "朗诵稿件", "lines": ["这是一片心形的胡杨叶，在大漠的空旷中，如此地摇我，摇出我醉心寒肠的泪水，摇出我积蓄一生，敲击戈壁，敲击生命之谜的目光。我以自己的苦泪浇灌浩荡的黄沙，浇灌我永远沉默的哭泣。", "端坐在戈壁的卵石里，面对这令我思索的绿色足迹，谁能遏止这抗争的勇气？谁又能在我笔管的血流里，让大漠深处的胡杨，一半埋在天空的大漠，一半招展在大漠的天空？", "面对献身的胡杨，我为什么不能勇敢地流泪？一种孤独烫得像火，一种孤独冷得像冰。单薄的梦幻，一直迷失着远方的苍茫，唯有胡杨，唯有这风雕雪刻的头颅，向苍穹，争一席擎天傲世之志，在生命的神圣和庄严里，站成男人的姿势，旗帜般地在大漠的尽头飘扬。"], "id": 404}, {"title": "血色母爱", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["她们真的累了，饥饿和寒冷的痛苦紧紧纠缠着她们，把她们折磨的疲惫不堪。", "在这样深可没膝的雪堆里艰难跋涉了四十多个小时的这对母女，后悔着当初本应该听从教练的警告，不要擅自偏离插满彩旗的滑雪道，后悔着不应该穿这件银白色的羽绒服来滑雪，以致于在冰天雪地里，滑雪俱乐部派出的直升机都找不到跟白雪有着一样颜色的她们。", "也许在这个时候女儿才是最后悔的，若不是她平日里总是闷闷不乐，当清洁工的妈妈也不会拿出自己几个月微薄的薪水，带她来阿尔卑斯山滑雪，逗她开心。可母亲怎么也想不到，女儿平日里的不开心，竟是因为有着一个卑微的、做清洁工的母亲。", "几天几夜，母女俩在这片苍白的雪山里艰难的寻找着生存的方向。她们发现有好几架直升机从天空掠过，但无论她们怎样示意，始终没有人发现她们。走着走着，体力不支的母亲，一个踉跄，脑袋栽在了石头上，鲜血立即涌了出来，而此时的女儿已经昏睡过去了。", "这个时候，天空再次飞来了一架直升机，霎时，母亲的脑海中闪过了一个可怕的念头，她抓起身边的一块岩石碎片，在自己的左手腕上用力的割了下去！鲜红、滚烫的鲜血从母亲的动脉中滚滚流出，染红了她身旁的皑皑白雪。她支撑着最后的一点儿力气，在血迹中爬行了十几米，为的是想让救援直升机能够发现她们的位置。最后，母亲那没有温度的身躯终于倒在了那片醒目的血泊中....", "女儿醒来的时候已经躺在了医院里，医生告诉了她所有的事实。在生死关头，母亲用自己流淌的鲜血为女儿指引了生的方向！女儿终于明白，原来自己一直都拥有一份人世间最珍贵的财富，那就是比血还浓的母爱！"], "id": 405}, {"title": "青衣", "author": "毕飞宇", "tag": "", "cat": "朗诵稿件", "lines": ["小燕秋是个天生的青衣坯子。二十年前京剧《奔月》的演出，让人们认识了一个真正的嫦娥，可造化弄人，此后她沉寂了二十年在远离舞台的戏校里教书，学生春来的出现让小燕秋重新看到了当年的自己。二十年后，《奔月》复排，这对师生成了嫦娥的AB角，把命都给了嫦娥的小燕秋一口气演了四场，她不让给春来，谁劝都没用。", "可第五场，她来晚了。小燕秋冲进化妆间的时候，春来已经上好妆了，她们对视了一眼，小燕秋一把抓住化妆师，她想大声说，我才是嫦娥，只有我才是嫦娥，但是她现在只会抖动着嘴唇，不会说话了。", "上了妆的春来真是比天仙还要美。这世上没有嫦娥，化妆师给谁上妆，谁就是嫦娥。大幕拉开，锣鼓响起来了，小燕秋目送着春来走上了舞台。", "观众承认了春来，掌声和喝彩声就是最好的证明。小燕秋无声的坐在化妆台前，她拿起衣服给自己披上，取过肉色滴排，挤在左手掌心，均匀地一点一点往手上抹，往脖子上抹，往脸上抹，然后请化妆师给她调眉，包头，上齐眉，戴头套，镇定自若，出奇的安静。", "小燕秋什么也没说，往门外走去，她穿着一身薄薄的戏装走进了风雪里。她来到了剧场门口，站在了路灯下面。她看了大雪中的马路一眼，自己给自己数起了板眼儿，她开了唱，她唱着依旧是二簧慢板转原板、转流水、转高腔。雪花在飞舞，戏场门口的人越来越多，车越来越挤，但是没有一点声音，小燕秋旁若无人，边舞边唱，她要给天唱，给地唱，给她心中的观众唱。", "小燕秋的告别演出轰轰烈烈地结束了。人的一生其实就是不断地失去挚爱的过程，而且是永远的失去，这是每个人必经的巨大伤痛。而我们从小燕秋的微笑中，看到了她的释怀，看到了她的执著和期盼。"], "id": 406}, {"title": "乌骓别霸王", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["这汗津津的一身疲惫", "冷冷地包裹着我苍凉的心", "霸王啊，霸王，我的横扫千军的霸王", "就在你枕剑酣睡的时候", "呼啸的狂风吹来四面楚歌", "我腾地而起，用带血的嘶鸣把你唤醒", "霸王啊，霸王，我的义薄云天的霸王", "这黑沉沉的夜晚", "这楚歌如潮的夜晚", "这血雨腥风扑天而来的夜晚", "你不该用缰绳窒息我的怒火，锁住我的悲愤", "霸王啊，霸王，我的气吞山河的霸王", "千万里血流成河", "没有阻挡我勇往直前的血性", "数不清的刀光剑影", "没有遮盖我喷射烈火的眼睛", "霸王啊，今晚,你不该用围栏困住我为你冲杀的豪情", "霸王啊，霸王，我的力拔泰山的霸王", "就暂且放下你手中的酒杯吧", "用你那把寒光凝血的利剑", "砍断锁住我的缰绳，", "让我一声长啸，向你作生离死别的辞行", "就果断地放下你怀中的虞姬", "用你无数次爱抚我的大手", "打开困我的栅栏", "让我一路驰骋，为你把突围的道路踏平", "霸王啊，霸王，我的豪气盖世的霸王", "你没有啊，你没有", "这杀声震天的时刻，这绝境求生的时刻", "你的杯中为什么只有无奈的惆怅", "你的怀中为什么只有虞姬的拥吻", "霸王啊，霸王，你看不见我泪流满面吗", "我不仅仅是在悲愤啊，我还在剜心刻骨地痛心", "江山是江东父老的江山", "美人却只是你霸王一个人的美人", "霸王啊，我的霸王，我的沽名钓誉的霸王", "我不仅仅是剜心刻骨的痛心", "我还在撕肝裂胆地反省", "鸿门宴上你用天真放跑了刘邦", "荥阳城外你用猜疑赶走了范增", "划一条鸿沟", "你的善意没有引来和平的甘泉", "引来一场残酷的战争", "点一把大火", "你燃烧的虽然是胜利者短暂的激情", "可焚毁的是老百姓长久的信任", "发一个号令", "你劫掠了阿房宫的珠宝和美女啊", "却把人间的正义和美德化为灰烬", "霸王啊，我的霸王，我的英雄气短的霸王", "你为什么，为什么就不能效仿越王勾践尝胆卧薪", "千百万江东父老还在把你殷殷期盼", "家乡的山山水水到处传颂着你的英名", "霸王啊，一个虞姬为什么就这样让你痴情", "难道东山再起的旗帜竟不如她飘飞的衣裙", "霸王啊，一柄短剑为什么就这样让你无情", "难道收拾河山的壮怀竟不能容纳你的憧憬", "奔流不息的乌江啊，此刻正在为你哭泣", "悲风怒号的垓下啊，此刻正在为你伤心", "霸王啊，我的霸王，我的相依为命的霸王（我相依为命的 霸王）", "你是我的生命，（我也是你的生命）", "你举起了短剑，倒在了虞姬冰冷的怀中", "我迈开了脚步，走向乌江汹涌的江心", "就让我悲愤的泪水汇入无尽的江流吧", "为你化作流传千秋永不停歇的嘶鸣", "就让我悲愤的泪水汇入无尽的江流吧", "为你化作流传千秋永不停歇的嘶鸣"], "id": 407}, {"title": "奇迹的名字叫父亲", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["在一艘横渡大西洋的船上，有一位父亲带着６岁的儿子去美国和妻子相会。一天，当父亲在船舱里用水果刀削苹果给儿子吃时，船突然剧烈地摇晃起来，刀子在父亲摔倒的一刹那插进了他的胸部。", "父亲慢慢站了起来，在儿子不注意时用拇指揩去了刀锋上的血。", "以后的三天，父亲照常照顾儿子，带他吹咸湿的海风，看蔚蓝的大海，讲他和孩子妈妈的故事，仿佛一切如常。", "抵达的前夜，父亲来到儿子的旁边，对儿子说：“明天见到妈妈的时候，告诉她，我爱她。”说完，在儿子的额上深深地留下一个吻。", "船到美国了，儿子在人潮中认出了妈妈，大喊：“妈妈！妈妈！”就在此时，男人已经仰面倒下，胸口血如井喷。", "尸检的结果让所有人惊呆了：那把刀子其实早已精确地插进了他的心脏，而他却多活了三天，而且不被任何人发觉。惟一可能的解释是因为创口太小了。", "这是医学上罕见的奇迹，医学会议上，有人说要称它为“大西洋奇迹”。", "一位坐在首席的老先生一字一句地说：“这个奇迹的名字叫父亲。”"], "id": 408}, {"title": "老人与海（男生）", "author": "海明威", "tag": "", "cat": "朗诵稿件", "lines": ["已经85天了，一条鱼都没打到，我好像已经老了，开始背运了，可是我的胳膊到还是有着劲的。", "太阳升起来了，阳光刺痛了我的眼睛，我感到我已经老了，有点力不从心了，可年轻的时候我曾经是个好的水手啊！", "船划得久了，汗珠从我的脊背上一滴滴的流淌下来，忽然，我发现那绿色的浮杆急速的往水底沉去，我拉了拉鱼绳，感到了沉重的分量。", "我钩住的是一条什么样的鱼呀？！我还从来没有见过鱼有这么大劲的，它只要一跳或向前一窜，就会要了我的命。我已经感到了你的力量，让我们面对面的斗一斗吧，我们谁也没有帮手，这很公平。我早已做好的准备，我不会后悔我死在一条金枪鱼的手里。", "我只有一次机会，这是生死决斗，不是我叉死它，就是它撕碎我！来吧！冲着这儿来吧！让我们来做临死前的最后一次决斗吧，我老了，没什么力气了，我跟你磨了三天，我等了你一辈子了，老兄，我这从来没见过比你更大更美更沉着的鱼呢，来吧，让我们来看看究竟谁杀死谁！！", "人并不是生来就给你们打败的，你可以消灭他，可就是打不败他，打不败他！"], "id": 409}, {"title": "老人与海（女生）", "author": "海明威", "tag": "", "cat": "朗诵稿件", "lines": ["那老人再一次扛起他的桨，朝海边走去，淡淡的太阳从海上升起来，将他憔悴的身影和他的船，冷冷的映在海上，他慢慢的升起那张补过的旧帆，那帆看上去就像永不失败的旗帜。", "船划得久了，汗珠从脊背上一滴滴的流淌下来。不知过了多久，老人发现，那绿色的浮杆急速的往水底沉去，他拉了拉鱼绳，感到了沉重的分量。老人全身心的等待着他和那条大鱼最后的搏斗，他想他这辈子再也不会遇到这么大的鱼了，他要最后再赢一次。", "太阳落下去了，夜晚来临，老人感到寒冷，那鱼拖了他的小船在海上游了一夜，他没想到等待一场搏斗需要那么长的时间。夜幕再次降临，老人精疲力尽，他觉得自己快要撑不住了，他用绵软的双手努力握紧他的鱼叉，将鱼叉举过头顶，他把鱼叉举到了不可能再高的高度。", "那条大鱼挣扎着向老人的小船冲过来，老人拼尽他最后的生命将鱼叉扎入了大鱼胸鳍后面的鱼腰里，那鳍停在空中高过老人的胸膛，老人扎中了大鱼的心脏，那鱼生气勃勃地做了最后一次挣扎，它跳出水面，越向空中，把它的长它的宽它的美他的威力和它全部的美都展现出来，而后轰隆一声落入水中。啊……老人赢了，他战胜了自己，战胜了那条大鱼，他没有发现一群无所畏惧的鲨鱼正嗅着血迹向这里涌来。", "成群结队的鲨鱼向船边的大鱼发起猛攻，那撕咬鱼肉的声音，使老人再一次站立起来，他决心捍卫自己的战利品，就像捍卫他的荣誉。当老人终于回到他出海的那个港口，天空第三次黑暗下来。", "老人在船上睡着了，他梦见年轻时的非洲，他梦见了狮子。"], "id": 410}, {"title": "蚂蚁", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["每当走过地铁的通道，你可曾旁耳听到那歌声，还是只匆匆走过？那年我背上吉他，搭上到北京的火车，北京很大，能容得下我的梦想，我要去那里唱歌；住在这儿的都是有梦想的年轻人，而且有个响亮的地名，叫唐家岭；他对她说我找到一份很好的工作，她总是鼓励我安心唱歌，爸妈都好。", "电话里我总说一切都好，却不让她来看我。可她还是背着我来了北京。唐家岭，这个地名心里在她心里曾经是那么动听，可当她站在这儿，道路坑坑洼洼，刚下过雨的地面肮脏泥泞，一排排就要拆迁的平房为了多住进几个人，随随便便的加盖几层，而我，就住在一个由阳台改成的五平方米的地方。她忍不住心里的疼痛，冲我喊道：“这就是为什么你不让我来看你，这就是你工作的地方，这就是你人生的舞台？这么苦，你干吗非要留下？”我说：“因为我不想让你们再受苦，我想让爸妈到大城市养老，我想你生活的更好，我不想我们的孩子将来一生下来就带着自卑。。。。。。”", "其实有人爱这个城市，就是爱它繁华喧嚣，爱他闪闪发光的名字，爱他聚集着权利、民声、财富和传奇。而有人是真的爱这个城市，哪怕遭受到白眼、冷落、轻视和嫌弃也坚信将来有一天会找到属于自己的位置。我开始明白他所说的梦想，开始陪他去地铁站唱歌。我们席地而坐，边弹边唱，有人会微笑着朝我们点头，我知道，那是在祝福我们。可是也有人说，我们根本不可能不属于这儿，不管我们怎么努力，都得不到认可。", "在这个城市，你昂首阔步，但不能阻止我挺直胸膛。我穿着破旧，但你永远不知道我们有多么坚强。我们北漂，我们蜗居，我们正为生存忙碌。我们隐忍，我们奋斗，我们不会停下脚步。我们也许贫穷，但无需施舍。我们没房没车，但有手有脚。我们没权没势，但自食其力。我们追求梦想从未放弃。", "有人说，我们是渺小的蚂蚁，可蚂蚁聪明、坚强、有耐力，可以扛起大于自己百倍的重物。我对她说：“我为你写首歌吧，就叫‘蚂蚁’”。"], "id": 411}, {"title": "霸王剑", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["我是一柄青铜宝剑", "我出自盛产名剑的春秋吴越", "尽管十面埋伏，困不住我锐不可当的剑锋", "四面楚歌，却将霸王卷土重来的斗志彻底瓦解", "在战争的天平上，我并不是唯一的筹码", "在历史的舞台上，我更不是压轴的主角", "我不过是文人笔下神化的杜撰", "外行眼中，无知的误解", "哪怕我一百招剑式的成功，也抵不上韩信张良的一个谋略", "哪怕我一千次进击的得手，也难以弥补鸿门宴上的一次失策", "一抹晚霞如花，那是虞姬欣慰的笑靥，盛开不谢", "一抹残阳如血。那是霸王高贵的头颅，傲视天下", "一道长虹如弓，那是我，刺破青天锷未残的剑影", "千秋不逝，万古不灭。"], "id": 412}, {"title": "孙中山的演讲", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["诸君，今日的募捐，原本为的是在广州的起义，然而就在刚才，我得到了消息，广州的枪声停了!起义失败了!电文上说“起义失败，骨干尽皆牺牲!”", "诸君没有见过他们，这些死去的年轻人，有的才华横溢，有的家境优越，有的新婚燕尔，他们何以不惜身家性命，不计成败利害，甘死如饴，只因信仰二字！", "在场的诸位，大多是我华侨同胞，你们心里最清楚，咱们这张与生俱来的中国人的脸，曾经让咱们遭受过多少白眼，多少欺凌，多少苦难和屈辱，这是因为，咱们面孔背后的国家早已腐朽不堪、羸弱不堪、困苦不堪。咱们中国人就是这样任人歧视，被人觊觎，由人宰割!", "我辈之革命，正是为了让民众获得幸福，为民族争得尊严，中国革命，一直受着华侨的恩惠，多年来，我深深地感受到，华侨乃革命之母。诸位，你们的孩子，为你们死了!"], "id": 413}, {"title": "囚徒", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["在非洲，那里种族之间的摩擦的确是越来越深了。黑人不满，他们是有充分理由的。黑人们发现他们长期以来在受我们白人剥削，所以他们不满和猜忌很自然地上升为仇恨和暴力。不过，我一定要指出，在当地抢劫和杀害白人的，大部分不是黑人干的。而是白人雇佣军干的。他们都是杀人成性，什么事都干的出来的禽兽。", "我家在非洲住了十二年。家里人不少，除了我，我妈妈，爸爸，还有两个哥哥。我们爱那个地方，爱那儿的人。有人说，黑人在暴动，可是我们不相信。事情发生得突然极了。有一天，周围的村子都敲起鼓来了，听了叫人毛骨悚然。妈妈劝爸爸让我们一家人离开，可爸爸就是不同意。一天晚上，我们听到机关枪的枪声越来越近，到处都有人尖声怪叫。我哥哥从楼上窗口大喊了一声：“爸爸，他们放火烧工厂了，都着了!”爸爸冲了出去，两个哥哥紧跟在后面。到处是一片火海，也挡不住他们。外面机关枪也响起来了。突然，他们停了下来，我跟妈妈跑出去，看见他们三人躺在路边上，浑身是血，遍体鳞伤，像牲口一样给宰了……(越说越激动)", "在火光下我突然看见他们在丛林里，杀人的不少黑人，是白人雇佣军!(情绪激动，几乎已难控制自己)我感觉到他们在树后注意外面的动静。我说：“妈妈，快跑吧，再不跑他们会抓住我们的!……妈妈，站住，妈妈——!”她倒下了，她叫我别管她，只管自己跑。那些魔鬼又开枪了，打中了妈妈，她死在了我的怀里。我想：“我往前跑，也许可能逃走。”可他们不放过我，很快就把我抓住了。他们围着我推来推去，还 逼我在他们面前脱光了，他们笑啊，跳啊，……他们还尖声匿气地说：“别害怕，我们是白人，你的朋友，我们就想乐一乐。别犟了，跳把!”啊……他们把我推来推去，……啊!放开我!"], "id": 414}, {"title": "感恩的心", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["我最喜欢听一首歌，这是一首手语歌，名字叫《感恩的心》，妈妈告诉我，这是一个真实的故事。", "有一个天生聋哑的小女孩，爸爸在她很小的时候就去世了。她和妈妈相依为命，过着贫困的生活。小女孩很乖，很听话，她从不羡慕别人的新衣服，也不羡慕别人的新玩具，她只希望每天能和妈妈在一起。妈妈为了养活她，摆了个修鞋摊，每天很早就出门，很晚才回来。每到日落时分，小女孩就开始站在家门口，充满期待地望着门前的那条路，等妈妈回家。妈妈回来的时候是她一天中最快乐的时刻，因为妈妈每天都要给她带回一块香喷喷的年糕。在她们贫穷的家里，一块小小的年糕，都给这个可怜的聋哑孩子带来许多童年的快乐。", "有一天，外面下着很大很大的雨，已经过了晚饭时间了，妈妈却迟迟没有回来。小女孩静静的站在家门口，盼啊，望啊，总也等不到那熟悉的身影。雨，越下越大，天，越来越黑，小女孩决定顺着妈妈每天回来的路自己去找。她走啊走啊，走了很远，很远。忽然，她终于在路边看见了倒在地上的妈妈。她使劲地摇着妈妈的身体，妈妈却没有回答。她想妈妈可能是太累了，想睡了。小女孩把妈妈的头枕在自己的腿上，让她睡得舒服一点儿。可是，妈妈的眼睛怎么也闭不上！小女孩突然想到：我的妈妈是不是已经死了！她慌张、她恐惧，她拉着妈妈的手使劲地摇，妈妈的手已变得冰凉，她却惊讶的发现妈妈的手里还紧紧地攥着一块年糕……妈妈，妈妈，小女孩拼命地哭着，却发不出一点声音……", "雨一直在不停的下，小女孩也不停的哭。她知道妈妈再也不会醒来，再也不会回家，现在就只剩孤单的她。妈妈的眼睛为什么不闭上？是因为不放心她？还是……那一瞬间，她突然明白了自己该怎样做。小女孩擦干眼泪，决定用自己的语言来告诉妈妈，她一定会乖乖的听话，一定做让妈妈放心的乖女儿……", "于是，小女孩就在雨中一遍一遍用手语唱着这首《感恩的心》，泪水和雨水混在一起，从她小小的，却写满坚强的脸上轻轻的滑落。就那样，小女孩站在雨中，不停歇地用她的语言给妈妈唱最后的歌，一直到妈妈那双眼睛轻轻闭上……"], "id": 415}, {"title": "洛克救母", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["一天，洛克和母亲开着小货车走在乡间小道上，由于路况原因，车子冲出了路面，掉到了二十英尺下的峡谷中。母亲凯丽满脸是血，不辩东西，牙龈残破，脸颊损毁，肩膀也被压碎，整个人被支离破碎的车门压得动弹不得。", "洛克则奇迹般地毫发未伤，洛克从车窗爬出了小货车，试图将母亲拉出车子，但凯丽一动也不动，洛克急得大喊：“妈妈，洛克会带你出去，你要支持住，千万别睡着啊！”", "洛克又钻进了小货车，并将母亲推出了车子的残骸。接着又用瘦小的身子将两倍半重的母亲一寸一寸往上推，准备爬到马路上求救，就这样一点点犹如蜗牛爬行。凯丽感到如此疼痛，几乎要放弃希望，但洛克始终鼓舞着她。", "为了鼓励凯丽，洛克告诉妈妈想想《小火车》的童话故事，故事中的小火车虽然只有小小引擎却能爬上陡峭的山头，洛克不断重复着故事中提到的：“我相信你能做到，我相信你能……”", "仿佛过了一个世纪，他们终于爬到路边，洛克才借着光亮看清母亲受重创的脸，他开始泪流满面，挥舞着双手，对着驶过的货车呼喊：“停下来，请停下来！请带我妈妈到医院去！”"], "id": 416}, {"title": "昭君出塞", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["刺骨的寒风呼啸着从耳边吹过，我默默地站在明月初升的阴山上，遥望那古老的雁门，轻将琵琶拨响。", "我有幸生长在屈原故里、宋玉家乡秭归，美丽的香溪伴我长大；我不幸生得容颜较好偏又出身贫寒，入选宫门却无力与画工行贿，哪知毛延寿添恨害我贬入冷宫。", "五年，整整的五年啊，我空望着花开花落，怕看这冬尽春残，奏一曲琵琶也饱含着深深的幽怨！“我一怨君王无缘相见，二怨父母兄弟不得团圆，三怨红颜消退出头无望。”上苍啊，难道一道宫墙冷院就该锁住我绝世的才情？难道这更漏声声就能让我坐等红颜白发？", "不，我不能让一座宫墙锁住一生的岁月！我要和大雁一样，飞出这高高的宫墙，在蓝天白云间自由地飞翔！", "让我再着一身汉家装，再弹一回《出塞曲》；此一去，江南烟雨再难见，关山明月入梦来；此一去，卸却汉家女儿妆，胡服烈马草原行！此一去，定保汉匈百姓睦邻好，不负君王临行托！"], "id": 417}, {"title": "永远的第十一位教师", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["和孩子们依依不舍地送走了第十位教师后，人们寒心地说：再不会有第十一位教师能留下来了。", "一所偏远的山村学校，因办学条件差，一年内已经先后走了七八位教师。当乡里实在派不来教师，乡亲们只好临时请了一位刚刚毕业、等待分配的女大学生来代一段时间课。", "三个月后，女大学生的分配通知到了。在女大学生含泪告别纯朴的山民走下山坡的时候，她背后突然传来了孩子们朗朗的读书声：离离原上草，一岁一枯荣，野火烧不尽，春风吹又生......", "那声音在山谷间低回传送，久久不绝，那是她第一节课教给孩子们的诗！年轻的女大学生回头望去，顿时被惊呆了！几十个孩子齐刷刷地跪在高高的山坡上！", "谁能承受得起那让天地都为之动容的长跪呀！她顷刻间明白了这是渴求知识的孩子们纯真而又无奈的挽留啊！", "女大学生的灵魂就在那瞬间洗礼中得到升华。她决定抛弃山外的诱惑，重新把行李扛回小学校，她成了山村的第十一位教师。 以后的日子，她从这所小学校里送走了一批又一批的孩子，去读初中，念高中，上大学......这一留就是整整二十年。"], "id": 418}, {"title": "一个人的双人舞", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["真的想不起来他们的名字了，却一直记得他们的爱情。", "他们是世界闻名的双人花样溜冰运动员，生活中是恩爱的夫妻，冰场上是最佳搭档。他们的表演配合默契，珠联璧合，多次在各种大赛中获奖。", "所谓天妒家缘，一次意外，丈夫去世了。这对于常人，无疑是一次巨大的打击；对于她，这打击更是加倍的，因为她失去的，不仅是生活上的爱侣，也是艺术上的合作伙伴。她从此远离了冰场。", "沉寂几年后，她忽然宣布，要再进行一次花样溜冰表演。这次，是她一个人。", "舞姿还是那样的娴熟，还是那样的", "优美，她还是从前的她，沉寂数年，丝毫没有影响到她的艺术水准，她依然是冰场上轻盈的精灵。", "但是，所有看得人都落泪了。", "冰场上，虽然只是一个人在旋转，在跳跃，但她的动作，却分明是两个人的。她的身侧，似乎总是有另一个人的影子。她举臂，似乎有人在与她牵手；她抬腿，似乎有人在为她支撑；她跳跃，似乎有人在扶她的腰；她旋转，似乎有人在与她同行；她微笑，似乎是对着那个人……是一个人的独舞，她的动作，却是双人舞的动作。似乎是 ，那个人还陪在她的身边，一如从前。", "最后的造型，是他们当年的经典。现在，却只有她一个人。她凝固成一尊塑像，一动不动，只有泪水，涔涔而下。"], "id": 419}, {"title": "骑兵连，进攻！", "author": "", "tag": "", "cat": "朗诵稿件", "lines": ["战斗很惨，鬼子的进攻也越来越猛烈 每一次的枪声过后", "我都会看到我的弟兄们一个个掉下马去 他们有的身首异处 有的甚至被砍的血肉模糊", "但是他们没有一个放弃 没有一个当逃兵 我们这些弟兄 有的还只有十几岁 但是他们却像他们的父辈一样 拿着马刀去砍杀敌人 狗日的日本鬼子！！", "你们抢光我们的粮食 烧光我们的房屋 杀光我们的父老乡亲", "你们甚至不放过一个孩子 你们这帮畜生", "有种我们在战场上拼刺刀 这才是真正的军人", "一次的冲锋过后 我的身边只剩下了四个弟兄 弟兄们", "我们的子弹打光了 把枪给我扔了 绝不留给小日本儿", "我们根本不懂得什么是投降 生是中国人，死是中国鬼 不当亡国奴！！", "弟兄们 拔刀！骑兵连，听我的命令！！", "向敌人，进攻！！！"], "id": 420}, {"title": "作品1号", "author": "节选自茅盾《白杨礼赞》", "tag": "", "cat": "普通话60篇", "lines": ["那是力争上游的一种树，笔直的干，笔直的枝。它的干呢，通常是丈把高，像是加以人工似的，一丈以内，绝无旁枝；它所有的丫枝呢，一律向上，而且紧紧靠拢，也像是加以人工似的，成为一束，绝无横斜逸出；它的宽大的叶子也是片片向上，几乎没有斜生的，更不用说倒垂了；它的皮，光滑而有银色的晕圈，微微泛出淡青色。这是虽在北方的风雪的压迫下却保持着倔强挺立的一种树！哪怕只有碗来粗细罢，它却努力向上发展，高到丈许，二丈，参天耸立，不折不挠，对抗着西北风。", "这就是白杨树，西北极普通的一种树，然而决不是平凡的树！", "它没有婆娑的姿态，没有屈曲盘旋的虬枝，也许你要说它不美丽，──如果美是专指“婆娑”或“横斜逸出”之类而言，那么白杨树算不得树中的好女子；但是它却是伟岸，正直，朴质，严肃，也不缺乏温和，更不用提它的坚强不屈与挺拔，它是树中的伟丈夫！当你在积雪初融的高原上走过，看见平坦的大地上傲然挺立这么一株或一排白杨树，难道你觉得树只是树，难道你就不想到它的朴质，严肃，坚强不屈，至少也象征了北方的农民；难道你竟一点也不联想到，在敌后的广大土地上，到处有坚强不屈，就像这白杨树一样傲然挺立的守卫他们家乡的哨兵！难道你又不更远一点想到这样枝枝叶叶靠紧团结，力求上进的白杨树，宛然象征了今天在华北平原纵横决荡用血写出新中国历史的那种精神和意志。"], "id": 421}, {"title": "作品2号", "author": "选自张健鹏、胡足青主编《故事时代》中《差别》", "tag": "", "cat": "普通话60篇", "lines": ["两个同龄的年轻人同时受雇于一家店铺，并且拿同样的薪水。", "可是一段时间后，叫阿诺德的那个小伙子青云直上，而那个叫布鲁诺的小伙子却仍在原地踏步。布鲁诺很不满意老板的不公正待遇。终于有一天他到老板那儿发牢骚了。老板一边耐心地听着他的抱怨，一边在心里盘算着怎样向他解释清楚他和阿诺德之间的差别。", "“布鲁诺先生，”老板开口说话了，“您现在到集市上去一下，看看今天早上有什么卖的。”", "布鲁诺从集市上回来向老板汇报说，今早集市上只有一个农民拉了一车土豆在卖。", "“有多少？”", "布鲁诺赶快戴上帽子又跑到集上，然后回来告诉老板一共四十袋土豆。", "“价格是多少？“", "布鲁诺又第三次跑到集上问来了价格。", "“好吧，”老板对他说，“现在请您坐到这把椅子上一句话也不要说，看看阿诺德怎么说。”", "阿诺德很快就从集市上回来了。向老板汇报说到现在为止只有一个农民在卖土豆，一共四十口袋，价格是多少多少；土豆质量很不错，他带回来一个让老板看看。这个农民一个钟头以后还会弄来几箱西红柿，据他看价格非常公道。昨天他们铺子的西红柿卖得很快，库存已经不多了。他想这么便宜的西红柿，老板肯定会要进一些的，所以他不仅带回了一个西红柿做样品，而且把那个农民也带来了，他现在正在外面等回话呢。", "此时老板转向了布鲁诺，说：“现在您肯定知道为什么阿诺德的薪水比您高了吧！”"], "id": 422}, {"title": "作品3号", "author": "节选自贾平凹《丑石》", "tag": "", "cat": "普通话60篇", "lines": ["我常常遗憾我家门前的那块丑石呢：它黑黝黝地卧在那里，牛似的模样；谁也不知道是什么时候留在这里的，谁也不去理会它。只是麦收时节，门前摊了麦子，奶奶总是要说：这块丑石，多碍地面哟，多时把它搬走吧。", "它不像汉白玉那样的细腻，可以凿下刻字雕花，也不像大青石那样的光滑，可以供来浣纱捶布；它静静地卧在那里，院边的槐荫没有庇覆它，花儿也不再在它身边生长。荒草便繁衍出来，枝蔓上下，慢慢地，竟锈上了绿苔、黑斑。我们这些做孩子的，也讨厌起它来，曾合伙要搬走它，但力气又不足；虽时时咒骂它，嫌弃它，也无可奈何，只好任它留在那里去了。", "终有一日，村子里来了一个天文学家。他在我家门前路过，突然发现了这块石头，眼光立即就拉直了。他再没有走去，就住了下来；以后又来了好些人，说这是一块陨石，从天上落下来已经有二三百年了，是一件了不起的东西。不久便来了车，小心翼翼地将它运走了。", "这使我们都很惊奇！这又怪又丑的石头，原来是天上的呢！它补过天，在天上发过热，闪过光，我们的先祖或许仰望过它，它给了他们光明，向往，憧憬；而它落下来了，在污土里，荒草里，一躺就是几百年了！", "我感到自己的可耻，也感到了丑石的伟大；我甚至怨恨它这么多年竟会默默地忍受着这一切？而我又立即深深地感到它那种不屈于误解、寂寞的生存的伟大。"], "id": 423}, {"title": "作品4号", "author": "――费舍尔《达瑞的故事》，刘志明译", "tag": "", "cat": "普通话60篇", "lines": ["在达瑞八岁的时候，有一天他想去看电影。因为没有钱，他想是向爹妈要钱，还是自己挣钱。最后他选择了后者。他自己调制了一种汽水，向过路的行人出售。可那里正是寒冷的冬天，没有人买，只有两个人例外――他的爸爸和妈妈。", "他偶然有一个和非常成功的商人谈话的机会。当他对商人讲述了自己的“破产史”后，商人给了他两个重要的建议：一是尝试为别人解决一个难题；二是把精力聚焦在你知道的、你会的和你拥有的东西上。", "这两个建议很关键。因为对于一个八岁的孩子而言，他不会做的事情很多。于是他穿过大街小巷，不住地思考：人们会有什么难题，他又如何利用这个机会？", "一天，吃早饭时父亲让达瑞去取报纸。美国的送报员总是把报纸从花园篱笆的一个特制的管子里塞进来。假如你想穿着睡衣舒舒服服地吃早饭和看报纸，就必须离开温暖和房间，冒着寒风，到花园去取。虽然路短，但十分麻烦。", "当达瑞为父亲取报纸的时候，一个主意诞生了。当天他就按响了邻居的门铃，对他们说，每个月只需付给他一美元，他就每天早上把报纸塞到他们的房门底下。大多数人都同意了，很快他有了七十多个顾客。一个月后，当他拿到自己赚的钱时，觉得自己简直是飞上了天。", "很快他又有了新的机会，他让他的顾客每天把垃圾袋放在门前，然后由他早上运到垃圾桶里，每个月加一美元。之后他还想出了许多孩子赚钱的办法，并把它集结成书，书名为《儿童挣钱的二百五十个主意》。为此，达瑞十二岁时就成了畅销书作家，十五岁有了自己的谈话节目，十七岁就拥有了几百万美元。"], "id": 424}, {"title": "作品5号", "author": "――节选自峻青《第一场雪》", "tag": "", "cat": "普通话60篇", "lines": ["这是入冬以来，胶东半岛上第一场雪。", "雪纷纷扬扬，下得很大。开始还伴着一阵儿小雨，不久就只见大片大片的雪花，从彤云密布的天空中飘落下来。地面上一会儿就白了。冬天的山村，到了夜里就万籁俱寂，只听得雪花簌簌地不断往下落，树木的枯枝被雪压断了，偶尔咯吱一声响。", "大雪整整下了一夜。今天早晨，天放晴了，太阳出来了。推开门一看，嗬！好大的雪啊！山川、河流、树木、房屋，全都罩上了一层厚厚的雪，万里江山，变成了粉妆玉砌的世界。落光了叶子的柳树上挂满了毛茸茸亮晶晶的银条儿；而那些冬夏常青的松树和柏树上，则挂满了蓬松松沉甸甸的雪球儿。一阵风吹来，树枝轻轻地摇晃，美丽的银条儿和雪球儿簌簌地落下来，玉屑似的雪末儿随风飘扬，映着清晨的阳光，显出一道道五光十色的彩虹。", "大街上的积雪足有一尺多深，人踩上去，脚底下发出咯吱咯吱的响声。一群群孩子在雪地里堆雪人，掷雪球，那欢乐的叫喊声，把树枝上的雪都震落下来了。", "俗话说，“瑞雪兆丰年”。这个话有充分的科学根据，并不是一句迷信的成语。寒冬大雪，可以冻死一部分越冬的害虫；融化了的水渗进土层深处，又能供应庄稼生长的需要。我相信这一场十分及时的大雪，一定会促进明年春季作物，尤其是小麦的丰收。有经验的老农把雪比做是“麦子的棉被”。冬天“棉被”盖得越厚，明春麦子就长得越好，所以又有这样一句谚语：“冬天麦盖三层被，来年枕着馒头睡。”", "我想，这就是人们为什么把及时的大雪称为“瑞雪”的道理吧。"], "id": 425}, {"title": "作品6号", "author": "节选自谢冕《读书人是幸福的人》", "tag": "", "cat": "普通话60篇", "lines": ["我常想读书人是世间幸福人，因为他除了拥有现实的世界之外，还拥有另一个更为浩瀚也更为丰富的世界。现实的世界是人人都有的，而后一个世界却为读书人所独有。由此我想，那些失去或不能阅读的人是多么的不幸，他们的丧失是不可补偿的。世间有诸多的不平等，财富的不平等，权力的不平等，而阅读能力的拥有或丧失却体现为精神的不平等。", "一个人的一生，只能经历自己拥有的那一份欣悦，那一份苦难，也许再加上他亲自闻知的那一些关于自身以外的经历的经验。然而，人们通过阅读，却能进入不同时空的诸多他人的世界。这样，具有阅读能力的人，无形间获得了超越有限生命的无限可能性。阅读不仅使他多识了草木虫鱼之名，而且可以上溯远古下及未来，饱览存在的与非存在的奇风异俗。", "更为重要的是，读书加惠于人们的不仅是知识的增广，而且还在于精神的感化与陶冶。人们从读书学做人，从那些往哲先贤以及当代才俊的著述中学得他们的人格。人们从《论语》中学得智慧的思考，从《史记》中学得严肃的历史精神，从《正气歌》中学得人格的刚烈，从马克思学得人世的激情，从鲁迅学得批判精神，从托尔斯泰学得道德的执着。歌德的诗句刻写着睿智的人生，拜伦的诗句呼唤着奋斗的热情。一个读书人，一个有机会拥有超乎个人生命体验的幸运人。"], "id": 426}, {"title": "作品7号", "author": "节选自唐继柳编译《二十美金的价值》", "tag": "", "cat": "普通话60篇", "lines": ["一天，爸爸下班回到家已经很晚了，他很累也有点儿烦，他发现五岁的儿子靠在门旁正等着他。", "“爸，我可以问您一个问题吗？", "“什么问题？“”爸，您一小时可以赚多少钱？“这与你无关，你为什么问这个问题？”父亲生气地说。", "“我只是想知道，你、请告诉我，您一小时赚多少钱？”小孩儿哀求道。“假如你一定要知道的话，我一小时赚二十美金。”", "“哦，”小孩儿低下了头，接着又说，“爸，可以借我十美金吗？”父亲发怒了：“如果你只是要分工负责去买无意义的玩具的话，给我回到你的房间睡觉去。好好想想为什么你会那么自私。我每天辛苦工作，没时间和你玩儿小孩子的游戏。”", "小孩儿默默地回到自己的房间关上门。", "父亲坐下来还在生气。后来，他平静下来了。心想他可能对孩子太凶了――或许孩子真的很想买什么东西，再说他平时很少要过钱。", "父亲走进孩子的房间：“你睡了吗？”“爸，还没有，我还醒着。”孩子回答。", "“我刚才可能对你太凶了，”父亲说。“我不应该发那么大的火儿――这是你要的十美金。”“爸，谢谢您。”孩子高兴地从枕头下使出一些被弄皱的钞票，慢慢地数着。", "“为什么你已经有钱了还要？”父亲不解地问。", "“因为原来不够，但现在凑够了。”孩子回答：“爸我现在有二十美金了，我可以向您买一个小时的时间吗？明天请早一点儿回家――我想和您一起吃晚餐。”"], "id": 427}, {"title": "作品8号", "author": "――节选自巴金《繁星》", "tag": "", "cat": "普通话60篇", "lines": ["我爱月夜，但我也爱星天。从前在家乡七八月的夜晚在庭院里纳凉的时候，我最爱看天上密密麻麻的繁星。望着星天，我就会忘记一切，仿佛回到了母亲的怀里似的。", "三年前在南京我住的地方有一道后门，我打开后门，便看见一个静寂的夜。下面是一片菜园，上面是星群密布的蓝天。星光在我们的肉眼里虽然微小，然而它使我们光明无处不在。那时候我正在读一些天文学的书，也认得一些星星，好像它们就是我的朋友，它们常常在和我谈话一样。", "如今在海上，和繁星相对，我把它们认得很熟了。我躺在舱面上，仰望天空。深蓝色的天空里悬着无数半明半昧的星。船在动，星也在动，它们是这样低，真是摇摇欲坠呢！渐渐地我的眼睛模糊了，我好像看见无数萤火虫在我的周围飞舞。海上的夜是柔和的，是静寂的，是梦幻的。我肩头许多认识的星，我仿佛看见它们在对我眨眼，我仿佛听见它们在小声说话。这时我忘记了一切。在星的怀抱中我微笑着，我沉睡着。我觉得自己是一个小孩子，现在睡在母亲的怀里了。", "有一夜，那个在哥伦波上船的英国人指给我看天上的巨人。他用手指着：那四颗明亮的星是头，下面的几颗是身子，这几颗是手，那几颗是腿和脚，还有三颗星算是腰带。经他这一番指点。我果然看清楚了那个天上的巨人。看，那个巨人还在跑呢！"], "id": 428}, {"title": "作品9号", "author": "――节选自李恒瑞《风筝畅想曲》", "tag": "", "cat": "普通话60篇", "lines": ["假日到河滩上转转，看见许多孩子在放风筝。一根根长长的引线，一头系在天上，一头系在地上，孩子同风筝都在天与地之间悠荡，连心也被悠荡得恍恍惚惚了，好像又回到了童年。", "儿时的放风筝，大多是自己的长辈或家人编扎的，几根削得很薄的篾，用细纱线扎成种种鸟兽的造型，糊上雪白的纸片，再用彩笔勾勒出面孔与翅膀的图案。通常扎得最多的是“老雕”“美人儿”“花蝴蝶”等。", "我们家前院就有位叔叔，擅扎风筝，远近闻名。他扎得风筝不只体形好看，色彩艳丽，放飞得高远，还在风筝上绷一叶用蒲苇削成的膜片，经风一吹，发出“嗡嗡”的声响，仿佛是风筝的歌唱，在蓝天下播扬，给开阔的天地增添了无尽的韵味，给驰荡的竭尽带来几分疯狂。", "我们那条胡同的左邻右舍的孩子们放的风筝几乎都是叔叔编扎的。他的风筝不卖钱，谁上门去要，就给谁，他乐意自己贴钱买材料。", "后来，这位叔叔去了海外，放风筝也渐与孩子们远离了。不过年年叔叔给家乡写信，总不忘提起儿时的放风筝。香港回归之后，他的家信中说到，他这只被故乡放飞到海外的风筝，尽管飘荡游弋，经风沐雨，可那线头儿一直在故乡和亲人手中牵着，如今飘得太累了，也该要回归到家乡和亲人身边来了。", "是的。我想，不光是叔叔，我们每个人都是风筝，在妈妈手中牵着，从小放到大，再从家乡放到祖国最需要的地方去啊！"], "id": 429}, {"title": "作品10号", "author": "节选自［美］艾尔玛　邦贝克《父亲的爱》", "tag": "", "cat": "普通话60篇", "lines": ["爸不懂得怎样表达爱，使我们一家人融洽相处的是我妈。他只是每天上班下班，而妈则把我们做过的错事开列清单，然后由他来责骂我们。", "有一次我偷了一块糖果，他要我把它送回去，告诉卖糖的说是我偷来的，说我愿意替他拆箱卸货作为赔偿。但妈妈却明白我只是个孩子。", "我在运动场打秋千跌断了腿，在前往医院的途中一直抱着我的，是我妈。爸把汽车停在急诊室门口，他们叫他驶开，说那空位是留给紧急车辆停放的。爸听了便叫嚷道：“你以为这是什么车？旅游车？”", "在我生日会上，爸总是显得有些不大相称。他只是忙于吹气球，布置餐桌，做杂务。把插着蜡烛的蛋糕推过来让我吹的，是我妈。", "我翻阅照相册时，人们总是问：“你爸爸是什么样子的？”天晓得！他老是忙着替别人拍照。妈和我笑容可掬地一起拍的照片，多得不可胜数。", "我记得妈有一次教我骑自行车。我叫他别放手，但他却说是应该放手的时候了。我摔倒之后，妈跑过来扶我，爸却挥手要她走开。我当时生气极了，决心要给他点颜色看。于是我马上爬上自行车，而且自己骑给他看。他只是微笑。", "我念大学时，所有的家信都是妈写的。他除了寄支票外，还寄过一封短柬给我，说因为我没有在草坪上踢足球了，所以他的草坪长得很美。", "每次我打电话回家，他似乎都想跟我说话，但结果总是说：“我叫你妈来接。”", "我结婚时，掉眼泪的是我妈。他只是大声擤了一下鼻子，便走出房间。", "我从小到大都听他说：“你到哪里去？什么时候回家？汽车有没有汽油？不，不准去。”爸完全不知道怎样表达爱。除非……", "会不会是他已经表达了而我却未能察觉？"], "id": 430}, {"title": "作品11号", "author": "节选自冯骥才《国家荣誉感》", "tag": "", "cat": "普通话60篇", "lines": ["一个大问题一直盘踞在我脑袋里：", "世界杯怎么会有如此巨大的吸引力？除去足球本身的魅力之外，还有什么超乎其上而更伟大的东西？", "近来观看世界杯，忽然从中得到了答案：是由于一种无上崇高的精神情感－－国家荣誉感！", "地球上的人都会有国家的概念，但未必时时都有国家的感情。往往人到异国思念家乡，心怀故国，这国家概念就变得有血有肉，爱国之情来得非常具体。而现代社会，科技畅达，信息快捷，事事上网，世界真是太小太小，国家的界限似乎也不那么清晰了。再说足球正在快速世界化，平日里各国球员频繁转会，往来随意，致使越来越多的国家联赛都具有国际的因素。球员们否认国籍，只效力于自己的俱乐部，他们比赛时的激情中完全没有爱国主义的因子。", "然而，到了世界杯大赛，天下大变。各国球员都回国效力，穿上与光荣的国旗同样色彩的服装。在每一场比赛前，还高唱国歌心宣誓对自己祖国的热爱与忠诚。一种血缘情感开始在全身的血管里燃烧起来，而且立刻热血沸腾。", "在历史时代，国家间经常发生对抗，好男儿戎装卫国。国家的荣誉往往需要以自己的生命换取。但在和平时代，只有这种国
